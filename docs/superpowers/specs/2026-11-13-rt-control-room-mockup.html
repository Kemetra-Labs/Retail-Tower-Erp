<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Tower Control Room</title>
<meta name="description" content="A control-room board of the Retail Tower services: every station, every cable, what it carries, and where each fault comes from, read from Port.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Hallmark · v2.0.0 · shape: app screen · theme: custom (by request: premium clean, owner calibration pick 2) · signature: a power-grid control room for software: stations, labelled cables, alarms pinned where the fault is · genre: atmospheric */
/* critique: v6 told the truth but hid where faults come from; v7 draws every link as a cable with what it carries and its state, pins each alarm at its origin with one icon per kind, and lists alarms like a control room. */
/* waive 69 (motion beyond --dur-short): the owner asked for a living board; motion fires only on a real change or a labelled replay, faulted cables pulse at under 1 Hz, and Pause stops all of it. */
:root {
  --color-paper: oklch(16% 0.01 250); --color-paper-2: oklch(20.5% 0.011 250); --color-paper-3: oklch(13% 0.009 250);
  --color-ink: oklch(95% 0.005 250); --color-ink-2: oklch(84% 0.008 250); --color-muted: oklch(73% 0.01 250);
  --color-rule: oklch(31% 0.012 250); --color-rule-2: oklch(43% 0.014 250);
  --color-cool: oklch(77% 0.12 245); --color-cool-soft: oklch(29% 0.05 245); --color-cool-ink: oklch(18% 0.03 245);
  --color-ok: oklch(84% 0.015 250); --color-ok-soft: oklch(26% 0.012 250);
  --color-bad: oklch(69% 0.19 25); --color-bad-soft: oklch(26% 0.06 25);
  --color-stale: oklch(82% 0.15 80); --color-stale-soft: oklch(29% 0.05 80);
  --color-ledger: oklch(86% 0.03 85); --color-focus: oklch(77% 0.12 245);
  --font-display: "Inter", ui-sans-serif, system-ui, sans-serif; --font-body: var(--font-display);
  --font-outlier: "Inter", "IBM Plex Sans Arabic", ui-sans-serif, system-ui, sans-serif; --font-arabic: "IBM Plex Sans Arabic", "Segoe UI", sans-serif;
  --radius-card: 10px; --radius-pill: 6px; --rule-hair: 1px; --tracking-display: -0.03em;
  --text-xs: 12px; --text-sm: 13px; --text-base: 15px; --text-md: 17px; --text-lg: 22px; --text-xl: 30px; --text-display: 40px;
  --space-2xs: 4px; --space-xs: 6px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 24px;
  --dur-micro: 120ms; --dur-short: 220ms; --ease-out: cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="light"] {
  --color-paper: oklch(98% 0.006 85); --color-paper-2: oklch(99.5% 0.004 85); --color-paper-3: oklch(95% 0.008 85);
  --color-ink: oklch(19% 0.01 60); --color-ink-2: oklch(32% 0.01 60); --color-muted: oklch(45% 0.012 60);
  --color-rule: oklch(88% 0.008 85); --color-rule-2: oklch(76% 0.01 85);
  --color-cool: oklch(50% 0.14 250); --color-cool-soft: oklch(93% 0.04 245); --color-cool-ink: oklch(99% 0.004 85);
  --color-ok: oklch(38% 0.015 250); --color-ok-soft: oklch(93% 0.006 250);
  --color-bad: oklch(52% 0.18 25); --color-bad-soft: oklch(94% 0.04 25);
  --color-stale: oklch(54% 0.14 70); --color-stale-soft: oklch(93% 0.05 80);
  --color-ledger: oklch(40% 0.04 70); --color-focus: oklch(50% 0.14 250);
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
html { scrollbar-color: var(--color-rule-2) var(--color-paper); }
body { background: var(--color-paper); color: var(--color-ink); font: 400 var(--text-base)/1.5 var(--font-body); }
:root[lang="ar"] body, :root[lang="ar"] button { font-family: var(--font-arabic); }
::selection { background: color-mix(in oklab, var(--color-cool) 30%, transparent); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.wrap { max-width: 1560px; margin: 0 auto; padding: var(--space-lg); }
button { font: 500 var(--text-sm) var(--font-body); color: var(--color-ink); background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-pill); padding: var(--space-xs) var(--space-md); min-height: 34px; cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out); }
button:hover { background: var(--color-paper-3); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--color-cool); border-color: var(--color-cool); color: var(--color-cool-ink); }
.seg { display: inline-flex; border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-pill); overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--color-muted); }
.seg button[aria-pressed="true"], .tabs button[aria-selected="true"] { color: var(--color-ink); box-shadow: inset 0 -2px 0 var(--color-cool); }
.measured { font-family: var(--font-outlier); font-variant-numeric: tabular-nums slashed-zero; }
h2 { margin: 0 0 var(--space-xs); font: 500 var(--text-md)/1.25 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
h3 { margin: var(--space-md) 0 var(--space-xs); font: 500 var(--text-sm)/1.3 var(--font-display); color: var(--color-ink-2); }
.sub { margin: 0 0 var(--space-md); color: var(--color-muted); font-size: var(--text-sm); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.bar { display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap; padding-bottom: var(--space-md); }
.wordmark { font: 500 var(--text-lg)/1 var(--font-display); letter-spacing: var(--tracking-display); }
.chip { display: inline-flex; align-items: center; gap: var(--space-2xs); font-size: var(--text-xs); font-weight: 500; color: var(--color-ink-2); border: var(--rule-hair) solid var(--color-rule); border-radius: 4px; padding: 1px var(--space-sm); white-space: nowrap; }
.chip.bad { background: var(--color-bad-soft); color: var(--color-ink); border-color: var(--color-bad-soft); }
.chip.ok { background: var(--color-ok-soft); color: var(--color-ink); border-color: var(--color-ok-soft); }
.chip.stale { background: var(--color-stale-soft); color: var(--color-ink); border-color: var(--color-stale-soft); }
.chip.idle { border-style: dashed; }
.asof { color: var(--color-cool); font-size: var(--text-sm); }
.grow { flex: 1; }

/* Verdict and pulse */
.verdict, .pulse { display: grid; gap: var(--rule-hair); background: var(--color-rule); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); overflow: hidden; margin-bottom: var(--space-md); }
.verdict { grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 1fr)); }
.pulse { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.verdict > div { background: var(--color-paper-3); padding: var(--space-md) var(--space-lg); min-width: 0; }
.pulse > div { background: var(--color-paper-2); padding: var(--space-md) var(--space-lg); min-width: 0; display: flex; flex-direction: column; }
.pulse .note { margin-top: auto; padding-top: var(--space-2xs); }
.verdict .line { font-size: var(--text-md); overflow-wrap: break-word; }
.verdict .gapnote, .pulse .note { font-size: var(--text-xs); color: var(--color-muted); }
.light .k, .pulse .k { font-size: var(--text-xs); color: var(--color-muted); }
.light .v { display: flex; align-items: center; gap: var(--space-sm); font-weight: 500; margin-top: var(--space-2xs); font-size: 19px; letter-spacing: -0.01em; }
.light .v svg { flex: none; }
.pulse .big { font: 400 var(--text-xl)/1.1 var(--font-outlier); font-variant-numeric: tabular-nums slashed-zero; margin-top: 2px; }
.pulse .gaps { color: var(--color-ink-2); font-size: var(--text-sm); margin: var(--space-2xs) 0 0; padding-inline-start: var(--space-lg); }
.trace-h { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-sm); }
.trace-v { font: 400 var(--text-xl)/1.1 var(--font-outlier); font-variant-numeric: tabular-nums slashed-zero; letter-spacing: -0.03em; }
.trace-v small { font: 400 var(--text-xs) var(--font-body); color: var(--color-muted); margin-inline-start: var(--space-2xs); letter-spacing: 0; }
svg.trace { width: 100%; height: 70px; display: block; direction: ltr; margin-top: var(--space-xs); overflow: visible; }
.trace .band { fill: var(--color-ok-soft); }
.trace .area { fill: color-mix(in oklab, var(--color-cool) 14%, transparent); }
.trace .line { fill: none; stroke: var(--color-cool); stroke-width: 1.6; stroke-linejoin: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.6s var(--ease-out) forwards; }
.trace .line.badline { stroke: var(--color-bad); }
.trace .now { fill: var(--color-cool); animation: beacon 2.4s ease-in-out infinite; }
.trace .spike { fill: var(--color-stale); }
.trace .badpt { fill: var(--color-bad); }
.trace .axis { stroke: var(--color-rule); stroke-width: 1; }
.trace text { fill: var(--color-muted); font: 400 10px var(--font-body); }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes beacon { 50% { opacity: .35; } }
.weeks { display: flex; align-items: flex-end; gap: var(--space-2xs); height: 34px; margin-top: var(--space-xs); direction: ltr; }
.weeks i { flex: 1; height: 100%; display: block; background: var(--color-cool); opacity: .45; border-radius: 2px 2px 0 0; transform-origin: bottom; transform: scaleY(0); transition: transform 900ms var(--ease-out); }
.weeks i:last-child { opacity: .9; }
.tiny { display: flex; justify-content: space-between; font-size: 11px; color: var(--color-muted); direction: ltr; }

/* Panels */
.panels { display: grid; gap: var(--rule-hair); background: var(--color-rule); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); overflow: hidden; }
.panels > section { background: var(--color-paper-2); padding: var(--space-lg); min-width: 0; position: relative; }
.main { grid-template-columns: minmax(0, 1fr) 370px; }
.lower { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: var(--space-md); }

/* The grid diagram (reads left to right in both languages) */
svg.grid { width: 100%; height: auto; display: block; direction: ltr; }
.zone { fill: var(--color-muted); font: 500 13px var(--font-body); }
.cc rect.frame { fill: var(--color-paper-3); stroke: var(--color-rule); }
.bus { stroke: var(--color-cool); stroke-width: 2; stroke-opacity: .45; }
.tap rect { fill: var(--color-paper-2); stroke: var(--color-rule-2); }
.tap .t1 { fill: var(--color-ink); font: 500 13px var(--font-body); }
.tap .t2 { fill: var(--color-muted); font: 400 12.5px var(--font-body); }
.tap .t3 { font: 400 12.5px var(--font-outlier); }
.riser { stroke: var(--color-rule-2); stroke-width: 1; stroke-dasharray: 2 4; fill: none; }
.cable { fill: none; stroke-linecap: round; }
.cable.live { stroke: var(--color-cool); stroke-width: 6; stroke-opacity: .22; }
.cable.fault { stroke: var(--color-bad); stroke-width: 4; stroke-dasharray: 10 6; animation: faultpulse 1.6s ease-in-out infinite; }
@keyframes faultpulse { 50% { stroke-opacity: .35; } }
.current { fill: none; stroke-linecap: round; stroke-width: 4; stroke-dasharray: 1 16; animation: flow var(--dur, 2.4s) linear infinite; }
.current.live { stroke: var(--color-cool); }
.current.riser { stroke: var(--color-cool); stroke-width: 3; stroke-dasharray: 1 12; opacity: .8; }
.current.stall { stroke: var(--color-cool); animation: stall 3.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -34; } }
@keyframes stall { 0% { stroke-dashoffset: 0; } 55% { stroke-dashoffset: -40; } 100% { stroke-dashoffset: -40; } }
.cable.infra { stroke: var(--color-rule-2); stroke-width: 2; stroke-dasharray: 6 5; }
.cable.rule { stroke: var(--color-rule-2); stroke-width: 1; stroke-dasharray: 2 6; }
.clabel { fill: var(--color-ink-2); font: 500 13px var(--font-body); }
.cstate { font: 400 12.5px var(--font-body); }
.clabel-bg { fill: var(--color-paper-2); stroke: var(--color-rule-2); stroke-width: 1; }
.station { cursor: pointer; }
.station .face { fill: var(--color-paper-3); stroke: var(--color-rule-2); stroke-width: 1; transition: stroke var(--dur-short) var(--ease-out); }
.station.err .face { stroke: var(--color-bad); stroke-width: 1.5; }
.station.ledger .face { fill: transparent; stroke: var(--color-ledger); stroke-opacity: .7; }
.station:hover .face, .station:focus-visible .face, .station[aria-pressed="true"] .face { stroke: var(--color-cool); stroke-width: 2; }
.station:focus { outline: none; }
.dim { opacity: .3; transition: opacity var(--dur-short) var(--ease-out); }
.sname { fill: var(--color-ink); font: 500 17px var(--font-display); letter-spacing: -0.01em; }
.srole { fill: var(--color-ink-2); font: 400 12px var(--font-body); }
.sk { fill: var(--color-muted); font: 400 12.5px var(--font-body); }
.sv { fill: var(--color-ink); font: 500 15px var(--font-outlier); }
.sv.bad { fill: var(--color-bad); } .sv.unk { fill: var(--color-muted); }
.lamp rect { stroke-width: 1; }
.lamp text { font: 500 11px var(--font-body); }
.host rect { fill: var(--color-paper-3); stroke: var(--color-rule); }
.hname { fill: var(--color-ink); font: 500 13px var(--font-body); }
.hsub { fill: var(--color-muted); font: 400 12.5px var(--font-body); }
.pin { cursor: pointer; }
.pin rect.box { fill: var(--color-bad-soft); stroke: var(--color-bad); }
.pin:hover rect.box, .pin.on rect.box { fill: var(--color-bad); }
.pin:hover .ic, .pin.on .ic { stroke: var(--color-paper-3); }
.ic { fill: none; stroke: var(--color-bad); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.gate { stroke: var(--color-bad); stroke-width: 3; opacity: 0; transition: opacity 400ms var(--ease-out); }
.gate.on { opacity: .9; }
.dimmable { transition: opacity 400ms var(--ease-out); }
.dimmable.down { opacity: .25; }
.scan { fill: var(--color-bad); opacity: .55; }
:root[lang="ar"] svg.grid text:not(.sv):not(.t3) { font-family: var(--font-arabic); }

/* Legend */
.legend-row + .legend-row { margin-top: var(--space-xs); }
.legend-cap { margin: var(--space-xs) 0 0; font-size: var(--text-xs); color: var(--color-muted); }
.legend-row { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-lg); margin-top: var(--space-md); font-size: var(--text-xs); color: var(--color-ink-2); align-items: center; }
.legend-row .it { display: inline-flex; align-items: center; gap: var(--space-xs); }
.legend-row .swatch { width: 26px; height: 0; border-top: 4px solid var(--c); }
.legend-row .swatch.dash { border-top-style: dashed; }
.legend-row .sep { width: 1px; height: 16px; background: var(--color-rule-2); }

/* Side: alarms, events, detail */
.tabs { display: flex; gap: var(--space-2xs); margin-bottom: var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); }
.tabs button { background: transparent; border: 0; border-radius: 0; color: var(--color-muted); }
.alarms { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-xs); max-height: 600px; overflow: auto; }
.alarm { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: var(--space-sm); padding: var(--space-sm) var(--space-md); border: var(--rule-hair) solid var(--color-rule); border-radius: 12px; background: var(--color-paper-3); cursor: pointer; text-align: start; width: 100%; color: inherit; font: inherit; }
.alarm:hover, .alarm[aria-pressed="true"] { border-color: var(--color-bad); }
.alarm .ib { width: 30px; height: 30px; border-radius: 6px; background: var(--color-bad-soft); display: grid; place-items: center; }
.alarm .tt { font-weight: 500; font-size: var(--text-sm); }
.alarm .loc { font-size: var(--text-xs); color: var(--color-ink-2); }
.alarm .meta { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-sm); font-size: 11px; color: var(--color-muted); margin-top: 2px; }
.alarm.unknown { border-style: dashed; }
.alarm.unknown .ib { background: var(--color-paper-2); }
.trail { list-style: none; margin: 0; padding-inline-start: var(--space-lg); border-inline-start: var(--rule-hair) solid var(--color-rule-2); display: grid; gap: var(--space-md); max-height: 600px; overflow: auto; }
.trail li { position: relative; }
.trail li.new { animation: enter 520ms var(--ease-out); }
@keyframes enter { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.trail li::before { content: ""; position: absolute; inset-inline-start: calc(-1 * var(--space-lg) - 5px); top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--color-paper-2); border: 2px solid var(--kind); }
.trail .meta { display: flex; gap: var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); }
.trail .when { color: var(--color-cool); }
.trail .what { font-size: var(--text-sm); }
.trail .why { font-size: var(--text-xs); color: var(--color-muted); }
.detail .msg { font: 400 var(--text-xs)/1.4 var(--font-outlier); color: var(--color-ink-2); overflow-wrap: anywhere; background: var(--color-paper-3); border: var(--rule-hair) solid var(--color-rule); border-radius: 6px; padding: var(--space-sm); }
.detail .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-2xs) var(--space-md); font-size: var(--text-sm); margin-top: var(--space-sm); }
.detail .kv dt { color: var(--color-muted); }
.detail .kv dd { margin: 0; }
.detail .gapline { color: var(--color-stale); font-size: var(--text-xs); }
.detail a { color: var(--color-cool); text-decoration-color: var(--color-rule-2); }
.trace { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2xs); font-size: var(--text-xs); margin-top: var(--space-sm); direction: ltr; }
.trace span { padding: 1px var(--space-xs); border: var(--rule-hair) solid var(--color-rule-2); border-radius: 4px; }
.trace span.at { border-color: var(--color-bad); color: var(--color-bad); }
[hidden] { display: none !important; }

/* Lower */
.river { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-xs); }
.col { border-top: 2px solid var(--c); padding-top: var(--space-xs); min-height: 96px; position: relative; }
.col .n { font: 500 var(--text-xl)/1 var(--font-outlier); font-variant-numeric: tabular-nums slashed-zero; }
.col .l { color: var(--color-muted); font-size: var(--text-xs); }
.strip-wrap { overflow: hidden; border-radius: 4px; direction: ltr; }
.strip { display: flex; gap: 1px; }
.cell { flex: 1 1 0; min-width: 2px; height: 34px; border-radius: 2px; background: var(--c); }
.cell.f { background: repeating-linear-gradient(45deg, var(--c) 0 3px, var(--color-paper-2) 3px 5px); }
.reading { font: 400 var(--text-display)/1 var(--font-outlier); letter-spacing: -0.04em; font-variant-numeric: tabular-nums slashed-zero; }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-md); margin-top: var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-inline-end: var(--space-xs); background: var(--c); vertical-align: -1px; }
.legend span.f::before { background: repeating-linear-gradient(45deg, var(--c) 0 3px, var(--color-paper-2) 3px 5px); }
.svc-tbl { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.svc-tbl th, .svc-tbl td { text-align: start; padding: var(--space-2xs) var(--space-xs); border-bottom: var(--rule-hair) solid var(--color-rule); }
.svc-tbl th, .svc-tbl td:first-child { white-space: nowrap; }
.svc-tbl th:not(:first-child) { text-align: end; }
.svc-tbl th { color: var(--color-muted); font-weight: 500; font-size: var(--text-xs); }
.svc-tbl td.n { font-family: var(--font-outlier); text-align: end; }
.hosts { display: grid; gap: var(--space-sm); }
.hrow { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); font-size: var(--text-sm); }
.host { cursor: pointer; }
.host:hover rect, .host:focus-visible rect, .host[aria-pressed="true"] rect { stroke: var(--color-cool); }
.host:focus { outline: none; }
.example-tag { fill: var(--color-stale); font: 500 11px var(--font-body); }
.alarm.example { border-style: dashed; }
.mon-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2xs); font-size: var(--text-sm); }
.mon-list li { display: flex; justify-content: space-between; gap: var(--space-sm); border-bottom: var(--rule-hair) solid var(--color-rule); padding: var(--space-2xs) 0; }
.foot { color: var(--color-muted); font-size: var(--text-xs); margin-top: var(--space-md); }

@media (max-width: 1200px) { .main { grid-template-columns: minmax(0, 1fr); } .lower, .pulse { grid-template-columns: repeat(2, minmax(0, 1fr)); } .verdict { grid-template-columns: repeat(3, minmax(0, 1fr)); } .verdict > div:first-child { grid-column: 1 / -1; } }
@media (max-width: 640px) { .lower, .pulse, .verdict { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; transition: none !important; }

/* ===== Premium clean finish (owner pick, calibration 2) ===== */
:root {
  --color-paper: oklch(16.5% 0.006 270); --color-paper-2: oklch(20.5% 0.007 270); --color-paper-3: oklch(18.5% 0.007 270);
  --color-ink: oklch(97% 0.003 270); --color-ink-2: oklch(86% 0.006 270); --color-muted: oklch(68% 0.012 270);
  --color-rule: oklch(100% 0 0 / 0.08); --color-rule-2: oklch(100% 0 0 / 0.16); --color-hi: oklch(100% 0 0 / 0.12);
  --color-cool: oklch(70% 0.14 275); --color-cool-soft: oklch(70% 0.14 275 / 0.14); --color-cool-ink: oklch(18% 0.03 275);
  --color-ok: oklch(85% 0.01 270); --color-ok-soft: oklch(100% 0 0 / 0.06);
  --color-bad: oklch(70% 0.17 28); --color-bad-soft: oklch(70% 0.17 28 / 0.13);
  --color-stale: oklch(82% 0.13 80); --color-stale-soft: oklch(82% 0.13 80 / 0.13);
  --color-focus: oklch(70% 0.14 275);
  --font-display: "Inter", ui-sans-serif, system-ui, sans-serif; --font-body: var(--font-display);
  --font-outlier: "Inter", "IBM Plex Sans Arabic", ui-sans-serif, system-ui, sans-serif;
  --radius-card: 16px; --radius-pill: 10px; --shadow-card: 0 12px 32px oklch(0% 0 0 / 0.35);
  --color-sheen: oklch(100% 0 0 / 0.03); --color-frame: oklch(100% 0 0 / 0.02); --color-bad-glow: oklch(70% 0.17 28 / 0.35); --color-bad-tile: oklch(70% 0.17 28 / 0.18); --color-band: oklch(100% 0 0 / 0.04);
}
:root[data-theme="light"] {
  --color-paper: oklch(97.5% 0.003 270); --color-paper-2: oklch(99.5% 0.002 270); --color-paper-3: oklch(98.5% 0.002 270);
  --color-ink: oklch(20% 0.01 270); --color-ink-2: oklch(34% 0.01 270); --color-muted: oklch(50% 0.012 270);
  --color-rule: oklch(0% 0 0 / 0.08); --color-rule-2: oklch(0% 0 0 / 0.16); --color-hi: oklch(100% 0 0 / 0.9);
  --color-cool: oklch(52% 0.17 275); --color-cool-soft: oklch(52% 0.17 275 / 0.1); --color-cool-ink: oklch(99% 0.002 270);
  --color-ok: oklch(38% 0.01 270); --color-ok-soft: oklch(0% 0 0 / 0.05);
  --color-bad: oklch(55% 0.19 28); --color-bad-soft: oklch(55% 0.19 28 / 0.1);
  --shadow-card: 0 10px 28px oklch(0% 0 0 / 0.08);
}
body { letter-spacing: -0.005em; }
.measured { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; }
button { border-radius: var(--radius-pill); border-color: var(--color-rule); background: transparent; }
button:hover { background: var(--color-rule); }
.chip { border-radius: 999px; border-color: transparent; background: var(--color-ok-soft); padding: 2px var(--space-sm); }
.chip.bad { background: var(--color-bad-soft); color: var(--color-bad); }
.chip.stale { background: var(--color-stale-soft); color: var(--color-stale); }
.chip.ok { background: var(--color-ok-soft); color: var(--color-ink-2); }
.chip.idle { border: 1px dashed var(--color-rule-2); background: transparent; }
.wordmark { font-weight: 600; letter-spacing: -0.03em; }
/* floating cards instead of hairline seams */
.verdict, .pulse, .panels { background: transparent; border: 0; gap: var(--space-md); overflow: visible; }
.verdict > div, .pulse > div, .panels > section {
  background: linear-gradient(180deg, var(--color-sheen), transparent), var(--color-paper-2);
  border: 0; border-radius: var(--radius-card);
  box-shadow: inset 0 1px 0 var(--color-hi), inset 0 0 0 1px var(--color-rule), var(--shadow-card);
}
.verdict .line { font-size: 18px; font-weight: 500; letter-spacing: -0.015em; }
.light .v { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.trace-v { font-weight: 600; letter-spacing: -0.03em; }
.reading { font-weight: 600; letter-spacing: -0.04em; }
.col .n { font-weight: 600; letter-spacing: -0.03em; }
h2 { font-weight: 600; letter-spacing: -0.02em; }
.trace .line { stroke-width: 2; }
.trace .area { fill: color-mix(in oklab, var(--color-cool) 16%, transparent); }
.trace .band { fill: var(--color-band); }
/* diagram */
svg.grid .cc rect.frame { fill: var(--color-frame); stroke: var(--color-rule); }
.tap rect { fill: var(--color-paper-3); stroke: var(--color-rule); }
.station .face { fill: var(--color-paper-3); stroke: var(--color-rule-2); }
.station.err .face { stroke: var(--color-bad); stroke-width: 1.5; filter: drop-shadow(0 0 8px var(--color-bad-glow)); }
.station.ledger .face { stroke: var(--color-rule-2); stroke-dasharray: 4 4; }
.sname { font: 600 17px var(--font-display); letter-spacing: -0.02em; }
.sv { font: 600 17px var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.sk, .srole { fill: var(--color-muted); }
.lamp text { font: 500 11px var(--font-display); }
.host rect { fill: var(--color-paper-3); stroke: var(--color-rule); }
.clabel-bg { fill: var(--color-paper-2); stroke: var(--color-rule-2); }
.pin rect.box { fill: var(--color-paper-2); stroke: var(--color-bad); }
.bus { stroke: var(--color-cool); stroke-opacity: .35; }
.current.live, .current.stall { stroke: var(--color-cool); }
/* alarm list: a halo instead of a side stripe */
.alarm { border: 1px solid var(--color-bad-soft); border-radius: 12px; background: var(--color-bad-soft); }
.alarm:hover, .alarm[aria-pressed="true"] { border-color: var(--color-bad); }
.alarm .ib { background: var(--color-bad-tile); border-radius: 10px; }
.alarm.unknown { border: 1px dashed var(--color-rule-2); background: transparent; }
.tabs button[aria-selected="true"], .seg button[aria-pressed="true"] { box-shadow: inset 0 -2px 0 var(--color-cool); }
.svc-tbl th, .svc-tbl td { border-bottom-color: var(--color-rule); }
</style>
