                    stores:
                      - { storeId: "0190f5a2-3b4c-7d8e-9f01-0000000000b1", readAt: "2026-11-26T06:59:59.120Z", eligibleAsSource: true, exclusion: null }
                      - { storeId: "0190f5a2-3b4c-7d8e-9f01-0000000000b3", readAt: "2026-11-26T06:59:59.120Z", eligibleAsSource: true, exclusion: null }
                    objective: { deficitBefore: "12.0000", deficitAfter: "4.0000", storePairs: 1, lines: 1 }
                    validator: { passed: true, violations: [] }
