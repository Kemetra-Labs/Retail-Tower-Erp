openapi: 3.1.0
info:
  title: Data-Pulse-2 Inventory — Store Redistribution Proposals API
  version: "1.0.0-draft"
  description: >
    RT-1599 (W9 slice A, candidate N2 of the RT-1596 master plan; [GATED: contract]; approved under the owner's
    delegation in chat on 2026-11-25). The contract for store-to-store redistribution PROPOSALS, published before any
    consumer is built. A new file, additive to every other contract: no existing operation or schema changes. The
    runtime is RT-1600 and the Console screen RT-1601; until RT-1600 lands every operation is marked
    `x-runtime-status: contract-only`. RT-1600 serves every operation of this contract, so none is marked any more.


    WHAT A PROPOSAL IS. On request, Backend-Core reads the tenant's stores (the W3 availability snapshot, open
    transfer quantities and each store's device freshness), runs the deterministic rule `reorder_gap_greedy` 1.0.0
    (RT-1598) and its independent validator, and stores the result as a proposal: lines that each move a quantity of
    one product from a source store to a destination store that is below its reorder level. A proposal is advice. It
    changes no stock, reserves nothing and never posts to the ERP. Only an explicit accept turns chosen lines into W3
    shipment transfers in `draft`; it never approves, dispatches or receives one (the W3 transfer workflow owns those).


    WHO. Owner or tenant_admin of the tenant whose store access covers every store of the tenant (a proposal reads
    and moves stock across all of them). Every other role, an owner or tenant_admin whose access is limited to
    specific stores, another tenant's proposal, an unknown id, and a tenant for which the feature is off all receive
    the same non-disclosing 404 `not_found`; the cases are indistinguishable by design. A platform admin is admitted
    as on every console operation. 403 is only `origin_rejected` (RT-430), on commands; reads never answer 403.


    PHASES. The feature ships dark. A tenant on the SHADOW allowlist may compute, list, read, review and reject:
    review records "would accept" / "would reject" per line and creates nothing. A tenant on the LIVE allowlist, with
    W3 shipment transfers activated, may also accept. `acceptEnabled` on a proposal tells the client which phase
    applies; for a tenant where it is false, accept answers the non-disclosing 404.


    STATES. `open` (just computed), `reviewed` (at least one review decision recorded), `partially_accepted` (some
    lines have an accept outcome, others not yet), `accepted` (every line has an accept outcome: created, reduced or
    dropped), `rejected`, `expired` (past `expiresAt`, set by the server, 24 hours after `createdAt` in V1, without a
    terminal decision) and `superseded` (a newer compute replaced it). `accepted`, `rejected`, `expired` and
    `superseded` are terminal. A tenant has at most one non-terminal proposal: every compute, scoped or not and
    whether or not it finds anything to move, supersedes it. A proposal past `expiresAt` is `expired`, never
    `superseded`, even before any sweep, and `proposal_expired` wins over every other 409 code.


    FRESHNESS. A store is excluded as a SOURCE (never as a destination) when any active device of the store has an
    unknown queue, dead-letter or held sales, or a stale heartbeat; an inactive store is excluded both ways. The
    exclusion and the per-store read time are on the proposal. Accept re-checks each listed line against current
    state: the source's freshness, its available stock net of open drafts, the destination's gap to its reorder
    level, sellability at both stores, and every per-line rule of the W3 transfer create command. A line that can no
    longer be given in full is reduced or dropped, and the outcome records both quantities and the reason.


    QUANTITIES are exact-decimal strings (`numeric(19,4)`), never floats. There is no money or currency on this
    surface.


    IDEMPOTENCY. Every command requires `Idempotency-Key` (`x-idempotency: required`), resolved by the shared
    `IdempotencyInterceptor`: an identical retry replays the stored response with `Idempotent-Replayed: true`, key
    reuse with a different body is 409 `idempotency_key_conflict`, a key still being processed is 425
    `idempotency_in_progress`, a missing key is 400 `idempotency_key_required` and a malformed one 400
    `idempotency_key_malformed`.


    ERRORS use the canonical envelope `{ error: { code, message, request_id } }`. Codes on this surface:
    `validation_error`, `idempotency_key_required`, `idempotency_key_malformed` (400); `unauthorized` (401);
    `origin_rejected` (403, commands only); `not_found` (404); `idempotency_key_conflict`, `proposal_superseded`,
    `proposal_expired`, `proposal_state_conflict`, `proposal_line_already_decided`, `proposal_stale` (409);
    `redistribution_too_large`, `redistribution_deadline_exceeded`, `redistribution_plan_invalid` (422);
    `idempotency_in_progress` (425); `rate_limited` (429); `internal_error` (5xx).


    ENGINE FIELDS (ratifying the RT-1598 README deviations). The engine's `stores[].tenantId`, `rows[].tracked` and
    input rows are internal and not on the wire. On the wire: a nullable reorder level is reported as the warning
    `reorder_level_missing`; the buffer policy is echoed; warnings and validator violations are structured
    `{code, ...}` objects; per-move warnings sit on each line; an inactive store is excluded both as source and as
    destination. A stored proposal always has a non-null objective and a passed validator report: a compute whose
    result is not `proposed` is never stored. Warning codes, store exclusions and line drop reasons are open strings
    whose current values are listed on each schema: a client must show an unknown value generically, and a new value
    is not a breaking change.

servers:
  - url: https://api.example.com

tags:
  - name: inventory-redistribution
    description: >
      W9 store redistribution proposals: compute, list, read, review (shadow), accept to W3 draft transfers (live) and
      reject (RT-1599).

paths:
  /api/inventory/v1/redistribution-proposals:
    post:
      operationId: createRedistributionProposal
      tags: [inventory-redistribution]
      summary: Compute a redistribution proposal for the tenant.
      x-idempotency: required
      description: >
        Computes a proposal on demand over the tenant's active stores, or over `storeIds` when given (at least two;
        a store that is not an active store of the tenant is 400 `validation_error`, which never says whether it
        exists elsewhere). Either way the tenant's non-terminal proposal, if any, is superseded. The result is stored
        only when the rule proposes at least one line: 201 with the new proposal. When nothing needs to move, 200
        with the outcome, including the id of the proposal it superseded; nothing new is stored. A store set above the limits is 422 `redistribution_too_large`, a compute
        over its deadline is 422 `redistribution_deadline_exceeded`, and a plan the independent validator rejects
        is 422 `redistribution_plan_invalid`; none of the three stores or supersedes anything. Owner or tenant_admin
        on the shadow or live allowlist; otherwise the non-disclosing 404.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeRedistributionProposalCommand"
      responses:
        "200":
          description: Nothing to move. Nothing new was stored; the tenant's non-terminal proposal, if any, was superseded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedistributionNothingToMove"
              examples:
                nothing_to_move:
                  value:
                    result: nothing_to_move
                    supersededProposalId: null
                    rule: { name: reorder_gap_greedy, version: "1.0.0" }
                    computedAt: "2026-11-26T08:00:00.000Z"
                    stores:
                      - { storeId: "0190f5a2-3b4c-7d8e-9f01-0000000000b1", readAt: "2026-11-26T07:59:59.120Z", eligibleAsSource: true, exclusion: null }
                      - { storeId: "0190f5a2-3b4c-7d8e-9f01-0000000000b3", readAt: "2026-11-26T07:59:59.200Z", eligibleAsSource: true, exclusion: null }
                    warnings: []
        "201":
          description: Proposal computed, stored in state `open`, and the previous non-terminal one superseded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedistributionProposal"
        "400": { $ref: "#/components/responses/WriteValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundNonDisclosing" }
        "409": { $ref: "#/components/responses/IdempotencyKeyConflict" }
        "422": { $ref: "#/components/responses/ComputeRefused" }
        "425": { $ref: "#/components/responses/IdempotencyInProgress" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }
    get:
      operationId: listRedistributionProposals
      tags: [inventory-redistribution]
      summary: List the tenant's redistribution proposals, newest first, in keyset pages.
      description: >
        The tenant's proposals newest first (`createdAt DESC, id DESC`), optionally filtered by `state`, as summaries
        without lines. An opaque `cursor` bound to this operation, the tenant and the filter; a value the server did
        not issue, or one reused with another filter, is 400 `validation_error`. A proposal past `expiresAt` is
        reported `expired` even before any sweep. Owner or tenant_admin on the shadow or live allowlist; otherwise
        the non-disclosing 404.
      security:
        - cookieAuth: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RedistributionProposalState"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of proposal summaries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedistributionProposalList"
              examples:
                one_page:
                  value:
                    items:
                      - id: "0190f5a2-3b4c-7d8e-9f01-0000000000a1"
                        state: open
                        acceptEnabled: false
                        createdAt: "2026-11-26T08:00:00.000Z"
                        expiresAt: "2026-11-27T08:00:00.000Z"
                        computedAt: "2026-11-26T08:00:00.000Z"
                        objective: { deficitBefore: "12.0000", deficitAfter: "4.0000", storePairs: 1, lines: 1 }
                        lineCount: 1
                        excludedStoreCount: 1
                        warningCount: 1
                    nextCursor: null
        "400": { $ref: "#/components/responses/ReadValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFoundNonDisclosing" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/redistribution-proposals/{proposalId}:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    get:
      operationId: getRedistributionProposal
      tags: [inventory-redistribution]
      summary: Read one redistribution proposal with its lines.
      description: >
        The proposal with its lines, per-store read times and exclusions, objective, validator report and warnings,
        plus each line's review decision and accept outcome. Owner or tenant_admin on the shadow or live allowlist;
        another tenant's proposal, an unknown id, another role and a tenant with the feature off are the same
        non-disclosing 404.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedistributionProposal"
              examples:
                open:
                  summary: Just computed; no decision yet.
                  value:
                    id: "0190f5a2-3b4c-7d8e-9f01-0000000000a1"
                    state: open
