openapi: 3.1.0
info:
  title: Data-Pulse-2 Inventory — Stock Movement Ledger API
  version: "1.13.0-draft"
  description: >
    Spec 009 Inventory & Stock Movement Ledger contract surface. Defines the
    Inventory source-of-truth domain the SaaS owns: an append-only
    `stock_movements` ledger and a derived (compute-on-read) on-hand balance.
    Built ALONGSIDE the shipped 001/005/008 seams — it reuses the
    `Idempotency-Key` interceptor, the `sourceSystem + externalId` dedup key,
    tenant-context/RLS, audit, and the outbox/worker. It does NOT re-invent
    ingestion.

    DECOUPLED from the gated 008 live loop: v1 does NOT subscribe to
    `sale.captured`. A movement MAY reference an 008 `sale_id` / `sale_line_id`
    (or a void/refund terminal event) as PROVENANCE ONLY. Automatic decrement
    and automatic restock-on-void are DEFERRED to a future follow-up
    (FR-060/FR-025) and are NOT modeled here.

    AUTH SURFACE (plan §4.2): the operator operations are a dashboard /
    back-office `cookieAuth` surface (the same `dp2_session` cookie scheme as
    `auth.openapi.yaml` / `outbox.openapi.yaml`) — NOT a POS-device
    (`/api/pos/v1/...`) surface. The principal's resolved tenant + store
    binding supplies `tenant_id` and `store_id`; body-supplied tenant / store / actor / derived-balance fields
    are NEVER accepted (Constitution §III/§XII, FR-052).

    Thirty operations:

      1. `createStockMovement` — append an inbound / outbound / adjustment
         movement (write-off = a reason-coded outbound). Exact-decimal quantity
         in the product's single stocking unit; cross-unit is rejected
         (FR-022). Idempotent via the `Idempotency-Key` header (FR-030). A
         movement MAY carry sale / terminal-event provenance refs (FR-032/025).
         Negative stock is ALLOWED and FLAGGED — never rejected for going below
         zero (FR-024).
      2. `getOnHand` — the derived on-hand for a `(store, product)`: the signed
         SUM of its movements (FR-003). The projection carries a
         `negative_balance` flag (FR-024). Empty key ⇒ deterministic zero
         (FR-005).
      3. `listStockMovements` — list a store's movements newest first in
         keyset pages (FR-004, RT-731): one product's, the ad-hoc
         (null-product) ones, which roll up to no product on-hand, or all of
         them (`scope=all`).
      4. `createStockTransfer` — an intra-tenant transfer as LINKED movements
         (a `transfer_out` at source + `transfer_in` at destination sharing a
         transfer group); mutually discoverable (FR-020). Same-store / zero-qty
         ⇒ validation error; cross-tenant destination ⇒ non-disclosing 404.
      5. `recordStockCount` — record a physical count; any variance from the
         derived on-hand is appended as a `count_correction` movement, never a
         history rewrite (FR-021).
      6. `listStockLocations` — the stock locations of a store (RT-432).
      7. `listTrackingIdentities` — the batches / serials of a product
         (RT-448).
      8. `createStatusMove` — move stock between two inventory statuses at one
         location, as one event with two effects (RT-435).
      9. `createRelocation` — move stock between two locations of one store,
         same status, as one event with two effects (RT-435).
     10. `getReturnLandingPolicy` / 11. `setReturnLandingPolicy` — the
         tenant's return landing status (RT-435).
     12. `placeQualityHold` / 13. `releaseTrackingHold` /
         14. `getTrackingHold` — a hold on a tracking identity (RT-449).
     15. `createInventoryRecall` / 16. `getInventoryRecall` — a recall of
         listed identities of one product (RT-449).
     17. `correctTrackingIdentityExpiry` — the governed expiry correction of
         an identity, with history (RT-449).
     18. `getSafetyTtlSetting` / 19. `setSafetyTtlSetting` — the tenant's
         Safety TTL of the POS inventory safety feed (RT-449).
     20. `listInventorySafetyFindings` — the computed inventory safety
         findings (RT-449).
     21. `listTrackingResolutionQueue` / 22. `bindTrackingResolution` — the
         Tracking Resolution queue of `tracking_unresolved` sales and the
         governed bind that resolves one (RT-451; served since RT-451 S5).
     23. `listSaleLineFindings` — the recorded sale-line findings of tracked
         selling (RT-451; contract-only).
     24. `listTrackingHolds` / 25. `listInventoryRecalls` — the tenant's
         holds and recall summaries in keyset pages (RT-1081).
     26. `getTrackingIdentity` / 27. `getTrackingIdentityPositions` — one
         identity and its positions per store (RT-1081).
     28. `listTrackingIdentityExpiryCorrections` — an identity's expiry
         history in keyset pages (RT-1081).
     29. `getTrackedSellingSetting` / 30. `setTrackedSellingSetting` — the
         tenant's tracked-selling on/off switch (RT-451 S2; contract-only).

    Quantity: every quantity is an exact-decimal STRING (`numeric(p,s)` at
    rest); no float appears on the wire. There is NO money / tender / payment
    field anywhere (out of scope — 010). Timestamps are RFC 3339 / `date-time`
    in UTC.

    Response bodies are explicit `toBody()` wire projections — the
    `stock_movements` / `stock_counts` DB shape is NEVER returned directly
    (Constitution §IV). Internal-only fields and the lineage-only
    `idempotency_key` column are not projected. The failure vocabulary encodes
    a canonical `Error` envelope shared verbatim with `auth.openapi.yaml` /
    `outbox.openapi.yaml`. There is NO PII / payment-class field (§XIV).

    1.1.0-draft — Inventory Effects Journal (Jira RT-425; owner-approved
    RT-289 Gates 2+3, Confluence RETAIL "Inventory Operations" baseline).
    Additive only. A movement is an Inventory Effect: it now projects its
    `origin` (`retail` | `erp_external`), its ERP `integrationState`
    (`not_posted` | `pending` | `confirmed` | `rejected` |
    `reconciliation_required` | `external`) and `erpConfirmedAt`. Every
    manual movement, transfer leg and count correction is a Retail effect
    that starts `not_posted`: none of them is posted to ERPNext yet. Nothing
    activates sale-linked effects in this version (RT-427). The sale-linked
    backfill operation is deprecated and retired (RT-289 Q3: no historical
    sale backfill); it remains contract-only and is never shipped (removed in
    1.11.0-draft, RT-1099).

    1.2.0-draft — Inventory position grain (Jira RT-432; owner-approved
    RT-290 Gate 4, Confluence RETAIL "Inventory Operations" baseline section
    "Gate 4"). Additive only. A movement is positioned at a Stock Location of
    its own store and an Inventory Status (`sellable` | `return_inspection` |
    `quality_hold` | `damaged` | `expired` | `recall_hold`); tracking is not
    yet supported (Gate 7). Every store has exactly one `primary` location,
    created with the store. Writes land at the store's primary location and
    `sellable` unless a manual movement names another location of the path
    store or another status. A movement recorded before positions existed is
    read as (the store's primary location, `sellable`) and flagged
    `positionInterpreted`; it is never rewritten. `OnHand.quantity` stays the
    physical total over every location and status; `sellableQuantity` and
    `statusQuantities` break it down. `listStockLocations` is read-only. The
    `erp_neutral` integration state exists in the schema but is not returned
    by this version (nothing assigns it yet, RT-435).

    1.3.0-draft — Tracking foundation (Jira RT-448; owner-approved RT-50
    Gate 7, Confluence RETAIL "Inventory Operations" baseline section
    "Gate 7", rules G7-2 and G7-3). Additive only. A Tracking Identity is an
    Inventory-owned batch or serial of one product: its printed `code`
    (matched exactly), its `kind`, its `expiryDate` and its origin. Identities
    are ERP-born only (`origin` is always `erp_external`); Retail Tower never
    creates one. A movement projects `trackingIdentityId`, the identity of the
    movement's own product; it is null for an untracked product and for every
    movement this version writes (tracked selling is not active yet, RT-451).
    `listTrackingIdentities` is read-only. ERPNext Batch / Serial No names are
    NOT part of this contract (they stay in the ERP edge map, M-9).


    **1.4.0-draft (RT-620, additive).** Every cookieAuth operation may
    return 429 `rate_limited` (`TooManyRequests`, with `Retry-After`)
    from the console rate limit (RT-574, RT-619). No other wire change.


    **1.5.0-draft (RT-731, additive).** `listStockMovements` gains the
    optional `scope` query parameter (`adhoc` default | `all`: every movement
    of the store, across every product), documents its order as newest first
    (`occurredAt DESC, id DESC`) and its `cursor` as an opaque keyset cursor
    bound to the operation, the tenant, the store and the filters. The
    request without `scope` selects the same movements as before.


    **1.6.0-draft (RT-435, additive; owner-approved RT-290 Gate 4 and RT-435
    decisions D1–D4, comment 12993).** Two position-changing Retail events, each
    an `adjustment` Business Event with an event record and exactly two
    effects under it: a status move (`createStatusMove`: `-q` in `fromStatus`
    and `+q` in `toStatus` at one location, with a governed `reasonCode`) and
    a relocation (`createRelocation`: `-q` at `fromLocationId` and `+q` at
    `toLocationId`, same status, both active locations of the path store).
    Physical on-hand never changes; Sellable On Hand changes by exactly `q`
    when one side is `sellable`. Under the V1 mapping profile both effects net
    to zero in the store's one ERP mapping bucket, so they are `erp_neutral`
    at creation and no ERP posting intent is created; a move whose net is not
    zero in every bucket is refused (`409 erp_transfer_intent_required`) until
    Gate 8 defines the transfer intent. `StockMovement.integrationState` can
    now be `erp_neutral`. A status move out of `damaged`, `expired`,
    `quality_hold` or `recall_hold` is sensitive: owner or tenant_admin only
    (`403 sensitive_move_forbidden`). Both moves are owner / tenant_admin /
    store_manager operations; a store_manager acts only in its store scope.
    A replay of the same command returns the recorded event and writes
    nothing. `getReturnLandingPolicy` / `setReturnLandingPolicy` read and set
    where a tenant's return effects land (`sellable`, the default, or
    `return_inspection`).


    **1.7.0-draft (RT-449, additive; owner-approved RT-50 Gate 7 G7-2 / G7-6
    / G7-7 and RT-449 rulings H1–H8, comment 13434).** Tracking holds, recall
    and the Inventory Safety Revision. A Tracking Hold is a record on a
    tracking identity: `quality_hold` (`placeQualityHold`) or `recall_hold`
    (one per identity listed by `createInventoryRecall`, a Recall safety
    Business Event; the product is never retired). An active hold blocks
    selling the identity; once the identity has positions, placing a hold
    moves its positive `sellable` and `return_inspection` positions into the
    hold's status as RT-435 status moves (`erp_neutral` effect pairs carrying
    the identity; negative positions are never moved). `releaseTrackingHold`
    ends a hold once: a released quality hold returns its quantity to
    `sellable` (to `recall_hold` when the identity has ever been under a
    recall hold); releasing a recall hold moves nothing, that stock leaves
    only through the Gate 8 disposition. `correctTrackingIdentityExpiry`
    corrects an identity's `expiryDate`, keeping every correction (old, new,
    reason, actor) as history; a required expiry is never cleared. Every placement, release, recall, expiry correction and
    tracking-profile change steps the tenant's monotonic Inventory Safety
    Revision exactly once, in its own transaction; each command answers the
    `safetyRevision` it produced. All of them are tenant-level operations (a
    hold reaches the identity at every store): owner or tenant_admin place a
    quality hold, create a recall and correct an expiry; only the owner
    releases a hold (965). A store_manager is refused. Replays of the same
    command return the recorded result and write nothing. No identity exists
    until the ERP-born identity import (RT-451 / F6), so these operations have
    nothing to act on before then.


    **1.8.0-draft (RT-449 PR 2, additive; owner-approved RT-50 G7-5 / G7-7
    and RT-449 rulings H6 / H8, comment 13434).** `getSafetyTtlSetting` /
    `setSafetyTtlSetting` read and set the tenant's Safety TTL: the maximum
    age of a till's last successful sync from the POS inventory safety feed
    (`inventory/inventory-safety-feed.yaml`), 60 to 900 seconds, 900 (15
    minutes) when unset; it is configurable downwards only, never above the
    default. Every feed answer carries the effective value, so a change
    reaches the tills at their next sync and does not step the Safety
    Revision. `listInventorySafetyFindings` computes the tenant's inventory
    safety findings on read: every active tracking hold (critical, 954) and
    every expired lot still in `sellable` (critical, 953: the expiry date is
    before the store's local business date; a lot is sellable through its
    expiry date, G7-5). `expiring_lot` is reserved: the near-expiry window
    is a policy value that stays off until RT-50 B1, so it is never emitted
    in 1.8.0. A store_manager sees only its own stores' findings. The
    identity import that gives these reads anything to find is RT-453 (F6).


    **1.9.0-draft (RT-451 Step 0, additive, contract-only; [GATED] owner
    authorization Jira RT-451 description, amended 2026-11-03 after RT-455
    comment 15233, OD-1, OD-2 and OD-9; design defaults approved by the owner
    2026-11-03 via the coordinator).** Three operations, each
    `x-runtime-status: contract-only` until the RT-451 runtime ships.
    `listTrackingResolutionQueue` lists the `tracking_unresolved` sales of
    `pos-sales/sales.yaml` G7-9 row 4 with their unresolved lines, in keyset
    pages, owner / tenant_admin; a store_manager gets only `unresolvedCount`
    for its own stores. Such a sale is not a finding.
    `bindTrackingResolution` is the governed, audited, owner-only Tracking
    Resolution: one atomic command per sale binds an existing identity of the
    line's product to every unresolved line, then commits the sale's
    Inventory effects and its ERP posting intent together (RT-50 DC-2).
    `listSaleLineFindings` lists the recorded, append-only sale-line findings
    of G7-9 rows 2 and 3 (`unvalidated_tracked_line`, `sold_under_hold`,
    `erp_intent_held`), filtered by kind and store, newest first. They are
    not kinds of the computed `listInventorySafetyFindings`, which keeps
    counting only current-state findings (RT-455 TR-8). Nothing captures a
    tracked line until the RT-451 runtime, so these reads answer empty until
    then.


    **1.10.0-draft (RT-1081; owner decisions OD-0..OD-8 on RT-455, comment
    15233; proposal `docs/decisions/rt-455-tracking-console-reads.md`).**
    Reads for the Console's tracking holds screen and batch / serial
    detail, all additive: `listTrackingHolds` (active or released holds,
    filterable by status, kind, identity and product), `listInventoryRecalls`
    (recall summaries with hold counts), `getTrackingIdentity`,
    `getTrackingIdentityPositions` (per store and stocking unit, split by
    status and summed over the store's locations) and
    `listTrackingIdentityExpiryCorrections`. The lists are keyset-paged as
    `listStockMovements` (RT-731). Identity reads keep the identity family's
    rule (owner / tenant_admin; any other role and another tenant's identity
    is a non-disclosing 404); the hold, recall and correction reads keep
    theirs (owner / tenant_admin; any other role is a 403).
    `listInventorySafetyFindings` gains the reserved `tracking_consistency`
    kind (critical, OD-8): each `check` is emitted only once the runtime that
    produces its data ships, so 1.10.0 emits none. **One breaking request
    change (TR-5, accepted as OD-7):** `placeQualityHold`,
    `createInventoryRecall` and `correctTrackingIdentityExpiry` now accept only
    a `SafetyReasonCodeInput` (`supplier_notice`, `authority_notice`,
    `label_misprint` or `other`; `other` requires a non-empty `note`).
    Projections keep `SafetyReasonCode` (the pattern), so a code recorded
    before 1.10.0 still reads back. Nothing writes identities until RT-453 and
    nothing writes tracked effects until RT-451, so until then these reads
    answer empty pages, empty positions or 404.

    **1.11.0-draft (RT-1099; [GATED: contract] owner authorization
    2026-11-03).** Removes the deprecated, contract-only
    `backfillSaleLinkedMovements` (`POST
    /api/inventory/v1/admin/sale-linked-backfill`), retired by RT-289 Q3 /
    RT-425 and never served, with the components only it used: the
    `SaleLinkedBackfillCommand`, `SaleLinkedBackfillItem` and
    `SaleLinkedBackfillResult` schemas, the `RateLimited` response, the
    `platformAdmin` security scheme and the `inventory-admin` tag. No other
    operation changes.

    **1.12.0-draft (RT-451 S2, additive, contract-only; [GATED: contract]
    owner decisions OD-T1..OD-T5 and approval, RT-451 comments 16215 and
    16216, 2026-11-08).** Tracked selling (batch / expiry) is an optional
    feature per tenant: Retail Tower is a general retail product, so a
    pharmacy turns it on and a shop that sells no tracked goods can leave it
    off. `getTrackedSellingSetting` / `setTrackedSellingSetting` read and
    switch it; only an owner or tenant_admin switches it. It is off for every tenant until
    switched on. Switching on is accepted only while the six RT-50 Q13
    preconditions (`TrackedSellingPrecondition`) hold; switching off is
    always accepted. Tracked selling is in effect for a tenant only while the
    deployment gate `POS_TRACKED_SELLING_ENABLED` is on AND the tenant has
    switched it on; while the gate is off both operations answer the
    non-disclosing 404 to an authenticated owner or tenant_admin. Both are
    `x-runtime-status: contract-only` until the RT-451 S2 runtime
    (migration M1) ships. Reading the switch (OD-T6, RT-451 comment 16217):
    a store_manager reads its on/off value only, through
    `getTrackedSellingSetting`; the POS reads `tracked_selling_enabled` on
    every answer of the POS inventory safety feed
    (`inventory/inventory-safety-feed.yaml` 1.1.0-draft). A switched-on
    tenant whose preconditions later fail stays on, shown to the owner as a
    warning (OD-T7). No other operation changes.

    **1.13.0-draft (RT-451 S5, wording only, no shape change; [GATED:
    contract] owner approval RT-451 comment 16535, 2026-11-11).** The
    Tracking Resolution runtime ships: `listTrackingResolutionQueue` and
    `bindTrackingResolution` drop their `x-runtime-status: contract-only`
    markers. Wording that settles what the runtime does: the bind refuses an
    identity without an expiry on an `expiry_required` product as
    `tracking_resolution_identity_expired` (fail closed, as capture and the
    Tracked Line Validation; RT-451 comment 16246); a non-batch identity is
    the non-disclosing 404, as an unknown one (RT-50 Q11); a sale outside the
    caller's store scope is the 404 too; the bind also commits the restores
    of the sale's voids and returns recorded before it and the reversal
    posting intents they emitted, each once (RT-451 comment 16556 Q1); and
    the bind's `reasonCode` is a governed machine code of the
    `SafetyReasonCode` pattern with a required note, not the
    `SafetyReasonCodeInput` list of the hold, recall and expiry-correction
    commands (RT-451 comment 16535, S5 question). Neither operation is gated
    by the tracked-selling switch (OD-T4).

servers:
  - url: https://api.datapulse.example
    description: Placeholder; the dashboard/back-office surface is same-origin.

security:
  - cookieAuth: []

tags:
  - name: inventory
    description: Stock movement ledger + derived on-hand (operator / cookieAuth surface).

paths:
  /api/inventory/v1/stores/{storeId}/movements:
    post:
      operationId: createStockMovement
      tags: [inventory]
      summary: Append a stock movement (inbound / outbound / adjustment).
      description: >
        Append an append-only stock movement at the path-scoped store.
        `movementType` is one of `inbound` | `outbound` | `adjustment`
        (write-off is a reason-coded `outbound`;
        `transfer_out`/`transfer_in`/`count_correction` are produced only by
        `createStockTransfer` / `recordStockCount`, never accepted here).
        Quantity is a SIGNED exact-decimal string in the product's single
        stocking unit (see `DecimalQuantity` — `outbound` carries a negative
        value, `inbound` positive); a unit inconsistent with the product's
        stocking unit is rejected (no coercion, FR-022). `adjustment` requires a
        `reason`. A movement MAY carry `saleId` / `saleLineId` /
        `terminalEventRef` as provenance only (FR-032/025). Negative resulting
        on-hand is allowed and flagged, never rejected (FR-024). The `storeId`
        is the PATH-scoped selection target, authorized server-side against the
        principal's store-access set; tenant / store-write-authority / actor are
        resolved server-side and are NEVER taken from the body (Constitution
        §XII, FR-052). Idempotent via the required `Idempotency-Key` header
        (FR-030).
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockMovementCommand"
      responses:
        "201":
          description: Movement appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }
    get:
      operationId: listStockMovements
      tags: [inventory]
      summary: List the movements of a store, newest first, in keyset pages.
      description: >
        List stock movements for the path-scoped store (FR-004). Which
        movements: `productId` set ⇒ that product's movements; `productId`
        omitted ⇒ `scope` decides — `adhoc` (the default) lists the ad-hoc
        (null-product) movements, which are auditable ledger entries that roll
        up to no product's on-hand (SC-001), and `all` lists every movement of
        the store, across every product and ad-hoc. Sending `scope` together
        with `productId` is a 400 `validation_error`. Each entry is a `toBody`
        projection carrying type, signed quantity, timestamps, acting principal
        (`createdBy`), reason, and provenance / linkage refs.


        **Ordering and paging (RT-731).** Newest first: `occurredAt DESC, id
        DESC`, a total, stable order on values fixed when the movement is
        written. Keyset pagination with an opaque `cursor` bound to this
        operation, the tenant, the store and the filters (`productId`,
        `scope`). Walking the pages with the same filters returns no movement
        twice and reaches every movement that existed when the walk started.
        The walk is not a snapshot: a movement written during a walk is
        returned by that walk only if it sorts after the walk's current
        position (a backdated `occurredAt`). Only `nextCursor: null` ends the
        walk.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - name: productId
          in: query
          required: false
          description: >
            Tenant Catalog product id; lists that product's movements. Omit it
            to list by `scope`.
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          required: false
          description: >
            RT-731. Only when `productId` is omitted: `adhoc` (the default) lists
            the store's ad-hoc (null-product) movements; `all` lists every
            movement of the store, across every product and ad-hoc. Sending it
            with `productId` is a 400 `validation_error`.
          schema: { type: string, enum: [adhoc, all] }
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor from a prior page's `nextCursor`, bound to the
            operation, the tenant, the store and the filters (`productId`,
            `scope`). Do not decode or construct it; omit it for the first page.
            A value the server did not issue, cannot decode, or that is reused
            with another store or other filters is 400 `validation_error`. The
            caller's store scope is checked on every request and is never
            carried by the cursor. The cursor carries only a keyset position
            and a digest of the filters; its position is ANDed with the tenant,
            the store and the filters and never replaces them, so a hand-built
            cursor can only reposition the walk inside rows the caller may
            already read.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of movements, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementList"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/stores/{storeId}/locations:
    get:
      operationId: listStockLocations
      tags: [inventory]
      summary: List the stock locations of a store.
      description: >
        RT-432 (RT-290 G4-1): the path-scoped store's stock locations, the
        `primary` location first, then by `code`. Read-only: a store's primary
        location is created with the store and its identity never changes. Store
        authorization is the same object-level rule as the other store-scoped
        reads; a store outside the caller's scope is a non-disclosing 404.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: The store's stock locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockLocationList"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/products/{productId}/tracking-identities:
    get:
      operationId: listTrackingIdentities
      tags: [inventory]
      summary: List the tracking identities (batches / serials) of a product.
      description: >
        RT-448 (RT-50 Gate 7 G7-2): the tenant's tracking identities of the
        path product, ordered by `kind`, then `expiryDate` (earliest first,
        none last), then `code`. Identities are tenant-wide, not store-scoped.
        Read-only: identities are ERP-born (G7-3) and nothing in this version
        creates one, so the list is empty until identity birth lands (RT-453).
        Owner / tenant-admin only; a product outside the caller's tenant, and a
        caller without the role, is a non-disclosing 404. Keyset-paged: a
        serial product has one identity per unit. `cursor` is the opaque
        `nextCursor` of the previous page for the same product; a malformed
        cursor, or one from another product, is a 400.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The product's tracking identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingIdentityList"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/on-hand/{storeId}/{productId}:
    get:
      operationId: getOnHand
      tags: [inventory]
      summary: Derived on-hand for a (store, product).
      description: >
        The compute-on-read signed SUM of the product's movements at the store
        (FR-003). A `(store, product)` with no movements returns a deterministic
        zero (FR-005), never an error. The projection carries a
        `negativeBalance` flag that is `true` when the derived quantity is below
        zero (FR-024); on-hand is never a stored mutable value.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The derived on-hand projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnHand"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/transfers:
    post:
      operationId: createStockTransfer
      tags: [inventory]
      summary: Transfer stock between stores as linked movements.
      description: >
        Create an intra-tenant transfer as LINKED movements — a `transfer_out`
        at the source store and a `transfer_in` at the destination, sharing a
        transfer group id so they are mutually discoverable (FR-020/SC-004).
        Source ≠ destination and quantity > 0 (else validation error). The
        destination store MUST belong to the same tenant; a cross-tenant
        destination is a non-disclosing 404 (FR-051). A transfer-out driving
        the source on-hand below zero is still recorded and flagged, never
        rejected (FR-024). Idempotent via the `Idempotency-Key` header.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockTransferCommand"
      responses:
        "201":
          description: Transfer recorded as a linked movement pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockTransfer"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/stores/{storeId}/counts:
    post:
      operationId: recordStockCount
      tags: [inventory]
      summary: Record a physical count; append a correction movement for any variance.
      description: >
        Record a physical stock count for a product at the path-scoped store.
        Any variance from the derived on-hand is appended as a
        `count_correction` movement (signed variance) linked to the count; the
        movement history is NEVER rewritten (FR-021/SC-005). After the count,
        the derived on-hand equals the counted quantity. A zero-variance count
        is deterministic (no correction, or an explicit zero-variance record).
        The `storeId` is the PATH-scoped selection target, authorized
        server-side; it is never taken from the body (§XII). Idempotent via the
        `Idempotency-Key` header.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordStockCountCommand"
      responses:
        "201":
          description: Count recorded; correction movement (if any) appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCountResult"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/stores/{storeId}/status-moves:
    post:
      operationId: createStatusMove
      tags: [inventory]
      summary: Move stock between two inventory statuses at one location.
      description: >
        RT-435 (RT-290 G4-2, decisions 842–844): one `adjustment` Business
        Event with exactly two effects at the same location: `-quantity` in
        `fromStatus` and `+quantity` in `toStatus`. Physical on-hand is
        unchanged. The `reasonCode` is required and must allow the
        `(fromStatus, toStatus)` pair (839, D1):
        `damage` sellable → damaged; `expiry` sellable → expired;
        `inspection_restock` return_inspection → sellable;
        `inspection_damage` return_inspection → damaged; `hold_release`
        quality_hold → sellable; `correction` any pair outside the two hold
        statuses, with a `note`. `quality_hold` and `recall` are reserved for
        the tracking-hold workflow and are refused here. The location defaults
        to the store's primary location; another location must be an active
        location of the path store. Both effects are `erp_neutral` (V1 mapping
        profile, M-5); no ERP posting intent is created. Owner, tenant_admin or
        store_manager (a store_manager only in its store scope); moving stock
        OUT of `damaged`, `expired`, `quality_hold` or `recall_hold` is
        sensitive and is owner / tenant_admin only (960, 961, D2). A tracked
        product is refused until tracked moves exist (G7-4). Idempotent via the
        `Idempotency-Key` header; a replay of the same command returns the
        recorded event and writes nothing.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatusMoveCommand"
      responses:
        "201":
          description: Status move recorded as one event with two effects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPositionEvent"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "409": { $ref: "#/components/responses/PositionEventConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/stores/{storeId}/relocations:
    post:
      operationId: createRelocation
      tags: [inventory]
      summary: Move stock between two locations of one store, same status.
      description: >
        RT-435 (decisions 800, 814): one `adjustment` Business Event with
        exactly two effects in the same status: `-quantity` at
        `fromLocationId` and `+quantity` at `toLocationId`. A relocation is an
        internal move, not a shipment Transfer. Both locations must be active
        locations of the path store and must differ; a location of another
        store or tenant is a non-disclosing 404, an inactive one a 400. The
        status defaults to `sellable`. Physical and Sellable On Hand are
        unchanged. A `reasonCode` is optional (`correction` needs a `note`;
        the reserved hold codes are refused). Both effects are `erp_neutral`;
        no ERP posting intent is created. Owner, tenant_admin or store_manager
        (a store_manager only in its store scope). Idempotent via the
        `Idempotency-Key` header.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelocationCommand"
      responses:
        "201":
          description: Relocation recorded as one event with two effects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPositionEvent"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "409": { $ref: "#/components/responses/PositionEventConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/settings/return-landing:
    get:
      operationId: getReturnLandingPolicy
      tags: [inventory]
      summary: Read the tenant's return landing policy.
      description: >
        RT-435 (RT-290 Q6, decision 849): where the tenant's return effects
        land: `sellable` (the default; `updatedAt` is null while unset) or
        `return_inspection`, from which stock leaves by a status move. Owner,
        tenant_admin or store_manager.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The tenant's return landing policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnLandingPolicy"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }
    put:
      operationId: setReturnLandingPolicy
      tags: [inventory]
      summary: Set the tenant's return landing policy.
      description: >
        RT-435 (RT-290 Q6): set where the tenant's return effects land. Owner
        or tenant_admin. Setting the current value again is a no-op change and
        answers the same body; the change is audited.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetReturnLandingPolicyCommand"
      responses:
        "200":
          description: The updated return landing policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnLandingPolicy"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/settings/safety-ttl:
    get:
      operationId: getSafetyTtlSetting
      tags: [inventory]
      summary: Read the tenant's Safety TTL.
      description: >
        RT-449 (G7-7, RT-50 Q8, H8): the maximum age of a till's last
        successful sync from the POS inventory safety feed before its safety
        data is stale. `safetyTtlSeconds` is the configured value (null while
        unset); `effectiveSafetyTtlSeconds` is what the feed answers (900 when
        unset). Owner, tenant_admin or store_manager.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The tenant's Safety TTL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyTtlSetting"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }
    put:
      operationId: setSafetyTtlSetting
      tags: [inventory]
      summary: Set the tenant's Safety TTL.
      description: >
        RT-449 (H8): set the Safety TTL to 60–900 seconds, or null to return
        to the default of 900. It is configurable downwards only: no value
        above the 15-minute default is accepted (400). Owner or tenant_admin.
        Setting the current value again writes nothing and answers the same
        body; a change is audited. A change does not step the Inventory
        Safety Revision: every feed answer carries the effective value.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSafetyTtlSettingCommand"
      responses:
        "200":
          description: The updated Safety TTL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyTtlSetting"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/settings/tracked-selling:
    get:
      operationId: getTrackedSellingSetting
      tags: [inventory]
      summary: Read the tenant's tracked-selling switch and its preconditions.
      description: >
        RT-451 S2 (OD-T1, OD-T2): whether tracked selling (batch / expiry) is
        switched on for the tenant. `enabled` is false for every tenant until
        switched on; `changedAt` and `changedBy` are null while it was never
        changed. `unmetPreconditions` lists the RT-50 Q13 preconditions
        (`TrackedSellingPrecondition`) that do not hold now, evaluated on each
        read; a precondition the server cannot confirm is listed as unmet
        (fail closed). `preconditionsMet` is true exactly when that list is
        empty. Tracked selling is in effect for the tenant only while the
        deployment gate `POS_TRACKED_SELLING_ENABLED` is on and `enabled` is
        true. If a precondition stops holding after the switch is on, tracked
        selling stays on (OD-T7, RT-451 comment 16217): `enabled: true` with
        `preconditionsMet: false` is the state the Console shows the owner as a
        warning. The switch never turns itself off; only an owner or
        tenant_admin switches it off. Owner or tenant_admin read every field.
        A store_manager reads on/off only (OD-T6): `enabled`, with
        `changedAt`, `changedBy`, `preconditionsMet` and `unmetPreconditions`
        null. Any other role is a 403. Authentication
        (401) and role (403) are checked first, as for `posListTrackedLots`;
        then, while the gate is off, this operation answers the non-disclosing
        404 and reads nothing.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The tenant's tracked-selling switch and its preconditions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedSellingSetting"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }
    put:
      operationId: setTrackedSellingSetting
      tags: [inventory]
      summary: Switch tracked selling on or off for the tenant.
      description: >
        RT-451 S2 (OD-T2..OD-T5). `{"enabled": true}` checks the RT-50 Q13
        preconditions in the same transaction as the write: while any is
        unmet the switch is refused with 409
        `tracked_selling_preconditions_unmet` and nothing is written;
        `getTrackedSellingSetting` names the unmet ones. Switching back on
        after an off is the same check (OD-T5). `{"enabled": false}` is
        always accepted (OD-T3). Setting the current value again, in either
        direction, writes nothing, records no audit event and answers the
        current setting: repeating `{"enabled": true}` while already on is
        that no-op and does not re-check the preconditions, which are checked
        only on a change from off to on. Every
        change is audited with the actor, the time and the new value; the
        history of the switch is kept in the audit trail. Switching off
        deletes and rewrites nothing: recorded tracking, sale-line findings,
        holds and recalls remain, and the sales already in the Tracking
        Resolution queue stay listed and can still be resolved with
        `bindTrackingResolution` (OD-T4). While it is off the tenant's tills
        are to sell a tracked product as a normal line (OD-T4). That needs an
        amendment of `pos-sales/sales.yaml` `captureSale` G7-9 row 4 in a
        later RT-451 slice; until it lands, `captureSale` G7-9 governs, and
        nothing captures a tracked line yet (every tracked-selling operation
        is contract-only or behind the deployment gate). Owner or
        tenant_admin; any other role is a 403. Authentication (401) and role
        (403) are checked first, as for `posListTrackedLots`; then, while the
        deployment gate `POS_TRACKED_SELLING_ENABLED` is off, this operation
        answers the non-disclosing 404 and writes nothing.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTrackedSellingSettingCommand"
      responses:
        "200":
          description: The tenant's tracked-selling switch after the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedSellingSetting"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "409": { $ref: "#/components/responses/TrackedSellingConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/safety/findings:
    get:
      operationId: listInventorySafetyFindings
      tags: [inventory]
      summary: List the tenant's computed inventory safety findings.
      description: >
        RT-449 (H6; decisions 953, 954): computed on read, never stored.
        `active_tracking_hold` (critical): one per active hold, with
        `storeIds` = the stores where the held identity has a non-zero
        position. `expired_lot_sellable` (critical): one per identity, store
        and stocking unit whose `sellable` position is positive while the
        identity's expiry date is before the store's local business date (a
        lot is sellable through its expiry date, G7-5); the prompt for the
        governed `sellable → expired` status move. `expiring_lot` (warning)
        is reserved and never emitted in 1.8.0: the near-expiry window is a
        policy value that stays off until RT-50 B1. `tracking_consistency`
        (critical, 1.10.0, OD-8) is reserved: a tracked product or identity
        whose records disagree, one finding per `check` grain; each `check`
        is emitted only once the runtime producing its data ships (RT-451,
        RT-453), so 1.10.0 emits none. Order: severity, then
        kind, then ids. Owner and tenant_admin see the tenant (their
        membership's stores); a store_manager sees only findings in its
        store scope: a hold appears when the held identity has stock in one
        of its stores, with `storeIds` narrowed to them. The list is not
        paginated.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The tenant's current inventory safety findings in the caller's scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySafetyFindingList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/tracking-holds:
    get:
      operationId: listTrackingHolds
      tags: [inventory]
      summary: List the tenant's tracking holds, newest first, in keyset pages.
      description: >
        RT-1081 (RT-455 TR-3a / II-3): the tenant's quality and recall holds,
        active or released, newest first (`placedAt DESC, id DESC`). Filters
        narrow the list and never widen it: `status`, `kind`,
        `trackingIdentityId` (one identity's hold history) and `productId`.
        A filter id that is not of this tenant matches no hold and answers
        an empty page. Keyset pagination as `listStockMovements` (RT-731):
        an opaque `cursor` bound to this operation, the tenant and the
        filters. The order key is fixed at placement, but `status` is not:
        a hold released during a walk of `status=active` drops out of the
        later pages, so that walk is not guaranteed to reach every hold
        that was active when it started. Conversely, a hold released
        during a walk of `status=released` can enter its later pages, so
        neither status-filtered walk is a complete snapshot of membership
        at its start. Holds are tenant-level (RT-449 H2), so the list is
        not store-scoped. Owner or tenant_admin, as `getTrackingHold`; any
        other role is a 403.
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, released, all], default: all }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [quality_hold, recall_hold] }
        - name: trackingIdentityId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: productId
          in: query
          required: false
          description: Tenant Catalog product; lists the holds on its identities.
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor from a prior page's `nextCursor`, bound to the
            operation, the tenant and the filters. A value the server did not
            issue, or one reused with other filters, is 400 `validation_error`.
            Its position is ANDed with the tenant and the filters and never
            replaces them; the role is checked on every request and is never
            carried by the cursor.
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of holds, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingHoldList"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }
    post:
      operationId: placeQualityHold
      tags: [inventory]
      summary: Place a quality hold on a tracking identity.
      description: >
        RT-449 (RT-50 G7-6, decisions 739, 740, 965): a `quality_hold` record
        on a tracking identity of the tenant. The identity's positive
        `sellable` and `return_inspection` positions, at every location of
        every store, move into `quality_hold` as RT-435 status moves (reason
        `quality_hold`, `erp_neutral` effect pairs carrying the identity);
        negative and zero positions are not moved. Steps the tenant's
        Inventory Safety Revision once. At most one active quality hold per
        identity (409 `hold_already_active`). An identity of another tenant
        is a non-disclosing 404. Owner or tenant_admin (H1, H2). Idempotent
        via the `Idempotency-Key` header; nothing is written on a refusal.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceQualityHoldCommand"
      responses:
        "201":
          description: Quality hold placed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingHoldResult"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "409": { $ref: "#/components/responses/SafetyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/tracking-holds/{holdId}:
    get:
      operationId: getTrackingHold
      tags: [inventory]
      summary: Read one tracking hold.
      description: >
        RT-449: a quality or recall hold of the tenant. Another tenant's hold
        is a non-disclosing 404. Owner or tenant_admin.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/HoldIdPath"
      responses:
        "200":
          description: The hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingHold"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/tracking-holds/{holdId}/release:
    post:
      operationId: releaseTrackingHold
      tags: [inventory]
      summary: Release a tracking hold.
      description: >
        RT-449 (RT-50 G7-6; rulings H3, H4): ends a hold. A released quality
        hold returns the identity's positive `quality_hold` positions to
        `sellable` (reason `hold_release`), or to `recall_hold` (reason
        `recall`) when the identity has ever been under a recall hold, active
        or released, so a recalled lot's stock leaves only through Gate 8.
        Releasing a recall hold moves nothing: that stock leaves only through
        the Gate 8 disposition (RT-293). Steps the Inventory Safety Revision
        once. A released hold is final: releasing it again answers the
        recorded release and writes nothing. Another tenant's hold is a
        non-disclosing 404. Owner only (965, H1).
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/HoldIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseTrackingHoldCommand"
      responses:
        "200":
          description: The released hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingHoldResult"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/recalls:
    get:
      operationId: listInventoryRecalls
      tags: [inventory]
      summary: List the tenant's recalls, newest first, in keyset pages.
      description: >
        RT-1081 (RT-455 TR-3b): the tenant's recalls as summaries, newest
        first (`createdAt DESC, id DESC`; `effectiveAt` may be backdated, so
        it is not the order key). `productId` narrows to one product; an id
        not of this tenant answers an empty page. Each summary counts its
        holds; `getInventoryRecall` returns them. Keyset pagination as
        `listStockMovements` (RT-731). Owner or tenant_admin, as
        `getInventoryRecall`; any other role is a 403.
      security:
        - cookieAuth: []
      parameters:
        - name: productId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor from a prior page's `nextCursor`, bound to the
            operation, the tenant and `productId`; a foreign or reused value is
            400 `validation_error`. Its position is ANDed with the tenant and
            the filter; the role is checked on every request.
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of recall summaries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRecallSummaryList"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }
    post:
      operationId: createInventoryRecall
      tags: [inventory]
      summary: Recall listed tracking identities of one product.
      description: >
        RT-449 (RT-50 G7-6, decisions 860–863): a Recall, an Inventory safety
        Business Event (reason code, external reference such as an authority
        notice, product, listed identities, `effectiveAt`). It creates one
        `recall_hold` per listed identity and moves each identity's positive
        `sellable` and `return_inspection` positions into `recall_hold`
        (reason `recall`, `erp_neutral` effect pairs) — all under ONE
        Inventory Safety Revision step. The product is never retired (861).
        Duplicate identities and a future `effectiveAt` are a 400; a product
        or identity that is not of this tenant and product is a
        non-disclosing 404; an identity already under an active recall hold
        is a 409 `hold_already_active`. Owner or tenant_admin (H1, H2).
        Idempotent via the `Idempotency-Key` header; nothing is written on a
        refusal.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryRecallCommand"
      responses:
        "201":
          description: Recall recorded with its holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRecallResult"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "409": { $ref: "#/components/responses/SafetyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/recalls/{recallId}:
    get:
      operationId: getInventoryRecall
      tags: [inventory]
      summary: Read one recall with its holds.
      description: >
        RT-449: a recall of the tenant and its holds (released or not).
        Another tenant's recall is a non-disclosing 404. Owner or
        tenant_admin.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RecallIdPath"
      responses:
        "200":
          description: The recall.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRecall"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/tracking-identities/{identityId}:
    get:
      operationId: getTrackingIdentity
      tags: [inventory]
      summary: Read one tracking identity.
      description: >
        RT-1081 (RT-455 II-5): one batch or serial of the tenant, the same
        projection as `listTrackingIdentities`. Owner or tenant_admin; an
        identity of another tenant, and a caller without the role, is a
        non-disclosing 404 (as `listTrackingIdentities`).
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdentityIdPath"
      responses:
        "200":
          description: The identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingIdentity"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SupportSessionRefused" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/tracking-identities/{identityId}/positions:
    get:
      operationId: getTrackingIdentityPositions
      tags: [inventory]
      summary: The derived positions of one identity, per store and status.
      description: >
        RT-1081 (RT-455 II-2, OD-6): compute-on-read signed sums of the
        movements that carry the identity, one row per store and stocking
        unit where the identity has at least one movement, in the caller's
        store scope, ordered by `storeId` then `stockingUnit`. Each row is
        split into the six inventory statuses like `OnHand`, summed over the
        store's locations: +5 at one location and -5 at another read as 0.
        Not paginated: bounded by the tenant's stores. An identity with no
        movement answers `stores: []`. Owner or tenant_admin; an identity of
        another tenant, and a caller without the role, is a non-disclosing
        404. A role failure is never a 403; the only 403 is a platform
        session's support-session refusal.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdentityIdPath"
      responses:
        "200":
          description: The identity's positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingIdentityPositions"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SupportSessionRefused" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/tracking-identities/{identityId}/expiry-corrections:
    get:
      operationId: listTrackingIdentityExpiryCorrections
      tags: [inventory]
      summary: List an identity's expiry corrections, newest first.
      description: >
        RT-1081 (RT-455 II-4): the append-only expiry history of one
        identity (RT-449 H7), newest first (`createdAt DESC, id DESC`).
        Keyset pagination as `listStockMovements` (RT-731), the cursor bound
        to the identity. Owner or tenant_admin, like the `POST` on this path:
        any other role is a 403. An identity of another tenant is a
        non-disclosing 404.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdentityIdPath"
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor from a prior page's `nextCursor`, bound to the
            operation, the tenant and the identity; a foreign or reused value
            is 400 `validation_error`. Its position is ANDed with the tenant
            and the identity; the role is checked on every request.
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of corrections, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingIdentityExpiryCorrectionList"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }
    post:
      operationId: correctTrackingIdentityExpiry
      tags: [inventory]
      summary: Correct a tracking identity's expiry date, with history.
      description: >
        RT-449 (RT-50 G7-2, ruling H7): the governed correction of an
        identity's `expiryDate`. Null clears an optional expiry; when the
        product's tracking profile requires an expiry, clearing it is a 400. Every correction is kept as
        history (old date, new date, reason, actor) and steps the Inventory
        Safety Revision once; the expiry never changes without it. The current
        date again is a 409 `expiry_unchanged`; a date before the identity's
        manufacture date is a 400. Another tenant's identity is a
        non-disclosing 404. Owner or tenant_admin. Idempotent via the
        `Idempotency-Key` header; nothing is written on a refusal.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdentityIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectTrackingIdentityExpiryCommand"
      responses:
        "201":
          description: Expiry corrected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingIdentityExpiryCorrectionResult"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "409": { $ref: "#/components/responses/SafetyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/safety/sale-line-findings:
    get:
      operationId: listSaleLineFindings
      tags: [inventory]
      summary: List the recorded sale-line findings of tracked selling, newest first.
      description: >
        RT-451 (RT-455 OD-2; RT-50 G7-9 rows 2 and 3): the critical findings
        recorded on a tracked sale line when the sale was captured, or when a
        Tracking Resolution bound the line (only `erp_intent_held` with cause
        `edge_map_missing`, see `bindTrackingResolution`), one per line, kind
        and cause (owner decision 2026-11-03: each cause is its own finding,
        so a line held by a quality hold and a recall, or both expired and
        without an edge-map row, records both). `unvalidated_tracked_line`: an exact identity with no
        `validationId`, or one that does not match an accepted validation of
        that identity. `sold_under_hold`: an exact identity held or recalled
        at the sale's `occurredAt`. `erp_intent_held`: an exact identity
        expired at the sale's business date, or with no ERP edge-map row; the
        line's effect is at the identity and the sale's ERP posting intent is
        held. One line can carry more than one kind and cause. Findings are append-only
        records of past sales: they are never removed or rewritten, including
        after the cause is repaired. A `tracking_unresolved` sale (row 4) is
        not a finding; it is in `listTrackingResolutionQueue`. Filters narrow
        the list and never widen it: `kind` and `storeId`; a store outside
        the caller's scope or not of this tenant answers an empty page.
        Order: newest first, `recordedAt DESC, id DESC`, a total, stable order
        on values fixed when the finding is recorded. Keyset pagination as
        `listStockMovements` (RT-731): an opaque `cursor` bound to this
        operation, the tenant and the filters. Walking the pages with the
        same filters returns no finding twice and reaches every finding that
        existed when the walk started. The walk is not a snapshot: a finding
        recorded during a walk is returned by that walk only if it sorts
        after the walk's current position. Only `nextCursor: null` ends the
        walk. Owner and tenant_admin see the tenant; a
        store_manager sees only findings of its own stores, narrowed like
        `listInventorySafetyFindings`. Any other role is a 403.
      security:
        - cookieAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SaleLineFindingKind"
        - name: storeId
          in: query
          required: false
          description: A store of the tenant; lists only its findings.
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor from a prior page's `nextCursor`, bound to the
            operation, the tenant and the filters (`kind`, `storeId`). A value
            the server did not issue, cannot decode, or that is reused with
            other filters is 400 `validation_error`. The cursor carries only a
            keyset position and a digest of the filters; its position is ANDed
            with the tenant, the caller's store scope and the filters and never
            replaces them. The role and store scope are checked on every
            request and are never carried by the cursor.
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of sale-line findings in the caller's scope, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleLineFindingList"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/tracking-resolutions:
    get:
      operationId: listTrackingResolutionQueue
      tags: [inventory]
      summary: List the Tracking Resolution queue, newest capture first, in keyset pages.
      description: >
        RT-451 (RT-455 TR-2, OD-1 and OD-9; RT-50 G7-9 row 4): the sales
        captured `tracking_unresolved` (a tracked product's line without
        `tracking`, with an unknown identity, or with another product's
        identity). Such a sale has no Inventory effect and no ERP posting
        intent until `bindTrackingResolution` resolves it. Each item is one
        sale with its unresolved lines. `status` narrows the items:
        `unresolved` (the default), `resolved` (with the resolution) or
        `all`. `storeId` narrows to one store; a store not of this tenant, or
        outside the caller's scope, matches nothing. Order: newest capture
        first, `capturedAt DESC, saleId DESC`, a total, stable order on values
        fixed at capture (`occurredAt` is not the key: an offline till can
        backdate it). Keyset pagination as `listStockMovements` (RT-731): an
        opaque `cursor` bound to this operation, the tenant and the filters.
        A sale resolved during a walk of `status=unresolved` drops out of the
        later pages, and one resolved during a walk of `status=resolved` can
        enter them, so neither status-filtered walk is a snapshot of
        membership at its start. `unresolvedCount` counts the unresolved sales
        in the caller's scope and `storeId`, whatever `status`, `cursor` and
        `limit`. Owner and tenant_admin read the items. A store_manager gets
        only the count for its own stores: `items` is always empty and
        `nextCursor` null (OD-9). Any other role is a 403.
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [unresolved, resolved, all], default: unresolved }
        - name: storeId
          in: query
          required: false
          description: A store of the tenant; narrows the items and the count to it.
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor from a prior page's `nextCursor`, bound to the
            operation, the tenant and the filters (`status`, `storeId`). A
            value the server did not issue, cannot decode, or that is reused
            with other filters is 400 `validation_error`. The cursor carries
            only a keyset position and a digest of the filters; its position
            is ANDed with the tenant, the caller's scope and the filters and
            never replaces them. The role is checked on every request and is
            never carried by the cursor.
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of the queue, newest capture first, and the unresolved count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResolutionQueue"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

  /api/inventory/v1/tracking-resolutions/{saleId}/bind:
    post:
      operationId: bindTrackingResolution
      tags: [inventory]
      summary: Resolve a tracking_unresolved sale by binding an identity to every unresolved line.
      description: >
        RT-451 scope item 4 (RT-50 DC-2; RT-455 TR-2): the governed, audited,
        high-sensitivity Tracking Resolution of one `tracking_unresolved`
        sale. One command binds an existing tracking identity to EVERY
        unresolved line of the sale: `lines` names each unresolved line
        exactly once and nothing else, or the command is a 400 and nothing is
        written. In one transaction it records the resolution and its audit
        record, then commits the sale's Inventory effects at the bound
        identities and its ERP posting intent together, with the ERP Batch
        ref frozen from the edge map as at capture. A bound identity with no
        ERP edge-map row still commits its effect, and the intent is held
        (G7-9 row 3): the bind records an `erp_intent_held` finding with cause
        `edge_map_missing` for that line. A bind records no other finding:
        it refuses a held or expired identity, and it is itself the governed
        check, so a bound line is never an `unvalidated_tracked_line`. The
        sale then leaves the unresolved queue. The same transaction also
        commits what the sale's voids and returns recorded before the bind
        were denied: their Inventory restores (a void compensates the exact
        identity position; a return lands at the bound identity in
        `return_inspection`, or `recall_hold` for an identity ever recalled),
        and the reversal posting intents they emitted, each one posted
        exactly once. A sale the server has not processed yet gets its
        effects and its intent when it is processed. Refusals, nothing written: a sale that is not of
        this tenant, is outside the caller's store scope or was never
        `tracking_unresolved`, and an identity that does not exist, is of
        another tenant or is not a batch identity, is a non-disclosing 404; a `saleLineId` that is not
        an unresolved line of the sale is a 400. 409
        `tracking_resolution_identity_mismatch`: an identity is not of the
        line's product. 409 `tracking_resolution_identity_held`: an identity
        has an active hold now, or had one at the sale's `occurredAt`. 409
        `tracking_resolution_identity_expired`: an identity's expiry date is
        before the sale's business date (a lot is sellable through its expiry
        date, G7-5), or the identity has no expiry and the line's product
        requires one (fail closed). 409 `tracking_resolution_already_resolved`: the sale was
        already resolved by another command. The `reasonCode` and a non-blank
        `note` are required; the runtime trims the note, and a blank one is a
        400. It does not step the Inventory Safety Revision. Owner only (high
        sensitivity, as `releaseTrackingHold`); any other role is a 403.
        Idempotent via the `Idempotency-Key` header: a replay with the same
        key and body returns the recorded resolution and writes nothing.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SaleIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindTrackingResolutionCommand"
      responses:
        "200":
          description: The sale's recorded Tracking Resolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResolution"
        "400": { $ref: "#/components/responses/ValidationFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrOriginRejected" }
        "404": { $ref: "#/components/responses/NotFoundOrCrossTenant" }
        "409": { $ref: "#/components/responses/TrackingResolutionConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "5XX": { $ref: "#/components/responses/SystemFailure" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dp2_session

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Replay-safety key for write operations (FR-030). A replay with the same
        key + same body returns the prior result with no second movement; a
        replay with the same key + different body is a 409 conflict. Resolved by
        the reused 001/005 idempotency interceptor (the manual-movement dedup
        contract).
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[\\x21-\\x7E]{16,128}$"
    StoreIdPath:
      name: storeId
      in: path
      required: true
      description: Store the request is scoped to; access is authorized server-side.
      schema: { type: string, format: uuid }
    ProductIdPath:
      name: productId
      in: path
      required: true
      description: Tenant Catalog product; resolved inside the caller's tenant only.
      schema: { type: string, format: uuid }
    HoldIdPath:
      name: holdId
      in: path
      required: true
      description: A tracking hold; resolved inside the caller's tenant only.
      schema: { type: string, format: uuid }
    RecallIdPath:
      name: recallId
      in: path
      required: true
      description: A recall; resolved inside the caller's tenant only.
      schema: { type: string, format: uuid }
    IdentityIdPath:
      name: identityId
      in: path
      required: true
      description: A tracking identity; resolved inside the caller's tenant only.
      schema: { type: string, format: uuid }
    SaleIdPath:
      name: saleId
      in: path
      required: true
      description: A captured sale (`pos-sales/sales.yaml` `Sale.saleRef`); resolved inside the caller's tenant only.
      schema: { type: string, format: uuid }

  schemas:
    # ----- Commands (request bodies) — strict; server-owned fields are NOT accepted (FR-052)
    CreateStockMovementCommand:
      type: object
      additionalProperties: false
      required: [movementType, quantity, stockingUnit]
      description: >
        Strict command. The store is the PATH parameter (`storeId`), authorized
        server-side; `tenantId`, `createdBy`, `receivedAt`, and any derived
        balance are resolved server-side. NONE of these are accepted from the
        body — there is no body `storeId` (Constitution §XII, FR-052).
      properties:
        movementType:
          type: string
          enum: [inbound, outbound, adjustment]
          description: Write-off is a reason-coded `outbound`. transfer/count types are produced by their own operations only.
        quantity:
          allOf:
            - $ref: "#/components/schemas/NonZeroDecimalQuantity"
          description: >
            SIGNED, non-zero quantity in the stocking unit — `inbound` is positive,
            `outbound` is negative; `movementType` is the semantic label, the
            sign is authoritative for the on-hand SUM. The server validates that
            the sign agrees with `movementType` (FR-022).
        stockingUnit:
          $ref: "#/components/schemas/StockingUnit"
        tenantProductRef:
          type: [string, "null"]
          format: uuid
          description: Resolved Tenant Catalog product. Null for ad-hoc / unresolved references (provenance only; never auto-created — FR-023).
        reason:
          type: string
          description: Required for `adjustment` (and recommended for write-off outbounds); bounded, PII-free.
        occurredAt:
          type: string
          format: date-time
          description: Business-event time (UTC). Backfilled / out-of-order values are normal; the server clock is the security clock.
        saleId:
          type: [string, "null"]
          format: uuid
          description: Provenance only — references a CAPTURED 008 sale (FR-032). Never required; never mutates the sale fact.
        saleLineId:
          type: [string, "null"]
          format: uuid
          description: Provenance only — references a captured 008 sale line.
        terminalEventRef:
          type: [string, "null"]
          format: uuid
          description: Provenance only — references an 008 void/refund terminal event (restock, FR-025).
        stockLocationId:
          type: string
          format: uuid
          description: >
            RT-432 (RT-290 G4-6): a stock location of the path store. Omitted ⇒
            the store's primary location. A location that is not one of the path
            store's locations is a non-disclosing 404; an inactive location is a
            400.
        inventoryStatus:
          allOf:
            - $ref: "#/components/schemas/InventoryStatus"
          description: RT-432 (RT-290 G4-6). Omitted ⇒ `sellable`.
    CreateStockTransferCommand:
      type: object
      additionalProperties: false
      required: [sourceStoreId, destinationStoreId, tenantProductRef, quantity, stockingUnit]
      description: >
        Strict command. `sourceStoreId` is the operator's authorized scope
        (validated server-side against the principal's store-access set — it
        grants no authority by being in the body, §XII); `destinationStoreId` is
        a legitimate TARGET reference (not write-authority over the actor's
        scope). Both resolve within the caller's tenant.
      properties:
        sourceStoreId:
          type: string
          format: uuid
          description: Source store; authorized server-side against the principal's store-access set.
        destinationStoreId:
          type: string
          format: uuid
          description: Target store. MUST be in the same tenant (cross-tenant ⇒ non-disclosing 404) and MUST differ from source.
        tenantProductRef: { type: string, format: uuid }
        quantity:
          allOf:
            - $ref: "#/components/schemas/PositiveDecimalQuantity"
          description: Strictly positive; a zero-quantity transfer is a validation error.
        stockingUnit:
          $ref: "#/components/schemas/StockingUnit"
        reason: { type: string }
    RecordStockCountCommand:
      type: object
      additionalProperties: false
      required: [tenantProductRef, countedQuantity, stockingUnit]
      description: >
        Strict command. The store is the PATH parameter (`storeId`), authorized
        server-side; never a body field (§XII).
      properties:
        tenantProductRef: { type: string, format: uuid }
        countedQuantity:
          allOf:
            - $ref: "#/components/schemas/NonNegativeDecimalQuantity"
          description: The physical count (non-negative); the signed variance vs derived on-hand becomes the correction movement.
        stockingUnit:
          $ref: "#/components/schemas/StockingUnit"
        countedAt:
          type: string
          format: date-time

    # ----- Projections (response bodies) — explicit toBody wire shapes (§IV); NO raw DB entity
    StockMovement:
      type: object
      required:
        [id, storeId, movementType, quantity, stockingUnit, occurredAt, receivedAt, createdBy, origin,
         stockLocationId, inventoryStatus, positionInterpreted, trackingIdentityId]
      description: >
        toBody projection of a stock_movements row. The lineage-only
        `idempotency_key` column and internal fields are NOT projected.
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        movementType:
          type: string
          enum: [inbound, outbound, adjustment, transfer_out, transfer_in, count_correction]
        quantity:
          $ref: "#/components/schemas/DecimalQuantity"
        stockingUnit: { type: string }
        tenantProductRef: { type: [string, "null"], format: uuid }
        reason: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        createdBy:
          type: string
          format: uuid
          description: >
            The acting principal's user id (FR-004 "acting principal"). An
            internal actor reference — NOT customer PII; the full audit record
            lives in the audit pipeline (§XIII).
        saleId: { type: [string, "null"], format: uuid }
        saleLineId: { type: [string, "null"], format: uuid }
        terminalEventRef: { type: [string, "null"], format: uuid }
        transferGroupId: { type: [string, "null"], format: uuid }
        stockCountId: { type: [string, "null"], format: uuid }
        origin:
          type: string
          enum: [retail, erp_external]
          description: >
            RT-425 (RT-289 G2-2, decision 768): where the effect originated.
            Every movement written by this API is `retail`.
        integrationState:
          type: [string, "null"]
          enum: [not_posted, pending, confirmed, rejected, reconciliation_required, external, erp_neutral, null]
          description: >
            RT-425 (RT-289 G2-3): the effect's ERP integration state.
            `not_posted` = no ERP posting intent represents the effect;
            `pending` / `confirmed` / `rejected` / `reconciliation_required`
            follow its ERP posting intent; `external` = an ERP-origin effect;
            `erp_neutral` (RT-435, RT-290 Q10) = an effect of a status move or
            relocation whose event nets to zero in its ERP mapping bucket, so
            it needs no ERP representation and never gets an intent.
            A confirmation never adds quantity (decision 771). Null only for a
            movement with no integration record.
        erpConfirmedAt:
          type: [string, "null"]
          format: date-time
          description: >
            RT-425 (RT-289 G2-4): when ERPNext confirmed the effect (server time
            of the `posted` acknowledgement); null unless `integrationState` is
            `confirmed`.
        stockLocationId:
          type: string
          format: uuid
          description: >
            RT-432 (RT-290 G4-1, G4-4): the effect's stock location, always one
            of `storeId`'s locations.
        inventoryStatus:
          $ref: "#/components/schemas/InventoryStatus"
        positionInterpreted:
          type: boolean
          description: >
            RT-432 (RT-290 G4-5): true for a movement recorded before positions
            existed. Its position is READ as the store's primary location and
            `sellable`; the movement itself is never rewritten.
        trackingIdentityId:
          type: [string, "null"]
          format: uuid
          description: >
            RT-448 (RT-50 G7-2): the tracking identity (batch / serial) of the
            movement's own product. Null for an untracked product, and for every
            movement written by this version (tracked selling is not active).
    InventoryReasonCode:
      type: string
      enum: [damage, expiry, quality_hold, recall, inspection_restock, inspection_damage, hold_release, correction]
      description: >
        RT-435 (decision 839, D1): the governed Reason Code of a status move or
        relocation. Which `(fromStatus, toStatus)` pair each allows is in
        `createStatusMove`. `quality_hold` and `recall` are reserved for the
        tracking-hold workflow (RT-449) and are refused by both operations.
    CreateStatusMoveCommand:
      type: object
      additionalProperties: false
      required: [tenantProductRef, quantity, stockingUnit, fromStatus, toStatus, reasonCode]
      description: >
        Strict command. The store is the PATH parameter; tenant and actor are
        resolved server-side. No tracking field is accepted yet (RT-451).
      properties:
        tenantProductRef: { type: string, format: uuid }
        quantity:
          $ref: "#/components/schemas/PositiveDecimalQuantity"
        stockingUnit:
          $ref: "#/components/schemas/StockingUnit"
        stockLocationId:
          type: string
          format: uuid
          description: An active location of the path store; defaults to its primary location.
        fromStatus:
          $ref: "#/components/schemas/InventoryStatus"
        toStatus:
          $ref: "#/components/schemas/InventoryStatus"
        reasonCode:
          $ref: "#/components/schemas/InventoryReasonCode"
        note:
          type: string
          maxLength: 500
          description: Operator note (no PII). Required with `reasonCode` `correction`.
    CreateRelocationCommand:
      type: object
      additionalProperties: false
      required: [tenantProductRef, quantity, stockingUnit, fromLocationId, toLocationId]
      description: >
        Strict command. The store is the PATH parameter; both locations must be
        active locations of it. No tracking field is accepted yet (RT-451).
      properties:
        tenantProductRef: { type: string, format: uuid }
        quantity:
          $ref: "#/components/schemas/PositiveDecimalQuantity"
        stockingUnit:
          $ref: "#/components/schemas/StockingUnit"
        fromLocationId: { type: string, format: uuid }
        toLocationId: { type: string, format: uuid }
        inventoryStatus:
          allOf:
            - $ref: "#/components/schemas/InventoryStatus"
          description: The status of the moved stock; defaults to `sellable`.
        reasonCode:
          $ref: "#/components/schemas/InventoryReasonCode"
        note:
          type: string
          maxLength: 500
          description: Operator note (no PII). Required with `reasonCode` `correction`.
    InventoryPositionEvent:
      type: object
      required:
        [id, kind, storeId, tenantProductRef, quantity, stockingUnit, fromLocationId, toLocationId,
         fromStatus, toStatus, reasonCode, note, trackingIdentityId, createdBy, occurredAt,
         fromEffect, toEffect]
      description: >
        RT-435: the record of a status move or relocation and its two effects.
        Each effect is a `StockMovement` with `movementType` `adjustment`.
        A status move has `fromLocationId` = `toLocationId`; a relocation has
        `fromStatus` = `toStatus`. The effects sum to zero.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [status_move, relocation]
        storeId: { type: string, format: uuid }
        tenantProductRef: { type: string, format: uuid }
        quantity:
          allOf:
            - $ref: "#/components/schemas/DecimalQuantity"
          description: The moved quantity (positive).
        stockingUnit: { type: string }
        fromLocationId: { type: string, format: uuid }
        toLocationId: { type: string, format: uuid }
        fromStatus:
          $ref: "#/components/schemas/InventoryStatus"
        toStatus:
          $ref: "#/components/schemas/InventoryStatus"
        reasonCode:
          oneOf:
            - $ref: "#/components/schemas/InventoryReasonCode"
            - type: "null"
        note: { type: [string, "null"] }
        trackingIdentityId:
          type: [string, "null"]
          format: uuid
          description: >
            The tracking identity both effects carry (RT-50 G7-2). Null for every
            event this version records (tracked moves arrive with RT-451).
        createdBy:
          type: string
          format: uuid
          description: The acting principal's user id (an internal actor reference, not PII).
        occurredAt: { type: string, format: date-time }
        fromEffect:
          allOf:
            - $ref: "#/components/schemas/StockMovement"
          description: The `-quantity` effect at (fromLocationId, fromStatus).
        toEffect:
          allOf:
            - $ref: "#/components/schemas/StockMovement"
          description: The `+quantity` effect at (toLocationId, toStatus).
    ReturnLandingStatus:
      type: string
      enum: [sellable, return_inspection]
      description: >
        RT-435 (RT-290 Q6, decision 849): where a tenant's return effects land.
    ReturnLandingPolicy:
      type: object
      required: [returnLandingStatus, updatedAt]
      properties:
        returnLandingStatus:
          $ref: "#/components/schemas/ReturnLandingStatus"
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: When the policy was last set; null while the tenant runs on the default.
    SetReturnLandingPolicyCommand:
      type: object
      additionalProperties: false
      required: [returnLandingStatus]
      properties:
        returnLandingStatus:
          $ref: "#/components/schemas/ReturnLandingStatus"
    SafetyTtlSetting:
      type: object
      additionalProperties: false
      required: [safetyTtlSeconds, effectiveSafetyTtlSeconds, updatedAt]
      description: RT-449 (H8) — the tenant's Safety TTL of the POS inventory safety feed.
      properties:
        safetyTtlSeconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 900
          description: The configured value; null while the tenant runs on the default.
        effectiveSafetyTtlSeconds:
          type: integer
          minimum: 60
          maximum: 900
          description: The value the feed answers (`safetyTtlSeconds`, or 900 when it is null).
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: When the tenant's inventory settings last changed; null while none are stored.
    SetSafetyTtlSettingCommand:
      type: object
      additionalProperties: false
      required: [safetyTtlSeconds]
      properties:
        safetyTtlSeconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 900
          description: 60–900 seconds, or null for the default of 900.
    TrackedSellingPrecondition:
      type: string
      enum:
        - sale_effects_active
        - status_moves_available
        - erp_tracking_import
        - erp_batch_posting_verified
        - identity_anchor
        - tracking_grain_reconciliation
      description: >
        RT-451 S2: the six RT-50 Q13 preconditions of switching tracked
        selling on. `sale_effects_active`: sale, void and return Inventory
        effects are active for the tenant (RT-427). `status_moves_available`:
        status moves and the return-inspection landing are available (RT-435).
        `erp_tracking_import`: ERP-origin stock import with tracking is in
        place, so newly received lots exist (RT-293). `erp_batch_posting_verified`:
        the ERPNext-Connector posts batch-tracked lines with the batch ref
        (G7-11, RT-452). `identity_anchor`: the per-identity anchor is set
        (G7-12, RT-453). `tracking_grain_reconciliation`: tracking-grain
        reconciliation is in place (RT-428).
    TrackedSellingSetting:
      type: object
      additionalProperties: false
      required: [enabled, changedAt, changedBy, preconditionsMet, unmetPreconditions]
      description: RT-451 S2 — the tenant's tracked-selling switch and its preconditions.
      properties:
        enabled:
          type: boolean
          description: Whether the tenant switched tracked selling on; false until it does.
        changedAt:
          type: [string, "null"]
          format: date-time
          description: When the switch last changed; null while it never changed, and for a store_manager.
        changedBy:
          type: [string, "null"]
          format: uuid
          description: The user who last changed the switch; null while it never changed, and for a store_manager.
        preconditionsMet:
          type: [boolean, "null"]
          description: >
            True exactly when `unmetPreconditions` is empty. Null only for a
            store_manager, who reads on/off only (OD-T6).
        unmetPreconditions:
          type: [array, "null"]
          uniqueItems: true
          maxItems: 6
          description: >
            The preconditions that do not hold now, in the enum's order; a
            precondition the server cannot confirm is listed (fail closed).
            Null only for a store_manager (OD-T6).
          items:
            $ref: "#/components/schemas/TrackedSellingPrecondition"
    SetTrackedSellingSettingCommand:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: true to switch tracked selling on, false to switch it off.
    InventorySafetyFindingList:
      type: object
      additionalProperties: false
      required: [findings, generatedAt]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/InventorySafetyFinding"
        generatedAt:
          type: string
          format: date-time
          description: When the findings were computed.
    InventorySafetyFinding:
      description: >
        RT-449 (H6): one computed inventory safety finding, discriminated by
        `kind`.
      oneOf:
        - $ref: "#/components/schemas/ActiveTrackingHoldFinding"
        - $ref: "#/components/schemas/ExpiredLotSellableFinding"
        - $ref: "#/components/schemas/ExpiringLotFinding"
        - $ref: "#/components/schemas/TrackingConsistencyFinding"
      discriminator:
        propertyName: kind
        mapping:
          active_tracking_hold: "#/components/schemas/ActiveTrackingHoldFinding"
          expired_lot_sellable: "#/components/schemas/ExpiredLotSellableFinding"
          expiring_lot: "#/components/schemas/ExpiringLotFinding"
          tracking_consistency: "#/components/schemas/TrackingConsistencyFinding"
    ActiveTrackingHoldFinding:
      type: object
      additionalProperties: false
      required:
        [kind, severity, holdId, holdKind, recallId, trackingIdentityId, tenantProductRef, identityKind,
         identityCode, expiryDate, placedAt, storeIds]
      description: An active quality or recall hold (954). The identity is not sellable.
      properties:
        kind: { type: string, const: active_tracking_hold }
        severity: { type: string, const: critical }
        holdId: { type: string, format: uuid }
        holdKind:
          type: string
          enum: [quality_hold, recall_hold]
        recallId: { type: [string, "null"], format: uuid }
        trackingIdentityId: { type: string, format: uuid }
        tenantProductRef: { type: string, format: uuid }
        identityKind:
          type: string
          enum: [batch, serial]
        identityCode: { type: string, minLength: 1, maxLength: 128 }
        expiryDate: { type: [string, "null"], format: date }
        placedAt: { type: string, format: date-time }
        storeIds:
          type: array
          items: { type: string, format: uuid }
          description: >
            The stores (in the caller's scope) where the held identity has a
            non-zero position; empty when it has none.
    ExpiredLotSellableFinding:
      type: object
      additionalProperties: false
      required:
        [kind, severity, trackingIdentityId, tenantProductRef, identityKind, identityCode, expiryDate,
         storeId, storeBusinessDate, sellableQuantity, stockingUnit]
      description: >
        An expired lot still in `sellable` at one store (953): its expiry date
        is before the store's local business date.
      properties:
        kind: { type: string, const: expired_lot_sellable }
        severity: { type: string, const: critical }
        trackingIdentityId: { type: string, format: uuid }
        tenantProductRef: { type: string, format: uuid }
        identityKind:
          type: string
          enum: [batch, serial]
        identityCode: { type: string, minLength: 1, maxLength: 128 }
        expiryDate: { type: string, format: date }
        storeId: { type: string, format: uuid }
        storeBusinessDate:
          type: string
          format: date
          description: The store's local business date the expiry was judged against.
        sellableQuantity:
          $ref: "#/components/schemas/PositiveDecimalQuantity"
        stockingUnit:
          $ref: "#/components/schemas/StockingUnit"
    ExpiringLotFinding:
      type: object
      additionalProperties: false
      required:
        [kind, severity, trackingIdentityId, tenantProductRef, identityKind, identityCode, expiryDate,
         storeId, storeBusinessDate, sellableQuantity, stockingUnit]
      description: >
        Reserved (953): a lot expiring within the near-expiry window. Never
        emitted in 1.8.0: the window is a policy value that stays off until
        RT-50 B1.
      properties:
        kind: { type: string, const: expiring_lot }
        severity: { type: string, const: warning }
        trackingIdentityId: { type: string, format: uuid }
        tenantProductRef: { type: string, format: uuid }
        identityKind:
          type: string
          enum: [batch, serial]
        identityCode: { type: string, minLength: 1, maxLength: 128 }
        expiryDate: { type: string, format: date }
        storeId: { type: string, format: uuid }
        storeBusinessDate: { type: string, format: date }
        sellableQuantity:
          $ref: "#/components/schemas/PositiveDecimalQuantity"
        stockingUnit:
          $ref: "#/components/schemas/StockingUnit"
    TrackingConsistencyFinding:
      type: object
      additionalProperties: false
      required: [kind, severity, check, tenantProductRef, trackingIdentityId, storeId, stockingUnit]
      description: >
        RT-50 G7-12 (956), reserved in 1.10.0-draft (RT-1081): a tracked
        product or identity whose records disagree, one finding per check
        grain (identity; product × store × unit; identity × store × unit;
        product). Each `check` is emitted only once the runtime that
        produces its data has shipped; 1.10.0 emits none. A store_manager
        sees a finding only when `storeId` is in its scope; a tenant-wide
        finding (`storeId` null) is owner / tenant_admin only.
      properties:
        kind: { type: string, const: tracking_consistency }
        severity:
          type: string
          const: critical
          description: Owner decision OD-8 (RT-455 comment 15233).
        check:
          type: string
          enum:
            - identity_without_edge_map
            - untracked_effect_on_tracked_product
            - serial_position_out_of_range
            - profile_erp_flag_mismatch
        tenantProductRef: { type: string, format: uuid }
        trackingIdentityId:
          type: [string, "null"]
          format: uuid
          description: Null for `untracked_effect_on_tracked_product` and `profile_erp_flag_mismatch`.
        storeId:
          type: [string, "null"]
          format: uuid
          description: >
            The store of a position check (`untracked_effect_on_tracked_product`,
            `serial_position_out_of_range`); null for a tenant-wide check.
        stockingUnit:
          oneOf:
            - $ref: "#/components/schemas/StockingUnit"
            - type: "null"
          description: The stocking unit of a position check; null for a tenant-wide check.
    SaleLineFindingKind:
      type: string
      enum: [unvalidated_tracked_line, sold_under_hold, erp_intent_held]
      description: RT-451 (RT-50 G7-9 rows 2 and 3) the kind of a sale-line finding.
    SaleLineFinding:
      type: object
      additionalProperties: false
      required:
        [id, kind, severity, cause, storeId, saleId, saleLineId, tenantProductRef, trackingIdentityId, holdId,
         businessDate, occurredAt, recordedAt]
      description: >
        RT-451 one recorded finding on a tracked sale line, one per line, kind
        and cause. Append-only.
      properties:
        id: { type: string, format: uuid }
        kind:
          $ref: "#/components/schemas/SaleLineFindingKind"
        severity: { type: string, const: critical }
        cause:
          type: string
          enum: [validation_missing, validation_mismatch, quality_hold, recall_hold, expired, edge_map_missing]
          description: >
            Why the line was recorded; part of the finding's grain (line,
            kind, cause). `unvalidated_tracked_line`:
            `validation_missing` (no `validationId`) or `validation_mismatch`.
            `sold_under_hold`: `quality_hold` or `recall_hold`.
            `erp_intent_held`: `expired` or `edge_map_missing`.
        storeId: { type: string, format: uuid }
        saleId: { type: string, format: uuid }
        saleLineId: { type: string, format: uuid }
        tenantProductRef: { type: string, format: uuid }
        trackingIdentityId:
          type: string
          format: uuid
          description: The exact identity the line carries (rows 2 and 3 always have one).
        holdId:
          type: [string, "null"]
          format: uuid
          description: The hold the line was sold under; set only for `sold_under_hold`.
        businessDate:
          type: string
          format: date
          description: The sale's business date at its store.
        occurredAt:
          type: string
          format: date-time
          description: When the till recorded the sale.
        recordedAt:
          type: string
          format: date-time
          description: When the server recorded the finding; the order key.
    SaleLineFindingList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/SaleLineFinding"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null when exhausted.
    TrackingResolutionQueue:
      type: object
      additionalProperties: false
      required: [items, nextCursor, unresolvedCount]
      properties:
        items:
          type: array
          maxItems: 200
          description: Always empty for a store_manager (OD-9).
          items:
            $ref: "#/components/schemas/TrackingResolutionQueueItem"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null when exhausted, and always null for a store_manager.
        unresolvedCount:
          type: integer
          minimum: 0
          description: >
            The unresolved sales in the caller's scope and `storeId` filter,
            whatever `status`, `cursor` and `limit`.
    TrackingResolutionQueueItem:
      type: object
      additionalProperties: false
      required: [saleId, storeId, businessDate, occurredAt, capturedAt, status, unresolvedLines, resolution]
      description: One `tracking_unresolved` sale and its unresolved lines.
      properties:
        saleId: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        businessDate:
          type: string
          format: date
          description: The sale's business date at its store.
        occurredAt:
          type: string
          format: date-time
          description: When the till recorded the sale.
        capturedAt:
          type: string
          format: date-time
          description: >
            When the server received the sale (`pos-sales/sales.yaml`
            `Sale.receivedAt`); the order key.
        status:
          type: string
          enum: [unresolved, resolved]
        unresolvedLines:
          type: array
          minItems: 1
          description: >
            The lines that made the sale unresolved, as captured. They stay
            listed after the sale is resolved; `resolution.lines` gives the
            identity each one was bound to. No `maxItems` yet: capture lines are uncapped until RT-1052, so a cap
            could leave a sale that cannot be resolved; add one when RT-1052 caps them.
          items:
            $ref: "#/components/schemas/UnresolvedTrackedLine"
        resolution:
          description: The recorded resolution; null while the sale is unresolved.
          oneOf:
            - $ref: "#/components/schemas/TrackingResolution"
            - type: "null"
    UnresolvedTrackedLine:
      type: object
      additionalProperties: false
      required: [saleLineId, tenantProductRef, reason, sentIdentityId, scannedCode, quantity, unit]
      properties:
        saleLineId:
          type: string
          format: uuid
          description: The sale line (`pos-sales/sales.yaml` `SaleLine.lineRef`).
        tenantProductRef: { type: string, format: uuid }
        reason:
          type: string
          enum: [tracking_missing, identity_unknown, identity_other_product]
          description: >
            `tracking_missing`: the tracked product's line carried no
            `tracking`. `identity_unknown`: its `identityId` is not an
            identity of this tenant. `identity_other_product`: the identity is
            of another product.
        sentIdentityId:
          type: [string, "null"]
          format: uuid
          description: The `tracking.identityId` the till sent; null for `tracking_missing`.
        scannedCode:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
          description: The `tracking.code` the till sent; null for `tracking_missing`.
        quantity:
          type: string
          description: The line's quantity as captured (`pos-sales/sales.yaml` `SaleLine.quantity`).
        unit:
          type: string
          description: The line's unit as captured (`SaleLine.unit`).
    BindTrackingResolutionCommand:
      type: object
      additionalProperties: false
      required: [reasonCode, note, lines]
      description: Strict command. Tenant, sale scope and actor are resolved server-side.
      properties:
        reasonCode:
          $ref: "#/components/schemas/SafetyReasonCode"
          description: >
            A governed machine reason code (lower snake case), recorded and
            audited with the resolution. The bind always requires a `note`, so
            it takes the `SafetyReasonCode` pattern, not the
            `SafetyReasonCodeInput` list of the hold, recall and expiry
            correction commands (RT-451 S5).
        note:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "\\S"
          description: >
            Required operator note (no PII). The runtime trims it; a blank note
            is a 400.
        lines:
          type: array
          minItems: 1
          description: >
            One binding per unresolved line of the sale, each line exactly
            once; a missing, repeated or foreign `saleLineId` is a 400. No `maxItems` yet: capture lines are uncapped until RT-1052, so a cap
            could leave a sale that cannot be resolved; add one when RT-1052 caps them.
          items:
            $ref: "#/components/schemas/TrackingResolutionLineBinding"
    TrackingResolutionLineBinding:
      type: object
      additionalProperties: false
      required: [saleLineId, trackingIdentityId]
      properties:
        saleLineId: { type: string, format: uuid }
        trackingIdentityId:
          type: string
          format: uuid
          description: An existing identity of the line's product.
    TrackingResolution:
      type: object
      additionalProperties: false
      required: [id, saleId, reasonCode, note, resolvedBy, resolvedAt, lines]
      description: >
        RT-451 the recorded, audited Tracking Resolution of one sale. Final: a
        sale is resolved once.
      properties:
        id: { type: string, format: uuid }
        saleId: { type: string, format: uuid }
        reasonCode:
          $ref: "#/components/schemas/SafetyReasonCode"
        note: { type: string, minLength: 1, maxLength: 500 }
        resolvedBy:
          type: string
          format: uuid
          description: The acting principal's user id (an internal actor reference, not PII).
        resolvedAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          description: >
            One binding per line the resolution bound. No `maxItems` yet: capture lines are uncapped until RT-1052, so a cap
            could leave a sale that cannot be resolved; add one when RT-1052 caps them.
          items:
            $ref: "#/components/schemas/TrackingResolutionLineBinding"
    SafetyReasonCode:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,63}$"
      description: >
        RT-449: a machine reason code of a hold, recall or expiry correction,
        lower snake case (e.g. `supplier_notice`, `authority_notice`,
        `label_misprint`). Projections keep this pattern (RT-1081, TR-5), so
        a code recorded before 1.10.0 still reads back; the hold, recall and
        expiry correction commands accept only `SafetyReasonCodeInput`.
        `bindTrackingResolution` takes this pattern with a required note
        (RT-451 S5).
    SafetyReasonCodeInput:
      type: string
      enum: [supplier_notice, authority_notice, label_misprint, other]
      description: >
        RT-1081 / RT-455 TR-5 (owner decision RT-972 c14943; OD-4, OD-7): the
        governed reason a command accepts for a quality hold, a recall or an
        expiry correction. `other` («أخرى») requires a `note` that is not
        empty after trimming; without one the command is a 400
        `validation_error` and nothing is written. Projections keep
        `SafetyReasonCode` (the pattern), so a recorded code outside this
        list still reads back.
    SafetyNote:
      type: string
      maxLength: 500
      description: Operator note (no PII).
    SafetyRevision:
      type: integer
      format: int64
      minimum: 1
      description: >
        RT-449 (G7-7): the tenant's monotonic Inventory Safety Revision this
        command produced (a replay answers the recorded one).
    PlaceQualityHoldCommand:
      type: object
      additionalProperties: false
      required: [trackingIdentityId, reasonCode]
      description: Strict command. Tenant and actor are resolved server-side.
      properties:
        trackingIdentityId: { type: string, format: uuid }
        reasonCode:
          $ref: "#/components/schemas/SafetyReasonCodeInput"
        note:
          $ref: "#/components/schemas/SafetyNote"
    ReleaseTrackingHoldCommand:
      type: object
      additionalProperties: false
      properties:
        note:
          $ref: "#/components/schemas/SafetyNote"
    TrackingHold:
      type: object
      additionalProperties: false
      required:
        [id, trackingIdentityId, tenantProductRef, kind, reasonCode, note, recallId, placedBy, placedAt,
         releasedBy, releasedAt, releaseNote, active]
      description: >
        RT-449 (G7-6): a quality or recall hold on a tracking identity. An
        active hold blocks selling the identity.
      properties:
        id: { type: string, format: uuid }
        trackingIdentityId: { type: string, format: uuid }
        tenantProductRef: { type: string, format: uuid }
        kind:
          type: string
          enum: [quality_hold, recall_hold]
        reasonCode:
          $ref: "#/components/schemas/SafetyReasonCode"
        note: { type: [string, "null"] }
        recallId:
          type: [string, "null"]
          format: uuid
          description: The recall that placed a recall hold; null for a quality hold.
        placedBy:
          type: string
          format: uuid
          description: The placing principal's user id (an internal actor reference, not PII).
        placedAt: { type: string, format: date-time }
        releasedBy: { type: [string, "null"], format: uuid }
        releasedAt: { type: [string, "null"], format: date-time }
        releaseNote: { type: [string, "null"] }
        active:
          type: boolean
          description: True until the hold is released.
    TrackingHoldResult:
      type: object
      additionalProperties: false
      required: [hold, safetyRevision]
      properties:
        hold:
          $ref: "#/components/schemas/TrackingHold"
        safetyRevision:
          $ref: "#/components/schemas/SafetyRevision"
    CreateInventoryRecallCommand:
      type: object
      additionalProperties: false
      required: [tenantProductRef, trackingIdentityIds, reasonCode, reference]
      description: Strict command. Tenant and actor are resolved server-side.
      properties:
        tenantProductRef: { type: string, format: uuid }
        trackingIdentityIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Identities of `tenantProductRef` to recall.
          items: { type: string, format: uuid }
        reasonCode:
          $ref: "#/components/schemas/SafetyReasonCodeInput"
        reference:
          type: string
          minLength: 1
          maxLength: 200
          description: The external reference, e.g. an authority notice number.
        note:
          $ref: "#/components/schemas/SafetyNote"
        effectiveAt:
          type: string
          format: date-time
          description: When the recall takes effect; defaults to now and is never in the future.
    InventoryRecall:
      type: object
      additionalProperties: false
      required: [id, tenantProductRef, reasonCode, reference, note, effectiveAt, createdBy, createdAt, holds]
      description: >
        RT-449 (G7-6, 860): a Recall and the recall hold it placed on each
        listed identity.
      properties:
        id: { type: string, format: uuid }
        tenantProductRef: { type: string, format: uuid }
        reasonCode:
          $ref: "#/components/schemas/SafetyReasonCode"
        reference: { type: string }
        note: { type: [string, "null"] }
        effectiveAt: { type: string, format: date-time }
        createdBy:
          type: string
          format: uuid
          description: The acting principal's user id (an internal actor reference, not PII).
        createdAt: { type: string, format: date-time }
        holds:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TrackingHold"
    InventoryRecallResult:
      type: object
      additionalProperties: false
      required: [recall, safetyRevision]
      properties:
        recall:
          $ref: "#/components/schemas/InventoryRecall"
        safetyRevision:
          $ref: "#/components/schemas/SafetyRevision"
    CorrectTrackingIdentityExpiryCommand:
      type: object
      additionalProperties: false
      required: [expiryDate, reasonCode]
      description: Strict command. Tenant and actor are resolved server-side.
      properties:
        expiryDate:
          type: [string, "null"]
          format: date
          description: >
            The corrected expiry date. Null clears it, unless the product's
            tracking profile requires an expiry (then a 400).
        reasonCode:
          $ref: "#/components/schemas/SafetyReasonCodeInput"
        note:
          $ref: "#/components/schemas/SafetyNote"
    TrackingIdentityExpiryCorrection:
      type: object
      additionalProperties: false
      required:
        [id, trackingIdentityId, tenantProductRef, oldExpiryDate, newExpiryDate, reasonCode, note, createdBy,
         createdAt]
      description: "RT-449 (G7-2): one entry of an identity's expiry history."
      properties:
        id: { type: string, format: uuid }
        trackingIdentityId: { type: string, format: uuid }
        tenantProductRef: { type: string, format: uuid }
        oldExpiryDate: { type: [string, "null"], format: date }
        newExpiryDate: { type: [string, "null"], format: date }
        reasonCode:
          $ref: "#/components/schemas/SafetyReasonCode"
        note: { type: [string, "null"] }
        createdBy:
          type: string
          format: uuid
          description: The acting principal's user id (an internal actor reference, not PII).
        createdAt: { type: string, format: date-time }
    TrackingIdentityExpiryCorrectionResult:
      type: object
      additionalProperties: false
      required: [correction, safetyRevision]
      properties:
        correction:
          $ref: "#/components/schemas/TrackingIdentityExpiryCorrection"
        safetyRevision:
          $ref: "#/components/schemas/SafetyRevision"
    TrackingIdentityExpiryCorrectionList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      description: RT-1081 (II-4) — a page of an identity's expiry corrections, newest first.
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/TrackingIdentityExpiryCorrection"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null when exhausted.
    TrackingHoldList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      description: RT-1081 (TR-3a, II-3) — a page of tracking holds, newest first.
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/TrackingHold"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null when exhausted.
    InventoryRecallSummary:
      type: object
      additionalProperties: false
      required:
        [id, tenantProductRef, reasonCode, reference, note, effectiveAt, createdBy, createdAt, holdCount,
         activeHoldCount]
      description: >
        RT-1081 (TR-3b): a recall without its holds (`getInventoryRecall`
        returns them).
      properties:
        id: { type: string, format: uuid }
        tenantProductRef: { type: string, format: uuid }
        reasonCode:
          $ref: "#/components/schemas/SafetyReasonCode"
        reference: { type: string }
        note: { type: [string, "null"] }
        effectiveAt: { type: string, format: date-time }
        createdBy:
          type: string
          format: uuid
          description: The acting principal's user id (an internal actor reference, not PII).
        createdAt: { type: string, format: date-time }
        holdCount: { type: integer, minimum: 1, maximum: 100 }
        activeHoldCount: { type: integer, minimum: 0, maximum: 100 }
    InventoryRecallSummaryList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/InventoryRecallSummary"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null when exhausted.
    TrackingIdentityPositions:
      type: object
      additionalProperties: false
      required: [trackingIdentityId, tenantProductRef, stores]
      description: RT-1081 (II-2) — one identity's derived positions per store and stocking unit.
      properties:
        trackingIdentityId: { type: string, format: uuid }
        tenantProductRef: { type: string, format: uuid }
        stores:
          type: array
          items:
            $ref: "#/components/schemas/TrackingIdentityStorePosition"
    TrackingIdentityStorePosition:
      type: object
      additionalProperties: false
      required: [storeId, stockingUnit, quantity, sellableQuantity, statusQuantities]
      properties:
        storeId: { type: string, format: uuid }
        stockingUnit:
          $ref: "#/components/schemas/StockingUnit"
        quantity:
          allOf:
            - $ref: "#/components/schemas/DecimalQuantity"
          description: The physical total over every status and location. May be negative.
        sellableQuantity:
          $ref: "#/components/schemas/DecimalQuantity"
        statusQuantities:
          type: array
          minItems: 6
          maxItems: 6
          description: One entry per inventory status, in `InventoryStatus` order; they sum to `quantity`.
          items:
            $ref: "#/components/schemas/StatusQuantity"
    StockMovementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          description: Bounded by the `limit` query parameter ceiling (max 200), symmetric with the request-side caps.
          items:
            $ref: "#/components/schemas/StockMovement"
        nextCursor:
          type: [string, "null"]
          description: >
            Opaque cursor for the next page, bound to the request's store and
            filters; null when exhausted. Absent is read as null.
    OnHand:
      type: object
      required: [storeId, productId, quantity, negativeBalance, sellableQuantity, statusQuantities]
      description: >
        Derived on-hand projection. `quantity` is the compute-on-read signed
        SUM (FR-003) over every location and inventory status of the store —
        the physical on-hand (decision 732). `negativeBalance` is true when
        `quantity` < 0 (FR-024); on-hand is never a stored mutable value.
        RT-432: `sellableQuantity` and `statusQuantities` split the same
        movements by inventory status (decision 745); a movement recorded before
        positions existed counts as `sellable`. Available To Sell is not
        projected here.
      properties:
        storeId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        quantity:
          $ref: "#/components/schemas/DecimalQuantity"
        stockingUnit: { type: [string, "null"] }
        negativeBalance:
          type: boolean
          description: True when the derived quantity is below zero (allow-and-flag, FR-024).
        sellableQuantity:
          allOf:
            - $ref: "#/components/schemas/DecimalQuantity"
          description: RT-432 — the `sellable` share of `quantity` (decision 733). May be negative.
        statusQuantities:
          type: array
          minItems: 6
          maxItems: 6
          description: >
            RT-432 — one entry per inventory status, in the order of the
            `InventoryStatus` enum; a status with no movements reads zero. The
            entries sum to `quantity`.
          items:
            $ref: "#/components/schemas/StatusQuantity"
    InventoryStatus:
      type: string
      enum: [sellable, return_inspection, quality_hold, damaged, expired, recall_hold]
      description: >
        RT-432 (RT-290 G4-2, decision 751): the closed set of inventory
        statuses. All are physical stock; only `sellable` is sellable (733).
    StatusQuantity:
      type: object
      required: [inventoryStatus, quantity]
      properties:
        inventoryStatus:
          $ref: "#/components/schemas/InventoryStatus"
        quantity:
          $ref: "#/components/schemas/DecimalQuantity"
    StockLocation:
      type: object
      required: [id, storeId, code, name, kind, isActive]
      description: >
        RT-432 (RT-290 G4-1): a stock location inside exactly one store. Every
        store has exactly one `primary` location, created with the store.
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        kind:
          type: string
          enum: [primary, storage]
        isActive: { type: boolean }
    StockLocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockLocation"
    TrackingIdentity:
      type: object
      required: [id, productId, kind, code, expiryDate, manufacturedOn, origin]
      additionalProperties: false
      description: >
        RT-448 (RT-50 G7-2, G7-3): an Inventory-owned batch or serial of one
        product. `kind`, `code` and the product never change. No ERPNext
        document name is projected (M-9).
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        kind:
          type: string
          enum: [batch, serial]
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: The lot or serial number exactly as printed on the pack; matched exactly, never fuzzily (313).
        expiryDate:
          type: [string, "null"]
          format: date
          description: >
            The calendar expiry date. A lot is sellable through this date,
            inclusive, at the selling store's business date (G7-5).
        manufacturedOn: { type: [string, "null"], format: date }
        origin:
          type: string
          enum: [erp_external]
          description: Identities are ERP-born only (G7-3).
    TrackingIdentityList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          description: Bounded by the `limit` query parameter (max 200).
          items:
            $ref: "#/components/schemas/TrackingIdentity"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null when exhausted.
    StockTransfer:
      type: object
      required: [transferGroupId, outbound, inbound]
      properties:
        transferGroupId: { type: string, format: uuid }
        outbound: { $ref: "#/components/schemas/StockMovement" }
        inbound: { $ref: "#/components/schemas/StockMovement" }
    StockCountResult:
      type: object
      required: [stockCountId, countedQuantity, variance]
      properties:
        stockCountId: { type: string, format: uuid }
        countedQuantity:
          $ref: "#/components/schemas/DecimalQuantity"
        variance:
          allOf:
            - $ref: "#/components/schemas/DecimalQuantity"
          description: Signed variance (counted − derived on-hand). Zero ⇒ no correction movement.
        correctionMovement:
          oneOf:
            - $ref: "#/components/schemas/StockMovement"
            - type: "null"
          description: The appended count_correction movement, or null on zero variance.

    # ----- Shared
    StockingUnit:
      type: string
      minLength: 1
      maxLength: 32
      pattern: "\\S"
      description: >
        Unit the quantity is expressed in; MUST match the product's stocking unit
        (cross-unit rejected, FR-022). 1–32 characters and not whitespace-only
        (the server trims it; a blank unit is a 400).
    NonZeroDecimalQuantity:
      type: string
      pattern: '^-?(?!0+(?:\.0+)?$)[0-9]{1,15}(\.[0-9]{1,4})?$'
      description: >
        Signed, non-zero exact-decimal quantity as a STRING (`numeric(19,4)`):
        ≤15 integer and ≤4 fraction digits. Zero is a 400 for every movement type.
    PositiveDecimalQuantity:
      type: string
      pattern: '^(?!0+(?:\.0+)?$)[0-9]{1,15}(\.[0-9]{1,4})?$'
      description: >
        Strictly positive exact-decimal quantity as a STRING (`numeric(19,4)`):
        unsigned, ≤15 integer and ≤4 fraction digits, and not zero.
    NonNegativeDecimalQuantity:
      type: string
      pattern: '^[0-9]{1,15}(\.[0-9]{1,4})?$'
      description: >
        Non-negative exact-decimal quantity as a STRING (`numeric(19,4)`):
        unsigned, ≤15 integer and ≤4 fraction digits.
    DecimalQuantity:
      type: string
      pattern: '^-?\d{1,15}(\.\d{1,4})?$'
      description: >
        Exact-decimal quantity as a STRING (`numeric(p,s)` at rest); no float on
        the wire. May be negative on a derived on-hand (allow-and-flag, FR-024).
        There is NO money / currency / tender field anywhere in this contract.
    Error:
      type: object
      required: [error]
      description: >
        Canonical error envelope, identical to the shared shape in
        `auth.openapi.yaml` / `outbox.openapi.yaml` (used verbatim — no extra
        fields, no `details`). Cross-tenant / out-of-scope refusals are
        non-disclosing (§II/§XII) — they never enumerate the underlying cause.
        NOTE: negative resulting stock is NOT an error (allow-and-flag, FR-024)
        — there is no error code for going below zero.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable summary. No sensitive data, no cause enumeration.
            request_id:
              type: string
              format: uuid
              description: Server-side correlation id; the actual cause is recorded server-side.

  responses:
    ValidationFailure:
      description: >
        400 — strict-schema validation failure: unknown keys, malformed values,
        a non-positive / zero transfer quantity, a same-store transfer, a
        cross-unit quantity (FR-022), or a missing `reason` on an adjustment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 401 — no valid session / credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 403 — authenticated but insufficient role within the resolved tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenOrOriginRejected:
      description: >
        403 — authenticated but insufficient role within the resolved tenant.
        Also `origin_rejected` (RT-430): the request is authenticated by the
        `dp2_session` cookie and its `Origin` header is missing, or is neither
        the API's own origin nor listed in `ALLOWED_ORIGINS`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SupportSessionRefused:
      description: >
        403 — only a platform-admin session without a live support session
        for the tenant (`support_session_required` /
        `support_session_expired`, RT-414). A caller without the role is a
        non-disclosing 404, never this 403 (RT-1081).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundOrCrossTenant:
      description: >
        404 — the target (movement / on-hand / store / product / sale ref /
        destination store) does not exist OR belongs to another tenant. The two
        are INDISTINGUISHABLE by design (non-disclosing, §II/§XII, FR-051).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: >
        409 — an `Idempotency-Key` replay with a DIFFERENT body (FR-030).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PositionEventConflict:
      description: >
        409 — RT-435. `idempotency_key_conflict`: the `Idempotency-Key` was
        already used for a different command. `erp_transfer_intent_required`:
        the move does not net to zero in every ERP mapping bucket, which needs
        the Gate 8 transfer intent (never under the V1 profile).
        `tracking_identity_required`: the product is tracked, and tracked moves
        are not supported yet. Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SafetyConflict:
      description: >
        409 — RT-449. `hold_already_active`: the identity (or a listed one)
        already has an active hold of that kind. `expiry_unchanged`: the
        identity already has that expiry date. `idempotency_key_conflict`: the
        `Idempotency-Key` was already used for a different command. Nothing is
        written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TrackingResolutionConflict:
      description: >
        409 — RT-451. `tracking_resolution_identity_mismatch`: an identity is
        not of the line's product. `tracking_resolution_identity_held`: an
        identity has an active hold now, or had one at the sale's
        `occurredAt`. `tracking_resolution_identity_expired`: an identity's
        expiry date is before the sale's business date, or it has none and
        the line's product requires one.
        `tracking_resolution_already_resolved`: the sale is already resolved.
        `idempotency_key_conflict`: the `Idempotency-Key` was already used for
        a different command. Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TrackedSellingConflict:
      description: >
        409 — RT-451 S2. `tracked_selling_preconditions_unmet`: switching
        tracked selling on was refused because at least one RT-50 Q13
        precondition does not hold now; `getTrackedSellingSetting` lists
        which. Nothing is written. Switching off never answers 409.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SystemFailure:
      description: 5xx — internal failure; the cause is recorded server-side under `request_id`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >
        429 `rate_limited` (RT-574): the caller's per-user budget for this
        class of operation is spent. The body is the canonical error
        envelope with a non-disclosing message (no budget, class or window);
        its `request_id` equals the `X-Request-Id` response header. Honour
        `Retry-After`; never auto-retry a mutation. A 429 is not a 401: it
        never means the session ended. The console limit is
        server-configured and may not be enforced, so a client must handle a
        429 but must not expect one.
      headers:
        Retry-After:
          $ref: "#/components/headers/ConsoleRetryAfter"
        Cache-Control:
          description: Always `no-store` on a 429.
          required: true
          schema:
            type: string
            enum: [no-store]
        X-Request-Id:
          description: >
            The request id, equal to `error.request_id` in the body: the
            inbound `X-Request-Id` when it is a well-formed UUID, otherwise a
            server-minted one.
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  headers:
    ConsoleRetryAfter:
      description: >
        Whole seconds the caller should wait before retrying, sent on every
        console 429 (RT-574 D5). Its own bound, 1 to 3600; it is not the POS
        `RetryAfter` header.
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 3600
