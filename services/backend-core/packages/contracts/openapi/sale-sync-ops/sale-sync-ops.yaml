openapi: 3.1.0
info:
  title: Data-Pulse-2 — Sale Sync-Ops Read / Repair API
  version: "1.3.0-draft"
  description: >
    Spec 032 §9 — the server-authoritative sale-sync READ/REPAIR surface the
    later Retail Tower Console consumes. DP-2 owns the authoritative sale-status
    (§7) and the dead-letter / NEEDS_REPAIR classification (§8); this contract
    is the generated-client surface over them. It is consumed later by the
    Console sync-ops UI — there is NO POS-facing route here.

      1. `consoleGetSaleSyncStatus`  — read one sale's server-authoritative
         sync-status (captured / synced / failed-retryable / failed-needs-repair)
         + minimal provenance. Object-level authz: a sale outside the operator's
         (tenant, store) scope is a non-disclosing 404.
      2. `consoleListNeedsRepair`    — the NEEDS_REPAIR queue: tenant+store
         scoped, newest-first, opaque keyset/cursor pagination (spec clarify
         2026-06-12). Open `failed-needs-repair` items only.
      3. `consoleGetSaleAuditTimeline` — the read-only correlation/audit
         timeline for one sale (028 provenance), redacted at the emitter
         (Principle XIII/XIV).
      4. `consoleRepairSaleSync`     — the SERVER-MEDIATED repair/retry op. Acts
         ONLY on a DP-2-classified NEEDS_REPAIR item, is audited, performs NO
         sale-fact rewrite, and has NO POS-local override path (repair authority
         is Console-mediated only — owner decision DP3 / §13 item 3; 028 OQ-2).

    SETTLEMENT EXCLUDED (F-2): there is NO payments.confirm / settled_at /
    tender-settlement op here — that endpoint does not exist and is not invented.
    The live provenance-conflict 409 (F-3) is owned by the POS `recordVoid` /
    `recordRefund` surface (`pos-sales/sales.yaml`) and is NOT regressed or
    re-shaped here; the AlreadyApplied-422 path is an OPEN owner decision and is
    NOT authored (DP1: keep-409, 422 deferred).

    AUTH: the HUMAN `cookieAuth` (httpOnly `dp2_session`) scheme — gated by
    `DashboardAuthGuard` + `RolesGuard` (human-operator-only), matching
    `console-sync-ops.yaml`. NOT the POS `clerkJwt` device scheme, NOT the
    machine `connectorBearer` / `dashboard_api` bearer. 401/403 auth semantics
    are owned by 028 (bound by reference; G10) and are NOT re-decided here.

    PROJECTIONS (§IV): every response is an explicit `toBody` wire shape with
    `additionalProperties: false` — no raw `sales` / `sale_sync_deadletters` DB
    entity, no `tenant_id` (implicit in the session scope), no `payload_hash`,
    no `created_by`, no money/line amounts on the status/queue surface.

    Error envelope: the canonical `{ error: { code, message, request_id } }`,
    identical to the shared shape (`auth` / `outbox` / `pos-sales` /
    `console-sync-ops`). Status mapping: 400 validation, 401 unauthenticated,
    403 insufficient-role, 404 not-found / cross-tenant (non-disclosing,
    safe-404), 409 repair conflict (item not in a repairable state),
    429 `rate_limited` (console rate limit; honour `Retry-After`), 500 internal.


    **1.1.0-draft (RT-620, additive).** Every cookieAuth operation may
    return 429 `rate_limited` (`TooManyRequests`, with `Retry-After`)
    from the console rate limit (RT-574, RT-619). No other wire change.


    **1.2.0-draft (RT-973, additive, contract-first).** `SaleSyncStatus`
    gains an optional `syncStatusVersion`, the Backend-Core-owned ordering
    of the sale's `syncStatus` (decision record
    `docs/planning/rt-973-sale-sync-status-ordering.md`). Backend-Core emits
    it on every newly computed `SaleSyncStatus` response since the RT-1061
    runtime slice (migration 0077, `sales.sync_status_version`). It stays
    optional: a `consoleRepairSaleSync` idempotent replay returns the body
    stored before that slice (72h replay TTL) without it. No operation
    changes, so no `x-runtime-status` marker applies.


    **1.3.0-draft (RT-1312 Phase 3(a), additive, contract-first;
    owner decision D1, RT-1312 comment 16359).** Three new operations, each
    `x-runtime-status: contract-only` until RT-1312 Phase 3(b):

      5. `consoleListQuarantinedSales`  — the quarantine half of the
         NEEDS_REPAIR queue.
      6. `consoleGetQuarantinedSale`    — one quarantine item.
      7. `consoleRepairQuarantinedSale` — re-ingest its stored body.

    A quarantined sale is one the till could not get captured: Backend-Core
    refused its `captureSale` for good, or the till held it after a re-pair.
    The till uploads it with `posQuarantineSale`
    (`pos-sales/sale-quarantine.yaml`, the POS-facing half; this file still
    has no POS route). Unlike items 1 to 4, which act on a CAPTURED sale
    (`saleRef` = `sales.id`) whose processing dead-lettered, a quarantined
    sale has no `sales` row, so it has its own reference (`quarantineRef`,
    UUIDv7), its own list and its own repair. `NeedsRepairItem` and
    `consoleListNeedsRepair` are unchanged: widening them would break the
    closed schema the Admin Console pins. The Console shows both lists as the
    one NEEDS_REPAIR queue. Everything else is shared with items 1 to 4: the
    `cookieAuth` session, the role and store-scope rules, the error envelope
    and responses, the `Idempotency-Key` rule and the `repair_conflict` 409.
    The projections carry no money, no line amounts and not the stored body,
    like the existing queue.

    **The repair (item 7).** It re-ingests the stored `saleBody` through the
    `captureSale` rules (`pos-sales/sales.yaml`) for the item's tenant and
    store, under the sale's original provenance `(sourceSystem, externalId)`
    and its recorded idempotency key. At most one sale ever exists for a
    provenance: that guarantee is the capture provenance dedup (FR-050) and
    the RT-1206 same-facts rule, not an interceptor replay (the capture
    interceptor is scoped to the authenticated principal and stores only
    successful answers, so a Console principal never replays the till's
    stored answer). So a repair racing a late till retry, a second repair or
    a repair of a sale captured meanwhile can never create a second sale.
    The repair's outcome is one of three, always returned as 200 with the
    updated item: `captured` (a new sale; the item leaves the queue),
    `already-captured` (a sale with this provenance and the same facts
    exists; the item leaves the queue) or `refused` (the capture rules
    refused it again; the item stays `open` with the new status and code).
    Repair never edits the stored body: a body that can never be captured
    as sent (for example a `payload_divergence`) needs an owner decision
    (open question 3 below). Each repair writes one audit row naming the
    repairer.

    **Open owner questions (not decided by this draft; the runtime waits
    for them).** (1) Who may repair: `owner` and `tenant_admin`, as the
    existing repair, or also `store_manager` for its stores? (2) Which
    capture checks the repair re-runs, and who the sale's operator
    (`created_by`) is. The stored body may carry the cashier's
    `operatorUserId` (RT-224 device path), whose cashier admission window
    has usually closed by repair time (the RT-1125 R-02 case of an outage
    over 12 h): does the repair re-check the admission and refuse, or does
    the repairer's session stand in for it, with the cashier still recorded
    as the seller? (3) A terminal close without re-ingest (for example
    "written off, handled outside Retail Tower") for a body that can never
    be captured, such as a `payload_divergence`: wanted, and by whom?
    (4) Retention of quarantined bodies and items. (5) Whether the Console
    may see the stored body or a money summary (the existing queue shows
    neither). (6) How the repair result reaches the till, if at all.

servers:
  - url: https://api.example.com

tags:
  - name: sale-sync-ops
    description: >
      Console-facing read/repair surface over the server-authoritative
      sale-status (§7) + dead-letter classification (§8). Spec 032 §9.

security:
  - cookieAuth: []

paths:
  /api/v1/catalog/sale-sync-ops/sales/{saleRef}/status:
    get:
      summary: Read one sale's server-authoritative sync-status.
      operationId: consoleGetSaleSyncStatus
      tags: [sale-sync-ops]
      description: >
        Resolve a single sale's DP-2-owned sync-status. Object-level authz: a
        sale outside the operator's (tenant, store) scope returns a
        non-disclosing 404, identical to genuinely-absent (FR-063/102).
      parameters:
        - $ref: "#/components/parameters/SaleRef"
      responses:
        "200":
          description: The sale's sync-status projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleSyncStatus"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/catalog/sale-sync-ops/needs-repair:
    get:
      summary: List the NEEDS_REPAIR queue (newest-first, keyset paginated).
      operationId: consoleListNeedsRepair
      tags: [sale-sync-ops]
      description: >
        The dead-letter NEEDS_REPAIR queue: tenant-scoped (RLS) and optionally
        store-filtered, newest-first by the time-ordered sale reference, opaque
        keyset/cursor paginated (spec clarify 2026-06-12). Open
        `failed-needs-repair` items only — resolved items are retained for audit
        but not listed. Never a silent drop (Principle V/XIII).
      parameters:
        - $ref: "#/components/parameters/StoreIdQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of NEEDS_REPAIR items, newest-first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsRepairPage"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/catalog/sale-sync-ops/sales/{saleRef}/audit-timeline:
    get:
      summary: Read the correlation/audit timeline for one sale (028 provenance).
      operationId: consoleGetSaleAuditTimeline
      tags: [sale-sync-ops]
      description: >
        The read-only correlation/audit timeline for one sale — 028 provenance,
        redacted at the emitter (Principle XIII/XIV). Object-level authz +
        non-disclosing 404, identical to the status read.
      parameters:
        - $ref: "#/components/parameters/SaleRef"
      responses:
        "200":
          description: The sale's audit timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleAuditTimeline"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/catalog/sale-sync-ops/sales/{saleRef}/repair:
    post:
      summary: Server-mediated repair/retry of a NEEDS_REPAIR sale sync.
      operationId: consoleRepairSaleSync
      x-idempotency: required
      tags: [sale-sync-ops]
      description: >
        Issue a SERVER-MEDIATED repair/retry for a DP-2-classified NEEDS_REPAIR
        sale. The op is audited, acts ONLY on a `failed-needs-repair` item, and
        performs NO sale-fact rewrite (no change to the immutable `sales` /
        `sale_lines` / terminal-event rows — only the SaaS-owned sync-status and
        the deadletter resolution are touched). There is NO POS-local override
        path (repair authority is Console-mediated only — DP3 / §13 item 3).

        An item not currently in a repairable (`failed-needs-repair`, open)
        state returns 409 `repair_conflict` — deterministic, no side effect.
        `Idempotency-Key` is REQUIRED (reuses the existing IdempotencyInterceptor).
      parameters:
        - $ref: "#/components/parameters/SaleRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: >
            Repair accepted — the item was re-queued for sync. Returns the
            sale's updated sync-status projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleSyncStatus"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RepairConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/catalog/sale-sync-ops/quarantined-sales:
    get:
      summary: List quarantined sales (the quarantine half of the NEEDS_REPAIR queue).
      operationId: consoleListQuarantinedSales
      tags: [sale-sync-ops]
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1312 Phase 3(a) publishes the contract only. There is no
        controller, service, table or migration for this route until RT-1312
        Phase 3(b).
      x-audit-action: sale_sync_ops.quarantine.listed
      description: >
        Sales the till uploaded with `posQuarantineSale` because Backend-Core
        refused them for good or the till held them after a re-pair.
        Tenant-scoped (RLS) and bound to the operator's store scope (RT-193),
        optionally store-filtered, newest-first by `quarantineRef` (UUIDv7),
        opaque keyset/cursor paginated. Lists `open` items by default;
        `state` selects resolved ones, which are retained for audit. Never a
        silent drop.
      parameters:
        - $ref: "#/components/parameters/StoreIdQuery"
        - $ref: "#/components/parameters/QuarantineStateQuery"
        - $ref: "#/components/parameters/QuarantineCursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of quarantined sales, newest-first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantinedSalePage"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/catalog/sale-sync-ops/quarantined-sales/{quarantineRef}:
    get:
      summary: Read one quarantined sale.
      operationId: consoleGetQuarantinedSale
      tags: [sale-sync-ops]
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1312 Phase 3(a) publishes the contract only. There is no
        controller, service, table or migration for this route until RT-1312
        Phase 3(b).
      x-audit-action: sale_sync_ops.quarantine.read
      description: >
        One quarantine item, any state. Object-level authz: an item outside
        the operator's (tenant, store) scope is a non-disclosing 404,
        identical to genuinely absent (FR-063/102).
      parameters:
        - $ref: "#/components/parameters/QuarantineRef"
      responses:
        "200":
          description: The quarantined sale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantinedSale"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/catalog/sale-sync-ops/quarantined-sales/{quarantineRef}/repair:
    post:
      summary: Re-ingest a quarantined sale under its original provenance and idempotency key.
      operationId: consoleRepairQuarantinedSale
      x-idempotency: required
      tags: [sale-sync-ops]
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1312 Phase 3(a) publishes the contract only. There is no
        controller, service, table or migration for this route until RT-1312
        Phase 3(b).
      x-audit-action: sale_sync_ops.quarantine.repair.requested
      description: >
        SERVER-MEDIATED repair of an `open` quarantine item (DP3: no POS-local
        override). Re-ingests the stored `saleBody` through the `captureSale`
        rules for the item's tenant and store, under the stored provenance
        `(sourceSystem, externalId)` and idempotency key; at most one sale
        ever exists per provenance (see the 1.3.0-draft notes in the info
        description). Never edits the stored body.

        200 with the updated item for every capture outcome: `captured` and
        `already-captured` resolve the item (`saleRef` set); `refused` keeps
        it `open` and records the capture's status and code in `lastRepair`.
        An item that is not `open` is 409 `repair_conflict`, deterministic,
        no side effect. `Idempotency-Key` is REQUIRED and is the Console
        request's own key (the existing IdempotencyInterceptor): an identical
        retry replays the stored answer; it is NOT the sale's capture key.
        Which capture checks re-run and who is recorded as the sale's
        operator are open owner questions (info description, 1.3.0-draft).
      parameters:
        - $ref: "#/components/parameters/QuarantineRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: >
            The repair ran. Returns the item with its new `state` and
            `lastRepair`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantinedSale"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RepairConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dp2_session
      description: >
        The human dashboard session cookie (httpOnly `dp2_session`), verified by
        `DashboardAuthGuard`. The ONLY accepted credential on this surface — a
        machine bearer or a POS `clerkJwt` is rejected. `RolesGuard` + `@Roles`
        gate the routes (default deny). 401/403 semantics owned by 028 (G10).

  parameters:
    SaleRef:
      name: saleRef
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: >
        Stable server-issued sale reference (= `sales.id`). Resolves only within
        the operator's (tenant, store) scope — out-of-scope refs are
        non-disclosing 404s (FR-063/102).
    StoreIdQuery:
      name: store_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: >
        Optional in-scope store filter. Validated against the operator's
        accessible stores; an out-of-scope id is a non-disclosing 404.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      description: >
        Opaque keyset pagination cursor from a prior page's `nextCursor`. Opaque
        — do not decode or construct. Omit for the first page. The value is a
        UUIDv7 sale reference; anything else is a 400 `validation_error`.
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Maximum items per page (bounded). The server MAY return fewer.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[\\x21-\\x7E]{16,128}$"
      description: >
        REQUIRED on the repair write. Reuses the existing IdempotencyInterceptor
        — identical retry replays the stored response; key-reuse with a
        different logical payload returns 409 `idempotency_key_conflict`.
    QuarantineRef:
      name: quarantineRef
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: >
        1.3.0-draft. Stable server-issued quarantine item reference (UUIDv7),
        returned to the till as `QuarantineReceipt.quarantineRef`. Resolves
        only within the operator's (tenant, store) scope; out-of-scope refs
        are non-disclosing 404s (FR-063/102).
    QuarantineStateQuery:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [open, captured, already-captured]
        default: open
      description: >
        1.3.0-draft. Which items to list; `open` (the queue) when omitted.
    QuarantineCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      description: >
        1.3.0-draft. Opaque keyset pagination cursor from a prior
        `QuarantinedSalePage.nextCursor`. Do not decode or construct it; omit
        it for the first page. The value is a UUIDv7 quarantine reference;
        anything else is a 400 `validation_error`.

  schemas:
    SyncStatusValue:
      type: string
      enum: [captured, synced, failed-retryable, failed-needs-repair]
      description: >
        The server-authoritative sale-status vocabulary (§7). DP-2 sets it; POS
        never overrides (the terminal observes, DP-2 decides).
    SaleSyncStatus:
      type: object
      additionalProperties: false
      required: [saleRef, storeId, syncStatus, sourceSystem, externalId]
      description: >
        Wire projection of a sale's server-authoritative sync-status. Carries no
        `tenant_id` (implicit in the session scope), no money, no line amounts,
        no `payload_hash`, no `created_by`.
      properties:
        saleRef:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        syncStatus:
          $ref: "#/components/schemas/SyncStatusValue"
        sourceSystem:
          type: string
        externalId:
          type: string
        processedAt:
          type: [string, "null"]
          format: date-time
          description: Null until the off-request drain sets it (FR-071).
        syncStatusVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: >
            RT-973 (1.2.0-draft). Orders this sale's `syncStatus` across reads.
            Backend-Core increments it by one in the same statement as every
            write that sets the sale's sync status (capture leaves it at 0;
            the drain, the dead-letter classifier and this repair each add
            one); it never decreases. Comparable only between two reads of
            the SAME sale: a higher value is a later status, an equal value is
            the same status. `console-sales` `ConsoleSaleItem` (1.2.0-draft)
            carries the same field, so a client can order this response
            against the sale detail. An idempotent repair replay returns the
            stored response, with the version it had then. Emitted on every
            newly computed response since RT-1061 (migration 0077). Optional
            for good, because a repair replay stored before RT-1061 has no
            value; a client treats an absent value as unknown and does not
            order on it.
        deadLetter:
          description: >
            Present (non-null) when the sale has an OPEN dead-letter row — the
            §8 classification + redacted reason + retry accounting. Null
            otherwise.
          anyOf:
            - $ref: "#/components/schemas/DeadLetterDetail"
            - type: "null"
    DeadLetterDetail:
      type: object
      additionalProperties: false
      required: [classification, reasonCode, retryCount, quarantinedAt]
      description: >
        The §8 dead-letter classification for a quarantined sale-sync. Provenance
        is on the parent `SaleSyncStatus`; the reason is a REDACTED machine label,
        never a raw upstream error body (Principle XIII/XIV).
      properties:
        classification:
          type: string
          enum: [retryable, needs-repair]
        reasonCode:
          type: string
          description: Redacted machine label (e.g. auth_revoked, validation_error).
        retryCount:
          type: integer
          minimum: 0
        quarantinedAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
          description: Set when a server-mediated repair resolved the item; null while open.
    NeedsRepairItem:
      type: object
      additionalProperties: false
      required:
        - saleRef
        - storeId
        - syncStatus
        - sourceSystem
        - externalId
        - reasonCode
        - quarantinedAt
      description: A single NEEDS_REPAIR queue row (newest-first list projection).
      properties:
        saleRef:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        syncStatus:
          $ref: "#/components/schemas/SyncStatusValue"
        sourceSystem:
          type: string
        externalId:
          type: string
        reasonCode:
          type: string
          description: Redacted machine label.
        retryCount:
          type: integer
          minimum: 0
        quarantinedAt:
          type: string
          format: date-time
    NeedsRepairPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      description: A keyset page of NEEDS_REPAIR items, newest-first.
      properties:
        items:
          type: array
          # Bounded to mirror the `page_size` maximum (200): the server returns
          # at most one page_size of items, so a conforming page can never carry
          # more than the upper page bound. Gives generated clients an explicit
          # cap rather than an unbounded array.
          maxItems: 200
          items:
            $ref: "#/components/schemas/NeedsRepairItem"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the last page.
    SaleAuditTimeline:
      type: object
      additionalProperties: false
      required: [saleRef, entries]
      description: >
        The read-only correlation/audit timeline for one sale (028 provenance).
        Entries are redacted at the emitter — no raw payload, no money, no PII.
      properties:
        saleRef:
          type: string
          format: uuid
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditTimelineEntry"
    AuditTimelineEntry:
      type: object
      additionalProperties: false
      required: [at, event]
      description: One redacted audit/correlation event in the sale's timeline.
      properties:
        at:
          type: string
          format: date-time
        event:
          type: string
          description: Stable machine event label (e.g. sale.captured, sync.failed, repair.requested).
        correlationId:
          type: [string, "null"]
          format: uuid

    # -----------------------------------------------------------------------
    # 1.3.0-draft (RT-1312 Phase 3(a)): quarantined sales
    # -----------------------------------------------------------------------
    QuarantineState:
      type: string
      enum: [open, captured, already-captured]
      description: >
        Set by Backend-Core only. `open`: waiting for a repair. `captured`: a
        repair captured the stored body as a new sale. `already-captured`: a
        repair found the sale already captured with the same facts. The same
        values as `QuarantineState` in `pos-sales/sale-quarantine.yaml`.
    QuarantineReasonKind:
      type: string
      enum: [refused, payload_divergence, cashier_claim_refused, held_previous_pairing]
      description: >
        The till's claim of why the sale is stuck, as uploaded
        (`pos-sales/sale-quarantine.yaml` `QuarantineReason.kind`). A claim,
        not a server finding: the repair outcome is authoritative.
    QuarantineRepair:
      type: object
      additionalProperties: false
      required: [at, outcome, httpStatus, errorCode]
      description: The latest repair attempt on an item.
      properties:
        at:
          type: string
          format: date-time
          description: Backend-Core server clock when the repair ran.
        outcome:
          type: string
          enum: [captured, already-captured, refused]
          description: >
            `captured`: a new sale. `already-captured`: the provenance was
            already captured with the same facts. `refused`: the capture
            rules refused the body again; the item stays `open`.
        httpStatus:
          type: [integer, "null"]
          minimum: 400
          maximum: 499
          description: The capture status of a `refused` outcome; null otherwise.
        errorCode:
          type: [string, "null"]
          maxLength: 64
          description: >
            The capture `error.code` of a `refused` outcome (a machine label,
            e.g. `sale_tender_mismatch`); null otherwise.
    QuarantinedSale:
      type: object
      additionalProperties: false
      required:
        - quarantineRef
        - storeId
        - deviceId
        - sourceSystem
        - externalId
        - reasonKind
        - tillHttpStatus
        - tillErrorCode
        - state
        - receivedAt
        - tillRecordedAt
        - previousTerminalId
        - repairCount
        - lastRepair
        - saleRef
      description: >
        Wire projection of one quarantine item. Carries no `tenant_id`
        (implicit in the session scope), no money, no line amounts and not
        the stored body.
      properties:
        quarantineRef:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
          description: The uploading device's store (the item's store).
        deviceId:
          type: string
          format: uuid
          description: The device that uploaded the item (`devices.id`).
        sourceSystem:
          type: string
        externalId:
          type: string
        reasonKind:
          $ref: "#/components/schemas/QuarantineReasonKind"
        tillHttpStatus:
          type: [integer, "null"]
          minimum: 400
          maximum: 499
          description: The capture status the till recorded; null when unknown or held.
        tillErrorCode:
          type: [string, "null"]
          maxLength: 64
          description: The capture `error.code` the till recorded; null when unknown or held.
        state:
          $ref: "#/components/schemas/QuarantineState"
        receivedAt:
          type: string
          format: date-time
          description: Backend-Core server clock at the first upload.
        tillRecordedAt:
          type: string
          format: date-time
          description: When the till dead-lettered or held the sale, by the till's clock (provenance only).
        previousTerminalId:
          type: [string, "null"]
          format: uuid
          description: Held items only, the earlier pairing's `devices.id`; null otherwise.
        repairCount:
          type: integer
          minimum: 0
          description: Number of repairs run on this item.
        lastRepair:
          description: The latest repair attempt; null before the first.
          anyOf:
            - $ref: "#/components/schemas/QuarantineRepair"
            - type: "null"
        saleRef:
          type: [string, "null"]
          format: uuid
          description: >
            The captured sale (`sales.id`) once the item is `captured` or
            `already-captured`; null while `open`. Readable with
            `consoleGetSaleSyncStatus`.
    QuarantinedSalePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      description: A keyset page of quarantined sales, newest-first.
      properties:
        items:
          type: array
          # Bounded to the `page_size` maximum (200), as NeedsRepairPage.
          maxItems: 200
          items:
            $ref: "#/components/schemas/QuarantinedSale"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the last page.

    # -----------------------------------------------------------------------
    # Canonical Error envelope (mirrors auth / outbox / pos-sales / console-sync-ops)
    # -----------------------------------------------------------------------
    Error:
      type: object
      required: [error]
      description: >
        Canonical error envelope, identical to the shared shape. Cross-tenant /
        out-of-scope refusals are non-disclosing (§II/§XII) — they never
        enumerate the underlying cause.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable summary. No sensitive data, no cause enumeration.
            request_id:
              type: string
              format: uuid
              description: Server-side correlation id; the actual cause is recorded server-side.

  responses:
    ValidationFailure:
      description: validation_error (400) — malformed query/path, unknown key (strict), bad cursor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >
        Unauthenticated (401) — missing/invalid session cookie, or a non-cookie
        credential (machine bearer / POS clerkJwt) rejected. Non-disclosing. 401
        semantics owned by 028 (G10).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Insufficient role (403) — authenticated but the operator lacks the
        required role. 403 semantics owned by 028 (G10).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenOrOriginRejected:
      description: >
        Insufficient role (403) — authenticated but the operator lacks the
        required role. 403 semantics owned by 028 (G10).
        Also `origin_rejected` (RT-430): the request is authenticated by the
        `dp2_session` cookie and its `Origin` header is missing, or is neither
        the API's own origin nor listed in `ALLOWED_ORIGINS`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >
        not_found (404) — the sale ref does not resolve within the operator's
        (tenant, store) scope. Non-disclosing: identical for cross-tenant,
        out-of-scope, and genuinely-absent ids (FR-102, SI-004, §II/§XII).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RepairConflict:
      description: >
        repair_conflict (409) — the targeted item is not in a repairable
        (open `failed-needs-repair`) state. Deterministic, no side effect. This
        is DISTINCT from the live provenance-conflict 409 on the POS terminal
        surface (F-3), which is NOT touched by this contract.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SystemFailure:
      description: system_failure (500) — unexpected server error; cause recorded server-side by request_id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >
        429 `rate_limited` (RT-574): the caller's per-user budget for this
        class of operation is spent. The body is the canonical error
        envelope with a non-disclosing message (no budget, class or window);
        its `request_id` equals the `X-Request-Id` response header. Honour
        `Retry-After`; never auto-retry a mutation. A 429 is not a 401: it
        never means the session ended. The console limit is
        server-configured and may not be enforced, so a client must handle a
        429 but must not expect one.
      headers:
        Retry-After:
          $ref: "#/components/headers/ConsoleRetryAfter"
        Cache-Control:
          description: Always `no-store` on a 429.
          required: true
          schema:
            type: string
            enum: [no-store]
        X-Request-Id:
          description: >
            The request id, equal to `error.request_id` in the body: the
            inbound `X-Request-Id` when it is a well-formed UUID, otherwise a
            server-minted one.
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  headers:
    ConsoleRetryAfter:
      description: >
        Whole seconds the caller should wait before retrying, sent on every
        console 429 (RT-574 D5). Its own bound, 1 to 3600; it is not the POS
        `RetryAfter` header.
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 3600
