openapi: 3.1.0
info:
  title: Data-Pulse-2 Tenants API
  version: "1.3.0-draft"
  description: >
    Tenant administration. Q1 default A: tenant *creation* is restricted to
    platform admins. Tenant-admins can read their own tenant and manage
    members within it.


    **1.1.0-draft (RT-620, additive).** Every cookieAuth operation may
    return 429 `rate_limited` (`TooManyRequests`, with `Retry-After`)
    from the console rate limit (RT-574, RT-619). No other wire change.


    **1.2.0-draft (RT-843, additive, GATED — owner-approved 2026-10-23).**
    `TenantSummary` (the `listTenants` row) gains `status`
    (`active | suspended | pending`, same enum as `Tenant.status`), so the
    platform tenant directory needs no per-row `readTenant`. Response-only
    and always emitted by the runtime; no request, path or status-code change.


    **1.3.0-draft (RT-1350 slice 6a, additive, GATED, owner delegation
    2026-11-13).** The platform tenant list shows each tenant's access state
    (RT-1353). `TenantSummary` gains three optional response properties,
    `access_state` (`restricted | unrestricted`), `unlock_requested_at` and
    `provisioned_at`, emitted **only to a platform admin** (a member's list is
    unchanged: a tenant reads its own state on
    `GET /api/v1/tenants/{tenant_id}/access-entitlement`). `listTenants` gains the
    optional `access_state` query filter, platform admins only (a non-platform
    caller gets 403 instead of a silently ignored filter; an unknown value is a
    400). A tenant with no stored state is `unrestricted` (the RT-1353 rule), so
    the filter `unrestricted` also returns tenants with no row.
servers:
  - url: https://api.example.com
paths:
  /api/v1/tenants:
    get:
      summary: List tenants the current user has access to (or all, if platform admin).
      operationId: listTenants
      parameters:
        - in: query
          name: access_state
          required: false
          description: >
            Platform admins only (RT-1350 slice 6a). Keeps the tenants whose access
            state (RT-1353) is the given one; `unrestricted` includes a tenant with no
            stored state.
          schema:
            type: string
            enum: [restricted, unrestricted]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantSummary"
        "400":
          description: >
            `validation_error`: `access_state` is not `restricted` or `unrestricted`.
            The body is the canonical envelope.
        "403":
          description: >
            `access_state` was sent by a caller who is not a platform admin. The
            body is the canonical envelope.
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      summary: Create a new tenant. Platform-admin only (Q1 default A).
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "403":
          description: >
            Caller is not a platform admin. Also `origin_rejected` (RT-430): the
            request is authenticated by the `dp2_session` cookie and its
            `Origin` header is missing, or is neither the API's own origin nor
            listed in `ALLOWED_ORIGINS`.
        "409":
          description: Slug conflict.
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/tenants/{tenant_id}:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a tenant the caller has access to.
      operationId: readTenant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found OR caller has no access. Same response (FR-ISO-4).
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      summary: Update tenant fields (name, status). Tenant-admin or platform-admin.
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "403":
          description: >
            `origin_rejected` (RT-430): the request is authenticated by the
            `dp2_session` cookie and its `Origin` header is missing, or is
            neither the API's own origin nor listed in `ALLOWED_ORIGINS`.
        "404":
          description: Not found / no access.
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      summary: Soft-delete the tenant. Platform-admin only.
      operationId: softDeleteTenant
      responses:
        "204":
          description: Soft-deleted; restorable within retention window (default 30 days).
        "403":
          description: >
            Caller is not a platform admin. Also `origin_rejected` (RT-430): the
            request is authenticated by the `dp2_session` cookie and its
            `Origin` header is missing, or is neither the API's own origin nor
            listed in `ALLOWED_ORIGINS`.
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/tenants/{tenant_id}/members:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List memberships in a tenant.
      operationId: listMembers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipDetail"
        "404":
          description: No access.
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  schemas:
    TenantSummary:
      type: object
      required: [status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, suspended, pending] }
        access_state:
          type: string
          enum: [restricted, unrestricted]
          description: >
            RT-1350 slice 6a. The tenant's access state (RT-1353); a tenant with no
            stored state is `unrestricted`. Emitted only on the platform admin's
            `listTenants`.
        unlock_requested_at:
          description: >
            RT-1350 slice 6a. When a platform admin requested the unlock; `null` if
            never. Emitted with `access_state`.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        provisioned_at:
          description: >
            RT-1350 slice 6a. When provisioning was recorded; `null` while restricted
            or never restricted. Emitted with `access_state`.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    Tenant:
      allOf:
        - $ref: "#/components/schemas/TenantSummary"
        - type: object
          properties:
            status: { type: string, enum: [active, suspended, pending] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            deleted_at: { type: [string, "null"], format: date-time }
    TenantCreate:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{1,62}[a-z0-9]$" }
        name: { type: string, minLength: 1 }
    TenantUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [active, suspended] }
    MembershipDetail:
      type: object
      properties:
        membership_id: { type: string, format: uuid }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: [string, "null"] }
        role_code: { type: string }
        store_access_kind: { type: string, enum: [all, specific] }
        accessible_store_ids:
          type: array
          items: { type: string, format: uuid }
        revoked_at: { type: [string, "null"], format: date-time }
    Error:
      description: The canonical error envelope (code, message, request_id).
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              format: uuid
  headers:
    ConsoleRetryAfter:
      description: >
        Whole seconds the caller should wait before retrying, sent on every
        console 429 (RT-574 D5). Its own bound, 1 to 3600; it is not the POS
        `RetryAfter` header.
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  responses:
    TooManyRequests:
      description: >
        429 `rate_limited` (RT-574): the caller's per-user budget for this
        class of operation is spent. The body is the canonical error
        envelope with a non-disclosing message (no budget, class or window);
        its `request_id` equals the `X-Request-Id` response header. Honour
        `Retry-After`; never auto-retry a mutation. A 429 is not a 401: it
        never means the session ended. The console limit is
        server-configured and may not be enforced, so a client must handle a
        429 but must not expect one.
      headers:
        Retry-After:
          $ref: "#/components/headers/ConsoleRetryAfter"
        Cache-Control:
          description: Always `no-store` on a 429.
          required: true
          schema:
            type: string
            enum: [no-store]
        X-Request-Id:
          description: >
            The request id, equal to `error.request_id` in the body: the
            inbound `X-Request-Id` when it is a well-formed UUID, otherwise a
            server-minted one.
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
security:
  - cookieAuth: []
