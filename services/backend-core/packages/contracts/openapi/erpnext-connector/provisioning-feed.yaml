openapi: 3.1.0
info:
  title: Backend-Core — ERP Provisioning Feed and Provisioner Credential API
  version: "1.2.0-draft"
  description: >
    Jira RT-1356 (Epic RT-1332; RT-1352 breakdown item PB-A). The contract
    between Backend-Core and the Connector's tenant provisioner: the feed the
    provisioner PULLS provisioning requests from, the step acknowledgements, the
    one-time issue of a tenant's connector credential, and the final outcome,
    plus the platform-admin routes that issue, rotate and revoke the
    provisioner's own credential. It is the shape that the provisioning
    migration (PB-B), the Backend-Core service (PB-C) and the Connector
    provisioner (PC-A) build against.


    **Posture.** `1.0.0-draft`. The operations in this file are served by
    Backend-Core since RT-1358 (RT-1352 PB-C): the provisioning service. The
    first deployment ships with the Connector provisioner (RT-1359) still to
    consume it. `[GATED: contract]`. Source: the
    owner-approved RT-1352 design (Confluence page 76152835, version 4),
    sections 4.3 to 4.7, 4.11 and 5, and the owner decisions OD-1 to OD-12
    (RT-1352 comment 16764). The owner waived the PV0 bench spike (RT-1355) for
    the contract slice on 2026-11-13; if PV0 contradicts a rule here, a
    follow-up contract change adjusts it. This file is additive: no existing
    operation changes, and the RT-1353 and RT-1350 contracts keep their
    shape (RT-1358 adds one error code to the RT-1353 mark-provisioned 409).


    **Direction (pull model).** The provisioner calls Backend-Core; Backend-Core
    never calls the ERP host. Status for the Platform Console is read from
    Backend-Core's own state, written by each acknowledgement; the Console never
    talks to the provisioner. The Console routes (status, retry, cancel,
    restart) are NOT here: they belong to RT-1333 item 6 with their own
    contract.


    **Principal.** The feed is authenticated by `connectorProvisionerBearer`, a
    NEW platform-scope machine credential that is tenant-independent. A new
    tenant's site has no credential yet, and the existing `connector` scope is
    tied to one tenant and one registration, so it cannot be used. One
    provisioner credential exists per ERP host. It is not a tenant credential
    and it cannot read or acknowledge any tenant's posting feed. Revoking it
    stops all provisioning (new sites, store provisioning, rotation) and no
    posting: posting uses the separate per-tenant credentials.


    **Request.** `provisioningRequestId` is the idempotency key of the request
    and is created by Backend-Core. There is at most one active
    `tenant.provision` request per tenant, and a second unlock returns the same
    request. The kinds are `tenant.provision`, `store.provision` and
    `credential.rotate`. `generation` increments only when an operator restarts
    a request after compensation. `siteName` is derived by Backend-Core from the
    tenant id (never from the slug or business name); the provisioner verifies
    it and fails the request as `conflict` if a site with that name belongs to
    another tenant. The template id and version are frozen into the request.


    **Status model (Backend-Core, per request).**

    `requested`, `claimed`, `site_created`, `erp_configured`,
    `connector_installed`, `credential_bound`, `verifying`, `succeeded`; and on
    the failure side `failed_retryable`, `failed_permanent`, `compensating`,
    `compensated`, `cancelled`. `succeeded` means: the site marker is present,
    one Company exists and `default_company` is set, the template version is
    applied, the Connector is installed with its exactly-once indexes, the
    credential is bound, the first heartbeat is healthy in Backend-Core, the
    compatibility status is OK, and every store that existed at request time
    has its warehouse and customer mapping acknowledged. The status is kept by
    Backend-Core and returned nowhere on this surface; the wire carries only
    `StepName` and `StepOutcome`. The recorded step is a display and audit
    trail, not the source of truth for what exists on the site: after a crash
    or a lost acknowledgement the provisioner re-reads the site and continues.
    Every step has a check (already done?) and an apply, so every
    acknowledgement is safe to repeat.


    **Lease.** The first acknowledgement (`claimed`) takes a time-limited lease of
    at least 15 minutes (the server sets it; the caller sends no duration);
    each NON-replayed progress acknowledgement renews it for the same length,
    and a replay of an acknowledgement (same `Idempotency-Key`) renews
    nothing. A provisioner checks the remaining lease before a long step (a
    site create takes up to about 110 seconds). One rule applies at every point
    of the lifecycle: when a lease expires, the request keeps its recorded
    status (`claimed`, `site_created`, `erp_configured`, `connector_installed`,
    `credential_bound` or `verifying`; the status is a display and audit trail,
    never the source of truth) and becomes re-offerable. Pull returns every
    non-terminal request that is `requested`, or that is in a later status with
    an expired lease, oldest first. The next provisioner to claim it takes a
    new lease, re-reads the site and continues from what exists there. A
    terminal request (`succeeded`, `failed_permanent`, `compensated`,
    `cancelled`) is never offered. A request under a retry backoff
    (`failed_retryable`, or a `capacity` hold) is offered only once its
    next-retry time has passed: the pulled item carries that time as `notBefore`
    while it is in the future, and pull does not return it until then. A call that depends on a lease the caller no
    longer holds is refused with `409 lease_lost` on the step acknowledgement
    and the outcome. Another provisioner's lease is never disclosed.


    **Error classes.** The step outcomes reuse the posting feed vocabulary
    (`failed_transient`, `permanently_rejected`) plus `conflict`, `capacity`,
    `compatibility` and `dependency`.
      - `failed_transient`: database unavailable, lock held, timeout, Backend-Core
        unreachable. Retry with backoff; after the cap the request becomes
        `failed_permanent` with an alert.
      - `permanently_rejected` (with a `reason`): unknown template version,
        unsupported country or currency, invalid request. Stop; an operator fixes
        the request and restarts it.
      - `conflict`: the site name exists with another tenant's marker, or a
        second Company is found on the site. Stop, never adopt, alert.
      - `capacity`: disk, memory or site-count ceiling reached. Hold, retry
        later, alert the operator.
      - `compatibility`: ERPNext or Frappe outside the supported line, or the
        compatibility profile reports CRITICAL. Stop.
      - `dependency`: Backend-Core refused the credential claim (registration
        disabled, tenant no longer eligible). Stop and compensate.
    Error detail on an acknowledgement is scrubbed by the provisioner: no
    secret, token, password or tenant business content is sent or logged.


    **Provisioned credential (constraints).** `connectorIssueProvisionedCredential`
    is the only way a managed tenant credential reaches a site.
      - It is LEASE-BOUND and MANAGED-ONLY: it succeeds only for a managed
        connector registration (`managed_by` = provisioner) whose request the
        calling provisioner currently holds a live lease on. Any other call (no
        live lease, a registration that is not managed, another provisioner's
        lease, an unknown request, or a request not in a state that allows
        issue) is the same non-disclosing `404 not_found`, with no side
        effects. On a `tenant.provision` request the provisioner reports that
        refusal as the `dependency` outcome; on a `credential.rotate` request it
        does not (see "Credential rotation" below).
      - It is AUDITED with the request id and the lease id, in the same
        transaction as the issue, like the other connector lifecycle actions.
      - The SECRET IS RETURNED ONCE, in the response body, with
        `Cache-Control: no-store`. It is never logged, never stored in
        Backend-Core in a recoverable form, and never kept in an idempotency
        store. The provisioner writes it in-process into the site's Connector
        Settings: never on a command line, in the environment, in logs or in a
        file.
      - On a `tenant.provision` request, a REPEAT for a credential that has
        never been presented (the registration is still `never_seen`) is a
        ROTATION: Backend-Core revokes the earlier credential and issues a new
        one in one transaction. That is safe because nothing could have used
        the lost one. This is the lost-response recovery: the provisioner first
        checks the site (a stored credential id means the step is done) and
        otherwise repeats the call. A repeat for a credential that HAS been
        presented is refused as the same `404`.
      - On a `credential.rotate` request (version 1.2.0-draft, RT-1362), the
        registration's current credential is in use, so the `never_seen` test
        above does not apply. The rule is OVERLAP (owner decision on RT-1362
        comment 19107, the RT-369 pattern; it amends the RT-1432 no-overlap
        decision):
          - The FIRST call under the live lease issues ONE PENDING credential
            for the registration, audited. The current credential is NOT
            revoked and keeps working: posting never pauses.
          - A REPEAT on the same request, while the pending credential has
            never been presented (Backend-Core has accepted no request
            authenticated with it), revokes that pending credential and
            issues a new pending one in one transaction. The current
            credential still keeps working. This is the lost-response and
            failed-write recovery, with no human step.
          - Backend-Core revokes the OLD credential server-side, in the same
            transaction that first accepts a request authenticated with the
            pending one; the pending credential becomes the current one and
            the request is done. A repeat after that is the same
            non-disclosing `404`.
        So a registration has at most TWO unrevoked credentials, and only
        while a rotation is open: the current one and at most one pending one
        (the one-unrevoked-credential index becomes at most one current plus
        one pending, RT-1362 S2, `[GATED: migration]`). A repeat cannot return
        the SAME secret, because the secret is never stored recoverably; it
        returns a fresh pending one. The call stays LEASE-BOUND (and, on this
        kind, CLAIM-BOUND: see "Claim fencing" below).
      - The expiry of a managed tenant credential is set by Backend-Core, not by
        the caller. This call takes no body.


    **Credential rotation (`credential.rotate`), version 1.2.0-draft.** Jira
    RT-1362 slice S1. Owner decisions on RT-1362: comment 19102 (approval),
    comment 19104 (adopted registrations are eligible) and comment 19107
    (OVERLAP, the RT-369 pattern; it amends the RT-1432 no-overlap decision,
    the "no-overlap unchanged" line of comment 19104, AC2 and the
    one-unrevoked-credential exclusion). A `credential.rotate` request is
    created by Backend-Core only: by its scheduler, 14 days before the managed
    credential's expiry, or by a platform admin through
    `platformRequestConnectorCredentialRotation` ("rotate now"), due
    immediately. At most one `credential.rotate` request is open per
    registration; a second trigger returns the open one. An open
    `store.provision` request does not block it.
      - **Which registrations.** A registration is eligible when it is managed
        (`managed_by` = provisioner), enabled, and bound to a site: either its
        `tenant.provision` request has `succeeded`, or it was adopted with
        `platformAdoptConnectorRegistration` (a hand-made registration, for
        example the lab one, whose site was never provisioned here). A managed
        registration that is neither (its `tenant.provision` request ended
        `failed_permanent`, `compensated` or `cancelled`, so no site was ever
        bound to it, and it was not adopted) gets none: "rotate now" refuses
        it with `409 site_not_bound` and the scheduler skips it.
      - **Which site.** Rotation keys on the registration's STORED SITE BINDING,
        never on `tenant.provision` fields. The request carries it as
        `erpnextSiteRef` (the registration's recorded ERP site reference),
        always present on `credential.rotate`; the provisioner locates the
        site by it. `siteName`, `template` and `locale` stay required on every
        request for compatibility with the pinned Connector, but on
        `credential.rotate` they are compatibility fields that the provisioner
        must never use to find or change the site: `siteName` is the
        tenant-derived name (the `siteName` rule, which can differ from the
        real site of an adopted registration), and `template` and `locale`
        are those of the registration's succeeded `tenant.provision` request,
        or, for an adopted registration, the deployment's current
        provisioning template and locale. The request also carries
        `connectorRegistrationId` and `environment`, no `legalName`, and
        `stores: []`; nothing on the site is re-provisioned. Making these
        fields optional per kind is a follow-up contract change that must land
        together with the Connector change (RT-1362 S3).
      - **Which host (routing).** Every `credential.rotate` request is routed to
        ONE ERP host label, so an adopted site is never worked by a
        provisioner on the wrong host: for a provisioned registration, the
        host that provisioned it (`provisioned_host_label` of its succeeded
        `tenant.provision` request), CONFIRMED from the start; for an adopted
        registration, the provisioner host recorded on the registration (a
        stored binding with a revision number, RT-1362 S2, `[GATED:
        migration]`). The adopt operation records none, so the first "rotate
        now" names it in its body (`hostLabel`). An adopted binding is
        PROVISIONAL until the first credential call of a rotation routed to
        it CONFIRMS it (the provisioner makes that call only after its site
        check on that host passed). While it is provisional, a platform admin
        may CORRECT it: a "rotate now" naming a different `hostLabel` together
        with the `expectedHostBindingRevision` it last saw replaces the
        binding, increments the revision, re-routes the open request and
        clears its lease, in one audited transaction
        (`connector.registration.provisioner_host_corrected`). A correction
        whose expected revision is not the current one is refused (`409
        host_binding_stale`), so a delayed retry can never undo a newer
        correction. Once confirmed, a different label is refused (`409
        host_mismatch`). A registration whose host cannot be resolved gets no
        request (`409 host_not_bound` on "rotate now"; the scheduler skips
        it). Pull offers a `credential.rotate` request ONLY to the provisioner
        principal whose credential's host label is the routed label; `claimed`
        and the credential call from any other host are the non-disclosing
        `404`.
      - **Claim fencing (lease id).** The lease holder is the host label, so
        two workers on the same host share a bearer. Every `200` step
        acknowledgement returns the claim's `leaseId`, new on each claim and
        unchanged on renewals. On a `credential.rotate` request:
          - the provisioner sends it back in the `Provisioning-Lease-Id` header
            on every later step acknowledgement, the credential call and the
            outcome, and Backend-Core compares it with the request's current
            lease under the request lock BEFORE any issue, revoke or state
            change; a missing or stale value is `409 lease_lost` on a step or
            the outcome and the non-disclosing `404` on the credential call,
            with no side effect;
          - a REPLAYED `claimed` acknowledgement (the same `Idempotency-Key`)
            is answered `409 lease_lost`, never the stored result, so two
            same-host workers that sent the same key cannot both hold one
            lease id; the original worker re-pulls, and the request is offered
            again when that lease expires.
        The header is optional in the schema and is not enforced on the other
        kinds, so `tenant.provision` and the pinned Connector are unchanged.
      - **Activation (compatibility gate).** A provisioner released before
        RT-1362 S3 skips every kind except `tenant.provision`. Backend-Core
        therefore creates `credential.rotate` requests (scheduler and "rotate
        now") only on a deployment where rotation is switched on, and it is
        switched on only after a provisioner that handles the kind is deployed
        on the ERP host. While it is off, the scheduler creates nothing and
        "rotate now" refuses with `409 rotation_unavailable`.
      - **One completion sequence.**
          1. `claimed` (keep the returned `leaseId`).
          2. SITE CHECK, before any credential is issued: the site named by
             `erpnextSiteRef` exists on this host and its Connector Settings
             already name `connectorRegistrationId`. A missing site or a
             mismatch is a `conflict` step outcome, then a `conflict` outcome;
             no credential call is made.
          3. The credential call (the `credential.rotate` rule above): a
             pending credential is issued, the current one keeps working.
          4. A FENCED write of the pending secret, its ids and its expiry into
             the PENDING SLOT of the site's Connector Settings (DUAL-SLOT
             STAGING, below), in one site transaction. It NEVER touches the
             CURRENT slot. It is a compare-and-set on the pending slot: it
             writes only if the pending slot is empty or holds a credential
             with an earlier `issuedAt` (`issuedAt` increases with every issue
             for the registration: the fencing token); a write whose
             `issuedAt` is older than the stored pending one is refused; a
             write of the credential already staged (same `credentialId` and
             `issuedAt`, for example a retry after a lost write response) is a
             no-op. The provisioner checks first that its lease has not
             expired. If a check fails it writes nothing, reports nothing and
             re-pulls: a newer worker owns the rotation.
          5. `credential_bound`.
          6. The Connector's next authenticated call uses the PENDING secret
             (ORDERING: the write completes before that call, because the
             Connector reads both slots from Connector Settings for each
             call). Backend-Core accepts it, promotes it to current, revokes
             the old credential in the same transaction and records
             `succeeded`; on that first successful call the Connector promotes
             PENDING to CURRENT locally.
          7. `verified`. The provisioner sends NO `succeeded` outcome for this
             kind (an adopted site cannot supply `ProvisioningResult`).
      - **Dual-slot staging (the Connector).** Connector Settings keep the
        CURRENT credential and at most one PENDING credential in separate
        slots. The Connector authenticates with PENDING when one is present.
        If a call with PENDING gets `401` (the pending credential was revoked
        by a newer repeat or by a failed rotation, or a superseded worker
        staged a stale one), the Connector falls back to CURRENT for that call
        and clears nothing; the next rotation step replaces the pending slot.
        On the first successful call with PENDING it promotes PENDING to
        CURRENT locally and empties the pending slot. So a lost write
        response, a failed rotation or a stale pending write never stops
        posting: CURRENT is only ever replaced by a pending credential that
        Backend-Core has just accepted. A call with the OLD current secret
        that reaches Backend-Core after the pending one was accepted gets the
        generic `401`; the Connector, which has by then promoted the pending
        one, retries with it (it never treats such a refusal as a lasting
        credential failure while its stored credentials changed). For this
        kind the status model's `succeeded` means only that the pending
        credential has been presented; no store map is acknowledged.
      - **No heartbeat completion.** The heartbeat-based completion of
        `connectorCompleteProvisioning` (`verifying` until the first
        heartbeat) applies to `tenant.provision` only: under overlap the
        CURRENT credential keeps heartbeating, so a heartbeat proves nothing
        about the pending one. On an open `credential.rotate` request a
        `succeeded` outcome is refused with `409 lease_lost` and changes
        nothing; only Backend-Core's acceptance of the pending credential
        completes the rotation.
      - **Late reports.** After `succeeded`, a step acknowledgement or a
        `succeeded` outcome carrying the request's FINAL lease id (the claim
        that was live when it succeeded) is answered `200`, recorded for the
        audit trail, and changes nothing; one carrying a SUPERSEDED or missing
        lease id is `409 lease_lost`; the credential call is the `404` above.
        On this kind neither refusal is a `dependency` failure: the
        provisioner stops and re-pulls. A request missing from a pull is not
        proof of completion; only Backend-Core's acceptance of the new
        credential completes a rotation.
      - **Failure.** Because the current credential stays valid throughout, a
        rotation that fails never interrupts posting. The usual retry rules
        and terminal outcomes apply (the transient retry cap, then
        `failed_permanent`; or a `permanently_rejected` or `conflict`
        outcome). When a `credential.rotate` request ends in any terminal
        state other than `succeeded`, Backend-Core revokes its pending
        credential (if any) in the same transaction, the current credential
        stays the only unrevoked one, and an alert fires. The scheduler
        creates a new request on its next pass while the current credential
        is inside the 14-day window (the 7-day alert, RT-1362 S4, covers a
        rotation still not done). There is nothing to compensate.
    The runtime of this section is RT-1362 slice S2 (Backend-Core) and S3 (the
    provisioner handler): until both ship and rotation is switched on,
    Backend-Core creates no `credential.rotate` request, so the rotation branch
    of the credential call cannot be reached, and the "rotate now" operation is
    contract only. `tenant.provision` behaviour is unchanged.


    **Provisioner credential routes (platform admin, session only).** Three
    operations let a platform admin issue, rotate and revoke the provisioner
    credential, one per ERP host (decision OD-12; no Console UI in this slice).
    The credential is short-lived: Backend-Core sets its expiry, which is at
    most 30 days from issue or rotation, and every issue and rotate response
    carries `expiresAt`; the caller sends no expiry. The secret is returned once
    with `Cache-Control: no-store` and is never logged. Every call is audited
    with the acting platform admin, the host label, the credential id and the
    request id, and the secret never appears in an audit row or a log. There is
    one live credential per host label and no list route, so rotate and revoke
    are addressed by `hostLabel`; the responses still return `credentialId` for
    audit correlation. A second issue for a host label that already has a live
    credential is `409 conflict`: rotate it instead. Rotate and revoke for a
    host label with no live credential are `404 not_found`, except that a
    repeat revoke of an already revoked or expired credential is a `200` with
    `alreadyRevoked: true` (404 only for a label that never had one). Revoking
    stops provisioning and never posting.


    **Adopt an existing registration (platform admin, session only).** Version
    1.1.0-draft (Jira RT-1557, RT-1433 slice S1) adds one additive operation,
    `platformAdoptConnectorRegistration`: it sets `managed_by` = `provisioner`
    on ONE existing connector registration, so a registration that was made by
    hand (the lab registration) can be managed by the provisioner without
    re-provisioning its site. The tenant is in the path because the registration
    table is tenant-scoped and a platform admin acts on any tenant. It is
    dormant: nothing calls it until the provisioner's rotation (RT-1360,
    RT-1362) is live, and running it on a live registration is an owner step,
    because adoption alone only stops tenant admins from rotating, revoking or
    disabling that registration by hand. It never issues, rotates or revokes a
    credential and never touches the site. It is reversible by setting
    `managed_by` back to NULL; there is no un-adopt operation. No existing
    operation changes.


    **Rotate now (platform admin, session only).** Version 1.2.0-draft (Jira
    RT-1362 S1) adds `platformRequestConnectorCredentialRotation`: it creates
    the `credential.rotate` request of ONE managed registration, due
    immediately, so the emergency path is the normal path and nobody handles
    a secret (RT-1432 D2, amended). It never issues, rotates or revokes a
    credential itself, returns no secret and never contacts the site: the
    provisioner does the rotation through the credential call. It is
    `x-runtime-status: contract-only` until RT-1362 S2.


    **Auth and scope.** The platform routes accept the HUMAN `cookieAuth`
    session only (`SessionOnlyAdminGuard`): a bearer-only request is `401`; a
    cookie write without a trusted `Origin` is `403 origin_rejected` (RT-430); a
    caller who is not a platform admin (`users.is_platform_admin`) is `403
    forbidden`. The four feed operations accept `connectorProvisionerBearer`
    only; a tenant `connector` bearer, a cookie session and a device credential
    are refused with the generic `401`.


    Response bodies are explicit projections, never database rows (§IV). They
    carry no password, no database credential and no site Administrator
    credential: the Administrator password is generated on the site, never
    stored and never sent here (decision OD-9).


    **Fiscal posture.** The outcome reports `fiscalReadiness: not_assessed`.
    The template creates an accounting structure only (no tax templates, no
    regional compliance app, no e-invoice setup), so no screen may claim that
    a tenant is fiscally ready (Fiscal decisions 1248 to 1270).


    **Notes for implementers (wording only).** The status model above has a
    `verifying` state while `StepName` names the step `verified`: the step
    acknowledgement `verified` / `done` moves the request from `verifying` to
    the outcome call. `compatibility` and `dependency` exist as step outcomes
    only; the terminal `ProvisioningOutcome.outcome` is `succeeded`,
    `permanently_rejected` or `conflict`, and a `compatibility` or
    `dependency` step outcome is followed by a terminal
    `permanently_rejected` outcome whose `reason` names it.

servers:
  - url: https://api.example.com

tags:
  - name: erpnext-provisioning
    description: >
      ERP provisioning feed (pull), step acknowledgement, one-time credential
      issue and outcome, authenticated by the provisioner bearer.
  - name: erpnext-provisioner-credential
    description: >
      Platform-admin issue, rotate and revoke of the provisioner credential, one
      per ERP host.
  - name: erpnext-registration-adoption
    description: >
      Platform-admin adoption of one existing connector registration as
      provisioner-managed.
  - name: erpnext-credential-rotation
    description: >
      Platform-admin "rotate now": a `credential.rotate` request for one managed
      connector registration, due immediately.

paths:
  /api/connector/v1/erpnext/provisioning/requests:
    get:
      summary: Pull provisioning requests that need a provisioner.
      operationId: connectorPullProvisioningRequests
      tags: [erpnext-provisioning]
      security:
        - connectorProvisionerBearer: []
      description: >
        Returns the non-terminal requests that are `requested`, or in a later
        status with an expired lease (the lease rule in the file description),
        oldest first, after the supplied opaque `cursor`. Re-requesting the
        same cursor yields the same logical set (idempotent replay). Pulling
        does not take a lease: the lease is taken by the first acknowledgement
        (`claimed`), for at least 15 minutes. Backend-Core holds back new
        `tenant.provision` requests while the host label already provisioned 20
        sites (the per-bench ceiling, decision OD-10); the provisioner's own
        queue-depth check is reported as the `capacity` outcome. A request whose lease is live for another provisioner is
        not returned. A `credential.rotate` request is returned only to the
        provisioner of its routed host label (see "Credential rotation"). Scope is the provisioner principal only, which is
        tenant-independent; query scope is never trusted. A cursor that cannot
        be served is a `400 validation_error`; the provisioner re-pulls from the
        start (omit `cursor`), which is safe because acknowledgements are
        idempotent.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: >
            A page of provisioning requests, oldest first, with the advanced
            opaque cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningRequestPage"
              examples:
                tenantProvision:
                  summary: One new-tenant request.
                  value:
                    items:
                      - provisioningRequestId: "7b0f3c1e-3f1a-4a52-9c1c-0a8f6d2f6a11"
                        kind: tenant.provision
                        tenantId: "0b9a3f0e-6c5d-4e2a-8d52-3a6f1b9c7d10"
                        generation: 1
                        siteName: "t0b9a3f0e6c5d4e2a8d52-pilot"
                        template:
                          templateId: egypt-retail
                          templateVersion: 1
                        locale:
                          country: EG
                          currency: EGP
                          timezone: Africa/Cairo
                          language: ar
                        legalName: "Example Trading Co"
                        connectorRegistrationId: "3d2c7f60-91a4-4c0b-9f3e-6f1c2a8b4e55"
                        environment: pilot
                        attemptFloor: 0
                        stores: []
                    cursor: "opaque-cursor-1"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/FeedUnauthorized"
        "403":
          $ref: "#/components/responses/FeedForbidden"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/connector/v1/erpnext/provisioning/requests/{requestId}/steps:
    post:
      summary: Acknowledge one provisioning step, taking or renewing the lease.
      operationId: connectorAckProvisioningStep
      x-idempotency: required
      tags: [erpnext-provisioning]
      security:
        - connectorProvisionerBearer: []
      description: >
        Reports the outcome of one step of one request. The first call for a
        request is the `claimed` step with outcome `done`, which takes the
        lease of at least 15 minutes; every later call that is not a replay
        renews it for the same length and returns the new `leaseExpiresAt`. Backend-Core records the step for the Console and the
        audit trail (`erp.provisioning.*`) and moves the request's status; the
        provisioner remains the source of truth for what exists on the site.

        Idempotency: the `Idempotency-Key` header is REQUIRED and has the form
        `{requestId}:{step}:{attempt}`. A replay of the same key with the same
        body returns the stored result with `Idempotent-Replayed: true` and
        changes nothing. The same key with a different `outcome` is `409
        idempotency_key_conflict`. `attempt` is monotonic per request and step
        across claims, leases and operator restarts: a re-claim after a lost
        lease (the `claimed` step included) and every step re-run on a new
        generation sends an `attempt` greater than any it sent before for that
        request and step, so a genuine retry never collides with a stored
        result. Only a lost-response retry of the same attempt reuses a key. A
        fresh provisioner learns the floor from `attemptFloor` on the pulled
        request: the next `attempt` must be greater than it.

        A step outcome other than `done` carries an `errorClass` (equal to the
        outcome) and, for `permanently_rejected`, a `reason`. Backend-Core
        applies the handling of each class (see the file description): it
        schedules a retry with backoff for `failed_transient` (at most three
        transient retries per step, then `failed_permanent` with an alert),
        holds for `capacity` (the request is kept and offered again 15 minutes
        later, never failed and never counted against the retry cap), and stops
        for the others. A caller who does not
        hold a live lease on the request gets `409 lease_lost`, except for the
        `claimed` step on a request that is `requested` or whose lease has
        expired, which takes a new lease, and except for a late report with the
        FINAL lease id on a `credential.rotate` request that is already
        `succeeded` (see "Credential rotation" in the file description: `200`,
        changes nothing). On `credential.rotate`, a replayed `claimed` is
        `409 lease_lost` and later calls need `Provisioning-Lease-Id`. `detail` is scrubbed by the caller and is stored for the audit
        trail only.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ProvisioningLeaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepAck"
            examples:
              claimed:
                summary: Claim a request (takes the lease).
                value:
                  step: claimed
                  outcome: done
                  attempt: 1
              siteCreated:
                summary: The site exists and carries this tenant's marker.
                value:
                  step: site_created
                  outcome: done
                  attempt: 1
              capacityHold:
                summary: The per-bench site ceiling is reached.
                value:
                  step: site_created
                  outcome: capacity
                  attempt: 1
                  errorClass: capacity
                  detail: "site-count ceiling reached"
      responses:
        "200":
          description: >
            The step was recorded, or it is an idempotent replay
            (`Idempotent-Replayed: true`). Returns the lease expiry.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepAckResult"
              examples:
                renewed:
                  value:
                    requestId: "7b0f3c1e-3f1a-4a52-9c1c-0a8f6d2f6a11"
                    step: site_created
                    leaseExpiresAt: "2026-11-14T10:20:00Z"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/FeedUnauthorized"
        "403":
          $ref: "#/components/responses/FeedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FeedConflict"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/connector/v1/erpnext/provisioning/requests/{requestId}/credential:
    post:
      summary: Issue the tenant connector credential once, lease-bound.
      operationId: connectorIssueProvisionedCredential
      tags: [erpnext-provisioning]
      security:
        - connectorProvisionerBearer: []
      description: >
        Issues the connector credential of the managed registration named by the
        request, for the provisioner to write into the site's Connector
        Settings. This is the most powerful call of the surface, so it is
        constrained (see "Provisioned credential" in the file description):
        LEASE-BOUND to the calling provisioner's live lease on `{requestId}`,
        MANAGED-ONLY, AUDITED with the request id and lease id in the same
        transaction, and the SECRET IS RETURNED ONCE with `Cache-Control:
        no-store`; it is never logged or stored recoverably.

        On a `tenant.provision` request, a REPEAT call for a credential that has
        never been presented (the registration is still `never_seen`) is a
        ROTATION: the earlier credential is revoked and a new one issued in one
        transaction; a repeat after the credential has been presented is
        refused.

        On a `credential.rotate` request (1.2.0-draft, RT-1362, OVERLAP per
        RT-1362 comment 19107), the first call issues one PENDING credential
        and leaves the current one valid; a repeat, while the pending
        credential has never been presented, revokes it and issues a new
        pending one (the lost-response and failed-write recovery), the
        current one still valid; Backend-Core revokes the OLD credential
        server-side in the same transaction that first accepts a request
        authenticated with the pending one, and a repeat after that is the
        same `404`. A registration has at most two unrevoked credentials, and
        only while a rotation is open. The call also requires the claim's
        `Provisioning-Lease-Id` on this kind. The response is always
        `rotated: true`. The rotation branch is served from RT-1362 slice S2;
        until then no `credential.rotate` request exists, so it cannot be
        reached.

        Any call that is not for a managed registration under the caller's live
        lease is the same non-disclosing `404`, with no side effects. The call
        takes no request body and no `Idempotency-Key`: its repeat rule is the
        per-kind rule above, because an idempotent replay would have to store
        the secret.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ProvisioningLeaseId"
      responses:
        "201":
          description: >
            The credential was issued, or rotated (a repeat for a
            never-presented credential, or any call on a `credential.rotate`
            request, which issues a pending credential and revokes nothing
            but an earlier pending one). The secret is in this response only.
          headers:
            Cache-Control:
              description: Always `no-store`; the body holds a secret.
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedProvisionedCredential"
              examples:
                issued:
                  value:
                    credentialId: "9a4e1d2b-7c3f-4b86-8e0a-5d1f3c7a9b22"
                    registrationId: "3d2c7f60-91a4-4c0b-9f3e-6f1c2a8b4e55"
                    secret: "example-secret-shown-once-not-a-real-credential"
                    issuedAt: "2026-11-14T10:00:00Z"
                    expiresAt: "2027-11-14T10:00:00Z"
                    rotated: false
        "401":
          $ref: "#/components/responses/FeedUnauthorized"
        "403":
          $ref: "#/components/responses/FeedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/connector/v1/erpnext/provisioning/requests/{requestId}/outcome:
    post:
      summary: Report the final outcome of a provisioning request.
      operationId: connectorCompleteProvisioning
      x-idempotency: required
      tags: [erpnext-provisioning]
      security:
        - connectorProvisionerBearer: []
      description: >
        Reports the terminal outcome. `succeeded` carries `result`: the site,
        company and template version, the versions found, `fiscalReadiness:
        not_assessed`, and per store the `warehouseRef` and `customerRef`
        Backend-Core records (for stores that existed at request time). A
        `permanently_rejected` or `conflict` outcome carries a `reason`.
        Backend-Core, not the provisioner, decides when a request is `succeeded`.
        On a `tenant.provision` request (and `store.provision`), the
        provisioner's `verified` step checks the site only, so Backend-Core
        accepts the outcome (200) and keeps the request `verifying` until the
        first heartbeat of the managed registration arrives, then records
        `succeeded`. That heartbeat path does NOT apply to `credential.rotate`
        (the current credential keeps heartbeating under overlap): there a
        `succeeded` outcome on an open request is refused with `409
        lease_lost` and changes nothing, and the request succeeds only when
        Backend-Core first accepts the pending credential (see "Credential
        rotation" in the file description); with no heartbeat within the timeout (30 minutes by
        default) the request fails with an alert. Backend-Core also decides
        what `succeeded` does to the tenant's access state; the outcome never
        lifts a restriction by itself on this contract (a platform admin does
        it with the RT-1353 mark-provisioned action until the per-store gate,
        RT-1361, is on `main`).

        Requires the caller's live lease on `{requestId}`; otherwise `409
        lease_lost`, except for a late `succeeded` outcome with the FINAL lease
        id on a `credential.rotate` request that is already `succeeded` (see
        "Credential rotation" in the file description: `200`, changes
        nothing). The `Idempotency-Key` header is REQUIRED (`{requestId}:outcome:{attempt}`
        form is recommended; the shared 16 to 128 printable ASCII rule applies):
        the same key and body replay the stored result with
        `Idempotent-Replayed: true`; a different outcome under the same key is
        `409 idempotency_key_conflict`. A repeat of the same logical outcome is
        an idempotent 200.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ProvisioningLeaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisioningOutcome"
            examples:
              succeeded:
                value:
                  outcome: succeeded
                  result:
                    siteName: "t0b9a3f0e6c5d4e2a8d52-pilot"
                    companyRef: "Example Trading Co"
                    templateVersion: 1
                    erpnextVersion: "16.51.0"
                    frappeVersion: "16.52.0"
                    connectorVersion: "1.0.0"
                    fiscalReadiness: not_assessed
                    stores:
                      - storeId: "5f1e2a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b"
                        warehouseRef: "Main Store - RT"
                        customerRef: "Retail Walk-in"
              conflict:
                value:
                  outcome: conflict
                  reason: "site name exists with another tenant marker"
      responses:
        "200":
          description: >
            The outcome was recorded, or it is an idempotent replay
            (`Idempotent-Replayed: true`).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordedProvisioningOutcome"
              examples:
                recorded:
                  value:
                    requestId: "7b0f3c1e-3f1a-4a52-9c1c-0a8f6d2f6a11"
                    outcome: succeeded
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/FeedUnauthorized"
        "403":
          $ref: "#/components/responses/FeedForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FeedConflict"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/platform/erp-provisioner-credentials:
    post:
      summary: Issue the provisioner credential for one ERP host (platform admin).
      operationId: platformIssueProvisionerCredential
      tags: [erpnext-provisioner-credential]
      security:
        - cookieAuth: []
      description: >
        Issues the platform-scope provisioner credential for the ERP host named
        by `hostLabel`. At most one live credential exists per host label: a
        second issue for a label that already has one is `409 conflict` (rotate
        it instead). The secret is returned ONCE with `Cache-Control: no-store`
        and is never logged or stored recoverably. Its expiry is set by
        Backend-Core, is at most 30 days from issue, and is returned as
        `expiresAt`. The owner puts the secret into the host's secret store; it
        is never placed in an image, an environment, a log or a command line.
        Audited, in the same transaction, with the acting platform admin, the
        host label, the credential id and the request id; the secret never
        appears in audit or logs. A platform admin only
        (`users.is_platform_admin`), session only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueProvisionerCredentialRequest"
            examples:
              lab:
                value:
                  hostLabel: lab-03
      responses:
        "201":
          description: The credential was issued. The secret is in this response only.
          headers:
            Cache-Control:
              description: Always `no-store`; the body holds a secret.
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedProvisionerCredential"
              examples:
                issued:
                  value:
                    credentialId: "c1a2b3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
                    hostLabel: lab-03
                    secret: "example-secret-shown-once-not-a-real-credential"
                    issuedAt: "2026-11-14T09:00:00Z"
                    expiresAt: "2026-12-14T09:00:00Z"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/PlatformUnauthorized"
        "403":
          $ref: "#/components/responses/PlatformForbidden"
        "409":
          $ref: "#/components/responses/PlatformConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/platform/erp-provisioner-credentials/{hostLabel}/rotate:
    post:
      summary: Rotate the provisioner credential (platform admin).
      operationId: platformRotateProvisionerCredential
      tags: [erpnext-provisioner-credential]
      security:
        - cookieAuth: []
      description: >
        Atomically revokes the live credential of `{hostLabel}` and issues a new
        one for the same host, in one transaction: the old secret is revoked
        when the new one is issued. The new secret is returned ONCE with
        `Cache-Control: no-store`; its expiry is set by Backend-Core, is at most
        30 days from rotation, and is returned as `expiresAt`. If the response
        is lost, the admin rotates again. Rotation replaces the stored secret
        on the host and restarts the provisioner process. A host label with no
        live credential (never issued, revoked or expired) is `404 not_found`;
        issue a new credential instead. Every call is audited with the acting
        platform admin, the host label, the new and the revoked credential id
        and the request id; the secret never appears in audit or logs. A
        platform admin only, session only.
      parameters:
        - $ref: "#/components/parameters/HostLabel"
      responses:
        "201":
          description: The new credential was issued. The secret is in this response only.
          headers:
            Cache-Control:
              description: Always `no-store`; the body holds a secret.
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedProvisionerCredential"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/PlatformUnauthorized"
        "403":
          $ref: "#/components/responses/PlatformForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/platform/erp-provisioner-credentials/{hostLabel}/revoke:
    post:
      summary: Revoke the provisioner credential (platform admin).
      operationId: platformRevokeProvisionerCredential
      tags: [erpnext-provisioner-credential]
      security:
        - cookieAuth: []
      description: >
        Revokes the live credential of `{hostLabel}`. Revocation STOPS
        PROVISIONING (new sites, store provisioning, rotation) and NEVER
        POSTING: tenant connector credentials are separate, so existing tenants
        keep selling. Requests under a lease held through this credential become
        re-offered when the lease expires. Retry-safe: if the host label's most
        recent credential is already revoked or expired (for example a retry
        after a lost response), the call returns `200` with the same body and
        `alreadyRevoked: true`, and the repeat is audited as a no-op. `404
        not_found` only when the host label never had a credential. The first
        revoke is audited with the acting platform admin, the host label, the
        credential id and the request id; no secret is involved. A platform
        admin only, session only. No request body.
      parameters:
        - $ref: "#/components/parameters/HostLabel"
      responses:
        "200":
          description: The credential is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedProvisionerCredential"
              examples:
                revoked:
                  value:
                    credentialId: "c1a2b3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
                    hostLabel: lab-03
                    revokedAt: "2026-11-20T08:00:00Z"
                    alreadyRevoked: false
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/PlatformUnauthorized"
        "403":
          $ref: "#/components/responses/PlatformForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/platform/tenants/{tenant_id}/connector-instances/{id}/adopt:
    post:
      summary: Adopt an existing connector registration as provisioner-managed (platform admin).
      operationId: platformAdoptConnectorRegistration
      tags: [erpnext-registration-adoption]
      security:
        - cookieAuth: []
      description: >
        Sets `managed_by` = `provisioner` on the connector registration `{id}` of
        tenant `{tenant_id}`, in one transaction that locks the row, decides,
        writes and records one audit row `connector.registration.adopted`
        (acting platform admin, tenant, registration id and the request id; ids
        and labels only, no secret). The tenant is in the path because the
        registration is tenant-scoped; a registration that does not belong to
        `{tenant_id}`, and a tenant that does not exist, are the same
        non-disclosing `404 not_found`.
          - A registration that is not managed (`managed_by` is null) and is not
            disabled becomes managed: `200` with `outcome: adopted`.
          - A repeat by the SAME platform admin for a registration this
            operation already adopted changes nothing and writes no second
            audit row: `200` with `outcome: already_adopted`.
          - A disabled registration is refused: `409 registration_disabled`.
          - A registration that is already managed, and was not adopted by this
            caller through this operation (it was provisioned, or another admin
            adopted it), is refused: `409 already_managed`.
        Refusals change nothing. After adoption, an owner or tenant admin can no
        longer rotate, revoke, re-issue or disable the registration (the same
        non-disclosing `404` as for any managed registration); a platform admin
        still can. The operation never issues, rotates or revokes a credential
        and never contacts the ERP site. A platform admin only
        (`users.is_platform_admin`), session only. No request body.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ConnectorInstanceId"
      responses:
        "200":
          description: >
            The registration is managed by the provisioner (adopted now, or a
            repeat by the same admin).
          headers:
            Cache-Control:
              description: Always `no-store`.
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptedConnectorRegistration"
              examples:
                adopted:
                  value:
                    outcome: adopted
                    tenantId: "0a000000-0000-7000-8000-0000000000a1"
                    instanceId: "01a145d4-b23d-7009-98f6-c31c61fa62ff"
                    managedBy: provisioner
                    environment: pilot
                    erpnextSiteRef: lab.localhost
                alreadyAdopted:
                  value:
                    outcome: already_adopted
                    tenantId: "0a000000-0000-7000-8000-0000000000a1"
                    instanceId: "01a145d4-b23d-7009-98f6-c31c61fa62ff"
                    managedBy: provisioner
                    environment: pilot
                    erpnextSiteRef: lab.localhost
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/PlatformUnauthorized"
        "403":
          $ref: "#/components/responses/PlatformForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AdoptRefused"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/platform/tenants/{tenant_id}/connector-instances/{id}/rotate-now:
    post:
      summary: Request an immediate credential rotation of a managed connector registration (platform admin).
      operationId: platformRequestConnectorCredentialRotation
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1362 S1: contract only. No route is registered until the RT-1362 S2
        runtime (request creation with per-registration idempotency, the
        14-day scheduler, this endpoint with its audit and refusals, and the
        rotation branch of `connectorIssueProvisionedCredential`). Rotation is
        switched on per deployment only after the RT-1362 S3 provisioner
        handler is deployed.
      tags: [erpnext-credential-rotation]
      security:
        - cookieAuth: []
      description: >
        Creates the `credential.rotate` request of the connector registration
        `{id}` of tenant `{tenant_id}`, due immediately (RT-1432 D2, amended).
        The provisioner then delivers the new secret to the site in-process,
        exactly as for a scheduled rotation (see "Credential rotation" in the
        file description). In one transaction that locks the registration
        row, the call decides, writes the request and records one audit row
        `connector.credential.rotation_requested` (acting platform admin,
        tenant, registration id, the `provisioningRequestId` and the request
        id; ids only, no secret). The tenant is in the path because the
        registration is tenant-scoped; a registration that does not belong to
        `{tenant_id}`, and a tenant that does not exist, are the same
        non-disclosing `404 not_found`. The checks run in this order, and the
        first that applies decides:
          0. While rotation is not switched on for this deployment (no
             provisioner that handles `credential.rotate` is deployed; see
             "Credential rotation" in the file description), every call is
             refused: `409 rotation_unavailable`.
          1. A registration that is not managed (`managed_by` is null) is
             refused: `409 not_managed`. No credential of a non-managed
             registration is ever rotated by the provisioner.
          2. A disabled registration is refused: `409 registration_disabled`.
          3. A registration whose `tenant.provision` request is still open is
             refused: `409 provisioning_in_progress` (that request issues the
             credential).
          4. A managed registration that is not bound to a site (its
             `tenant.provision` request ended `failed_permanent`,
             `compensated` or `cancelled` and it was not adopted) is refused:
             `409 site_not_bound`. An ADOPTED registration is eligible, like a
             provisioned one (owner decision, RT-1362 comment 19104; see
             "Credential rotation" in the file description).
          5. Host routing ("Which host" in the file description).
             - No resolved host and no body `hostLabel` (an adopted
               registration rotated for the first time): `409
               host_not_bound`.
             - A body `hostLabel` on an adopted registration with no recorded
               host is recorded on it, in the same transaction, as its
               PROVISIONAL provisioner host (revision 1).
             - A body `hostLabel` equal to the current binding changes
               nothing.
             - A body `hostLabel` that differs from a PROVISIONAL adopted
               binding, sent with `expectedHostBindingRevision` equal to the
               binding's current revision, CORRECTS it (audited
               `connector.registration.provisioner_host_corrected`: acting
               platform admin, old and new label, old and new revision,
               registration id, request id): the binding is replaced, its
               revision increments, and an open `credential.rotate` request is
               re-routed to the new label with its lease cleared, in the same
               transaction. The call then continues with step 6 (usually `200
               already_open`, returning the re-routed request).
             - The same, with `expectedHostBindingRevision` missing or not the
               current revision (for example a delayed retry of an older
               correction): `409 host_binding_stale`; nothing changes.
             - A body `hostLabel` that differs from a CONFIRMED host (a
               provisioned registration's host, or an adopted binding that a
               credential call has confirmed): `409 host_mismatch`.
             The response always names the routed `hostLabel`, whether its
             binding is `provisional` or `confirmed`, and its
             `hostBindingRevision`.
          6. While a `credential.rotate` request of the registration is open
             (not `succeeded`, `failed_permanent`, `compensated` or
             `cancelled`), whoever or whatever created it (this operation,
             another admin, or the 14-day scheduler), the call creates
             nothing, writes no second audit row and returns the OPEN request:
             `200` with `outcome: already_open`.
          7. Otherwise a request is created, routed to the resolved host: `201`
             with `outcome: requested` and `trigger: forced`.
        A lost response is recovered by calling again, which returns the open
        request. If that rotation already finished before the retry, the retry
        starts a new rotation (`201`); this is accepted, because under overlap
        a rotation never pauses posting and is safe to repeat, and the call
        takes no `Idempotency-Key`.
        Refusals change nothing and write no request. The call never issues,
        rotates or revokes a credential itself, returns no secret and never
        contacts the ERP site: the current credential keeps working until the
        site first uses the new one (overlap). An expired credential can be
        rotated this way. A platform admin only
        (`users.is_platform_admin`), session only; a tenant owner or admin is
        `403 forbidden`. The request body is optional and carries only
        `hostLabel` and `expectedHostBindingRevision` (step 5).
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ConnectorInstanceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestConnectorCredentialRotation"
            examples:
              adoptedFirstRotation:
                summary: First rotation of an adopted registration names its provisioner host.
                value:
                  hostLabel: lab-03
              correctProvisionalHost:
                summary: Correct a provisional binding, naming the revision last seen.
                value:
                  hostLabel: lab-04
                  expectedHostBindingRevision: 1
      responses:
        "201":
          description: A `credential.rotate` request was created, due immediately.
          headers:
            Cache-Control:
              description: Always `no-store`.
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorRotationRequest"
              examples:
                requested:
                  value:
                    outcome: requested
                    provisioningRequestId: "0c3e5a7b-9d1f-4e2a-8b6c-1d3f5a7b9c0e"
                    kind: credential.rotate
                    trigger: forced
                    tenantId: "0a000000-0000-7000-8000-0000000000a1"
                    instanceId: "01a145d4-b23d-7009-98f6-c31c61fa62ff"
                    requestedAt: "2026-11-27T10:00:00Z"
                    hostLabel: lab-03
                    hostBinding: provisional
                    hostBindingRevision: 1
        "200":
          description: >
            A `credential.rotate` request of this registration is already open;
            it is returned and nothing changed.
          headers:
            Cache-Control:
              description: Always `no-store`.
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorRotationRequest"
              examples:
                alreadyOpen:
                  value:
                    outcome: already_open
                    provisioningRequestId: "0c3e5a7b-9d1f-4e2a-8b6c-1d3f5a7b9c0e"
                    kind: credential.rotate
                    trigger: scheduled
                    tenantId: "0a000000-0000-7000-8000-0000000000a1"
                    instanceId: "01a145d4-b23d-7009-98f6-c31c61fa62ff"
                    requestedAt: "2026-11-20T02:00:00Z"
                    hostLabel: bench-01
                    hostBinding: confirmed
                    hostBindingRevision: 1
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/PlatformUnauthorized"
        "403":
          $ref: "#/components/responses/PlatformForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RotationRefused"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

components:
  securitySchemes:
    connectorProvisionerBearer:
      type: http
      scheme: bearer
      description: >
        OPAQUE, REVOCABLE machine bearer presented as `Authorization: Bearer
        <token>`: the platform-scope provisioner credential, tenant-independent,
        one per ERP host, short-lived, issued and rotated by a platform admin
        (`platformIssueProvisionerCredential`). It is NOT a tenant `connector`
        credential, NOT a device credential and NOT a human cookie session, and
        it cannot read or acknowledge any tenant's posting feed. The feed
        operations accept no other scheme. Verified at the API edge and
        fail-closed; the token is not propagated past the verifier.
    cookieAuth:
      type: apiKey
      in: cookie
      name: dp2_session

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: >
        The opaque `cursor` returned by a prior pull page. Opaque: clients MUST
        NOT decode or construct it. Omit to pull from the start.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: >
        Maximum requests per page. The server MAY return fewer. Provisioning is
        one site at a time per host, so pages are small.
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The `provisioningRequestId` of a pulled request.
    HostLabel:
      name: hostLabel
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9][a-z0-9-]*$"
      description: >
        The ERP host label the credential was issued for. One live credential
        exists per label.
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The tenant that owns the connector registration.
    ConnectorInstanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The connector registration (instance) id.
    ProvisioningLeaseId:
      name: Provisioning-Lease-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: >
        Version 1.2.0-draft (RT-1362 S1). The `leaseId` returned by the step
        acknowledgement that took or renewed the caller's lease. REQUIRED by
        Backend-Core on every call after `claimed` on a `credential.rotate`
        request (a missing or stale value is `409 lease_lost`, or `404` on the
        credential call); optional and ignored on the other kinds. See "Claim
        fencing" in the file description.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[\\x21-\\x7E]{16,128}$"
      description: >
        REQUIRED. 16 to 128 printable ASCII characters with no whitespace, as
        the shared `IdempotencyInterceptor` enforces. On a step acknowledgement
        the form is `{requestId}:{step}:{attempt}`. Keyed on `(method, route,
        clientId = the provisioner principal, key)`. No new idempotency
        primitive is introduced.

  headers:
    IdempotentReplayed:
      description: >
        Present and `true` on a 200 idempotent replay. Absent on a first record.
      schema:
        type: boolean
    ConsoleRetryAfter:
      description: >
        Whole seconds the caller should wait before retrying, sent on every
        console 429 (RT-574 D5). Its own bound, 1 to 3600.
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 3600

  schemas:
    RequestKind:
      type: string
      enum: [tenant.provision, store.provision, credential.rotate]
      description: >
        `tenant.provision`: create the tenant's ERP site, company and template.
        `store.provision`: provision one store's warehouse and customer mapping.
        `credential.rotate`: rotate a managed connector credential and deliver
        the new secret to the site.

    StepName:
      type: string
      enum: [claimed, site_created, erp_configured, connector_installed, credential_bound, verified]
      description: >
        The step being acknowledged. `claimed` takes the lease. `verified` is
        the last step: the first heartbeat is healthy in Backend-Core, the
        compatibility status is OK and every store map is acknowledged.

    StepOutcome:
      type: string
      enum: [done, failed_transient, permanently_rejected, conflict, capacity, compatibility, dependency]
      description: >
        `done`, or an error class (see the file description for the handling of
        each class).

    ErrorClass:
      type: string
      enum: [failed_transient, permanently_rejected, conflict, capacity, compatibility, dependency]

    FiscalReadiness:
      type: string
      enum: [not_assessed]
      description: >
        Always `not_assessed`. The template is an accounting structure only, so
        no screen may claim fiscal readiness.

    Template:
      type: object
      additionalProperties: false
      required: [templateId, templateVersion]
      description: >
        The code-owned versioned company template, frozen into the request. A
        new template version never rewrites an existing site.
      properties:
        templateId:
          type: string
          minLength: 1
          maxLength: 64
          description: The template id, for example `egypt-retail`.
        templateVersion:
          type: integer
          minimum: 1

    Locale:
      type: object
      additionalProperties: false
      required: [country, currency, timezone, language]
      properties:
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217.
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            An IANA timezone. It is set on the site BEFORE the Connector is
            installed.
        language:
          type: string
          enum: [ar, en]

    ProvisioningStore:
      type: object
      additionalProperties: false
      required: [storeId, displayName]
      properties:
        storeId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 135

    ProvisioningRequest:
      type: object
      additionalProperties: false
      required:
        - provisioningRequestId
        - kind
        - tenantId
        - generation
        - siteName
        - template
        - locale
        - connectorRegistrationId
        - environment
        - attemptFloor
      description: >
        One provisioning request. `provisioningRequestId` is its idempotency
        key. The request carries no secret, no credential and no password.
      properties:
        provisioningRequestId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/RequestKind"
        tenantId:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
          description: Increments only when an operator restarts a request after compensation.
        siteName:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^t[0-9a-f]{20}[a-z0-9.-]*$'
          description: >
            Derived by Backend-Core from the tenant id (never from the slug or
            business name): `t`, then the first 20 hexadecimal characters of the
            tenant id with the hyphens removed, then `-`, then the deployment
            environment (for example `t0b9a3f0e6c5d4e2a8d52-pilot`). The provisioner verifies it; a mismatch or a site
            with this name that carries another tenant's marker is `conflict`.
            On `credential.rotate` it is a compatibility field only: the site
            is identified by `erpnextSiteRef`.
        template:
          $ref: "#/components/schemas/Template"
        locale:
          $ref: "#/components/schemas/Locale"
        legalName:
          type: string
          minLength: 1
          maxLength: 140
          description: The business name entered at signup. Absent on `store.provision` and `credential.rotate`.
        connectorRegistrationId:
          type: string
          format: uuid
          description: >
            The managed connector registration the credential operation issues
            for. Backend-Core creates it with the request, with no credential yet.
        environment:
          type: string
          enum: [dev, staging, pilot, prod]
        erpnextSiteRef:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Version 1.2.0-draft (RT-1362 S1). The registration's stored ERP site
            reference (its site binding). Always present on `credential.rotate`,
            where it, not `siteName`, identifies the site the provisioner works
            on (an adopted registration's site need not follow the `siteName`
            rule). Absent on the other kinds.
        attemptFloor:
          type: integer
          minimum: 0
          description: >
            The highest `attempt` Backend-Core has recorded for this request
            across all steps (0 if none). The next step acknowledgement must
            send an `attempt` greater than this, so a fresh provisioner (after a
            crash or on another host) never reuses a stored key. An
            acknowledgement whose `attempt` is at or below the floor with a
            different body is `409 idempotency_key_conflict`.
        notBefore:
          type: string
          format: date-time
          description: >
            Present only while the request is under a retry backoff: the time
            before which pull does not offer it again. Informational on a
            returned item (an offered request is past it).
        stores:
          type: array
          maxItems: 500
          description: >
            The stores that exist at request time. Each is acknowledged in the
            outcome `result.stores`. For `store.provision` it holds the one
            store to provision.
          items:
            $ref: "#/components/schemas/ProvisioningStore"

    ProvisioningRequestPage:
      type: object
      additionalProperties: false
      required: [items, cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ProvisioningRequest"
        cursor:
          type: string
          minLength: 1
          description: >
            The advanced opaque server cursor. Pass it as `cursor` to continue;
            it is the only paging input. An empty `items` array means the
            provisioner is caught up. Opaque; do not decode.

    StepAck:
      type: object
      additionalProperties: false
      required: [step, outcome, attempt]
      allOf:
        - if:
            properties:
              outcome:
                const: done
          then:
            not:
              anyOf:
                - required: [errorClass]
                - required: [reason]
          else:
            required: [errorClass]
        - if:
            properties:
              outcome:
                const: permanently_rejected
          then:
            required: [reason]
      description: >
        One step outcome. `errorClass` is required when `outcome` is not
        `done` and must equal it; `reason` is required when `outcome` is
        `permanently_rejected`. Tenant, actor and lease resolve from the
        principal and the request, and are rejected if body-supplied.
      properties:
        step:
          $ref: "#/components/schemas/StepName"
        outcome:
          $ref: "#/components/schemas/StepOutcome"
        attempt:
          type: integer
          minimum: 1
          description: >
            The attempt number for this step, starting at 1 and increasing on
            every re-claim, retry or restart of the request and step (it never
            repeats for a different attempt; see the operation description).
        errorClass:
          $ref: "#/components/schemas/ErrorClass"
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            A short scrubbed reason. Required on `permanently_rejected`. No
            secret, token, password or tenant business content.
        detail:
          type: string
          maxLength: 1000
          description: >
            Optional scrubbed diagnostic text, stored for the audit trail only
            and never returned.

    StepAckResult:
      type: object
      additionalProperties: false
      required: [requestId, step, leaseExpiresAt]
      properties:
        requestId:
          type: string
          format: uuid
        step:
          $ref: "#/components/schemas/StepName"
        leaseExpiresAt:
          type: string
          format: date-time
          description: The renewed lease expiry. Progress acknowledgements renew it.
        leaseId:
          type: string
          format: uuid
          description: >
            Version 1.2.0-draft (RT-1362 S1). The id of the caller's current
            claim: new on each `claimed`, unchanged on renewals. Optional in
            the schema; on a `credential.rotate` request Backend-Core always
            returns it and requires it back in `Provisioning-Lease-Id` (see
            "Claim fencing").

    IssuedProvisionedCredential:
      type: object
      additionalProperties: false
      required: [credentialId, registrationId, secret, issuedAt, expiresAt, rotated]
      description: >
        The connector credential of the managed registration. The `secret` is
        shown ONCE, in this response only (`Cache-Control: no-store`); it is
        never logged and never stored recoverably.
      properties:
        credentialId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        secret:
          type: string
          minLength: 1
          description: The one-time secret. Written in-process into the site's Connector Settings.
        issuedAt:
          type: string
          format: date-time
          description: >
            Set by Backend-Core; strictly later for every new credential of the
            registration. On `credential.rotate` it is the fencing token of the
            provisioner's site write (see "Credential rotation").
        expiresAt:
          type: string
          format: date-time
          description: >
            Set by Backend-Core. A managed credential uses the 365-day maximum
            until automated rotation ships (RT-1352 decision OD-5).
        rotated:
          type: boolean
          description: >
            `true` when this call issued a replacement: on a `tenant.provision`
            request, for an earlier credential that was never presented (the
            repeat rule, which revokes it); on a `credential.rotate` request,
            always: the credential is PENDING, the current one is not revoked
            by this call (Backend-Core revokes it when the pending one is first
            used), and a repeat revokes only the earlier pending one.

    ProvisioningResultStore:
      type: object
      additionalProperties: false
      required: [storeId, warehouseRef, customerRef]
      properties:
        storeId:
          type: string
          format: uuid
        warehouseRef:
          type: string
          minLength: 1
          maxLength: 140
          description: >
            The ERP warehouse reference. Backend-Core records its warehouse map
            from this value.
        customerRef:
          type: string
          minLength: 1
          maxLength: 140
          description: The ERP customer reference mapped for the store.

    ProvisioningResult:
      type: object
      additionalProperties: false
      required: [siteName, companyRef, templateVersion, fiscalReadiness, stores]
      description: >
        The result of `succeeded`. The version fields are informational only.
      properties:
        siteName:
          type: string
          minLength: 1
          maxLength: 128
        companyRef:
          type: string
          minLength: 1
          maxLength: 140
        templateVersion:
          type: integer
          minimum: 1
        erpnextVersion:
          type: string
          maxLength: 32
        frappeVersion:
          type: string
          maxLength: 32
        connectorVersion:
          type: string
          maxLength: 32
        fiscalReadiness:
          $ref: "#/components/schemas/FiscalReadiness"
        stores:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ProvisioningResultStore"

    ProvisioningOutcome:
      type: object
      additionalProperties: false
      required: [outcome]
      allOf:
        - if:
            properties:
              outcome:
                const: succeeded
          then:
            required: [result]
            not:
              required: [reason]
          else:
            required: [reason]
            not:
              required: [result]
      description: >
        The terminal outcome. `result` is required on `succeeded` and absent
        otherwise; `reason` is required on `permanently_rejected` and
        `conflict`.
      properties:
        outcome:
          type: string
          enum: [succeeded, permanently_rejected, conflict]
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: A short scrubbed reason.
        result:
          $ref: "#/components/schemas/ProvisioningResult"

    RecordedProvisioningOutcome:
      type: object
      additionalProperties: false
      required: [requestId, outcome]
      properties:
        requestId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [succeeded, permanently_rejected, conflict]

    IssueProvisionerCredentialRequest:
      type: object
      additionalProperties: false
      required: [hostLabel]
      properties:
        hostLabel:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9-]*$"
          description: >
            A label for the ERP host this credential serves, such as `lab-03`.
            At most one live credential exists per label.

    IssuedProvisionerCredential:
      type: object
      additionalProperties: false
      required: [credentialId, hostLabel, secret, issuedAt, expiresAt]
      description: >
        The provisioner credential. The `secret` is shown ONCE, in this
        response only (`Cache-Control: no-store`), and is never logged.
      properties:
        credentialId:
          type: string
          format: uuid
        hostLabel:
          type: string
          minLength: 1
          maxLength: 64
        secret:
          type: string
          minLength: 1
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Set by Backend-Core, at most 30 days after `issuedAt`.

    RevokedProvisionerCredential:
      type: object
      additionalProperties: false
      required: [credentialId, hostLabel, revokedAt, alreadyRevoked]
      properties:
        alreadyRevoked:
          type: boolean
          description: >
            `false` on the call that revoked the credential; `true` on a
            repeat for a credential that was already revoked or expired.
        credentialId:
          type: string
          format: uuid
        hostLabel:
          type: string
          minLength: 1
          maxLength: 64
        revokedAt:
          type: string
          format: date-time

    AdoptedConnectorRegistration:
      type: object
      additionalProperties: false
      required: [outcome, tenantId, instanceId, managedBy, environment, erpnextSiteRef]
      description: >
        The state of the registration after `platformAdoptConnectorRegistration`.
        An explicit projection, never a database row: no credential, no secret.
      properties:
        outcome:
          type: string
          enum: [adopted, already_adopted]
          description: >
            `adopted`: this call set `managed_by`. `already_adopted`: a repeat by
            the same admin; nothing changed and no audit row was written.
        tenantId:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        managedBy:
          type: string
          enum: [provisioner]
        environment:
          type: string
          enum: [dev, staging, pilot, prod]
        erpnextSiteRef:
          type: string
          minLength: 1
          maxLength: 255

    AdoptRefusedError:
      type: object
      additionalProperties: false
      required: [error]
      description: >
        The 409 envelope of `platformAdoptConnectorRegistration`. Same shape as
        `Error`, with its own closed code set so the shared `Error` enum does
        not change.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [registration_disabled, already_managed]
              description: >
                `registration_disabled`: the registration is disabled.
                `already_managed`: it is managed and was not adopted by this
                caller through this operation.
            message:
              type: string
              description: Human-readable summary. No sensitive data.
            request_id:
              type: string
              format: uuid

    RequestConnectorCredentialRotation:
      type: object
      additionalProperties: false
      description: >
        Optional body of `platformRequestConnectorCredentialRotation`.
        Server-owned fields (tenant, actor, kind, trigger) are rejected if
        body-supplied.
      properties:
        hostLabel:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9-]*$"
          description: >
            The ERP host label (as in `IssueProvisionerCredentialRequest`) whose
            provisioner works this registration's rotations. Needed only for
            an adopted registration with no recorded provisioner host; it is
            then recorded on the registration as PROVISIONAL. A different
            label corrects a provisional binding only with the matching
            `expectedHostBindingRevision`; it is `409 host_mismatch` against a
            confirmed one.
        expectedHostBindingRevision:
          type: integer
          minimum: 1
          description: >
            The `hostBindingRevision` the caller last saw. Required to correct
            a provisional binding; a missing or older value is `409
            host_binding_stale`, so a delayed retry never undoes a newer
            correction.

    ConnectorRotationRequest:
      type: object
      additionalProperties: false
      required: [outcome, provisioningRequestId, kind, trigger, tenantId, instanceId, requestedAt, hostLabel, hostBinding, hostBindingRevision]
      description: >
        The open `credential.rotate` request of the registration after
        `platformRequestConnectorCredentialRotation`. An explicit projection,
        never a database row: no credential, no secret.
      properties:
        outcome:
          type: string
          enum: [requested, already_open]
          description: >
            `requested`: this call created the request. `already_open`: a
            rotation request was already open; it is returned and nothing
            changed.
        provisioningRequestId:
          type: string
          format: uuid
          description: The request the provisioner pulls and works.
        kind:
          type: string
          enum: [credential.rotate]
        trigger:
          type: string
          enum: [forced, scheduled]
          description: >
            What created the open request: `forced` (this operation) or
            `scheduled` (the 14-day scheduler).
        tenantId:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
          description: When the open request was created.
        hostLabel:
          type: string
          minLength: 1
          maxLength: 64
          description: The ERP host label the request is routed to.
        hostBinding:
          type: string
          enum: [provisional, confirmed]
          description: >
            `confirmed`: the provisioning host of a provisioned registration, or
            an adopted binding a credential call has confirmed (a different
            label is `409 host_mismatch`). `provisional`: an adopted binding no
            credential call has confirmed yet (a different label corrects it).
        hostBindingRevision:
          type: integer
          minimum: 1
          description: >
            The revision of the host binding; it increments on every
            correction. Send it as `expectedHostBindingRevision` to correct a
            provisional binding.
        hostCorrected:
          type: boolean
          description: >
            Present and `true` when this call corrected a provisional host
            binding (audited `connector.registration.provisioner_host_corrected`).

    RotationRefusedError:
      type: object
      additionalProperties: false
      required: [error]
      description: >
        The 409 envelope of `platformRequestConnectorCredentialRotation`. Same
        shape as `Error`, with its own closed code set so the shared `Error`
        enum does not change.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [rotation_unavailable, not_managed, registration_disabled, provisioning_in_progress, site_not_bound, host_mismatch, host_not_bound, host_binding_stale]
              description: >
                `rotation_unavailable`: rotation is not switched on for this
                deployment (no provisioner that handles `credential.rotate`).
                `not_managed`: the registration is not managed by the
                provisioner. `registration_disabled`: it is disabled.
                `provisioning_in_progress`: its `tenant.provision` request is
                still open. `site_not_bound`: it is bound to no site (its
                `tenant.provision` request did not succeed and it was not
                adopted). `host_mismatch`: the body `hostLabel` differs from
                the registration's CONFIRMED provisioner host (a provisional
                adopted binding is corrected instead). `host_not_bound`:
                no provisioner host is resolved and the body names none.
                `host_binding_stale`: a correction of a provisional binding
                named a missing or outdated `expectedHostBindingRevision`.
            message:
              type: string
              description: Human-readable summary. No sensitive data.
            request_id:
              type: string
              format: uuid

    Error:
      type: object
      required: [error]
      description: >
        Canonical error envelope, as in `posting-feed.yaml` and
        `tenant-access-entitlement.openapi.yaml`. Refusals are non-disclosing.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - validation_error
                - unauthorized
                - origin_rejected
                - forbidden
                - not_found
                - lease_lost
                - idempotency_key_conflict
                - conflict
                - internal_error
              description: >
                Stable machine-readable code, closed on this surface.
                `unauthorized` and `internal_error` are the global exception
                filter's generic 401 and 500 codes.
            message:
              type: string
              description: Human-readable summary. No sensitive data, no cause enumeration.
            request_id:
              type: string
              format: uuid
            details:
              type: array
              description: Present only with `validation_error`.
              items:
                type: object

    RateLimitedError:
      type: object
      additionalProperties: false
      required: [error]
      description: >
        The console 429 envelope (RT-620). Same shape as `Error`, whose closed
        code set does not include the console rate limit's `rate_limited`.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [rate_limited]
            message:
              type: string
              description: Non-disclosing summary (no budget, class or window).
            request_id:
              type: string
              format: uuid

  responses:
    ValidationFailure:
      description: >
        `validation_error`: a malformed body, query or id, an unknown key
        (strict boundary), a body-supplied server-owned field, or a missing
        conditional field (for example `errorClass` on a failed step or `result`
        on `succeeded`). Deterministic; nothing is recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FeedUnauthorized:
      description: >
        Generic refusal (401). The body does not distinguish a missing, invalid,
        expired or revoked provisioner bearer from a tenant `connector` bearer,
        a cookie session or a device credential. Non-disclosing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FeedForbidden:
      description: >
        `forbidden` (403): the provisioner bearer is valid but its environment
        does not match this deployment. Non-disclosing: the body names no
        environment. Deterministic, no side effects.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >
        `not_found`: non-disclosing. Identical for an unknown id, a request or
        credential outside the caller's scope, a request the caller holds no
        live lease on (credential issue), a registration that is not managed
        (on the feed operations; the platform adopt and rotate-now operations
        answer that case with their own 409), and another provisioner's lease.
        No existence leak.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FeedConflict:
      description: >
        `lease_lost` (409): the caller does not hold a live lease on the
        request (it expired and was re-offered, or another provisioner claimed
        it). The provisioner stops working the request and re-pulls. Or
        `idempotency_key_conflict` (409): the same `Idempotency-Key` was reused
        with a different logical body. Deterministic, no side effects.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [lease_lost, idempotency_key_conflict]
    PlatformUnauthorized:
      description: >
        No human dashboard session: a bearer-only request (the provisioner
        bearer, a tenant connector bearer or `dashboard_api`) is refused here
        (`SessionOnlyAdminGuard`).
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        const: unauthorized
    PlatformForbidden:
      description: >
        `forbidden`: the caller is not a platform admin; or `origin_rejected`
        (RT-430): the request is authenticated by the `dp2_session` cookie and
        its `Origin` header is missing, or is neither the API's own origin nor
        listed in `ALLOWED_ORIGINS`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [forbidden, origin_rejected]
    PlatformConflict:
      description: >
        `conflict` (409): a live provisioner credential already exists for this
        `hostLabel`. Rotate it instead. Nothing is changed.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        const: conflict
    AdoptRefused:
      description: >
        `registration_disabled` (409): the registration is disabled.
        `already_managed` (409): it is already managed and was not adopted by
        this caller through this operation. Deterministic, nothing is changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdoptRefusedError"
    RotationRefused:
      description: >
        `rotation_unavailable` (409): rotation is not switched on for this
        deployment (no provisioner that handles `credential.rotate` is
        deployed). `not_managed` (409): the registration is not managed by the
        provisioner. `registration_disabled` (409): it is disabled.
        `provisioning_in_progress` (409): its `tenant.provision` request is
        still open. `site_not_bound` (409): it is managed but bound to no site
        (its `tenant.provision` request ended `failed_permanent`,
        `compensated` or `cancelled`, and it was not adopted). `host_mismatch`
        (409): the body `hostLabel` differs from the confirmed provisioner host.
        `host_not_bound` (409): no provisioner host is resolved and the body
        names none. `host_binding_stale` (409): a correction named a missing or
        outdated `expectedHostBindingRevision`. Deterministic, nothing is changed and no request is
        written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RotationRefusedError"
    TooManyRequests:
      description: >
        429 `rate_limited` (RT-574): the caller's per-user budget for this class
        of operation is spent. Honour `Retry-After`; never auto-retry a
        mutation. A 429 is not a 401: it never means the session ended.
      headers:
        Retry-After:
          $ref: "#/components/headers/ConsoleRetryAfter"
        Cache-Control:
          description: Always `no-store` on a 429.
          required: true
          schema:
            type: string
            enum: [no-store]
        X-Request-Id:
          description: The request id, equal to `error.request_id` in the body.
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
    SystemFailure:
      description: >
        `internal_error` (500): an unexpected server error, recorded
        server-side by `request_id` and never returned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        const: internal_error
