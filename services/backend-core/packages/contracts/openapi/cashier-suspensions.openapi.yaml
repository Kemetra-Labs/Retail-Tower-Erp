openapi: 3.1.0
info:
  title: Backend-Core — Cashier Suspension API
  version: "1.0.0"
  description: >
    Jira RT-1138 (Story RT-1130, remote cashier suspension). The per-store
    suspension state of a cashier (a `store_staff` user), the Console write API
    that suspends and reactivates, and the list the Console page reads. The POS
    side (pulling the state on sync, refusing the cashier, ending the local
    session) is RT-1139, and the per-cashier PIN is RT-1140; neither is here.


    **Posture.** `[GATED: contract, migration]`. The owner told the
    implementing session "Yes, implement" for RT-1138 on 2026-11-12 after the
    new table and this contract were named as gated, and confirmed the shape
    below in chat the same day: the roster field that carries the state to the
    POS, owner / tenant_admin writes, per-store scope, and no reason text. The
    storage is migration `0106`.


    **Default (the rule every reader shares).** A cashier with no stored state
    is NOT suspended. Every existing cashier is therefore active with no
    backfill. Suspension is per store: a cashier suspended at one store stays
    admissible at the others it can reach.


    **Effect of a suspension** (server behaviour; the wire change to the POS is
    in `pos-cashier-admissions.openapi.yaml`):

      - `posCreateCashierAdmission` refuses the cashier with that contract's
        existing generic `refused`; the cause (`suspended`) is audited
        server-side and never returned.
      - `posListCashierAdmissionRoster` leaves the cashier out of `cashiers`
        and lists it in `suspended_cashiers`.
      - Admission is the only gate this change adds. A cashier session that is
        already open is not cut server-side: the terminal ends it when it syncs
        (RT-1139). Until then the cashier can keep selling on that terminal.
        Renewal goes through the same admission check, so a suspended cashier's
        admission is not renewed and lapses at its TTL, and sales already made
        offline still sync (the sale attribution check does not consult the
        suspension).

    **Auth and scope.** The HUMAN `cookieAuth` session only (`SessionOnlyAdminGuard`):
    a bearer-only request is `401`; a cookie write without a trusted `Origin` is
    `403 origin_rejected` (RT-430). The tenant is the session's active tenant and
    is never a parameter.

      - `consoleSuspendCashier`, `consoleReactivateCashier`: roles `owner` and
        `tenant_admin` (a platform admin is admitted by the existing
        `RolesGuard` pass). A role outside the list is `403 forbidden`.
      - `consoleListCashierSuspensions`: `owner`, `tenant_admin`, `store_manager`.
        A role outside the list is the non-disclosing `404`.
      - The store must belong to the session's tenant and lie inside the
        caller's store scope, and the user must be an active `store_staff`
        member who reaches that store. Anything else is the same non-disclosing
        `404 not_found`: another tenant's store, a store outside the caller's
        scope, a user who is not a cashier of that store. Nothing about
        existence is disclosed.

    **Writes.** Both are idempotent. Each change writes ONE audit row in the
    write's transaction (`cashier.suspended`, `cashier.reactivated`; target
    `cashier_suspension`, target id the cashier's user id, the store id and the
    actor recorded, no free text); a replay and a no-op change nothing and
    audit nothing. No request body, no reason text.

    Response bodies are explicit projections, never DB rows (§IV). They carry
    no name, email or actor identity.

x-runtime-note: >
  The state is read by the cashier admission check and the POS roster in
  `pos-cashier-admissions`. The sync field is the roster's `suspended_cashiers`;
  this contract fixes no other sync surface.

paths:
  /api/v1/stores/{store_id}/cashier-suspensions:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      summary: List the cashiers currently suspended at a store.
      operationId: consoleListCashierSuspensions
      tags: [cashier-suspensions]
      security:
        - cookieAuth: []
      description: >
        Only cashiers whose state is `suspended`, most recent change first. A
        reactivated cashier is not listed. Takes no query parameter. Roles
        `owner`, `tenant_admin`, `store_manager`.
      responses:
        "200":
          description: The cashiers suspended at the store. May be empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierSuspensionList"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/stores/{store_id}/cashiers/{user_id}/suspension:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/UserId"
    put:
      summary: Suspend a cashier at a store.
      operationId: consoleSuspendCashier
      tags: [cashier-suspensions]
      security:
        - cookieAuth: []
      description: >
        Sets the cashier's state at the store to `suspended` and writes
        `cashier.suspended`, in one transaction. Outcomes: `suspended` (the
        state changed); `already_suspended` (a replay: nothing changes, no
        audit). No request body. Roles `owner`, `tenant_admin`.
      responses:
        "200":
          description: The outcome and the resulting state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierSuspensionChange"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"
    delete:
      summary: Reactivate a suspended cashier at a store.
      operationId: consoleReactivateCashier
      tags: [cashier-suspensions]
      security:
        - cookieAuth: []
      description: >
        Sets the cashier's state at the store back to `active` and writes
        `cashier.reactivated`, in one transaction. The row is kept. Outcomes:
        `reactivated` (the state changed); `already_active` (a replay, or a
        cashier never suspended: nothing changes, no audit). Answers `200` with
        a body, not `204`, so the Console can show the resulting state. No
        request body. Roles `owner`, `tenant_admin`.
      responses:
        "200":
          description: The outcome and the resulting state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierSuspensionChange"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dp2_session

  headers:
    ConsoleRetryAfter:
      description: >
        Whole seconds the caller should wait before retrying, sent on every
        console 429 (RT-574 D5). Its own bound, 1 to 3600.
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 3600

  parameters:
    StoreId:
      name: store_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: >
        The store addressed. It must belong to the session's tenant and lie
        inside the caller's store scope; otherwise `404`.
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: >
        The cashier's `users.id`, as the POS roster's `user_id` carries it. It
        must be an active `store_staff` member who reaches the store; otherwise
        `404`.

  schemas:
    CashierSuspensionStatus:
      type: string
      enum: [suspended, active]
      description: >
        `suspended`: not admissible at the store. `active`: admissible (also the
        state of a cashier with no stored row).

    CashierSuspension:
      type: object
      additionalProperties: false
      required: [store_id, user_id, status, changed_at]
      description: >
        One cashier's state at one store. `changed_at` is the last change, and
        `null` for a cashier that was never suspended.
      properties:
        store_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/CashierSuspensionStatus"
        changed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    CashierSuspensionChange:
      type: object
      additionalProperties: false
      required: [outcome, suspension]
      properties:
        outcome:
          type: string
          enum: [suspended, already_suspended, reactivated, already_active]
        suspension:
          $ref: "#/components/schemas/CashierSuspension"

    CashierSuspensionList:
      type: object
      additionalProperties: false
      required: [store_id, suspensions]
      properties:
        store_id:
          type: string
          format: uuid
        suspensions:
          type: array
          description: Only cashiers whose status is `suspended`.
          items:
            $ref: "#/components/schemas/CashierSuspension"

    Error:
      type: object
      additionalProperties: false
      required: [error]
      description: >
        Canonical error envelope. Refusals are non-disclosing across tenants
        (§II/§XII).
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          if:
            properties:
              code:
                const: validation_error
          else:
            not:
              required: [details]
          properties:
            code:
              type: string
              enum:
                - validation_error
                - unauthorized
                - origin_rejected
                - forbidden
                - not_found
                - internal_error
              description: >
                Stable machine-readable code, closed on this surface.
                `unauthorized` and `internal_error` are the global exception
                filter's generic 401 and 500 codes.
            message:
              type: string
            request_id:
              type: string
              format: uuid
            details:
              type: array
              description: >
                Present only with `validation_error`: the validation issues
                the global exception filter serialises (one object per issue).
              items:
                type: object

    RateLimitedError:
      type: object
      additionalProperties: false
      required: [error]
      description: >
        The console 429 envelope (RT-620). Same shape as `Error`, whose closed
        code set does not include the console rate limit's `rate_limited`.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [rate_limited]
            message:
              type: string
              description: Non-disclosing summary (no budget, class or window).
            request_id:
              type: string
              format: uuid

  responses:
    ValidationFailure:
      description: "`validation_error` — a malformed `store_id` or `user_id`, or a query parameter on the list."
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        const: validation_error
    Unauthorized:
      description: >
        No human dashboard session: a bearer-only request (`dashboard_api`
        included) is refused here (`SessionOnlyAdminGuard`).
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        const: unauthorized
    Forbidden:
      description: >
        `forbidden` — a write by a role outside `owner` / `tenant_admin`; or
        `origin_rejected` (RT-430): the request is authenticated by the
        `dp2_session` cookie and its `Origin` header is missing, or is neither
        the API's own origin nor listed in `ALLOWED_ORIGINS`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [forbidden, origin_rejected]
    NotFound:
      description: >
        `not_found` — another tenant's store, a store outside the caller's
        scope, an unknown store, a user who is not an active cashier of the
        store, or (on the list) a role outside `owner` / `tenant_admin` /
        `store_manager`: identical in all cases (§II/§XII).
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        const: not_found
    SystemFailure:
      description: >
        `internal_error` — an unexpected server error, recorded server-side by
        `request_id` and never returned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        const: internal_error
    TooManyRequests:
      description: >
        429 `rate_limited` (RT-574): the caller's per-user budget for this
        class of operation is spent. Honour `Retry-After`; never auto-retry a
        mutation. A 429 is not a 401: it never means the session ended.
      headers:
        Retry-After:
          $ref: "#/components/headers/ConsoleRetryAfter"
        Cache-Control:
          description: Always `no-store` on a 429.
          required: true
          schema:
            type: string
            enum: [no-store]
        X-Request-Id:
          description: >
            The request id, equal to `error.request_id` in the body.
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
