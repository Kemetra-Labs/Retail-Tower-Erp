openapi: 3.1.0
info:
  title: Backend-Core — Offer Engine V1 API (Console authoring and POS Offer Pack)
  version: "1.0.0-draft"
  description: >
    Jira RT-1335 (RT-286 slice S2, Post-Pilot). Design record:
    `services/backend-core/specs/048-offer-engine-v1/spec.md` and its
    `decision-record.md` (OD-1 to OD-10 and the OD-12 permissions approved by
    the owner on 2026-11-11; OD-11 open for the Connector slice). Section
    numbers such as §16 refer to Confluence RETAIL 23134209 (owner-approved
    2026-10-07).


    **Posture.** `1.0.0-draft`, `[GATED: contract]` OpenAPI, and
    **contract-only**: every operation carries `x-runtime-status:
    contract-only`. Backend-Core has no controller, guard, service, table or
    migration for these routes yet; the schema is RT-1336 (S3) and the
    runtime is RT-1337 (S4). This file is a new contract, so it changes no
    existing one. The sale-side facts (`CaptureSaleLine.promotion`,
    `SaleLine.promotion`, `SaleReturn.promotionClawbacks` and the two return
    refusals) are in `pos-sales/sales.yaml` 1.22.0-draft. The evaluation
    golden vectors are `packages/contracts/fixtures/offers/golden-vectors.json`
    (S5).


    **What this surface is.** V1 has one offer type, `buy_x_get_y_percent`:
    "buy X eligible items, get Y more at P% off, the discount going to the
    cheapest items" (spec 048 §5, §6). The items that count are chosen by
    product, category or brand, with exclusions that always win (OD-1). An
    offer is a tenant-owned identity with a lifecycle state; its rules live
    in immutable, numbered versions. The Admin Console authors a draft,
    previews it, and publishes it as a new version; the POS reads the store's
    current Offer Pack and applies the offers itself, online and offline
    (§19, OD-6, OD-8). Backend-Core is the authority for the eligible set,
    the Pack and the frozen sale facts; the Console and the POS never resolve
    a category or brand rule themselves (OD-6).


    **Surfaces.**

      1. Console (Admin Console), the human `cookieAuth` session:
         `consoleListOffers`, `consoleCreateOfferDraft`, `consoleGetOffer`,
         `consoleUpdateOfferDraft`, `consolePreviewOffer`,
         `consolePublishOffer`, `consolePauseOffer`, `consoleResumeOffer`,
         `consoleEndOffer`, `consoleArchiveOffer` and
         `consoleListOfferVersions`.
      2. POS, the paired terminal's `device` bearer: `posGetOfferPack`.


    **Auth and tenant (Console).** The HUMAN `cookieAuth` scheme (httpOnly
    `dp2_session`) only. The guard order is `SessionOnlyAdminGuard` (the
    cookie session only: any bearer, including a `dashboard_api` token, is
    401; it carries the RT-430 Origin check on every cookie-authenticated
    unsafe request, the CSRF defence for the POST and PUT operations), then
    `TenantContextGuard`, then `RolesGuard`. The tenant is the session's
    active tenant and never a request value (Constitution §II, §XII): no
    request carries a `tenant_id`. An offer of another tenant, an offer a
    `store_manager` cannot see, and an offer that never existed are the same
    non-disclosing 404 `offer_not_found`; a store that is not a store of the
    tenant, or is outside a `store_manager`'s store scope, is the same
    non-disclosing 404 `store_not_found`.


    **Roles and capabilities (OD-12).** Three capabilities, evaluated
    through the Policy engine (RT-284), not a separate authority model
    (§21): `offers.manage` (create and edit drafts, preview, end, archive),
    `offers.publish` (publish, and resume a paused offer) and `offers.pause`.

      - `owner` and `tenant_admin` hold all three, for every store of the
        tenant.
      - `store_manager` holds `offers.pause` for **their own stores only**:
        a pause that names `storeIds`, every one within the caller's
        membership store scope. A `store_manager` cannot create, edit,
        preview, publish, resume, end or archive an offer, and cannot pause a
        whole offer (no `storeIds`): those are 403 `forbidden`.
      - Reads (`consoleListOffers`, `consoleGetOffer`,
        `consoleListOfferVersions`) are open to `owner`, `tenant_admin` and
        `store_manager`. A `store_manager` sees only the offers whose store
        scope includes at least one of their stores (an all-stores offer
        included); any other offer is 404 `offer_not_found`.
      - Any other role is 403 `forbidden` on every operation.


    **Lifecycle (§16).** `draft` → `scheduled` → `active` → `paused` →
    `ended` → `archived`. `state` is derived when read: an offer with no
    published version is `draft`; a published, unpaused offer is `scheduled`
    before its window opens in every store of its scope, `active` while the
    window is open in at least one store, and `ended` once the window has
    closed in every store or it was ended explicitly; `paused` is a
    whole-offer pause; `archived` is terminal. Every publish is a new
    immutable version; a version used by a sale is never changed (§16, §20).
    Editing a published offer edits its next draft, and only a publish
    changes what tills apply. A store-level pause does not change `state`;
    it is listed in `pausedStores`.


    **Conflicts (OD-7).** In V1 a unit belongs to at most one offer. A
    publish, or a resume, is refused with 409 `offer_conflict` when the
    offer's eligible set shares a product with another `scheduled`, `active`
    or `paused` offer of the tenant, in a store both offers cover, during
    overlapping windows. The refusal body lists each conflicting offer and
    the number of shared products. A paused offer counts, so that resuming
    it can never create an overlap. Best Deal and stacking come later (§17).


    **Offer Pack and offline behaviour (§19, OD-6, OD-8).** See
    `posGetOfferPack`. Backend-Core materialises the eligible set (product
    ids) of every version into each Pack revision and publishes a new
    revision when an offer is published, paused, resumed or ended, or when a
    catalog change moves a product into or out of an eligible set.


    **Audit.** Every Console write (`x-audit-action` on each operation)
    writes one `audit_events` row with the actor, the tenant, the offer and
    the version or draft revision it produced; a pause also records its
    `reason` and its stores. `reason` is short free text documented "no
    PII". The Console reads carry the read action of the surface. A Pack
    read writes no audit row (like `posGetCashVariancePolicy`).


    **Errors.** The closed offer error set is `OfferErrorCode`:
    `validation_error`, `forbidden`, `offer_not_found`, `store_not_found`,
    `offer_state_invalid`, `offer_draft_changed_concurrently`,
    `offer_conflict`, `offer_reference_invalid`, `offer_schedule_elapsed`,
    `offer_eligible_set_empty`, `offer_eligible_set_too_large`,
    `offer_store_not_in_scope`, `idempotency_key_required`,
    `idempotency_key_malformed` and `idempotency_key_conflict`. Two platform
    codes can also appear: `rate_limited` (RT-574) on any Console operation,
    and `origin_rejected` (RT-430) on the Console POST and PUT operations
    only (the Origin check does not run on the GETs). The offer-domain 400,
    404, 409 and 422 bodies use `OfferError`, whose `code` is that closed
    set; the 401, 403, 429 and 500 bodies use the canonical envelope with a
    free-string `code`; a 425 carries the platform's
    `IdempotencyInProgress` body. The envelope is `{ error: { code, message,
    request_id } }`. A 400 is checked before any database read.


    **Rate limit.** Intended classes
    (`apps/api/test/console-rate-limit/classes/offers.rate-limit.yaml`):
    `cheapRead` for the three GETs, `expensiveRead` for the preview,
    `write` for create, edit, publish, resume and archive, and
    `incidentControl` for pause and end (an emergency stop must not wait on
    the write budget). The device read is not a Console operation and has no
    console 429.


    **Money.** Every amount is an exact-decimal string (gate A.6, never a
    float) in the store's currency, with no more fractional digits than its
    ISO-4217 minor unit. A percent is a whole number from 1 to 100, the same
    domain as the RT-740 manual discount.
servers:
  - url: https://api.example.com

tags:
  - name: offers-console
    description: >
      Admin Console authoring and lifecycle of automatic offers (spec 048).
      Contract-only until RT-1337.
  - name: offers-pos
    description: >
      POS read of the store's current Offer Pack (spec 048 §7). Contract-only
      until RT-1337.

paths:
  /api/v1/offers:
    get:
      summary: List the tenant's offers, newest first.
      description: >
        Keyset-paginated list of the session tenant's offers, newest first
        (`createdAt`, then `offerId`). Roles: `owner`, `tenant_admin`,
        `store_manager` (only offers whose store scope includes one of their
        stores). Filters combine with AND. `state` is the derived state.
      operationId: consoleListOffers
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-audit-action: offers.listed
      tags: [offers-console]
      security:
        - cookieAuth: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfferState"
          description: Only offers in this derived state.
        - name: store_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Only offers whose store scope includes this store (an all-stores
            offer included). A store that is not of the tenant, or outside a
            `store_manager`'s scope, is 404 `store_not_found`.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of offers. `nextCursor` is null on the last page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPage"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"
    post:
      summary: Create an offer with its first draft.
      description: >
        Creates an offer in state `draft` whose draft is `definition`
        (`draftRevision` 1). Capability `offers.manage`: roles `owner`,
        `tenant_admin`. The body must be a complete `OfferDefinition`; shape
        rules (including an `include` that names nothing) are 400
        `validation_error`. Whether the referenced products, categories,
        brands and stores exist, and what the eligible set is, are checked by
        `consolePreviewOffer` and `consolePublishOffer`, not here, so a
        draft can be saved while the catalog is still being prepared. A
        same-key retry with the same body replays the stored 201
        (`Idempotent-Replayed: true`).
      operationId: consoleCreateOfferDraft
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-idempotency: required
      x-audit-action: offer.draft_created
      tags: [offers-console]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferDraftCreateRequest"
      responses:
        "201":
          description: The offer and its first draft.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "400":
          $ref: "#/components/responses/WriteValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "425":
          $ref: "#/components/responses/InProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/offers/{offer_id}:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    get:
      summary: Read one offer, its draft and its current version.
      description: >
        The offer's derived state, its draft (null when there is none), a
        summary of its current published version (null before the first
        publish), the whole-offer pause and the store pauses. Roles: `owner`,
        `tenant_admin`, `store_manager` (own-store offers only; any other
        offer is the same 404 as one that does not exist).
      operationId: consoleGetOffer
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-audit-action: offers.read
      tags: [offers-console]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The offer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/offers/{offer_id}/draft:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    put:
      summary: Replace the offer's draft (optimistic concurrency).
      description: >
        Replaces the draft with `definition` and increments `draftRevision`.
        Capability `offers.manage`: roles `owner`, `tenant_admin`.
        `expectedDraftRevision` is the `draftRevision` the caller last read,
        or `null` to start the next draft of a published offer that has
        none; any other value is 409 `offer_draft_changed_concurrently` and
        nothing is written. A draft can be edited while the offer is `draft`,
        `scheduled`, `active` or `paused`; tills keep applying the published
        version until the next publish. On an `ended` or `archived` offer it
        is 409 `offer_state_invalid`. Shape rules are 400 `validation_error`,
        as on create. A same-key retry with the same body replays the stored
        200.
      operationId: consoleUpdateOfferDraft
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-idempotency: required
      x-audit-action: offer.draft_updated
      tags: [offers-console]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferDraftUpdateRequest"
      responses:
        "200":
          description: The offer with its new draft revision.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "400":
          $ref: "#/components/responses/WriteValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferNotFound"
        "409":
          description: >
            `offer_draft_changed_concurrently` (the draft moved on since the
            caller read it), `offer_state_invalid` (the offer is `ended` or
            `archived`), or `idempotency_key_conflict` (the same key with a
            different body). Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferError"
        "425":
          $ref: "#/components/responses/InProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/offers/{offer_id}/preview:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      summary: Validate and preview the draft; changes nothing.
      description: >
        Validate → Preview (§18). Resolves the offer's current draft against
        the catalog and the other offers, and changes nothing: no state, no
        version, no Pack revision. Capability `offers.manage`: roles `owner`,
        `tenant_admin`. When `expectedDraftRevision` is sent and is not the
        current one, it is 409 `offer_draft_changed_concurrently`. An offer
        with no draft is 409 `offer_state_invalid`.


        The 200 reports every issue a publish would refuse for, in `issues`
        (codes from `OfferErrorCode`), so a preview with an empty `issues`
        list and no `conflicts` is publishable at that moment:
        `offer_reference_invalid` (a product, category, brand or store id
        that is not of the tenant, or is deleted; every brand id until the
        RT-1334 brands exist), `offer_eligible_set_empty`,
        `offer_eligible_set_too_large`, `offer_schedule_elapsed`. It
        returns the eligible-set count and a sample of up to 20 products
        (§5.2 rule 5), and the conflicts with other `scheduled`, `active` or
        `paused` offers (OD-7). An optional `simulation` (a list of cart
        unit prices) is evaluated with the spec 048 §6 algorithm and the
        draft's parameters, and returns the result a till would compute.
      operationId: consolePreviewOffer
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-audit-action: offers.previewed
      tags: [offers-console]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferPreviewRequest"
      responses:
        "200":
          description: The preview of the current draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPreview"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferNotFound"
        "409":
          description: >
            `offer_draft_changed_concurrently` or `offer_state_invalid` (the
            offer has no draft).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/offers/{offer_id}/publish:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      summary: Publish the draft as a new immutable version.
      description: >
        Publishes the draft named by `expectedDraftRevision` as the offer's
        next version (`version` 1, 2, …), which is immutable from then on;
        the draft is consumed (`draft` becomes null). Capability
        `offers.publish`: roles `owner`, `tenant_admin`. The offer becomes
        `scheduled` or `active` according to its schedule; a `paused` offer
        stays paused and the new version applies from its resume. A new Pack
        revision follows for every store in scope.


        Refusals, in this order, with nothing written: 409
        `offer_state_invalid` (the offer is `ended` or `archived`); 409
        `offer_draft_changed_concurrently` (no draft, or not the expected
        revision); 422 `offer_reference_invalid`, `offer_schedule_elapsed`
        (`endsAt` is already past in every store of the scope),
        `offer_eligible_set_empty` or `offer_eligible_set_too_large` (more
        than 20000 products, the Pack bound); then 409 `offer_conflict`
        (OD-7), whose body lists each conflicting offer and the number of
        shared products. A same-key retry with the same body replays the
        stored 200.
      operationId: consolePublishOffer
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-idempotency: required
      x-audit-action: offer.published
      tags: [offers-console]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferPublishRequest"
      responses:
        "200":
          description: The offer with its new current version.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "400":
          $ref: "#/components/responses/WriteValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferNotFound"
        "409":
          description: >
            `offer_state_invalid`, `offer_draft_changed_concurrently`,
            `offer_conflict` (with `error.conflicts`), or
            `idempotency_key_conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferError"
        "422":
          $ref: "#/components/responses/DefinitionUnprocessable"
        "425":
          $ref: "#/components/responses/InProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/offers/{offer_id}/pause:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      summary: Pause the whole offer, or only some stores (emergency stop).
      description: >
        Capability `offers.pause`. Without `storeIds` the whole offer is
        paused (`state` becomes `paused`): roles `owner`, `tenant_admin`;
        a `store_manager` is 403 `forbidden`. With `storeIds` only those
        stores are paused (`pausedStores`); `owner` and `tenant_admin` may
        name any store of the offer's scope, and a `store_manager` only
        stores within their own store scope (any other is 404
        `store_not_found`, non-disclosing). A store that is of the tenant
        but outside the offer's scope is 422 `offer_store_not_in_scope`.
        `reason` is required (1 to 500 characters, no PII) and is recorded
        on the audit row. Pausing never deletes history (§21).


        Only a `scheduled` or `active` offer can be paused (a store pause
        also on a `paused` one); any other state is 409
        `offer_state_invalid`. Pausing what is already paused is 200 with no
        change and no second audit row. A new Pack revision without the
        paused offer (or without it for the paused stores) follows at once.
        A till that is offline keeps applying the Pack it holds until it
        reads the new revision; Backend-Core judges such a sale against the
        Pack revision it cites (§19).
      operationId: consolePauseOffer
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-idempotency: required
      x-audit-action: offer.paused
      tags: [offers-console]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferPauseRequest"
      responses:
        "200":
          description: The offer with its pauses.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "400":
          $ref: "#/components/responses/WriteValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferOrStoreNotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          description: "`offer_store_not_in_scope`: a named store is not in the offer's store scope."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferError"
        "425":
          $ref: "#/components/responses/InProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/offers/{offer_id}/resume:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      summary: Resume a paused offer, or some paused stores.
      description: >
        Capability `offers.publish` (OD-12): roles `owner`, `tenant_admin`;
        a `store_manager` cannot resume, even a store they paused (403
        `forbidden`). Without `storeIds` it lifts the whole-offer pause and
        every store pause; with `storeIds` it lifts only those store pauses
        (a named store that is not paused is 422
        `offer_store_not_in_scope`). The offer returns to `scheduled`,
        `active` or `ended` according to its schedule. A resume is re-checked
        for conflicts like a publish (409 `offer_conflict`, OD-7). A resume
        of an offer with no pause is 409 `offer_state_invalid`. A new Pack
        revision follows.
      operationId: consoleResumeOffer
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-idempotency: required
      x-audit-action: offer.resumed
      tags: [offers-console]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferResumeRequest"
      responses:
        "200":
          description: The offer after the resume.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "400":
          $ref: "#/components/responses/WriteValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferOrStoreNotFound"
        "409":
          description: >
            `offer_state_invalid` (nothing is paused), `offer_conflict` (with
            `error.conflicts`), or `idempotency_key_conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferError"
        "422":
          description: "`offer_store_not_in_scope`: a named store is not a paused store of the offer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferError"
        "425":
          $ref: "#/components/responses/InProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/offers/{offer_id}/end:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      summary: End the offer now; it cannot be resumed.
      description: >
        Capability `offers.manage`: roles `owner`, `tenant_admin`. Ends a
        `scheduled`, `active` or `paused` offer at the server time: it is
        `ended` from then on and leaves the Pack (a new revision follows).
        An `ended` offer cannot be resumed or published again; a new offer is
        created instead. Ending an offer that is already `ended` is 200 with
        no change and no second audit row. A `draft` or `archived` offer is
        409 `offer_state_invalid`. Sales already captured keep their frozen
        facts (§20).
      operationId: consoleEndOffer
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-idempotency: required
      x-audit-action: offer.ended
      tags: [offers-console]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The ended offer.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "400":
          $ref: "#/components/responses/WriteValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferNotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "425":
          $ref: "#/components/responses/InProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/offers/{offer_id}/archive:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      summary: Archive an ended offer.
      description: >
        Capability `offers.manage`: roles `owner`, `tenant_admin`. Only an
        `ended` offer can be archived; any other state is 409
        `offer_state_invalid`. Archiving hides the offer from the default
        lists of the Admin Console and keeps every version, so the frozen
        facts of past sales still resolve (§21). Archiving an offer that is
        already `archived` is 200 with no change and no second audit row.
      operationId: consoleArchiveOffer
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-idempotency: required
      x-audit-action: offer.archived
      tags: [offers-console]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The archived offer.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "400":
          $ref: "#/components/responses/WriteValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferNotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "425":
          $ref: "#/components/responses/InProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/offers/{offer_id}/versions:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    get:
      summary: List the offer's published versions, newest first.
      description: >
        Keyset-paginated, newest `version` first. Each version is immutable
        and carries its full definition and the size of the eligible set it
        was published with. Roles: `owner`, `tenant_admin`, `store_manager`
        (own-store offers only).
      operationId: consoleListOfferVersions
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service or table for this route until the RT-1336
        schema and the RT-1337 runtime.
      x-audit-action: offers.versions_listed
      tags: [offers-console]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of versions. `nextCursor` is null on the last page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferVersionPage"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/pos/v1/store/offer-pack:
    get:
      summary: Read the paired terminal's current Offer Pack.
      description: >
        Spec 048 §7, OD-6, OD-8. The current Pack revision of the device's
        own tenant and store: every offer version that is `scheduled` or
        `active` for this store and not paused for it, with its parameters,
        its schedule resolved to absolute instants for this store, its
        offline policy and its **materialised eligible set** (product ids).
        Tenant and store come only from the device row; no query parameter is
        accepted. Send `If-None-Match` with the last `ETag`; an unchanged
        Pack is `304` with no body. The body may be large (an offer over a
        whole category can carry about 10 000 product ids); the response may
        be compressed when the request accepts it.


        **How the till applies it.** The till evaluates every offer with the
        spec 048 §6 algorithm (the golden vectors in
        `packages/contracts/fixtures/offers/golden-vectors.json`), matching
        product ids only; it never resolves a category or brand rule and
        never invents one (§19). A line with a manual discount, or with a
        non-whole quantity, never takes part (OD-5, F-9). Each sale line that
        takes part cites `offerId`, `offerVersion` and `packRevision` in
        `CaptureSaleLine.promotion` (`pos-sales/sales.yaml` 1.22.0-draft).


        **Trusted time (OD-8).** The till never applies a scheduled offer by
        trusting the workstation wall clock. Its "now" is `issuedAt` (the
        server time of the last successful read: the body's `issuedAt` on a
        200, the `X-Server-Time` header on a 304) plus the time elapsed since
        that read on a monotonic clock. An offer applies only while that
        "now" is at or after `startsAt` and before `endsAt` (when set).


        **Freshness.** The Pack is fresh for `freshnessWindowHours` (a tenant
        setting, 1 to 72, default 24) after the last successful read, 200 or
        304, measured on the same monotonic clock. A stale Pack applies no
        offer while the till is offline; online the till reads it again
        first.


        **Restart.** A restart loses the monotonic clock, so until the next
        successful read the till can neither compute "now" nor prove the
        Pack fresh: it treats the Pack as stale and applies no offer. This is
        fail-safe: the customer pays the regular price, and the cashier sees
        «العرض غير متاح بدون اتصال».


        **Offline policy.** `allow_cached` (the V1 default) applies the offer
        from a fresh Pack online and offline; `online_only` applies it only
        while the till reaches Backend-Core and captures the sale online
        (the RT-284 P-F vocabulary).


        **Revalidation on sync.** Backend-Core judges a sale against the Pack
        revision it cites, not against the current offers: a sale is not
        invalid because the offer has since been paused or ended (§19). A
        rule-level mismatch with the server's evaluation is accepted and
        flagged for review (OD-9); see `captureSale`.


        This operation is not (yet) one of the RT-719 build identity
        reporting operations or the RT-639 rotate-hint operations of
        `pos-terminal-pairing.openapi.yaml`; it joins those sets only by
        naming itself there when its runtime ships.
      operationId: posGetOfferPack
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-1335 (RT-286 S2) publishes the contract only. There is no
        controller, guard, service, table or Pack materialisation for this
        route until the RT-1336 schema and the RT-1337 runtime. Until then
        the POS must not call it, and applies no offer.
      tags: [offers-pos]
      security:
        - device: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The current Offer Pack of the device's store.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Server-Time:
              $ref: "#/components/headers/ServerTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPack"
        "304":
          description: >
            Unchanged since the `If-None-Match` ETag. No body. The read still
            counts as a successful read for trusted time and freshness, from
            `X-Server-Time`.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Server-Time:
              $ref: "#/components/headers/ServerTime"
        "400":
          $ref: "#/components/responses/DeviceValidationFailure"
        "401":
          $ref: "#/components/responses/DeviceUnauthorized"
        "500":
          $ref: "#/components/responses/SystemFailure"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dp2_session
      description: >
        The human dashboard session cookie (httpOnly `dp2_session`), verified
        by `SessionOnlyAdminGuard`. The only credential accepted on the
        Console operations: a machine bearer (`dashboard_api` included), a POS
        `device` token or an `operatorAuthorization` envelope is 401.
    device:
      type: http
      scheme: bearer
      description: >
        The paired terminal's opaque `devices` pairing token, presented as
        `Authorization: Bearer <device_token>` (the scheme of
        `posGetCashVariancePolicy`; NOT a JWT). The device row supplies the
        authoritative tenant and store; nothing in the request is trusted as
        scope. A missing, malformed, unknown or revoked token is the generic,
        non-disclosing 401.

  parameters:
    OfferId:
      name: offer_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: >
        An offer of the session's tenant (and, for a `store_manager`, one
        whose scope includes one of their stores); anything else is the
        non-disclosing 404 `offer_not_found`. A malformed id is 400
        `validation_error`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[\\x21-\\x7E]{16,128}$"
      description: >
        REQUIRED on every Console write: 16 to 128 printable ASCII characters
        with no whitespace (UUIDv7 recommended), as the shared
        `IdempotencyInterceptor` enforces. Keyed on the verified actor. An
        identical retry replays the stored response with
        `Idempotent-Replayed: true`; the same key with a different body is
        409 `idempotency_key_conflict`; a key still being processed is 425.
        Missing: 400 `idempotency_key_required`. Malformed: 400
        `idempotency_key_malformed`.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: "^[A-Za-z0-9_-]+$"
      description: >
        Opaque keyset cursor from a prior page's `nextCursor`. Do not decode
        or construct it; omit it for the first page. Reuse it only with the
        same filters. A value the server did not issue, or cannot decode, is
        400 `validation_error`.
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Maximum items per page. The server may return fewer.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
      description: The last `ETag` received; omit it when the cached Pack was lost.

  headers:
    IdempotentReplayed:
      description: Present with value `true` when this response replays an earlier request with the same key.
      schema:
        type: string
        enum: ["true"]
    ETag:
      description: >
        Strong ETag: the quoted lowercase hex SHA-256 of the canonical JSON
        (keys sorted, no whitespace) of the Pack body without `issuedAt`.
        It changes whenever any other field changes (a new `packRevision`,
        the store's timezone or freshness window), never only because time
        passed.
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
    CacheControl:
      description: Always `no-cache, private`; the POS revalidates every read.
      schema:
        type: string
        const: "no-cache, private"
    ServerTime:
      description: >
        The server time of this response (RFC 3339, UTC), on the 200 and the
        304. On a 200 it equals the body's `issuedAt`. It is the till's
        trusted-time anchor (OD-8); it is not part of the ETag.
      required: true
      schema:
        type: string
        format: date-time
    ConsoleRetryAfter:
      description: >
        Whole seconds the caller should wait before retrying, sent on every
        console 429 (RT-574 D5). Its own bound, 1 to 3600.
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 3600

  schemas:
    # -----------------------------------------------------------------------
    # Primitives
    # -----------------------------------------------------------------------
    DecimalAmount:
      type: string
      pattern: '^[0-9]{1,15}(\.[0-9]{1,4})?$'
      description: >
        Non-negative exact-decimal amount as a string (gate A.6, never a
        float), with no more fractional digits than the currency's ISO-4217
        minor unit.
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO-4217 alphabetic currency code.
    WholePercent:
      type: string
      pattern: '^(100|[1-9][0-9]?)$'
      description: >
        A whole percent from `1` to `100` as a string, the same domain and
        pattern as the RT-740 manual percent discount. `100` makes the
        reward unit free.
    OfferState:
      type: string
      enum: [draft, scheduled, active, paused, ended, archived]
      description: >
        The derived lifecycle state (§16; see the info description).
        `scheduled`, `active` and `ended` follow from the schedule and the
        server time when read.
    OfferType:
      type: string
      const: buy_x_get_y_percent
      description: The only offer type of V1 (spec 048 §3.1).
    OfflinePolicy:
      type: string
      enum: [allow_cached, online_only]
      default: allow_cached
      description: >
        RT-284 P-F vocabulary. `allow_cached` (the V1 default for automatic
        offers) applies the offer from a fresh Pack online and offline;
        `online_only` applies it only on an online sale.
    UuidList:
      type: array
      maxItems: 5000
      uniqueItems: true
      items: { type: string, format: uuid }

    # -----------------------------------------------------------------------
    # The offer definition (spec 048 §5)
    # -----------------------------------------------------------------------
    BuyXGetYPercentParameters:
      type: object
      additionalProperties: false
      required: [buyQuantity, getQuantity, percentOff, rewardSelection, maxApplicationsPerSale, priceBasis]
      description: >
        Spec 048 §5.1. "Buy one, get the second at 40% off" is `buyQuantity`
        1, `getQuantity` 1, `percentOff` "40", `rewardSelection` `cheapest`.
        The reward of each application goes to the cheapest eligible units
        of the whole basket (OD-2), and the discount of a reward unit is
        `percentOff`% of its unit price, rounded half up once at the currency
        minor unit (OD-28-3).
      properties:
        buyQuantity:
          type: integer
          minimum: 1
          maximum: 1000
          description: X, the units that trigger one application.
        getQuantity:
          type: integer
          minimum: 1
          maximum: 1000
          description: Y, the reward units of one application.
        percentOff:
          $ref: "#/components/schemas/WholePercent"
        rewardSelection:
          type: string
          const: cheapest
          description: >
            The only value in V1. A field of the offer, never implicit (§17).
        maxApplicationsPerSale:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000
          description: Null means unlimited.
        priceBasis:
          type: string
          const: resolved_store_price
          description: >
            The only value in V1: the regular unit price the POS shows, after
            the store override (§16 price basis).
    EligibilitySet:
      type: object
      additionalProperties: false
      description: >
        Products, categories and brands, each a list of ids of the tenant.
        An omitted list is empty. A product with no category, or no brand,
        never matches a category or brand rule. Brand ids refer to the
        catalog brands of RT-1334 (S1), which are not live yet: until they
        are, any brand id is `offer_reference_invalid` at preview and
        publish.
      properties:
        productIds:
          $ref: "#/components/schemas/UuidList"
        categoryIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        brandIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
    EligibilityInclude:
      description: >
        The include set. It must name at least one product, category or
        brand (§5.2 rule 1: a whole-catalog offer is out of V1), else 400
        `validation_error`.
      allOf:
        - $ref: "#/components/schemas/EligibilitySet"
        - anyOf:
            - required: [productIds]
              properties:
                productIds: { minItems: 1 }
            - required: [categoryIds]
              properties:
                categoryIds: { minItems: 1 }
            - required: [brandIds]
              properties:
                brandIds: { minItems: 1 }
    Eligibility:
      type: object
      additionalProperties: false
      required: [include]
      description: >
        Spec 048 §5.2. A product is eligible when it matches ANY include
        entry and NO exclude entry: exclusion always wins, whatever its
        dimension (OD-1). Retired or inactive products are never eligible.
        Backend-Core resolves the set (OD-6); the result is the eligible set
        of the version, materialised into each Pack revision.
      properties:
        include:
          $ref: "#/components/schemas/EligibilityInclude"
        exclude:
          $ref: "#/components/schemas/EligibilitySet"
    StoreScope:
      description: >
        Either the whole chain (`allStores: true`, which includes stores
        added later) or an explicit list of stores, which never grows by
        itself.
      oneOf:
        - type: object
          additionalProperties: false
          required: [allStores]
          properties:
            allStores:
              type: boolean
              const: true
        - type: object
          additionalProperties: false
          required: [storeIds]
          properties:
            storeIds:
              type: array
              minItems: 1
              maxItems: 500
              uniqueItems: true
              items: { type: string, format: uuid }
    OfferSchedule:
      type: object
      additionalProperties: false
      required: [timeBasis, startsAt]
      description: >
        The offer window, `[startsAt, endsAt)`; no `endsAt` means open-ended.
        Spec 041 §4.3 conventions. `store_local` (the default for authoring):
        `startsAt` and `endsAt` are local date-times without an offset
        (`2026-12-01T00:00` or `2026-12-01T00:00:00`), interpreted in each
        store's IANA timezone, so the offer opens at local midnight in every
        store; a local time in a spring-forward gap resolves to the first
        valid instant after it, and one that occurs twice to the earlier
        occurrence. `absolute`: RFC 3339 instants with an offset, the same
        for every store. `endsAt` must be after `startsAt` (400
        `validation_error`).
      properties:
        timeBasis:
          type: string
          enum: [store_local, absolute]
        startsAt:
          type: string
          maxLength: 40
        endsAt:
          type: [string, "null"]
          maxLength: 40
      allOf:
        - if:
            properties:
              timeBasis: { const: store_local }
            required: [timeBasis]
          then:
            properties:
              startsAt:
                pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?$'
              endsAt:
                anyOf:
                  - type: "null"
                  - type: string
                    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?$'
        - if:
            properties:
              timeBasis: { const: absolute }
            required: [timeBasis]
          then:
            properties:
              startsAt:
                format: date-time
                pattern: '(Z|[+-][0-9]{2}:[0-9]{2})$'
              endsAt:
                anyOf:
                  - type: "null"
                  - type: string
                    format: date-time
                    pattern: '(Z|[+-][0-9]{2}:[0-9]{2})$'
    OfferDefinition:
      type: object
      additionalProperties: false
      required: [nameAr, type, parameters, eligibility, storeScope, schedule]
      description: >
        Everything a version freezes (spec 048 §4): names, type, parameters,
        eligibility rules, store scope, schedule and offline policy. V1
        offers are exclusive (OD-5): a line with a manual discount never
        takes part, and a unit belongs to at most one offer (OD-7).
      properties:
        nameAr:
          type: string
          minLength: 1
          maxLength: 120
          description: Arabic name, shown to the cashier and on the receipt.
        nameEn:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
          description: Optional English name.
        type:
          $ref: "#/components/schemas/OfferType"
        parameters:
          $ref: "#/components/schemas/BuyXGetYPercentParameters"
        eligibility:
          $ref: "#/components/schemas/Eligibility"
        storeScope:
          $ref: "#/components/schemas/StoreScope"
        schedule:
          $ref: "#/components/schemas/OfferSchedule"
        offlinePolicy:
          $ref: "#/components/schemas/OfflinePolicy"

    # -----------------------------------------------------------------------
    # Requests
    # -----------------------------------------------------------------------
    OfferDraftCreateRequest:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition:
          $ref: "#/components/schemas/OfferDefinition"
    OfferDraftUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, definition]
      properties:
        expectedDraftRevision:
          type: [integer, "null"]
          minimum: 1
          description: >
            The `draftRevision` the caller last read, or null when the offer
            has no draft (after a publish).
        definition:
          $ref: "#/components/schemas/OfferDefinition"
    OfferPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        expectedDraftRevision:
          type: integer
          minimum: 1
          description: Optional. When sent, the preview is refused if the draft moved on.
        simulation:
          $ref: "#/components/schemas/OfferSimulationRequest"
    OfferSimulationRequest:
      type: object
      additionalProperties: false
      required: [currencyCode, lines]
      description: >
        A cart to evaluate with the draft's parameters (§10 "cart of these
        prices → result"). A line without `productId` is treated as an
        eligible unit price; a line with one is eligible when the product is
        in the draft's eligible set. Lines are taken in the order sent, which
        breaks price ties (§6 step 2).
      properties:
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/OfferSimulationLine"
    OfferSimulationLine:
      type: object
      additionalProperties: false
      required: [unitPrice]
      properties:
        unitPrice:
          $ref: "#/components/schemas/DecimalAmount"
        quantity:
          type: integer
          minimum: 1
          maximum: 999
          default: 1
        productId:
          type: string
          format: uuid
    OfferPublishRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision]
      properties:
        expectedDraftRevision:
          type: integer
          minimum: 1
          description: The draft revision that was previewed and is to be published.
    OfferPauseRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the offer is paused. Required, recorded on the audit row. No PII.
        storeIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
          description: >
            Absent: pause the whole offer (`owner`, `tenant_admin`). Present:
            pause only these stores (also `store_manager`, within their own
            store scope).
    OfferResumeRequest:
      type: object
      additionalProperties: false
      properties:
        storeIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
          description: "Absent: lift every pause. Present: lift only these store pauses."

    # -----------------------------------------------------------------------
    # Console reads
    # -----------------------------------------------------------------------
    OfferDraft:
      type: object
      additionalProperties: false
      required: [draftRevision, definition, updatedAt, updatedByUserId]
      properties:
        draftRevision:
          type: integer
          minimum: 1
          description: The optimistic-concurrency token of the draft.
        definition:
          $ref: "#/components/schemas/OfferDefinition"
        updatedAt: { type: string, format: date-time }
        updatedByUserId: { type: string, format: uuid }
    OfferVersion:
      type: object
      additionalProperties: false
      required: [version, definition, publishedAt, publishedByUserId, eligibleSetCount]
      description: An immutable published version (§16).
      properties:
        version:
          type: integer
          minimum: 1
        definition:
          $ref: "#/components/schemas/OfferDefinition"
        publishedAt: { type: string, format: date-time }
        publishedByUserId: { type: string, format: uuid }
        eligibleSetCount:
          type: integer
          minimum: 0
          description: The size of the eligible set at publish; the materialised set can change with the catalog (OD-6).
    OfferPause:
      type: object
      additionalProperties: false
      required: [pausedAt, pausedByUserId, reason]
      properties:
        pausedAt: { type: string, format: date-time }
        pausedByUserId: { type: string, format: uuid }
        reason:
          type: string
          minLength: 1
          maxLength: 500
    OfferStorePause:
      type: object
      additionalProperties: false
      required: [storeId, pausedAt, pausedByUserId, reason]
      properties:
        storeId: { type: string, format: uuid }
        pausedAt: { type: string, format: date-time }
        pausedByUserId: { type: string, format: uuid }
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Offer:
      type: object
      additionalProperties: false
      required:
        - offerId
        - state
        - draft
        - currentVersion
        - pause
        - pausedStores
        - createdAt
        - updatedAt
        - endedAt
        - archivedAt
      properties:
        offerId: { type: string, format: uuid }
        state:
          $ref: "#/components/schemas/OfferState"
        draft:
          description: The draft of the next version, or null.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/OfferDraft"
        currentVersion:
          description: The latest published version, or null before the first publish.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/OfferVersion"
        pause:
          description: The whole-offer pause, or null.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/OfferPause"
        pausedStores:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/OfferStorePause"
          description: The store-level pauses; empty when none.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        endedAt:
          type: [string, "null"]
          format: date-time
          description: When the offer was ended explicitly; null otherwise (a window that closed by itself leaves it null).
        archivedAt:
          type: [string, "null"]
          format: date-time
    OfferSummary:
      type: object
      additionalProperties: false
      required: [offerId, state, nameAr, nameEn, currentVersion, hasDraft, schedule, storeScope, updatedAt]
      description: >
        One row of the offers list. Names, schedule and scope are those of
        the current version, or of the draft before the first publish.
      properties:
        offerId: { type: string, format: uuid }
        state:
          $ref: "#/components/schemas/OfferState"
        nameAr:
          type: string
        nameEn:
          type: [string, "null"]
        currentVersion:
          type: [integer, "null"]
          minimum: 1
        hasDraft:
          type: boolean
        schedule:
          $ref: "#/components/schemas/OfferSchedule"
        storeScope:
          $ref: "#/components/schemas/StoreScope"
        updatedAt: { type: string, format: date-time }
    OfferPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OfferSummary"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the last page.
    OfferVersionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OfferVersion"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the last page.

    # -----------------------------------------------------------------------
    # Preview
    # -----------------------------------------------------------------------
    OfferConflict:
      type: object
      additionalProperties: false
      required: [offerId, offerVersion, nameAr, state, sharedProductCount, sharedProductSample]
      description: >
        Another offer whose eligible set shares products with this one, in a
        shared store, during an overlapping window (OD-7).
      properties:
        offerId: { type: string, format: uuid }
        offerVersion:
          type: integer
          minimum: 1
        nameAr:
          type: string
        state:
          type: string
          enum: [scheduled, active, paused]
        sharedProductCount:
          type: integer
          minimum: 1
        sharedProductSample:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
          description: Up to 20 of the shared product ids.
    OfferPreviewIssue:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - offer_reference_invalid
            - offer_eligible_set_empty
            - offer_eligible_set_too_large
            - offer_schedule_elapsed
        field:
          type: [string, "null"]
          maxLength: 200
          description: A JSON pointer into the definition, such as `/eligibility/include/brandIds/0`, when the issue has one.
        message:
          type: string
          description: Non-disclosing; never names another tenant's data.
    OfferEligibleProduct:
      type: object
      additionalProperties: false
      required: [productId, sku, name]
      properties:
        productId: { type: string, format: uuid }
        sku:
          type: [string, "null"]
        name:
          type: string
    OfferSimulationResultLine:
      type: object
      additionalProperties: false
      required: [lineIndex, unitPrice, quantity, eligible, discountAmount, lineAmount]
      description: >
        One line after the §6 step-6 split: each reward unit is its own line
        with quantity 1 and `lineAmount = unitPrice − discountAmount`; the
        rest of the source line keeps `lineAmount = unitPrice × quantity`.
      properties:
        lineIndex:
          type: integer
          minimum: 0
          description: The 0-based index of the request line this line came from.
        unitPrice:
          $ref: "#/components/schemas/DecimalAmount"
        quantity:
          type: integer
          minimum: 1
        eligible:
          type: boolean
        discountAmount:
          $ref: "#/components/schemas/DecimalAmount"
        lineAmount:
          $ref: "#/components/schemas/DecimalAmount"
    OfferSimulationResult:
      type: object
      additionalProperties: false
      required: [currencyCode, applications, totalDiscount, total, lines]
      properties:
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        applications:
          type: integer
          minimum: 0
          description: "`k` of §6 step 3."
        totalDiscount:
          $ref: "#/components/schemas/DecimalAmount"
        total:
          $ref: "#/components/schemas/DecimalAmount"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OfferSimulationResultLine"
    OfferPreview:
      type: object
      additionalProperties: false
      required: [offerId, draftRevision, publishable, issues, eligibleSet, conflicts, simulation]
      properties:
        offerId: { type: string, format: uuid }
        draftRevision:
          type: integer
          minimum: 1
        publishable:
          type: boolean
          description: True when `issues` and `conflicts` are both empty at this moment.
        issues:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OfferPreviewIssue"
        eligibleSet:
          type: object
          additionalProperties: false
          required: [count, sample]
          properties:
            count:
              type: integer
              minimum: 0
            sample:
              type: array
              maxItems: 20
              items:
                $ref: "#/components/schemas/OfferEligibleProduct"
        conflicts:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/OfferConflict"
        simulation:
          description: The simulation result, or null when no simulation was sent.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/OfferSimulationResult"

    # -----------------------------------------------------------------------
    # POS Offer Pack (spec 048 §7)
    # -----------------------------------------------------------------------
    OfferPack:
      type: object
      additionalProperties: false
      required: [packRevision, issuedAt, freshnessWindowHours, storeTimezone, currencyCode, offers]
      properties:
        packRevision:
          type: integer
          minimum: 0
          description: >
            The tenant-wide, monotonically increasing Pack revision. `0` when
            the tenant has never published an offer (`offers` is empty).
            A sale line cites it in `CaptureSaleLine.promotion.packRevision`.
        issuedAt:
          type: string
          format: date-time
          description: The server time of this response (OD-8); equal to `X-Server-Time`. Not part of the ETag.
        freshnessWindowHours:
          type: integer
          minimum: 1
          maximum: 72
          default: 24
          description: The tenant's Pack freshness window (OD-8).
        storeTimezone:
          type: string
          minLength: 1
          maxLength: 64
          description: The store's IANA timezone, used to resolve `store_local` schedules.
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        offers:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PackOffer"
    PackOffer:
      type: object
      additionalProperties: false
      required:
        - offerId
        - offerVersion
        - nameAr
        - type
        - parameters
        - startsAt
        - endsAt
        - offlinePolicy
        - eligibleProductIds
      properties:
        offerId: { type: string, format: uuid }
        offerVersion:
          type: integer
          minimum: 1
        nameAr:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        type:
          $ref: "#/components/schemas/OfferType"
        parameters:
          $ref: "#/components/schemas/BuyXGetYPercentParameters"
        startsAt:
          type: string
          format: date-time
          description: The window start resolved to an absolute instant for this store.
        endsAt:
          type: [string, "null"]
          format: date-time
          description: The window end resolved for this store; null when open-ended.
        offlinePolicy:
          type: string
          enum: [allow_cached, online_only]
        eligibleProductIds:
          type: array
          minItems: 1
          maxItems: 20000
          uniqueItems: true
          items: { type: string, format: uuid }
          description: >
            The materialised eligible set of this version in this Pack
            revision (OD-6): the till matches product ids only.

    # -----------------------------------------------------------------------
    # Errors
    # -----------------------------------------------------------------------
    OfferErrorCode:
      type: string
      description: >
        The closed error set of this surface: the offer and idempotency
        codes, plus the two platform codes `origin_rejected` (RT-430) and
        `rate_limited` (RT-574).
      enum:
        - validation_error
        - forbidden
        - offer_not_found
        - store_not_found
        - offer_state_invalid
        - offer_draft_changed_concurrently
        - offer_conflict
        - offer_reference_invalid
        - offer_schedule_elapsed
        - offer_eligible_set_empty
        - offer_eligible_set_too_large
        - offer_store_not_in_scope
        - idempotency_key_required
        - idempotency_key_malformed
        - idempotency_key_conflict
        - origin_rejected
        - rate_limited
    Error:
      description: >
        The canonical error envelope (code, message, request_id). `code` is a
        free string, as in the sibling contracts: the platform guards answer
        401, 403 and 500 with codes this contract does not own, and a client
        must not fail to decode one it does not know. The offer-domain 400,
        404, 409 and 422 bodies use `OfferError`, whose `code` is the closed
        set.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
              description: Non-disclosing; never carries another tenant's data.
            request_id:
              type: string
              format: uuid
    OfferError:
      description: >
        The error envelope of the offer-domain 400, 404, 409 and 422
        responses. `code` is one of the closed `OfferErrorCode` set.
        `conflicts` is present only with `offer_conflict`.
      type: object
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/OfferErrorCode"
            message:
              type: string
              description: Non-disclosing; never carries another tenant's data.
            request_id:
              type: string
              format: uuid
            conflicts:
              type: array
              minItems: 1
              maxItems: 50
              items:
                $ref: "#/components/schemas/OfferConflict"
    IdempotencyInProgress:
      type: object
      additionalProperties: false
      required: [error, retryAfterSec]
      description: >
        The platform idempotency interceptor's 425 body (not the canonical
        envelope).
      properties:
        error:
          type: string
          enum: [idempotency_in_progress]
        retryAfterSec:
          type: integer
          minimum: 1

  responses:
    ValidationFailure:
      description: >
        400 `validation_error`: a malformed path id, query parameter, cursor
        or body. Checked before any database read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OfferError"
    WriteValidationFailure:
      description: >
        400: `validation_error` (a malformed path id or body, an unknown key,
        a bound exceeded, an `include` that names nothing, an `endsAt` not
        after `startsAt`, a schedule value that does not fit its
        `timeBasis`), `idempotency_key_required` or
        `idempotency_key_malformed`. Checked before any database read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OfferError"
    Unauthorized:
      description: No valid session cookie (`401`). 401 semantics are owned by spec 028.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        `forbidden`: the session user's role does not hold the operation's
        capability (OD-12): a role other than `owner`, `tenant_admin` or
        `store_manager` on any operation, or a `store_manager` on any
        operation other than the three reads and a store-level pause
        (create, edit, preview, publish, resume, end, archive, and a
        whole-offer pause without `storeIds`). Also `origin_rejected` (RT-430) on the POST and PUT
        operations: the request is authenticated by the `dp2_session`
        cookie and its `Origin` header is missing, or is neither the API's
        own origin nor listed in `ALLOWED_ORIGINS`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OfferNotFound:
      description: >
        `offer_not_found`. Non-disclosing: the same body for an offer of
        another tenant, an offer outside a `store_manager`'s stores and one
        that never existed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OfferError"
    StoreNotFound:
      description: >
        `store_not_found`: the store is not a store of the tenant, or is
        outside a `store_manager`'s store scope. Non-disclosing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OfferError"
    OfferOrStoreNotFound:
      description: >
        `offer_not_found` (see `OfferNotFound`), or `store_not_found`: a
        named store is not a store of the tenant, or is outside a
        `store_manager`'s store scope. Non-disclosing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OfferError"
    StateConflict:
      description: >
        `offer_state_invalid` (the transition is not allowed from the
        offer's current state), or `idempotency_key_conflict` (the same key
        with a different request). Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OfferError"
    IdempotencyConflict:
      description: >
        `idempotency_key_conflict`: the same key was used with a different
        body. Terminal for that key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OfferError"
    DefinitionUnprocessable:
      description: >
        422 on publish: `offer_reference_invalid`, `offer_schedule_elapsed`,
        `offer_eligible_set_empty` or `offer_eligible_set_too_large` (see
        `consolePublishOffer`). `consolePreviewOffer` reports the same
        issues in its 200. Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OfferError"
    InProgress:
      description: >
        Too Early (425): a request with this `Idempotency-Key` is still in
        progress. Retrying after `Retry-After` seconds with the same key and
        body is safe: it replays the stored response. The body is the
        platform's `IdempotencyInProgress`, not the canonical envelope.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IdempotencyInProgress"
    DeviceValidationFailure:
      description: >
        400 `validation_error`: a malformed `If-None-Match`, or an unknown
        query parameter. Checked before any database read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeviceUnauthorized:
      description: >
        401 `unauthorized`: a missing, invalid or revoked device token, or a
        non-device credential. Non-disclosing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SystemFailure:
      description: >
        500 `internal_error`: an unexpected server error, recorded
        server-side under `request_id` and never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >
        429 `rate_limited` (RT-574): the caller's per-user budget for this
        class of operation is spent. The body is the canonical error envelope
        with a non-disclosing message; its `request_id` equals the
        `X-Request-Id` response header. Honour `Retry-After`; never
        auto-retry a mutation. A 429 is not a 401: it never means the
        session ended.
      headers:
        Retry-After:
          $ref: "#/components/headers/ConsoleRetryAfter"
        Cache-Control:
          description: Always `no-store` on a 429.
          required: true
          schema:
            type: string
            enum: [no-store]
        X-Request-Id:
          description: >
            The request id, equal to `error.request_id` in the body: the
            inbound `X-Request-Id` when it is a well-formed UUID, otherwise a
            server-minted one.
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
