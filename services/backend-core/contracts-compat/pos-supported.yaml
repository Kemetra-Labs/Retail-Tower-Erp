# POS compatibility matrix (RT-713, schema retail-tower/pos-compat@1, RT-709 §C.1).
#
# Fleet evidence is the authority for "installed", never git tags. Each supported
# entry references a Backend-Core contract snapshot by commit and git blob (verified
# against git history by check.mjs): no YAML is copied here, so nothing can drift.
# Dropping an entry is an explicit, reviewed change (and removes its accepted breaks).
