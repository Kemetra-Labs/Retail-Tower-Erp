<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>دخول POS - شاشة قفل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&amp;family=Tajawal:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
button{transition:background-color 150ms ease-out,border-color 150ms ease-out}
@media (prefers-reduced-motion: reduce){button{transition:none}}
</style>
</helmet>
<div dir="rtl" style="--color-canvas: #f2f5f6; --color-surface: #ffffff; --color-surface-sunken: #eef2f6; --color-text: #0f1d2e; --color-text-muted: #53647a; --color-ink: #0a2125; --color-ink-muted: #a9c2c5; --color-mint: #5fe0cf; --color-primary: #0f766e; --color-primary-emphasis: #0b5b55; --color-primary-soft: #e6f4f1; --color-border: #d8dfe7; --color-border-soft: #e7ecf2; --color-border-strong: #6f7b89; --elevation-overlay: 0 24px 60px -20px rgba(0, 0, 0, 0.55); width: 1920px; height: 1080px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--color-ink); color: var(--color-text); font-family: 'Dubai', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 1.6">

<svg aria-hidden="true" viewBox="0 0 1920 1080" width="1920" height="1080" style="position: absolute; inset: 0">
<defs>
<pattern id="tower-grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" style="stroke: var(--color-mint)" stroke-opacity="0.06" stroke-width="1"/></pattern>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" style="stop-color: var(--color-mint)" stop-opacity="0.16"/><stop offset="1" style="stop-color: var(--color-mint)" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1920" height="1080" fill="url(#tower-grid)"/>
<ellipse cx="960" cy="560" rx="900" ry="620" fill="url(#glow)"/>
</svg>

<header style="position: absolute; inset-inline: 0; inset-block-start: 0; height: 96px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 56px">
<div style="flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #5fe0cf 0%, #0f766e 100%)">
<svg role="img" aria-label="شعار المنتج" viewBox="0 0 64 64" width="28" height="28" fill="#0a2125"><rect x="8" y="36" width="12" height="20" rx="3"/><rect x="26" y="22" width="12" height="34" rx="3"/><rect x="44" y="8" width="12" height="48" rx="3"/></svg>
</div>
<div dir="ltr" style="font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 28px; font-weight: 600; color: #ffffff">POS Pulse</div>
<div style="margin-inline-start: auto; color: var(--color-ink-muted); font-size: 15px">الجهاز <b style="margin-inline-start: 6px; color: #ffffff; font-weight: 700"><bdi>[اسم الجهاز]</bdi></b></div>
</header>

<main style="position: absolute; inset-inline: 0; inset-block: 96px 0; display: grid; place-items: center">
<section aria-labelledby="signin-h" style="width: 1040px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 20px; background: var(--color-surface); box-shadow: var(--elevation-overlay)">

<div style="display: flex; align-items: center; gap: 16px; min-height: 88px; box-sizing: border-box; padding: 16px 32px; border-bottom: 1px solid var(--color-border-soft)">
<div style="flex: 1; min-width: 0">
<h1 id="signin-h" style="margin: 0; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.3">تسجيل الدخول</h1>
<p style="margin: 0; color: var(--color-text-muted); font-size: 15px">كل عمليات الوردية تُسجَّل باسمك.</p>
</div>
<button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>
دخول المدير
</button>
</div>

<ul aria-label="الكاشير في هذا الفرع" style="margin: 0; padding: 20px 32px; list-style: none; display: flex; justify-content: center; gap: 14px; border-bottom: 1px solid var(--color-border-soft)">
<sc-for list="{{roster}}" as="item" hint-placeholder-count="6">
<li>
<sc-if value="{{item.selected}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 140px; height: 124px; box-sizing: border-box; padding: 8px; border: 1px solid var(--color-primary); border-radius: 12px; background: var(--color-primary-soft); color: var(--color-primary-emphasis); font: inherit; cursor: pointer">
<span aria-hidden="true" style="display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--color-ink); color: var(--color-mint); font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 26px; font-weight: 600; line-height: 1">{{item.initial}}</span>
<span style="font-size: 16px; font-weight: 700">{{item.name}}</span>
</button>
</sc-if>
<sc-if value="{{item.idle}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 140px; height: 124px; box-sizing: border-box; padding: 8px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); font: inherit; cursor: pointer">
<span aria-hidden="true" style="display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--color-ink); color: var(--color-mint); font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 26px; font-weight: 600; line-height: 1">{{item.initial}}</span>
<span style="font-size: 16px; font-weight: 600">{{item.name}}</span>
</button>
</sc-if>
</li>
</sc-for>
</ul>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; box-sizing: border-box; padding: 24px 32px">
<div style="width: 340px; display: flex; align-items: center; gap: 12px; min-height: 48px">
<div style="flex: 1; min-width: 0">
<div style="font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 17px; font-weight: 600; line-height: 1.3">منى عادل</div>
<span style="display: block; color: var(--color-text-muted); font-size: 12px">الكاشير</span>
</div>
<button type="button" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: var(--color-text-muted); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
رجوع
</button>
</div>
<div role="group" aria-label="الرقم السري" dir="ltr" style="width: 340px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 16px; height: 56px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface)">
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-border-strong); border-radius: 9999px"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-border-strong); border-radius: 9999px"></span>
</div>
<div style="width: 340px; min-height: 70px"></div>
<div dir="ltr" style="width: 340px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<div>
<sc-if value="{{k.blank}}" hint-placeholder-val="{{ false }}"><div style="height: 64px"></div></sc-if>
<sc-if value="{{k.digit}}" hint-placeholder-val="{{ true }}"><button type="button" style="display: grid; place-items: center; width: 100%; height: 64px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 28px; font-weight: 600; cursor: pointer">{{k.label}}</button></sc-if>
<sc-if value="{{k.back}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="حذف" style="display: grid; place-items: center; width: 100%; height: 64px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg></button></sc-if>
</div>
</sc-for>
</div>
<button type="button" style="margin-top: 4px; width: 340px; height: 60px; border: 0; border-radius: 12px; background: var(--color-ink); color: #ffffff; box-shadow: 0 6px 14px -6px rgba(10, 33, 37, 0.55); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer">دخول</button>
</div>

</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['أحمد سمير', 'منى عادل', 'خالد يوسف', 'سارة محمود', 'هدى إبراهيم', 'عمر حسن'];
    const roster = names.map((name, i) => ({
      name,
      initial: Array.from(name)[0],
      selected: i === 1,
      idle: i !== 1
    }));
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'];
    const keys = labels.map((label) => ({ label, blank: label === '', digit: label !== '' && label !== 'back', back: label === 'back' }));
    return { roster, keys };
  }
}
</script>
</body>
</html>
