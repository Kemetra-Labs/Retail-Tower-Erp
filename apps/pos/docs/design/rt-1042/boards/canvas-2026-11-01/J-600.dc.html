<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>دخول POS - تكوين H على 1024x600</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&amp;family=Tajawal:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button:focus-visible{outline:2px solid #0f766e;outline-offset:2px}
</style>
</helmet>
<div dir="rtl" style="--color-canvas: #f2f5f6; --color-surface: #ffffff; --color-text: #0f1d2e; --color-text-muted: #53647a; --color-ink: #0a2125; --color-ink-muted: #a9c2c5; --color-mint: #5fe0cf; --color-primary: #0f766e; --color-primary-emphasis: #0b5b55; --color-primary-soft: #e6f4f1; --color-border: #d8dfe7; --color-border-soft: #e7ecf2; --color-border-strong: #6f7b89; width: 1024px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--color-canvas); color: var(--color-text); font-family: 'Dubai', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 1.5">

<header style="flex: none; position: relative; overflow: hidden; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--color-ink)">
<svg aria-hidden="true" viewBox="0 0 1024 56" width="1024" height="56" style="position: absolute; inset: 0">
<defs><pattern id="tower-grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" style="stroke: var(--color-mint)" stroke-opacity="0.06" stroke-width="1"/></pattern></defs>
<rect width="1024" height="56" fill="url(#tower-grid)"/>
</svg>
<div style="position: relative; flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #5fe0cf 0%, #0f766e 100%)">
<svg role="img" aria-label="شعار المنتج" viewBox="0 0 64 64" width="20" height="20" fill="#0a2125"><rect x="8" y="36" width="12" height="20" rx="3"/><rect x="26" y="22" width="12" height="34" rx="3"/><rect x="44" y="8" width="12" height="48" rx="3"/></svg>
</div>
<div dir="ltr" style="position: relative; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 22px; font-weight: 600; color: #ffffff">POS Pulse</div>
<div aria-hidden="true" style="position: relative; width: 1px; height: 20px; background: rgba(169, 194, 197, 0.3)"></div>
<div style="position: relative; color: var(--color-ink-muted)">الجهاز <b style="margin-inline-start: 4px; color: #ffffff; font-weight: 700"><bdi>[اسم الجهاز]</bdi></b></div>
</header>

<div style="flex: 1; min-height: 0; display: flex">

<main style="flex: 1; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 12px 16px">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 style="margin: 0; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3">تسجيل الدخول</h1>
<p style="margin: 0; color: var(--color-text-muted); font-size: 13px">كل عمليات الوردية تُسجَّل باسمك.</p>
</div>
<section aria-labelledby="roster-h" style="display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: 16px; background: var(--color-surface)">
<div style="display: flex; align-items: center; min-height: 44px; box-sizing: border-box; padding: 8px 16px; border-bottom: 1px solid var(--color-border-soft)">
<h2 id="roster-h" style="margin: 0; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 15px; font-weight: 600">الكاشير في هذا الفرع</h2>
</div>
<ul style="margin: 0; padding: 12px; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{roster}}" as="item" hint-placeholder-count="8">
<li>
<sc-if value="{{item.selected}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" style="position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 56px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--color-primary); border-radius: 12px; background: var(--color-primary-soft); color: var(--color-primary-emphasis); font: inherit; text-align: start; cursor: pointer">
<span aria-hidden="true" style="position: absolute; inset-block: 8px; inset-inline-start: -1px; width: 2px; border-radius: 2px; background: var(--color-primary)"></span>
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--color-ink); color: var(--color-mint); font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 17px; font-weight: 600; line-height: 1">{{item.initial}}</span>
<span style="font-size: 15px; font-weight: 700">{{item.name}}</span>
</button>
</sc-if>
<sc-if value="{{item.idle}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 56px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); font: inherit; text-align: start; cursor: pointer">
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--color-ink); color: var(--color-mint); font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 17px; font-weight: 600; line-height: 1">{{item.initial}}</span>
<span style="font-size: 15px; font-weight: 600">{{item.name}}</span>
</button>
</sc-if>
</li>
</sc-for>
</ul>
<div style="display: flex; align-items: center; padding: 8px 16px; border-top: 1px solid var(--color-border-soft)">
<button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>
دخول المدير
</button>
</div>
</section>
</main>

<aside aria-labelledby="auth-h" style="flex: none; width: 320px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--color-surface); border-inline-start: 1px solid var(--color-border)">
<div style="flex: none; display: flex; align-items: center; gap: 10px; min-height: 48px">
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--color-ink); color: var(--color-mint); outline: 2px solid var(--color-primary); outline-offset: 2px; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 19px; font-weight: 600; line-height: 1">م</span>
<div style="flex: 1; min-width: 0">
<h2 id="auth-h" style="margin: 0; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 16px; font-weight: 600; line-height: 1.3">منى عادل</h2>
<span style="display: block; color: var(--color-text-muted); font-size: 12px">الكاشير</span>
</div>
<button type="button" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 6px; border: 0; border-radius: 12px; background: transparent; color: var(--color-text-muted); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
رجوع
</button>
</div>
<div style="flex: none; min-height: 58px"></div>
<div role="group" aria-label="الرقم السري" dir="ltr" style="flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; height: 48px; box-sizing: border-box; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface)">
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-border-strong); border-radius: 9999px"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-border-strong); border-radius: 9999px"></span>
</div>
<div dir="ltr" style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<div>
<sc-if value="{{k.blank}}" hint-placeholder-val="{{ false }}"><div style="height: 56px"></div></sc-if>
<sc-if value="{{k.digit}}" hint-placeholder-val="{{ true }}"><button type="button" style="display: grid; place-items: center; width: 100%; height: 56px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 24px; font-weight: 600; cursor: pointer">{{k.label}}</button></sc-if>
<sc-if value="{{k.back}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="حذف" style="display: grid; place-items: center; width: 100%; height: 56px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg></button></sc-if>
</div>
</sc-for>
</div>
<button type="button" style="flex: none; margin-top: auto; display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; border: 0; border-radius: 12px; background: var(--color-ink); color: #ffffff; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">
دخول
<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--color-mint)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</button>
</aside>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['أحمد سمير', 'منى عادل', 'خالد يوسف', 'سارة محمود', 'هدى إبراهيم', 'عمر حسن', 'نهى فاروق', 'ياسر مجدي'];
    const roster = names.map((name, i) => ({ name, initial: Array.from(name)[0], selected: i === 1, idle: i !== 1 }));
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'];
    const keys = labels.map((label) => ({ label, blank: label === '', digit: label !== '' && label !== 'back', back: label === 'back' }));
    return { roster, keys };
  }
}
</script>
</body>
</html>
