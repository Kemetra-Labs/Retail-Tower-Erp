<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>دخول POS - شاشة صغيرة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
button{transition:background-color 150ms ease-out,border-color 150ms ease-out}
@media (prefers-reduced-motion: reduce){button{transition:none}}
</style>
</helmet>
<div dir="rtl" style="--color-background: #f7f9fa; --color-surface: #ffffff; --color-surface-elevated: #f3f6fa; --color-surface-sunken: #eef2f6; --color-text: #0f1d2e; --color-text-muted: #53647a; --color-primary: #0f766e; --color-primary-emphasis: #0b5b55; --color-primary-soft: #e6f4f1; --color-primary-on: #ffffff; --color-border: #d8dfe7; --color-border-soft: #e7ecf2; --color-border-strong: #6f7b89; width: 1024px; height: 768px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--color-background); color: var(--color-text); font-family: 'Dubai', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 1.6">

<header style="flex: none; display: flex; align-items: center; gap: 14px; height: 72px; box-sizing: border-box; padding: 0 16px; background: var(--color-surface-elevated); border-bottom: 1px solid var(--color-border)">
<div style="flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--color-primary-soft)">
<svg role="img" aria-label="شعار المنتج" viewBox="0 0 100 100" style="width: 24px; height: 24px; fill: var(--color-primary)"><rect x="38" y="8" width="24" height="84" rx="6"/><rect x="8" y="38" width="84" height="24" rx="6"/></svg>
</div>
<div dir="ltr" style="font-size: 26px; font-weight: 700; color: var(--color-primary-emphasis)">POS Pulse</div>
<div aria-hidden="true" style="width: 1px; height: 22px; background: var(--color-border)"></div>
<div style="color: var(--color-text-muted)">الجهاز <b style="margin-inline-start: 4px; color: var(--color-text); font-weight: 700"><bdi>[اسم الجهاز]</bdi></b></div>
</header>

<main style="flex: 1; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 16px">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3">تسجيل الدخول</h1>
<p style="margin: 0; color: var(--color-text-muted)">كل عمليات الوردية تُسجَّل باسمك.</p>
</div>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 304px; gap: 12px">

<section aria-labelledby="roster-h" style="display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--color-border); border-radius: 14px; background: var(--color-surface)">
<div style="display: flex; align-items: center; min-height: 56px; box-sizing: border-box; padding: 12px 16px; border-bottom: 1px solid var(--color-border-soft)">
<h2 id="roster-h" style="margin: 0; font-size: 16px; font-weight: 700">الكاشير في هذا الفرع</h2>
</div>
<ul style="flex: 1; min-height: 0; margin: 0; padding: 16px; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; gap: 8px">
<sc-for list="{{roster}}" as="item" hint-placeholder-count="8">
<li>
<sc-if value="{{item.selected}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" style="position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 52px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--color-primary); border-radius: 10px; background: var(--color-primary-soft); color: var(--color-primary-emphasis); font: inherit; text-align: start; cursor: pointer">
<span aria-hidden="true" style="position: absolute; inset-block: 8px; inset-inline-start: -1px; width: 2px; border-radius: 2px; background: var(--color-primary)"></span>
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9999px; background: var(--color-primary); color: var(--color-primary-on); font-size: 15px; font-weight: 700; line-height: 1">{{item.initial}}</span>
<span style="font-size: 15px; font-weight: 700">{{item.name}}</span>
</button>
</sc-if>
<sc-if value="{{item.idle}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 52px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--color-border-strong); border-radius: 10px; background: var(--color-surface); color: var(--color-text); font: inherit; text-align: start; cursor: pointer">
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9999px; background: var(--color-surface-sunken); color: var(--color-text); font-size: 15px; font-weight: 700; line-height: 1">{{item.initial}}</span>
<span style="font-size: 15px; font-weight: 600">{{item.name}}</span>
</button>
</sc-if>
</li>
</sc-for>
</ul>
<div style="display: flex; align-items: center; padding: 12px 16px; border-top: 1px solid var(--color-border-soft)">
<button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border: 1px solid var(--color-border-strong); border-radius: 10px; background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>
دخول المدير
</button>
</div>
</section>

<aside aria-labelledby="auth-h" style="display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--color-border); border-radius: 14px; background: var(--color-surface)">
<div style="display: flex; align-items: center; gap: 10px; min-height: 70px; box-sizing: border-box; padding: 12px 16px; border-bottom: 1px solid var(--color-border-soft)">
<div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9999px; background: var(--color-primary-soft); color: var(--color-primary-emphasis); font-size: 15px; font-weight: 700; line-height: 1">م</span>
<div style="min-width: 0">
<h2 id="auth-h" style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3">منى عادل</h2>
<span style="display: block; color: var(--color-text-muted); font-size: 12px">الكاشير</span>
</div>
</div>
<button type="button" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 6px; border: 0; border-radius: 10px; background: transparent; color: var(--color-text-muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
رجوع
</button>
</div>
<div style="flex: 1; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 16px">
<div role="group" aria-label="الرقم السري" dir="ltr" style="display: flex; align-items: center; justify-content: center; gap: 14px; height: 52px; border: 1px solid var(--color-border-strong); border-radius: 10px; background: var(--color-surface)">
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-text); border-radius: 9999px; background: var(--color-text)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-text); border-radius: 9999px; background: var(--color-text)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-text); border-radius: 9999px; background: var(--color-text)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-text); border-radius: 9999px; background: var(--color-text)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-border-strong); border-radius: 9999px"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-border-strong); border-radius: 9999px"></span>
</div>
<div dir="ltr" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<div>
<sc-if value="{{k.blank}}" hint-placeholder-val="{{ false }}"><div style="height: 56px"></div></sc-if>
<sc-if value="{{k.digit}}" hint-placeholder-val="{{ true }}">
<button type="button" style="display: grid; place-items: center; width: 100%; height: 56px; border: 1px solid var(--color-border-strong); border-radius: 10px; background: var(--color-surface); color: var(--color-text); font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 24px; font-weight: 600; cursor: pointer">{{k.label}}</button>
</sc-if>
<sc-if value="{{k.back}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="حذف" style="display: grid; place-items: center; width: 100%; height: 56px; border: 1px solid var(--color-border-strong); border-radius: 10px; background: var(--color-surface); color: var(--color-text); cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg></button></sc-if>
</div>
</sc-for>
</div>
<button type="button" style="margin-top: auto; width: 100%; height: 56px; border: 0; border-radius: 10px; background: var(--color-primary); color: var(--color-primary-on); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer">دخول</button>
</div>
</aside>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['أحمد سمير', 'منى عادل', 'خالد يوسف', 'سارة محمود', 'هدى إبراهيم', 'عمر حسن', 'نهى فاروق', 'ياسر مجدي'];
    const roster = names.map((name, i) => ({
      name,
      initial: Array.from(name)[0],
      selected: i === 1,
      idle: i !== 1
    }));
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'];
    const keys = labels.map((label) => ({ label, blank: label === '', digit: label !== '' && label !== 'back', back: label === 'back' }));
    return { roster, keys };
  }
}
</script>
</body>
</html>
