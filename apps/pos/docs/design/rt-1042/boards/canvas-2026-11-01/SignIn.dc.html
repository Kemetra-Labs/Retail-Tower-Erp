<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&amp;display=swap">
<style>

button:focus-visible,input:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
button{transition:background-color 150ms ease-out,border-color 150ms ease-out}

</style>
</helmet>
<div dir="rtl" style="--color-background: #f7f9fa; --color-surface: #ffffff; --color-surface-elevated: #f3f6fa; --color-surface-sunken: #eef2f6; --color-text: #0f1d2e; --color-text-muted: #53647a; --color-primary: #0f766e; --color-primary-emphasis: #0b5b55; --color-primary-soft: #e6f4f1; --color-primary-on: #ffffff; --color-border: #d8dfe7; --color-border-soft: #e7ecf2; --color-border-strong: #6f7b89; --color-danger: #b3261e; --color-danger-soft: #fbe9e7; --color-warning: #a35a00; --color-warning-soft: #fdf1e0; --color-info: #1b6ca8; --color-info-soft: #e4f0f9; width: 1920px; height: 1080px; box-sizing: border-box; display: flex; overflow: hidden; background: var(--color-background); color: var(--color-text); font-family: 'Dubai', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 1.6">

<defs>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" style="stroke: var(--color-border)" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="1080" fill="url(#grid)"/>
<circle cx="320" cy="500" r="290" style="fill: var(--color-surface-elevated); stroke: var(--color-border)" stroke-width="1"/>
<circle cx="320" cy="500" r="222" fill="none" style="stroke: var(--color-border-soft)" stroke-width="1"/>
</svg>
<div style="position: absolute; inset-inline: 0; inset-block-start: 360px; display: flex; flex-direction: column; align-items: center; gap: 24px">
<div style="display: grid; place-items: center; width: 140px; height: 140px; border-radius: 16px; background: var(--color-primary-soft)">
<svg role="img" aria-label="شعار المنتج" viewBox="0 0 100 100" style="width: 68px; height: 68px; fill: var(--color-primary)"><rect x="38" y="8" width="24" height="84" rx="6"/><rect x="8" y="38" width="84" height="24" rx="6"/></svg>
</div>
<div dir="ltr" style="font-size: 60px; font-weight: 700; line-height: 1.1; color: var(--color-primary-emphasis)">POS Pulse</div>
</div>
<div style="position: absolute; inset-inline: 56px; inset-block-end: 40px; display: flex; justify-content: center; padding-block-start: 16px; border-block-start: 1px solid var(--color-border); color: var(--color-text-muted); font-size: 15px">
الجهاز <b style="margin-inline-start: 6px; color: var(--color-text); font-weight: 700"><bdi>[اسم الجهاز]</bdi></b>
</div>
</aside>

<main style="flex: 1; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 72px">
<div style="width: 100%; max-width: 1080px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.3">تسجيل الدخول</h1>
<p style="margin: 0; color: var(--color-text-muted); font-size: 16px">كل عمليات الوردية تُسجَّل باسمك.</p>
</div>

<div style="height: 612px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px">

<section aria-labelledby="roster-h" style="display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--color-border); border-radius: 14px; background: var(--color-surface)">
<div style="display: flex; align-items: center; min-height: 56px; box-sizing: border-box; padding: 12px 20px; border-bottom: 1px solid var(--color-border-soft)">
<h2 id="roster-h" style="margin: 0; font-size: 18px; font-weight: 700">الكاشير في هذا الفرع</h2>
</div>

<sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
<ul style="flex: 1; min-height: 0; margin: 0; padding: 20px; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; gap: 8px">
<sc-for list="{{roster}}" as="item" hint-placeholder-count="8">
<li>
<sc-if value="{{item.selected}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" style="position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 60px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-primary); border-radius: 10px; background: var(--color-primary-soft); color: var(--color-primary-emphasis); font: inherit; text-align: start; cursor: pointer">
<span aria-hidden="true" style="position: absolute; inset-block: 8px; inset-inline-start: -1px; width: 2px; border-radius: 2px; background: var(--color-primary)"></span>
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9999px; background: var(--color-primary); color: var(--color-primary-on); font-size: 18px; font-weight: 700; line-height: 1">{{item.initial}}</span>
<span style="font-size: 17px; font-weight: 700">{{item.name}}</span>
</button>
</sc-if>
<sc-if value="{{item.idle}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 60px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-strong); border-radius: 10px; background: var(--color-surface); color: var(--color-text); font: inherit; text-align: start; cursor: pointer">
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9999px; background: var(--color-surface-sunken); color: var(--color-text); font-size: 18px; font-weight: 700; line-height: 1">{{item.initial}}</span>
<span style="font-size: 17px; font-weight: 600">{{item.name}}</span>
</button>
</sc-if>
<sc-if value="{{item.off}}" hint-placeholder-val="{{ false }}">
<button type="button" disabled style="display: flex; align-items: center; gap: 12px; width: 100%; height: 60px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-surface-sunken); color: var(--color-text-muted); font: inherit; text-align: start; cursor: not-allowed">
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9999px; background: var(--color-surface-elevated); color: var(--color-text-muted); font-size: 18px; font-weight: 700; line-height: 1">{{item.initial}}</span>
<span style="font-size: 17px; font-weight: 600">{{item.name}}</span>

</sc-for>
</ul>
</sc-if>

<div role="status" style="display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border: 1px solid {{noticeInk}}; border-radius: 10px; background: {{noticeSoft}}; font-size: 14px; line-height: 1.5">

<sc-if value="{{noticeInfo}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{noticeInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-block-start: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></sc-if>

<sc-if value="{{mgrPressed}}" hint-placeholder-val="{{ false }}">

<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>
دخول المدير

</div>

<aside aria-labelledby="auth-h" style="display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--color-border); border-radius: 14px; background: var(--color-surface)">

<button type="button" disabled style="margin-top: auto; width: 100%; height: 60px; box-sizing: border-box; border: 2px dashed var(--color-border-strong); border-radius: 10px; background: var(--color-surface-sunken); color: var(--color-text-muted); font: inherit; font-size: 18px; font-weight: 700; cursor: not-allowed">دخول</button>
</div>
</sc-if>

<sc-if value="{{authPicked}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px; min-height: 70px; box-sizing: border-box; padding: 12px 20px; border-bottom: 1px solid var(--color-border-soft)">
<div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9999px; background: var(--color-primary-soft); color: var(--color-primary-emphasis); font-size: 18px; font-weight: 700; line-height: 1">م</span>
<div style="min-width: 0">
<h2 id="auth-h" style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3">منى عادل</h2>
<span style="display: block; color: var(--color-text-muted); font-size: 12px">الكاشير</span>
</div>
</div>
<button type="button" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; border: 0; border-radius: 10px; background: transparent; color: var(--color-text-muted); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
رجوع
</button>
</div>
<div style="flex: 1; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 20px">
<div role="textbox" aria-label="الرقم السري" dir="ltr" style="display: flex; align-items: center; justify-content: center; gap: 16px; height: 56px; border: 1px solid {{dotsEdge}}; border-radius: 10px; background: var(--color-surface)">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid {{d.edge}}; border-radius: 9999px; background: {{d.fill}}"></span>
</sc-for>
</div>
<div style="display: flex; align-items: center; min-height: 70px">
<sc-if value="{{feedbackSigning}}" hint-placeholder-val="{{ false }}"><span role="status" style="color: var(--color-text-muted)">جارٍ تسجيل الدخول…</span></sc-if>
<sc-if value="{{feedbackRefusal}}" hint-placeholder-val="{{ false }}">
<span role="alert" style="display: flex; align-items: flex-start; gap: 8px; width: 100%; box-sizing: border-box; padding: 8px 12px; border: 1px solid var(--color-danger); border-radius: 10px; background: var(--color-danger-soft); font-size: 14px; line-height: 1.5">
<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--color-danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-block-start: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>
<span style="flex: 1; min-width: 0; align-self: center">بيانات الدخول غير صحيحة. حاول مرة أخرى.</span>
</span>
</sc-if>
</div>
<div dir="ltr" role="group" aria-label="إدخال الرقم السري" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<div>
<sc-if value="{{k.blank}}" hint-placeholder-val="{{ false }}"><div style="height: 64px"></div></sc-if>
<sc-if value="{{k.digitOn}}" hint-placeholder-val="{{ true }}"><button type="button" style="display: grid; place-items: center; width: 100%; height: 64px; border: 1px solid var(--color-border-strong); border-radius: 10px; background: var(--color-surface); color: var(--color-text); font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 28px; font-weight: 600; cursor: pointer">{{k.label}}</button></sc-if>
<sc-if value="{{k.digitOff}}" hint-placeholder-val="{{ false }}"><button type="button" disabled style="display: grid; place-items: center; width: 100%; height: 64px; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-surface-sunken); color: var(--color-text-muted); font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 28px; font-weight: 600; cursor: default">{{k.label}}</button></sc-if>
<sc-if value="{{k.backOn}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="حذف" style="display: grid; place-items: center; width: 100%; height: 64px; border: 1px solid var(--color-border-strong); border-radius: 10px; background: var(--color-surface); color: var(--color-text); cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg></button></sc-if>
<sc-if value="{{k.backOff}}" hint-placeholder-val="{{ false }}"><button type="button" disabled aria-label="حذف" style="display: grid; place-items: center; width: 100%; height: 64px; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-surface-sunken); color: var(--color-text-muted); cursor: default"><svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg></button></sc-if>
</div>
</sc-for>
</div>
<button type="button" disabled style="margin-top: auto; width: 100%; height: 60px; box-sizing: border-box; border: 2px dashed var(--color-border-strong); border-radius: 10px; background: var(--color-surface-sunken); color: var(--color-text-muted); font: inherit; font-size: 18px; font-weight: 700; cursor: not-allowed">دخول</button>
</div>
</sc-if>

<sc-if value="{{authManager}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px; min-height: 70px; box-sizing: border-box; padding: 12px 20px; border-bottom: 1px solid var(--color-border-soft)">
<div style="flex: 1; min-width: 0"><h2 id="auth-h" style="margin: 0; font-size: 18px; font-weight: 700">دخول المدير</h2></div>
<button type="button" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; border: 0; border-radius: 10px; background: transparent; color: var(--color-text-muted); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
رجوع
</button>
</div>
<form style="flex: 1; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 20px">
<div style="display: grid; gap: 6px">
<label for="mgr-id" style="font-weight: 600">البريد الإلكتروني أو اسم المستخدم</label>
<input id="mgr-id" dir="ltr" type="text" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-strong); border-radius: 10px; background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 16px; text-align: left">
</div>
<div style="display: grid; gap: 6px">
<label for="mgr-pw" style="font-weight: 600">كلمة المرور</label>
<input id="mgr-pw" dir="ltr" type="password" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-strong); border-radius: 10px; background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 16px; text-align: left">
</div>

<button type="submit" style="margin-top: auto; width: 100%; height: 60px; border: 0; border-radius: 10px; background: var(--color-primary); color: var(--color-primary-on); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer">تسجيل الدخول</button>
</form>
</sc-if>

</aside>

</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["before","signing","refused","offline","empty","manager"],"default":"before"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'before';
    const picked = state === 'signing' || state === 'refused';
    const signing = state === 'signing';
    const refused = state === 'refused';
    const manager = state === 'manager';
    const offline = state === 'offline';
    const empty = state === 'empty';
    const showList = !offline && !empty;

    const names = ['أحمد سمير', 'منى عادل', 'خالد يوسف', 'سارة محمود', 'هدى إبراهيم', 'عمر حسن', 'نهى فاروق', 'ياسر مجدي'];
    const roster = names.map((name, i) => {
      const sel = picked && i === 1;
      return { name, initial: Array.from(name)[0], selected: sel, idle: !sel && !signing, off: !sel && signing };
    });

    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'];
    const keys = labels.map((label) => ({
      label,
      blank: label === '',
      digit: label !== '' && label !== 'back',
      back: label === 'back',
      digitOn: label !== '' && label !== 'back' && !signing,
      digitOff: label !== '' && label !== 'back' && signing,
      backOn: label === 'back' && !signing,
      backOff: label === 'back' && signing
    }));

    const filled = signing ? 4 : 0;
    const dots = [0, 1, 2, 3, 4, 5].map((i) => {
      const on = i < filled;
      return { edge: on ? '#0f1d2e' : '#6f7b89', fill: on ? '#0f1d2e' : 'transparent' };
    });

    let prompt = 'اختر اسمك من القائمة لإدخال الرقم السري.';
    if (offline) prompt = 'لا يمكن إدخال الرقم السري قبل تحميل القائمة.';
    if (empty) prompt = 'الدخول بالرقم السري يحتاج كاشيرًا مسجّلًا في هذا الفرع.';

    return {
      showList,
      showNotice: offline || empty,
      noticeWarn: offline,
      noticeInfo: empty,
      noticeInk: offline ? '#a35a00' : '#1b6ca8',
      noticeSoft: offline ? '#fdf1e0' : '#e4f0f9',
      noticeText: offline ? 'تعذّر تحميل قائمة الكاشير. تحقق من الاتصال.' : 'لا يوجد كاشير مسجّل في هذا الفرع.',
      roster,
      keys,
      dots,
      dotsEdge: refused ? '#b3261e' : '#6f7b89',
      prompt,
      authPreview: state === 'before' || offline || empty,
      authPicked: picked,
      authManager: manager,
      feedbackSigning: signing,
      feedbackRefusal: refused,
      mgrOn: !manager && !signing,
      mgrPressed: manager,
      mgrOff: signing
    };
  }
}
</script>
</body>
</html>
