<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&amp;display=swap">

body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 1920px; height: 1080px; box-sizing: border-box; display: flex; overflow: hidden; background: #f7f9fa; color: #0f1d2e; font-family: 'Dubai', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 1.6">

<aside style="flex: none; width: 720px; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: #cfd9e3; border-inline-end: 1px solid #d8dfe7">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #53647a">
<svg aria-hidden="true" viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 9"></path></svg>
<div style="font-size: 20px; font-weight: 500">[صورة الصيدلية]</div>
<div dir="ltr" style="font-size: 14px">720 x 1080</div>
</div>
<div style="flex: none; display: flex; align-items: center; gap: 20px; box-sizing: border-box; padding: 28px 40px; background: #ffffff; border-top: 1px solid #d8dfe7">
<div style="flex: none; display: grid; place-items: center; width: 72px; height: 72px; border-radius: 18px; background: #e6f4f1">
<svg role="img" aria-label="شعار المنتج" viewBox="0 0 100 100" style="width: 38px; height: 38px; fill: #0f766e"><rect x="38" y="8" width="24" height="84" rx="6"></rect><rect x="8" y="38" width="84" height="24" rx="6"></rect></svg>
</div>
<div>
<div dir="ltr" style="font-size: 40px; font-weight: 700; line-height: 1.1; color: #0b5b55; text-align: start">POS Pulse</div>
<div style="margin-top: 4px; color: #53647a; font-size: 16px">الجهاز <b style="color: #0f1d2e; font-weight: 700"><bdi>[اسم الجهاز]</bdi></b></div>
</div>
</div>
</aside>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['أحمد سمير', 'منى عادل', 'خالد يوسف', 'سارة محمود', 'هدى إبراهيم', 'عمر حسن', 'نهى فاروق', 'ياسر مجدي'];
    const roster = names.map((name, i) => ({
      name,
      initial: Array.from(name)[0],
      selected: i === 1,
      idle: i !== 1
    }));
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'حذف'];
    const keys = labels.map((label) => ({ label, blank: label === '', real: label !== '' }));
    return { roster, keys };
  }
}
</script>
</body>
</html>
