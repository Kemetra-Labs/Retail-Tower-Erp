<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>دخول POS - تكوين H على 1024</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&amp;family=Tajawal:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button:focus-visible{outline:2px solid #0f766e;outline-offset:2px}
button{transition:background-color 150ms ease-out,border-color 150ms ease-out}
@media (prefers-reduced-motion: reduce){button{transition:none}}
</style>
</helmet>
<div dir="rtl" style="--color-canvas: #f2f5f6; --color-surface: #ffffff; --color-surface-sunken: #eef2f6; --color-text: #0f1d2e; --color-text-muted: #53647a; --color-ink: #0a2125; --color-ink-muted: #a9c2c5; --color-mint: #5fe0cf; --color-primary: #0f766e; --color-primary-emphasis: #0b5b55; --color-primary-soft: #e6f4f1; --color-border: #d8dfe7; --color-border-soft: #e7ecf2; --color-border-strong: #6f7b89; --elevation-resting: 0 1px 2px rgba(10, 33, 37, 0.06), 0 32px 32px -24px rgba(10, 33, 37, 0.25); width: 1024px; height: 768px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--color-canvas); color: var(--color-text); font-family: 'Dubai', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 1.6">

<header style="flex: none; position: relative; overflow: hidden; height: 72px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--color-ink)">
<svg aria-hidden="true" viewBox="0 0 1024 72" width="1024" height="72" style="position: absolute; inset: 0">
<defs>
<pattern id="tower-grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" style="stroke: var(--color-mint)" stroke-opacity="0.06" stroke-width="1"/></pattern>
<pattern id="ruler" width="65" height="10" patternUnits="userSpaceOnUse"><path d="M6.5 10v-4M19.5 10v-4M32.5 10v-4M45.5 10v-4M58.5 10v-8" fill="none" style="stroke: var(--color-mint)" stroke-opacity="0.22" stroke-width="1"/></pattern>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" style="stop-color: var(--color-mint)" stop-opacity="0.2"/><stop offset="1" style="stop-color: var(--color-mint)" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0"><stop offset="0" style="stop-color: var(--color-mint)" stop-opacity="0.9"/><stop offset="1" style="stop-color: var(--color-mint)" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1024" height="72" fill="url(#tower-grid)"/>
<ellipse cx="930" cy="36" rx="320" ry="70" fill="url(#glow)"/>
<ellipse cx="170" cy="60" rx="300" ry="60" fill="url(#glow)"/>
<rect x="0" y="62" width="1024" height="10" fill="url(#ruler)"/>
<g opacity="0.55" fill="none" stroke="url(#fade)" stroke-width="1.25">
<rect x="20" y="44" width="26" height="34" rx="3"/><rect x="56" y="30" width="26" height="48" rx="3"/><rect x="92" y="40" width="26" height="38" rx="3"/><rect x="128" y="18" width="26" height="60" rx="3"/><rect x="164" y="30" width="26" height="48" rx="3"/><rect x="200" y="10" width="26" height="68" rx="3"/><path d="M213 10V3"/><rect x="236" y="36" width="26" height="42" rx="3"/><rect x="272" y="24" width="26" height="54" rx="3"/><rect x="308" y="42" width="26" height="36" rx="3"/>
</g>
<g style="fill: var(--color-mint)">
<rect x="136" y="28" width="4" height="4" fill-opacity="0.5"/><rect x="146" y="28" width="4" height="4" fill-opacity="0.2"/><rect x="136" y="40" width="4" height="4" fill-opacity="0.2"/><rect x="146" y="40" width="4" height="4" fill-opacity="0.5"/>
<rect x="208" y="20" width="4" height="4" fill-opacity="0.5"/><rect x="218" y="20" width="4" height="4" fill-opacity="0.2"/><rect x="208" y="32" width="4" height="4" fill-opacity="0.2"/><rect x="218" y="32" width="4" height="4" fill-opacity="0.5"/>
</g>
</svg>
<div style="position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #5fe0cf 0%, #0f766e 100%)">
<svg role="img" aria-label="شعار المنتج" viewBox="0 0 64 64" width="24" height="24" fill="#0a2125"><rect x="8" y="36" width="12" height="20" rx="3"/><rect x="26" y="22" width="12" height="34" rx="3"/><rect x="44" y="8" width="12" height="48" rx="3"/></svg>
</div>
<div dir="ltr" style="position: relative; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 26px; font-weight: 600; color: #ffffff">POS Pulse</div>
<div aria-hidden="true" style="position: relative; width: 1px; height: 22px; background: rgba(169, 194, 197, 0.3)"></div>
<div style="position: relative; color: var(--color-ink-muted)">الجهاز <b style="margin-inline-start: 4px; color: #ffffff; font-weight: 700"><bdi>[اسم الجهاز]</bdi></b></div>
</header>

<div style="flex: 1; min-height: 0; display: flex">

<main style="flex: 1; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 16px">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 style="margin: 0; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 24px; font-weight: 600; line-height: 1.3">تسجيل الدخول</h1>
<p style="margin: 0; color: var(--color-text-muted)">كل عمليات الوردية تُسجَّل باسمك.</p>
</div>

<section aria-labelledby="roster-h" style="display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: 20px; background: var(--color-surface); box-shadow: var(--elevation-resting)">
<div style="display: flex; align-items: center; min-height: 52px; box-sizing: border-box; padding: 10px 20px; border-bottom: 1px solid var(--color-border-soft)">
<h2 id="roster-h" style="margin: 0; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 16px; font-weight: 600">الكاشير في هذا الفرع</h2>
</div>
<ul style="flex: 1; min-height: 0; margin: 0; padding: 16px; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; gap: 8px; overflow: hidden">
<sc-for list="{{roster}}" as="item" hint-placeholder-count="8">
<li>
<sc-if value="{{item.selected}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" style="position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 64px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-primary); border-radius: 12px; background: var(--color-primary-soft); color: var(--color-primary-emphasis); font: inherit; text-align: start; cursor: pointer">
<span aria-hidden="true" style="position: absolute; inset-block: 10px; inset-inline-start: -1px; width: 2px; border-radius: 2px; background: var(--color-primary)"></span>
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--color-ink); color: var(--color-mint); font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 20px; font-weight: 600; line-height: 1">{{item.initial}}</span>
<span style="min-width: 0"><span style="display: block; font-size: 16px; font-weight: 700">{{item.name}}</span><span style="display: block; font-size: 12px; font-weight: 400">الكاشير</span></span>
</button>
</sc-if>
<sc-if value="{{item.idle}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 64px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); font: inherit; text-align: start; cursor: pointer">
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--color-ink); color: var(--color-mint); font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 20px; font-weight: 600; line-height: 1">{{item.initial}}</span>
<span style="min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">{{item.name}}</span><span style="display: block; color: var(--color-text-muted); font-size: 12px">الكاشير</span></span>
</button>
</sc-if>
</li>
</sc-for>
</ul>
<div style="display: flex; align-items: center; padding: 10px 20px; border-top: 1px solid var(--color-border-soft)">
<button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>
دخول المدير
</button>
</div>
</section>
</main>

<aside aria-labelledby="auth-h" style="flex: none; width: 340px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; background: var(--color-surface); border-inline-start: 1px solid var(--color-border)">
<div style="flex: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-block-start: 4px">
<button type="button" style="position: absolute; inset-block-start: -4px; inset-inline-start: -8px; display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: var(--color-text-muted); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
رجوع
</button>
<span aria-hidden="true" style="display: grid; place-items: center; width: 64px; height: 64px; margin-block-start: 6px; border-radius: 18px; background: var(--color-ink); color: var(--color-mint); outline: 2px solid var(--color-primary); outline-offset: 3px; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 28px; font-weight: 600; line-height: 1">م</span>
<h2 id="auth-h" style="margin: 8px 0 0; font-family: 'Readex Pro', 'Tajawal', sans-serif; font-size: 18px; font-weight: 600; line-height: 1.3">منى عادل</h2>
<span style="color: var(--color-text-muted); font-size: 12px">الكاشير</span>
</div>
<div style="flex: none; min-height: 70px"></div>
<div role="group" aria-label="الرقم السري" dir="ltr" style="flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; height: 52px; box-sizing: border-box; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface)">
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-ink); border-radius: 9999px; background: var(--color-ink)"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-border-strong); border-radius: 9999px"></span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--color-border-strong); border-radius: 9999px"></span>
</div>
<div dir="ltr" style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<div>
<sc-if value="{{k.blank}}" hint-placeholder-val="{{ false }}"><div style="height: 56px"></div></sc-if>
<sc-if value="{{k.digit}}" hint-placeholder-val="{{ true }}"><button type="button" style="display: grid; place-items: center; width: 100%; height: 56px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 24px; font-weight: 600; cursor: pointer">{{k.label}}</button></sc-if>
<sc-if value="{{k.back}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="حذف" style="display: grid; place-items: center; width: 100%; height: 56px; border: 1px solid var(--color-border-strong); border-radius: 12px; background: var(--color-surface); color: var(--color-text); cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg></button></sc-if>
</div>
</sc-for>
</div>
<button type="button" style="flex: none; margin-top: auto; display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; border: 0; border-radius: 12px; background: var(--color-ink); color: #ffffff; box-shadow: 0 6px 14px -6px rgba(10, 33, 37, 0.55); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer">
دخول
<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--color-mint)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</button>
</aside>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['أحمد سمير', 'منى عادل', 'خالد يوسف', 'سارة محمود', 'هدى إبراهيم', 'عمر حسن', 'نهى فاروق', 'ياسر مجدي'];
    const roster = names.map((name, i) => ({
      name,
      initial: Array.from(name)[0],
      selected: i === 1,
      idle: i !== 1
    }));
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'];
    const keys = labels.map((label) => ({ label, blank: label === '', digit: label !== '' && label !== 'back', back: label === 'back' }));
    return { roster, keys };
  }
}
</script>
</body>
</html>
