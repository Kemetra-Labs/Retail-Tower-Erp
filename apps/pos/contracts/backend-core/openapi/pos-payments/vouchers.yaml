openapi: 3.1.0
info:
  title: Data-Pulse-2 POS Payments — Voucher Authority (Contract V-A)
  version: "1.2.0-draft"
  description: >
    POS-Pulse 006-payments-tender Slice 4 voucher contract surface
    (Contract V-A — Backend-authoritative). Defines three POS-authenticated
    operations that let a paired POS terminal redeem a tenant-issued internal
    voucher as a tender line on an in-flight PaymentAttempt:

      1. `posValidateVoucher`  — POS submits a voucher code together with the
         caller-intended `applied_amount_minor`. On success the response
         carries a short-lived non-sensitive `redemption_intent_token` that
         binds the voucher to a specific payment attempt. The token MUST NOT
         be a long-lived bearer or a re-usable credential. Partial redemption
         is refused (POS-Pulse plan AD-7 / OQ-PLAN-3): `applied_amount_minor`
         that exceeds either the authoritative voucher value or the
         caller-supplied `remaining_balance_minor` returns 400
         `non_cash_overpayment_refused`. The response also carries
         `forfeited_amount_minor`, the part of the voucher's value this
         redemption would forfeit (see "Redemption consumes the whole
         voucher" below).
      2. `posRedeemVoucher`    — POS atomically consumes a previously-issued
         intent token at payment confirmation. The response carries an opaque
         `redemption_id` that the terminal persists on the tender line for
         audit / receipt correlation. Replay of the same intent token returns
         200 with `idempotent_replayed: true`.
      3. `posReverseVoucher`   — POS reverses a committed redemption when the
         attempt is cancelled or the tender line is reversed individually.
         Idempotent: a second reverse of the same `redemption_id` returns 200
         with `already_reversed: true`. The voucher is restored atomically to
         `active` with its full value.

    **Redemption consumes the whole voucher (RT-1098 decision 1A, owner
    2026-11-03).** A voucher has one value and is used once. A successful
    `posRedeemVoucher` moves the voucher to `redeemed`; the part of its value
    above `applied_amount_minor` is forfeited and is not carried as a balance.
    There is no residual balance and no second redemption. The redemption
    stores `applied_amount_minor` and `forfeited_amount_minor`. A reverse
    undoes the whole redemption. v1 vouchers are promotional only (issued
    free; RT-1098 c15291).

    **Code normalisation.** The voucher `code` is normalised before lookup:
    upper-cased, with hyphens and spaces removed, exactly as at issue
    (`vouchers-admin.openapi.yaml`; RT-922 §5.3). Lookup is tenant-scoped.

    This contract is consumed by POS-Pulse main-process bridge handlers
    `vouchers.validate` / `vouchers.redeem` / `vouchers.reverse` (see
    POS-Pulse `specs/006-payments-tender/contracts/bridge-api.md`
    §"`vouchers.*` namespace"). It is NOT consumed by the dashboard or
    backend admin UI. Tenant-admin voucher CRUD (issuing and managing
    vouchers) is not part of this contract and has no contract or route
    yet; it will need its own contract when it is specified.

    Authentication boundary (RT-1110; owner decisions RT-1098 c16394 and
    c16402): all three operations are authenticated with the `device` scheme
    only, the paired terminal's opaque token presented as
    `Authorization: Bearer <device_token>`. It is the same credential as
    `captureSale` (`pos-sales/sales.yaml`, RT-224 option B). The previous
    `operator-identity` provider JWT is removed: a cashier session holds no
    such JWT (RT-218). The device row supplies `tenant_id`, `store_id` and
    `device_id`; body-supplied tenant / store fields are NOT accepted
    (Constitution §III backend authority). `store_context_required` stays in
    the closed sets below, but a device that carries a store never produces
    it.

    `posValidateVoucher` and `posRedeemVoucher` also carry `operatorUserId`
    in the body: the `users.id` of the cashier applying the voucher. A device
    token alone never proves the author. The server accepts the claim only
    when a cashier admission of this device, store and user is active at the
    time of the request, and it re-checks the cashier's membership and store
    access live. A refused claim from a valid device is the generic 403
    `refused`; a missing, invalid or revoked device token is the generic 401.
    These calls are online, so no `occurredAt` window applies. The claim is
    checked before the voucher code is looked up, so a refused claim reveals
    nothing about any code.
    `posReverseVoucher` takes no `operatorUserId`: the reverse is attributed
    to the operator recorded when the redemption was made, so the POS's
    deferred reverse resolver still works after the cashier's admission has
    ended.

    Idempotency: all three operations REQUIRE the `Idempotency-Key` header
    following the existing `IdempotencyInterceptor` convention (header
    name + shape mirror `memberships.openapi.yaml#createInvitation` and
    `catalog/unknown-items.yaml#posCaptureItem`). `Idempotency-Token` is
    NOT used here — the POS-Pulse-side bridge handlers generate UUID v4
    keys and pass them through unchanged.

    PII / secret discipline (Constitution §XIV; POS-Pulse FR-017 / P6 /
    P7): voucher token rotation, holder identity, voucher value history,
    and cross-attempt voucher state MUST NOT appear in any response body
    on this contract, with ONE owner-approved exception (RT-1098 c16402):
    `forfeited_amount_minor` on the `posValidateVoucher` 200. Together with
    `applied_amount_minor` it gives the voucher's value to the terminal that
    presented a valid code for its own payment attempt, so the cashier can
    confirm the forfeit before redeeming (decision 1A). It is carried by no
    other response, and it MUST NOT be logged, written to an audit event or
    printed on a receipt. Only the closed-set response fields below cross
    the wire. The `redemption_intent_token` returned by `posValidateVoucher`
    is short-lived (≤ 5 minutes recommended) and bound to a single
    `payment_attempt_id` — losing it does not leak voucher value.

    **Version 1.1.0-draft (RT-1112, owner decisions RT-1112 c16636).** The
    three operations are served (the `contract-only` markers are lifted).
    `posValidateVoucher` and `posRedeemVoucher` add a 429 with `Retry-After`:
    failed lookups are rate limited per device (ADR 0009). A same-key,
    same-body replay of a successful `posRedeemVoucher` is answered before
    the cashier admission check, so a terminal that retries after its
    cashier signed out still receives its `redemption_id`. A reverse of a
    voucher that has expired since it was redeemed succeeds: the voucher is
    restored to `active` and still answers `voucher_expired`. Nothing else
    changes.

    **Version 1.2.0-draft (RT-1343, owner decision 2026-11-12).**
    `posReverseVoucher` refuses a redemption that a sale tender pays with:
    409 `redemption_consumed_by_sale`. A full void of a voucher-paid sale
    reverses the redemption and restores the voucher. `RATE_LIMITED` joins the
    closed error sets of `posValidateVoucher` and `posRedeemVoucher`
    (it was already answered with the 429). Descriptions only: no schema
    changes.

servers:
  - url: https://api.example.com

tags:
  - name: pos-payments-vouchers
    description: >
      POS Payments — voucher authority surface for POS-Pulse 006 Slice 4
      Contract V-A.

paths:
  /api/pos/v1/vouchers/validate:
    post:
      summary: Validate a voucher code for a specific payment attempt + amount.
      operationId: posValidateVoucher
      x-idempotency: required
      tags: [pos-payments-vouchers]
      security:
        - device: []
      description: >
        Resolve the submitted voucher `code` against the tenant's active
        voucher set. On success, return a short-lived
        `redemption_intent_token` bound to the supplied `payment_attempt_id`
        + `applied_amount_minor`. The token is the only artefact the POS
        terminal needs to subsequently call `posRedeemVoucher` at
        settlement time.

        **Partial redemption rule (POS-Pulse AD-7 / OQ-PLAN-3):** if the
        caller-supplied `applied_amount_minor` exceeds either the
        authoritative voucher value OR the caller-supplied
        `remaining_balance_minor`, the operation MUST refuse with
        `non_cash_overpayment_refused`. The backend enforces this
        authority-side. A zero `applied_amount_minor` is refused with
        `validation_failure`: a voucher is consumed whole, so applying
        nothing would forfeit its entire value for no tender (the schema
        bound is unchanged).
        There is no residual voucher balance: redeeming consumes the whole
        voucher and forfeits the unused remainder (decision 1A), and the 200
        carries `forfeited_amount_minor` so the POS can show it before it
        redeems.

        **Failure-response error codes** (closed set, mirrors POS-Pulse
        bridge contract §`vouchers.validate`):
        `voucher_not_found`, `voucher_expired`, `voucher_cancelled`,
        `voucher_already_redeemed`, `voucher_tenant_mismatch`,
        `voucher_branch_mismatch`, `non_cash_overpayment_refused`,
        `validation_failure`, `store_context_required`, `refused`,
        `RATE_LIMITED`, `idempotency_key_required`, `idempotency_key_malformed`,
        `idempotency_key_conflict`.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: "^[\\x21-\\x7E]{16,128}$"
          description: >
            Client-generated opaque token (POS-Pulse uses UUID v4) that
            enables safe retries. Same key + same body replays the
            original response with `Idempotent-Replayed: true`. Same key
            + different body returns 409 `idempotency_key_conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosValidateVoucherRequest"
      responses:
        "200":
          description: >
            Voucher is redeemable for the requested amount. Body carries a
            short-lived `redemption_intent_token` plus the
            authority-confirmed `applied_amount_minor` (which equals the
            caller-supplied value — V-A refuses overpayment rather than
            capping it) and `forfeited_amount_minor`, the part of the
            voucher's value that redeeming it would forfeit (0 when the
            voucher is used in full).
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                enum: ["true"]
              description: >
                Present with value "true" when this response is an
                idempotent replay of an earlier successful validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosValidateVoucherResponse"
        "400":
          description: >
            Bad request. `error.code` is one of the closed-set values
            documented in the operation description above.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Missing, invalid or revoked device token. The generic 401: no
            factor is disclosed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            `error.code = "refused"`. The device token is valid but the
            `operatorUserId` claim is refused: no active cashier admission of
            this device, store and user, or the cashier's membership or store
            access no longer holds. One generic body for every cause.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Voucher code not found for the active tenant. `error.code =
            "voucher_not_found"`. Cross-tenant probes share this
            non-disclosing response per Constitution §XIV.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Idempotency-Key reuse with a different logical payload.
            `error.code = "idempotency_key_conflict"`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "425":
          description: >
            Too Early. The original request with this Idempotency-Key is
            still being processed. Retry after `Retry-After` seconds with
            the same key and body.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >
            Too Many Requests (ADR 0009; RT-1112). The device has spent its
            failed-lookup budget: about 10 lookups per 15 minutes per device that
            found no voucher (an unknown code, or another tenant's). A lookup that
            finds its voucher does not count. The
            limit is keyed per device and is checked after the cashier claim and
            before the lookup, so a device over its budget looks nothing up.
            `error.code = "RATE_LIMITED"`, the per-device limiter's code (as on
            the `pos-sales` routes). A POS client treats it as transient and
            retries after `Retry-After`. The limiter fails open on a datastore
            outage, so a 429 is a real budget breach.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 300
              description: Seconds to wait before retrying, clamped to [1, 300].
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pos/v1/vouchers/redeem:
    post:
      summary: Atomically consume a redemption-intent token at confirm time.
      operationId: posRedeemVoucher
      x-idempotency: required
      tags: [pos-payments-vouchers]
      security:
        - device: []
      description: >
        Consume a `redemption_intent_token` issued by an earlier
        `posValidateVoucher` call. On success, the voucher transitions
        to `redeemed` (the whole voucher is consumed; the part of its value
        above `applied_amount_minor` is forfeited, decision 1A)
        and the response carries the durable `redemption_id` that
        POS-Pulse persists on the `payment_tender_lines` row for audit /
        receipt correlation. The intent token is single-use; a second
        call with the same token but the same Idempotency-Key returns
        200 with `idempotent_replayed: true`.

        Redeem re-evaluates the voucher at redeem time. A voucher cancelled
        or expired since validate is refused with `voucher_cancelled` or
        `voucher_expired`, and a store outside the voucher's
        eligible set with `voucher_branch_mismatch`. An "all stores" voucher
        includes stores added after it was issued; an explicit subset never
        grows (RT-810 D3, D4).

        **Failure-response error codes** (closed set):
        `intent_token_not_found`, `intent_token_expired`,
        `intent_token_payment_attempt_mismatch`, `voucher_already_redeemed`,
        `voucher_cancelled`, `voucher_expired`, `voucher_branch_mismatch`,
        `validation_failure`, `store_context_required`, `refused`,
        `RATE_LIMITED`, `idempotency_key_required`, `idempotency_key_malformed`,
        `idempotency_key_conflict`.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: "^[\\x21-\\x7E]{16,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosRedeemVoucherRequest"
      responses:
        "200":
          description: >
            Voucher atomically redeemed. Body carries `redemption_id`
            and `redeemed_at`. Replay of the same intent token + same
            Idempotency-Key + same body returns this response with
            `idempotent_replayed: true`.
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                enum: ["true"]
              description: >
                Present with value "true" when this response is an
                idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosRedeemVoucherResponse"
        "400":
          description: >
            Bad request. `error.code` is one of the closed-set values
            documented in the operation description above.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Missing, invalid or revoked device token. The generic 401: no
            factor is disclosed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            `error.code = "refused"`. The device token is valid but the
            `operatorUserId` claim is refused: no active cashier admission of
            this device, store and user, or the cashier's membership or store
            access no longer holds. One generic body for every cause.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Intent token not found (already consumed by a different
            attempt, expired, or never issued). `error.code =
            "intent_token_not_found"`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Idempotency-Key reuse with a different logical payload, OR
            the voucher can no longer be redeemed: already redeemed by a
            different attempt, cancelled, expired, or not valid in this
            store. `error.code` is one of `idempotency_key_conflict`,
            `voucher_already_redeemed`, `voucher_cancelled`,
            `voucher_expired`, `voucher_branch_mismatch`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "425":
          description: >
            Too Early. The original redeem with this Idempotency-Key is
            still being processed. Retry after `Retry-After` seconds with
            the same key and body.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >
            Too Many Requests (ADR 0009; RT-1112). The device has spent its
            failed-lookup budget: about 10 lookups per 15 minutes per device that
            found no intent (an unknown token, or one of another tenant or store).
            A lookup that finds its intent does not count. The
            limit is keyed per device and is checked after the cashier claim and
            before the lookup, so a device over its budget looks nothing up.
            `error.code = "RATE_LIMITED"`, the per-device limiter's code (as on
            the `pos-sales` routes). A POS client treats it as transient and
            retries after `Retry-After`. The limiter fails open on a datastore
            outage, so a 429 is a real budget breach.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 300
              description: Seconds to wait before retrying, clamped to [1, 300].
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pos/v1/vouchers/reverse:
    post:
      summary: Reverse a previously-committed voucher redemption.
      operationId: posReverseVoucher
      x-idempotency: required
      tags: [pos-payments-vouchers]
      security:
        - device: []
      description: >
        Reverse a `redemption_id` issued by `posRedeemVoucher`. The voucher
        is restored atomically: its status transitions back from `redeemed`
        to `active` with its full value, and the forfeit of that redemption
        is undone. V-A supports a single full redemption only (decision 1A);
        there is no partially-redeemed state. The reversal is attributed to
        the operator recorded when the redemption was made, and the request
        carries no `operatorUserId`; the reversal's audit event records the
        reversing `device_id`. On success, the response
        carries `already_reversed: false` on the first call and
        `already_reversed: true` on every subsequent call with the same
        `redemption_id`.

        **Failure-response error codes** (closed set):
        `redemption_not_found`, `redemption_tenant_mismatch`,
        `redemption_branch_mismatch`, `redemption_consumed_by_sale`,
        `validation_failure`, `store_context_required`,
        `idempotency_key_required`, `idempotency_key_malformed`,
        `idempotency_key_conflict`.

        **A redemption a sale pays with is not reversed here (RT-1343).** Once
        a sale tender of method `voucher` references the redemption, this
        operation refuses with `redemption_consumed_by_sale` (409): a sale
        owns its voucher. The voucher is restored by the sale's full void
        (`recordVoid`, `pos-sales/sales.yaml`), which reverses the redemption and returns the
        voucher to `active` in the same transaction as the void. After that
        void, a reverse of the same redemption answers 200 with
        `already_reversed: true`, like any later reverse. A redemption that
        no sale tender references (the reverse of a payment attempt that did
        not complete) is reversed as before.

        **Authority-unreachable handling** is a POS-Pulse-side concern:
        the POS bridge handler transitions the tender line to
        `reversal_pending` on a network error and runs a deferred
        resolver. The backend has no `reversal_pending` concept; from
        the backend's point of view a reverse either succeeded or the
        request was never received.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: "^[\\x21-\\x7E]{16,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReverseVoucherRequest"
      responses:
        "200":
          description: >
            Redemption reversed (or already reversed by a prior call —
            response is identical except for `already_reversed`).
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                enum: ["true"]
              description: >
                Present with value "true" when this response is an
                idempotent replay of an earlier successful reverse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReverseVoucherResponse"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Missing, invalid or revoked device token. The generic 401: no
            factor is disclosed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Redemption id not found for the active tenant. `error.code =
            "redemption_not_found"`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Idempotency-Key reuse with a different logical payload
            (`error.code = "idempotency_key_conflict"`), or the redemption is
            paid into a sale tender (`error.code =
            "redemption_consumed_by_sale"`, RT-1343): void the sale instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "425":
          description: >
            Too Early. The original reverse with this Idempotency-Key is
            still being processed.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    # RT-1110: the `device` scheme replaces `operator-identity` (a provider JWT
    # a cashier session never holds, RT-218). Same scheme, same wire form as
    # `pos-sales/sales.yaml`.
    device:
      type: http
      scheme: bearer
      description: >
        RT-224 option B: the paired terminal's opaque `devices` pairing token,
        presented as `Authorization: Bearer <device_token>` (NOT a JWT, so
        `bearerFormat` is omitted). The token is hashed and matched against a
        non-revoked `devices` row of an active tenant; that row supplies the
        authoritative `(tenant_id, store_id, device_id)`. A missing, invalid
        or revoked device token is the generic 401. On `posValidateVoucher` and
        `posRedeemVoucher` it is accepted only together with `operatorUserId`
        in the body: the device token is device-scoped and never proves the
        author alone. The server then requires a cashier admission of that
        device, store and user that is active at the time of the request, and
        re-checks the cashier's membership and store access live; a refused
        claim from a valid device is the generic 403 `refused`. On
        `posReverseVoucher` no `operatorUserId` is sent: the reversal is
        attributed to the operator recorded at redeem time.

  schemas:

    PosValidateVoucherRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - payment_attempt_id
        - applied_amount_minor
        - remaining_balance_minor
        - operatorUserId
      properties:
        operatorUserId:
          type: string
          format: uuid
          description: >
            RT-1110 (RT-224 option B credential). The `users.id` of the
            cashier applying the voucher: the `user_id` of the cashier
            admission the terminal holds (NOT the provider subject
            `operator_id`). REQUIRED with the `device` scheme. It is a claim,
            never trusted on its own: the server accepts it only when a
            cashier admission of this device, store and user is active at the
            time of the request, and re-checks the cashier's membership and
            store access live. A refused claim from a valid device is the
            generic 403 `refused`.
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Voucher code as scanned or keyed by the cashier. It is
            normalised before lookup (upper-cased, hyphens and spaces
            removed, exactly as at issue). Lookup is tenant-scoped;
            cross-tenant codes return 404 (non-disclosing).
        payment_attempt_id:
          type: string
          format: uuid
          description: >
            POS-Pulse-generated UUID v4 identifying the in-flight
            PaymentAttempt this voucher is being applied to. The
            issued `redemption_intent_token` is bound to this id; an
            attempt at `posRedeemVoucher` with a different
            `payment_attempt_id` returns
            `intent_token_payment_attempt_mismatch`.
        applied_amount_minor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: >
            The exact amount the cashier intends to apply, in integer
            minor units (Constitution §II equivalent — POS-Pulse P-II).
            MUST satisfy
            `0 < applied_amount_minor <= remaining_balance_minor` AND
            `applied_amount_minor <= authoritative_voucher_value`; the server
            refuses 0 with `validation_failure` (see the operation
            description).
            V-A refuses overpayment with `non_cash_overpayment_refused`
            rather than capping.
        remaining_balance_minor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: >
            The remaining payable balance on the PaymentAttempt at the
            moment of voucher application, in integer minor units.
            Sent by POS for authority-side enforcement of the
            no-overpayment rule.

    PosValidateVoucherResponse:
      type: object
      additionalProperties: false
      required:
        - kind
        - redemption_intent_token
        - applied_amount_minor
        - forfeited_amount_minor
        - intent_expires_at
      properties:
        kind:
          type: string
          enum: [validated]
          description: Discriminator literal — voucher is redeemable.
        redemption_intent_token:
          type: string
          minLength: 32
          maxLength: 256
          description: >
            Short-lived opaque token (recommended TTL ≤ 5 minutes) bound
            to (`tenant_id`, `store_id`, `payment_attempt_id`,
            `voucher_id`, `applied_amount_minor`). Single-use at
            `posRedeemVoucher`. NEVER appears in audit-event payloads,
            logs, support bundles, or any non-payload log sink
            (POS-Pulse FR-017 / Constitution §XIV).
        applied_amount_minor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: >
            Authority-confirmed amount. Equal to the caller-supplied
            value on success (V-A refuses partial-redemption capping
            per AD-7).
        forfeited_amount_minor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: >
            RT-1110 (decision 1A). The part of the voucher's value that this
            redemption would forfeit: the authoritative voucher value minus
            `applied_amount_minor`, in integer minor units. 0 when the voucher
            is used in full. Shown to the cashier before redeem. It reveals the
            voucher's value only to the terminal that presented the valid code
            in a validate for its own payment attempt, and is not carried by
            any other response.
        intent_expires_at:
          type: string
          format: date-time
          description: >
            UTC timestamp after which the `redemption_intent_token` is
            no longer accepted by `posRedeemVoucher`. POS-Pulse SHOULD
            call redeem before this time; on expiry POS MUST re-call
            `posValidateVoucher` to obtain a fresh token.

    PosRedeemVoucherRequest:
      type: object
      additionalProperties: false
      required:
        - redemption_intent_token
        - payment_attempt_id
        - operatorUserId
      properties:
        operatorUserId:
          type: string
          format: uuid
          description: >
            RT-1110 (RT-224 option B credential). The `users.id` of the
            cashier applying the voucher: the `user_id` of the cashier
            admission the terminal holds (NOT the provider subject
            `operator_id`). REQUIRED with the `device` scheme. It is a claim,
            never trusted on its own: the server accepts it only when a
            cashier admission of this device, store and user is active at the
            time of the request, and re-checks the cashier's membership and
            store access live. A refused claim from a valid device is the
            generic 403 `refused`.
        redemption_intent_token:
          type: string
          minLength: 32
          maxLength: 256
          description: >
            Opaque token previously issued by `posValidateVoucher`.
            Single-use; consumed atomically with the voucher's
            transition to `redeemed`.
        payment_attempt_id:
          type: string
          format: uuid
          description: >
            Must match the `payment_attempt_id` the token was issued
            against. Mismatch returns
            `intent_token_payment_attempt_mismatch`.

    PosRedeemVoucherResponse:
      type: object
      additionalProperties: false
      required:
        - kind
        - redemption_id
        - redeemed_at
        - idempotent_replayed
      properties:
        kind:
          type: string
          enum: [redeemed]
          description: Discriminator literal — voucher redeemed.
        redemption_id:
          type: string
          format: uuid
          description: >
            Durable, opaque, tenant-scoped UUID identifying this specific
            redemption event. Safe to surface in receipt-handoff payloads
            and audit-event correlation (POS-Pulse FR-017 explicit
            allowlist). Does NOT carry voucher balance, voucher holder
            id, or any cross-attempt voucher state.
        redeemed_at:
          type: string
          format: date-time
          description: UTC timestamp at which the redemption committed.
        idempotent_replayed:
          type: boolean
          description: >
            `false` on the first successful redeem; `true` on every
            subsequent identical-Idempotency-Key + identical-body
            replay. Lets POS distinguish a fresh commit from a retry
            for audit-emission purposes.

    PosReverseVoucherRequest:
      type: object
      additionalProperties: false
      required:
        - redemption_id
      properties:
        redemption_id:
          type: string
          format: uuid
          description: >
            The `redemption_id` issued by an earlier `posRedeemVoucher`
            call. Tenant-scoped; cross-tenant addresses return 404
            (non-disclosing).

    PosReverseVoucherResponse:
      type: object
      additionalProperties: false
      required:
        - kind
        - redemption_id
        - reversed_at
        - already_reversed
      properties:
        kind:
          type: string
          enum: [reversed]
          description: Discriminator literal — redemption reversed.
        redemption_id:
          type: string
          format: uuid
        reversed_at:
          type: string
          format: date-time
          description: >
            UTC timestamp of the reverse. On idempotent replay (and on
            `already_reversed: true`) this is the timestamp of the
            ORIGINAL reverse, not the replay.
        already_reversed:
          type: boolean
          description: >
            `false` on the first reverse; `true` on every subsequent
            call against the same `redemption_id` (whether by the same
            attempt or a different attempt under the same tenant).
            Lets POS resolve `reversal_pending` lines deterministically.

    Error:
      type: object
      additionalProperties: false
      required:
        - error
      description: >
        Canonical error envelope shared with `auth.openapi.yaml`,
        `outbox.openapi.yaml`, `catalog/unknown-items.yaml`, and the
        other backend contracts. The `error.code` enum is the closed
        set documented per-operation above.
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable summary; no sensitive data.
            request_id:
              type: [string, "null"]
              format: uuid
              description: Server-assigned correlation id.

security:
  - device: []
