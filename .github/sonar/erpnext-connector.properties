# RT-901: scanner scope for integrations/erpnext-connector (the scan's project base directory),
# read by sonar.yml. The project key, organization and host are passed by the workflow, not set
# here. The scanner ignores .sonarcloud.properties (Automatic Analysis only), so its settings are
# carried here.
# specs/ (the throwaway live-e2e scripts and SQL) is outside sonar.sources, so it is not analysed.
sonar.sources=retail_tower_erpnext_connector
sonar.tests=retail_tower_erpnext_connector/tests
sonar.test.inclusions=retail_tower_erpnext_connector/tests/**
sonar.python.version=3.11

# From .sonarcloud.properties: the PL/SQL analyzer does not understand Postgres SQL.
sonar.exclusions=**/*.sql

# RT-469 (owner decision B4, 2026-10-18; docs/decisions/sonar-test-style-rules.md, option c):
# ignore the two test-style rules for test code only. Production code, the org quality profile and
# the quality gate are untouched.
#   python:S9073  composite assertion      python:S5778  several calls inside pytest.raises
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S9073
sonar.issue.ignore.multicriteria.e1.resourceKey=retail_tower_erpnext_connector/tests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.e2.resourceKey=retail_tower_erpnext_connector/tests/**

# The coverage.xml, path-checked and rewritten by sonar_coverage_prep.py.
sonar.python.coverage.reportPaths=.sonar-coverage/coverage.xml
