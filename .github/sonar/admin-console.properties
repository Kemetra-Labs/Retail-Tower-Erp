# RT-901: scanner scope for apps/admin-console (the scan's project base directory), read by
# sonar.yml. The project key, organization and host are passed by the workflow, not set here. The
# scanner ignores .sonarcloud.properties (Automatic Analysis only), so its exclusions are carried here.
sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**

# From .sonarcloud.properties: the design hand-off bundle is reference material (it is outside
# sonar.sources already; kept so the intent survives a change of sources).
sonar.exclusions=design_handoff_retail_tower_console/**
# The Arabic and English message catalogs mirror each other key for key by design (RT-399), so
# every new key reads as duplicated code.
sonar.cpd.exclusions=src/i18n/messages/**

# The lcov, path-checked and rewritten by sonar_coverage_prep.py.
sonar.javascript.lcov.reportPaths=.sonar-coverage/lcov.info
