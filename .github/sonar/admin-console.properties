# RT-901: scanner scope for apps/admin-console (the scan's project base directory), read by
# sonar.yml. The project key, organization and host are passed by the workflow, not set here. The
# scanner ignores .sonarcloud.properties (Automatic Analysis only), so its exclusions are carried here.
#
# RT-1586: SonarQube Cloud's analysis scope analyses the whole base directory and IGNORES
# sonar.sources, sonar.tests and sonar.test.inclusions (every scan logged "configured but have no
# effect"; RT-1585). The intended scope (src as source, tests as test code) is therefore expressed
# as exclusions, the mechanism that log names, and the three ignored properties are removed.

# Not product source: root files (`*` matches the base directory's own files only, so it covers
# release-artifact.ts and the config files), agent and design tooling, specs and docs, the design
# boards and the design hand-off bundle (reference material, from .sonarcloud.properties), the
# vendored contracts, static assets, the cloud e2e harness and scripts.
sonar.exclusions=*,.claude/**,.design-sync/**,.github/**,.impeccable/**,.specify/**,cloud-e2e/**,contracts/**,design/**,design_handoff_retail_tower_console/**,docs/**,public/**,scripts/**,specs/**

# Test code stays analysed but is not counted as code to cover or as duplication. Without
# sonar.tests the scanner's own test detection is a path heuristic, so the patterns are named here.
sonar.coverage.exclusions=tests/**,**/*.test.ts,**/*.test.tsx
# The Arabic and English message catalogs mirror each other key for key by design (RT-399), so
# every new key reads as duplicated code.
sonar.cpd.exclusions=src/i18n/messages/**,tests/**,**/*.test.ts,**/*.test.tsx

# The lcov, path-checked and rewritten by sonar_coverage_prep.py.
sonar.javascript.lcov.reportPaths=.sonar-coverage/lcov.info
