# RT-901: scanner scope for services/backend-core (the scan's project base directory), read by
# sonar.yml. The project key, organization and host are passed by the workflow, not set here. The
# scanner ignores .sonarcloud.properties (Automatic Analysis only), so its exclusions are carried here.
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/test/**,**/*.spec.ts,**/*.test.ts,**/__tests__/**

# From .sonarcloud.properties: the Drizzle migrations are Postgres SQL, which the PL/SQL analyzer
# does not understand. Build output and installed packages are not source.
sonar.exclusions=**/*.sql,**/dist/**,**/node_modules/**,**/coverage/**

# Only the api Jest run collects coverage (bc/db-integration); worker, shared, auth and db show no
# coverage. Its lcov paths are relative to apps/api; sonar_coverage_prep.py prefixes them.
sonar.javascript.lcov.reportPaths=.sonar-coverage/lcov.info
