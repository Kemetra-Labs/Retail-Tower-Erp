# RT-901: scanner scope for services/backend-core (the scan's project base directory), read by
# sonar.yml. The project key, organization and host are passed by the workflow, not set here. The
# scanner ignores .sonarcloud.properties (Automatic Analysis only), so its exclusions are carried here.
#
# RT-1586: SonarQube Cloud's analysis scope analyses the whole base directory and IGNORES
# sonar.sources, sonar.tests and sonar.test.inclusions (every scan logged "configured but have no
# effect"; RT-1585). The intended scope (apps and packages) is therefore expressed as exclusions,
# the mechanism that log names, and the three ignored properties are removed.

# Not product source: root files (`*` matches the base directory's own files only), specs and
# docs, tooling, load tests, deploy scripts, changelog fragments, contract-compat fixtures. From
# .sonarcloud.properties: the Drizzle migrations are Postgres SQL, which the PL/SQL analyzer does
# not understand. Build output and installed packages are not source.
sonar.exclusions=*,.specify/**,changelog.d/**,contracts-compat/**,deploy/**,docs/**,loadtests/**,specs/**,tools/**,**/*.sql,**/dist/**,**/node_modules/**,**/coverage/**

# Test code stays analysed but is not counted as code to cover or as duplication. Without
# sonar.tests the scanner's own test detection is a path heuristic that misses `__tests__` and
# `*.spec.ts`, so the patterns are named here.
# apps/worker and packages/* upload no coverage yet: only the api Jest run (bc/db-integration)
# produces the lcov this scan reads. They are left out of the coverage measure until they upload
# one, instead of being counted as 0% (RT-1586 scope item 3).
sonar.coverage.exclusions=**/test/**,**/__tests__/**,**/*.spec.ts,**/*.test.ts,**/jest.config.cjs,apps/worker/**,packages/**
sonar.cpd.exclusions=**/test/**,**/__tests__/**,**/*.spec.ts,**/*.test.ts

# The api lcov; its paths are relative to apps/api, and sonar_coverage_prep.py prefixes them.
sonar.javascript.lcov.reportPaths=.sonar-coverage/lcov.info
