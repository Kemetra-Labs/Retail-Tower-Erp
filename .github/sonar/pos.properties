# RT-901: scanner scope for apps/pos (the scan's project base directory), read by sonar.yml.
# The project key, organization and host are passed by the workflow, not set here, so a product's
# file cannot point an analysis at another project. The scanner ignores .sonarcloud.properties
# (Automatic Analysis only), so its exclusions are carried here.
sonar.sources=src,scripts
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,tests/**

# From .sonarcloud.properties: design mockups and the Postgres migrations (the PL/SQL analyzer
# does not understand Postgres SQL).
sonar.exclusions=docs/design/**,**/*.sql
# src/shared/api-types.ts is generated by `npm run codegen:api` (RT-869); repeated vendored
# contract components are not hand-written duplication.
sonar.cpd.exclusions=src/shared/api-types.ts

# The merged lcov, path-checked and rewritten by sonar_coverage_prep.py.
sonar.javascript.lcov.reportPaths=.sonar-coverage/lcov.info
