# RT-901: scanner scope for apps/pos (the scan's project base directory), read by sonar.yml.
# The project key, organization and host are passed by the workflow, not set here, so a product's
# file cannot point an analysis at another project. The scanner ignores .sonarcloud.properties
# (Automatic Analysis only), so its exclusions are carried here.
#
# RT-1586: SonarQube Cloud's analysis scope analyses the whole base directory and IGNORES
# sonar.sources, sonar.tests and sonar.test.inclusions (every scan logged "configured but have no
# effect"; RT-1585). The intended scope (src and scripts as source, tests as test code) is
# therefore expressed as exclusions, the mechanism that log names, and the three ignored
# properties are removed.

# Not product source: root files (`*` matches the base directory's own files only), agent and
# design tooling, specs and docs (including the design mockups), the vendored contracts. From
# .sonarcloud.properties: the Postgres migrations (the PL/SQL analyzer does not understand
# Postgres SQL).
sonar.exclusions=*,.claude/**,.impeccable/**,.specify/**,contracts/**,docs/**,specs/**,**/*.sql

# Test code stays analysed but is not counted as code to cover or as duplication. Without
# sonar.tests the scanner's own test detection is a path heuristic, so the patterns are named here.
sonar.coverage.exclusions=tests/**,**/__tests__/**,**/test-utils/**,**/*.test.ts,**/*.test.tsx
# src/shared/api-types.ts is generated by `npm run codegen:api` (RT-869); repeated vendored
# contract components are not hand-written duplication.
sonar.cpd.exclusions=src/shared/api-types.ts,tests/**,**/__tests__/**,**/test-utils/**,**/*.test.ts,**/*.test.tsx

# The merged lcov, path-checked and rewritten by sonar_coverage_prep.py.
sonar.javascript.lcov.reportPaths=.sonar-coverage/lcov.info
