# RT-871 (MR-1, MR-9): Admin-Console release, independent of the other products. Publishes on an admin-console/vX.Y.Z tag (RT-717 C1); dry-run by default.
#
# Triggers: an `admin-console/vX.Y.Z` tag push, or a manual dispatch whose default is a
# dry-run. No pull_request trigger: PR code can never start this workflow with the release
# environment.
#
#   resolve   the release SHA (always github.sha) must be on main; a release needs an
#             admin-console/vX.Y.Z tag ref, a dry-run needs nothing else.
#   build     the Vite production build (`pnpm build`, the same install and build as
#             admin/build-test), packed as a deterministic tarball and uploaded as a workflow
#             artifact. No cache: a release build reads nothing a PR could write.
#   manifest  release-manifest.json + unsigned provenance + SHA256SUMS (.github/release/manifest.py):
#             source SHA, apps/admin-console tree hash, dist digest, Backend-Core contract tree
#             and the Admin-Console contract PIN, CI URL. Every run, dry-run included.
#   publish   RT-717 C1. Release mode only (an admin-console/vX.Y.Z tag), behind the
#             `release-admin-console` environment (owner reviewer, tag-only deployment policy;
#             publish refuses unless the environment is protected that way). Checks that the
#             package is the one the manifest recorded, attests its build provenance and creates
#             the GitHub release admin-console/vX.Y.Z with the archive, its .sha256 and the manifest.
#             No rebuild. Never overwrites a release, and never deploys.
#   env-probe manual negative probe (input probe_environment): asks for the environment from the
#             dispatched ref; from anything but an admin-console/v* tag it must never start.
#
# Every job is environment-free and secret-free except publish and env-probe. The token is
# read-only (workflow `permissions: {}`, contents: read per job). Only publish, admitted by the
# environment, gets contents write, id-token write and attestations write (plus actions read to
# check the environment's protection): the write scopes are
# repo-wide (a monorepo token is never confined to apps/admin-console); the boundary is the
# tag-only environment and this job's steps.
name: release-admin-console

"on":
  push:
    tags: ["admin-console/v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry-run (build + manifest, publish nothing). false needs a admin-console/vX.Y.Z tag ref.
        type: boolean
        default: true
      probe_environment:
        description: Negative probe of the release-admin-console environment from the dispatched ref
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-admin-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: release/resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout (history only, for the main-ancestry check)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: .github/release

      - name: Resolve SHA, mode and tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          TAG_RE='^refs/tags/admin-console/v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "unexpected SHA '$SHA'"
          case "$EVENT" in
            push) [[ "$REF" =~ $TAG_RE ]] || fail "tag $REF is not admin-console/vX.Y.Z"; mode=release ;;
            workflow_dispatch)
              if [ "$DRY_RUN" = "true" ]; then mode=dry-run
              else [[ "$REF" =~ $TAG_RE ]] || fail "a non-dry-run dispatch must run on a admin-console/vX.Y.Z tag ref, not $REF"; mode=release
              fi ;;
            *) fail "unsupported event $EVENT" ;;
          esac
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main || fail "$SHA is not on main"
          tag=""
          if [ "$mode" = release ]; then tag="${REF#refs/tags/}"; fi
          { echo "sha=$SHA"; echo "mode=$mode"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          echo "### release-admin-console: $mode ${tag:-(no tag)} at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: release/build (Vite dist)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/admin-console
    steps:
      - name: Checkout the release SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: apps/admin-console/package.json

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The generated API client is committed and checked against the PIN by admin/build-test
      # on main; the release builds exactly what is committed. vite.config.ts stamps GITHUB_SHA.
      # No env and no secrets: VITE_* values are inlined into the bundle, and same-origin hosting
      # (RT-315) needs VITE_API_BASE_URL unset. Vite reads it in this step, so it is refused here;
      # release-artifact.ts repeats the check and also covers committed .env* files.
      - name: Build
        run: |
          if [ -n "${VITE_API_BASE_URL+set}" ]; then
            echo "::error::VITE_API_BASE_URL must not be set for a release build (same-origin hosting, RT-315)."
            exit 1
          fi
          pnpm build

      # RT-878: carried over from the retired product release-artifact.yml (RT-337). Checks the
      # dist/ layout and writes the public dist/version.json (sha, build time, Backend-Core contract
      # pin) that Backend-Core's Console hosting serves and checks (deploy/console-smoke.sh).
      # RELEASE_TAG is empty in a dry-run. The archive name comes from artifactName() in
      # release-artifact.ts (unit-tested): admin-console-vX.Y.Z.tar.gz for a release, the short SHA otherwise.
      - name: Write version.json
        id: version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: node --experimental-strip-types release-artifact.ts

      # Deterministic tarball: sorted names, fixed mtime and owner, gzip without a timestamp.
      - name: Package dist/
        env:
          ARTIFACT: ${{ steps.version.outputs.artifact }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT" =~ ^admin-console-(v[0-9]+\.[0-9]+\.[0-9]+|dist-[0-9a-f]{12})\.tar\.gz$ ]] \
            || { echo "::error::unexpected archive name '$ARTIFACT'"; exit 1; }
          out="$RUNNER_TEMP/admin-release"
          mkdir -p "$out"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C dist -cf - . \
            | gzip -n -9 > "$out/$ARTIFACT"
          sha256sum "$out"/*.tar.gz

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-console-package-${{ needs.resolve.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/admin-release/
          if-no-files-found: error
          retention-days: 7

  manifest:
    name: release/manifest
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the release SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: admin-console-package-${{ needs.resolve.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pkg

      - name: Write the release manifest
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          MODE: ${{ needs.resolve.outputs.mode }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=("$RUNNER_TEMP"/pkg/*.tar.gz)
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::expected one dist tarball, found ${#zips[@]}"; exit 1; }
          args=(--product admin-console --sha "$SHA" --mode "$MODE" --repository "$REPOSITORY" --ci-url "$CI_URL"
                --artifact "admin-console-dist=${zips[0]}"
                --out "$RUNNER_TEMP/manifest")
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          python3 .github/release/manifest.py "${args[@]}"
          { echo '```json'; cat "$RUNNER_TEMP/manifest/release-manifest.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-console-release-manifest-${{ needs.resolve.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/manifest/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: release/publish (attestation + GitHub release)
    needs: [resolve, build, manifest]
    if: needs.resolve.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-admin-console
    # One publish at a time for the product.
    concurrency:
      group: release-admin-console-publish
      cancel-in-progress: false
    permissions:
      contents: write # the GitHub release
      id-token: write # attestation signing (Sigstore)
      attestations: write
      actions: read # the environment and deployment-policy reads in the first step
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      TAG: ${{ needs.resolve.outputs.tag }}
      REPO: ${{ github.repository }}
    # No checkout: this job runs no repository code. GH_TOKEN is set per step, only where gh needs it.
    steps:
      # A job that names a missing environment creates it unprotected. Refuse unless the
      # environment has a required reviewer and admits only admin-console/v* tags.
      - name: Refuse unless the release environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          ENV_JSON="$(gh api "repos/$REPO/environments/release-admin-console")" || fail "cannot read the release-admin-console environment"
          jq -e '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length > 0' <<<"$ENV_JSON" >/dev/null \
            || fail "release-admin-console has no required reviewer"
          jq -e '.deployment_branch_policy.custom_branch_policies == true' <<<"$ENV_JSON" >/dev/null \
            || fail "release-admin-console has no custom deployment policy"
          POLICIES="$(gh api "repos/$REPO/environments/release-admin-console/deployment-branch-policies" \
            --jq '[.branch_policies[] | {name, type}]')" || fail "cannot read the deployment policies"
          [ "$(jq -c . <<<"$POLICIES")" = '[{"name":"admin-console/v*","type":"tag"}]' ] \
            || fail "release-admin-console must admit exactly the tag pattern admin-console/v* (got $POLICIES)"

      - name: Check the release inputs
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$TAG" =~ ^admin-console/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "release tag '$TAG' is not admin-console/vX.Y.Z"
          [ "$SHA" = "$GITHUB_SHA" ] || fail "resolved SHA $SHA != workflow SHA $GITHUB_SHA"

      - name: Download the package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: admin-console-package-release-${{ github.run_id }}
          path: ${{ runner.temp }}/pkg

      - name: Download the release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: admin-console-release-manifest-release-${{ github.run_id }}
          path: ${{ runner.temp }}/manifest

      # What is published must be exactly what the build produced and the manifest job recorded: no rebuild.
      - name: Check the package against the manifest
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          shopt -s nullglob
          ART="admin-console-${TAG#admin-console/}.tar.gz"
          PKG="$RUNNER_TEMP/pkg"
          MANIFEST="$RUNNER_TEMP/manifest/release-manifest.json"
          [ "$(ls "$PKG")" = "$ART" ] || fail "the package must hold exactly $ART (got: $(ls "$PKG" | paste -sd ' ' -))"
          GOT="sha256:$(sha256sum "$PKG/$ART" | cut -d' ' -f1)"
          jq -e --arg tag "$TAG" --arg sha "$SHA" --arg file "$ART" --arg digest "$GOT" '
              .product == "admin-console" and .mode == "release" and .tag == $tag and .source.sha == $sha
              and ([.artifacts[] | select(.name == "admin-console-dist" and .file == $file and .digest == $digest)] | length == 1)
            ' "$MANIFEST" >/dev/null \
            || fail "the manifest does not match the package: expected tag $TAG, sha $SHA, file $ART, digest $GOT"
          # The .sha256 asset keeps the shape the Console hosting steps check with `sha256sum -c`.
          (cd "$PKG" && sha256sum "$ART" > "$ART.sha256")
          cp "$MANIFEST" "$PKG/release-manifest.json"

      # Re-run safe, never overwrites: a release that exists (even a draft) stops the job.
      - name: Refuse if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if OUT="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>&1)"; then
            echo "::error::release $TAG already exists (draft: $OUT); refusing to overwrite. A draft left by a failed run must be deleted by the owner first."
            exit 1
          fi
          grep -qi "release not found" <<<"$OUT" \
            || { echo "::error::could not determine whether release $TAG exists: $OUT"; exit 1; }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/pkg/admin-console-*.tar.gz

      - name: Create the GitHub release (never overwrites)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          ART="admin-console-${TAG#admin-console/}.tar.gz"
          PKG="$RUNNER_TEMP/pkg"
          [ "$(ls "$PKG" | sort | paste -sd ' ' -)" = "$(printf '%s\n' "$ART" "$ART.sha256" release-manifest.json | sort | paste -sd ' ' -)" ] \
            || fail "the release assets are not exactly $ART, $ART.sha256 and release-manifest.json"
          # --verify-tag only proves the tag exists: it must still point at the SHA this run built.
          TAG_SHA="$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)" || fail "cannot resolve tag $TAG"
          [ "$TAG_SHA" = "$SHA" ] || fail "tag $TAG now points at $TAG_SHA, not $SHA"
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --title "Admin Console $TAG" \
            --notes "Static Admin Console bundle built from $SHA by $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID. Verify with the .sha256 file and gh attestation verify before use; see apps/admin-console/docs/release/admin-console-artifact.md." \
            "$PKG/$ART" "$PKG/$ART.sha256" "$PKG/release-manifest.json"
          {
            echo "### Published $TAG"
            echo
            echo "- release: $GITHUB_SERVER_URL/$REPO/releases/tag/$TAG"
            echo "- archive: \`$ART\` ($(jq -r '.artifacts[0].digest' "$PKG/release-manifest.json"))"
          } >> "$GITHUB_STEP_SUMMARY"

  env-probe:
    name: release/env-probe (must not start outside a admin-console/v* tag)
    if: github.event_name == 'workflow_dispatch' && inputs.probe_environment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-admin-console
    permissions: {}
    steps:
      - name: Report what the environment admitted
        env:
          REF: ${{ github.ref }}
          PROBE: ${{ secrets.RELEASE_ENV_PROBE }}
        run: |
          visible=no
          if [ -n "$PROBE" ]; then visible=yes; fi
          if [[ "$REF" =~ ^refs/tags/admin-console/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release-admin-console admitted the release tag $REF, as intended (probe secret visible: $visible)"
            exit 0
          fi
          echo "::error::release-admin-console admitted $REF (probe secret visible: $visible). Only admin-console/v* tags may use this environment: set its deployment policy."
          exit 1
