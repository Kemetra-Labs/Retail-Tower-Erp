# Root CI for POS (RT-748 slice I-3). Defines the graph.yaml job keys pos/static,
# pos/test-shard-1..3, pos/test, pos/package-windows and pos/docs (static rule 5) by
# reproducing apps/pos/.github/workflows/ci.yml as imported at POS@3c1cad5, inside
# apps/pos/. The import is now at the POS SHA in tools/history/frozen.tsv. Product ci.yml
# steps added since then: the RT-830 fuse readback and native-load smoke are carried (see
# pos/package-windows); the non-blocking RT-775 display step and RT-773 Playwright Electron
# smoke are not. Job `name:` values are the graph keys, so each is a literal with no
# expression and there is no matrix (the three shards are three literal jobs). The
# workflow `name:` must stay `pos` (listed in gate.yml `workflow_run`).
# PR-reachable: read-only token, no stored credentials, no environment. The only use of the job token is the
# "Fetch main tip" step in the three shard jobs (see the comment there).
#
# Differences from the product workflow, all forced by the project graph:
#  - the graph is the only selector, so the `changes` job, the `ci` aggregate and every
#    docs_only / needs_package `if:` are gone; no `paths:` filter. RT-867: the `plan` job
#    runs the base-branch evaluator and every job below runs only if the graph selects it
#    (the shards also run for `pos/test`, which needs them). A selected job that is skipped
#    fails the gate.
#  - `pos/docs` Prettier-checks the md/json files this change touched under apps/pos/
#    whenever it is selected (a POS `low` path, or select-all), not only for docs-only PRs.
#  - the informational coverage upload is not carried over (it needs a repo credential,
#    which PR-reachable workflows must not use); coverage is still collected and gated.
#  - run directory: `defaults.run.working-directory` does not apply to `uses:` steps, so
#    the npm cache path and the artifact paths carry the apps/pos/ prefix explicitly.
name: pos

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # RT-588: number of vitest shards. There are exactly three literal shard jobs below;
  # the merge job fails if the number of blob reports differs from this.
  TEST_SHARD_COUNT: 3

concurrency:
  # Per-workflow prefix so the product workflows never cancel each other on one ref; the
  # push-SHA suffix stops consecutive pushes to main from cancelling each other.
  group: pos-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/pos

jobs:
  # RT-867 (MR-4): the project graph decides which jobs of this workflow EXECUTE, with the same
  # selection the `required` gate enforces. The evaluator and graph.yaml come from the trusted
  # commit (the PR base; the pushed main commit on push), extracted with `git archive` and never
  # from the PR head, whose tree is read as git data only. On push to main the evaluator selects
  # everything (FULL_RUN_EVENT). `jobs` is the JSON list of selected graph job keys. If this job
  # fails, every guarded job is skipped and the gate fails (UNEXPECTED_SKIP / ABSENT_JOB).
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # Full history: the evaluator diffs the base and head commits with git plumbing. Only
      # tools/project-graph is materialised; nothing from the checked-out tree is executed.
      - name: Checkout (history only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: tools/project-graph

      - name: Resolve trusted, base and head commits
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) base="$SHA"; head="$SHA" ;;   # main itself is trusted; push selects all
            *) echo "::error::unsupported event '$EVENT'"; exit 1 ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base^{commit}"
          { echo "base=$base"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      - name: Extract the trusted evaluator (git archive of the base commit)
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgraph-base"
          git archive "$BASE_SHA" tools/project-graph | tar -x -C "$RUNNER_TEMP/pgraph-base"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies (from the base commit)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r "$RUNNER_TEMP/pgraph-base/tools/project-graph/requirements.txt"

      - name: Evaluate the project graph
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgraph-base/tools/project-graph"
          python -m pgraph evaluate --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event "$EVENT" --out "$RUNNER_TEMP/plan.json"
          plan="$RUNNER_TEMP/plan.json"
          # An invalid trusted graph selects nothing; fail loudly instead of running nothing quietly.
          if [ "$(jq '.products | length' "$plan")" = "0" ]; then
            echo "::error::trusted graph invalid: $(jq -c .graph_validation "$plan")"; exit 1
          fi
          jobs="$(jq -c '.needed_jobs | if all(test("^[a-z0-9/-]+$")) then . else error("bad job key") end' "$plan")"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          {
            echo "### project graph plan"
            echo "graph validation: \`$(jq -r .graph_validation.status "$plan")\` $(jq -c .graph_validation.reasons "$plan"), select_all: \`$(jq -r .select_all "$plan")\`"
            echo
            echo "selected: \`$jobs\`"
          } >> "$GITHUB_STEP_SUMMARY"

  pos-static:
    name: pos/static
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'pos/static')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Backend-Core contract conformance
        run: npm test -- tests/contract/backend-core

      - name: Verify OpenAPI codegen drift
        run: npm run codegen:verify

      - name: Build renderer (vite)
        run: npm run build:renderer

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # RT-588: the vitest suite is split across three runners (`vitest --shard=i/N`, a
  # deterministic partition by test file). Shards only COLLECT coverage into a blob report;
  # the thresholds are evaluated once, on the merged coverage, by `pos-test`.
  pos-test-shard-1:
    name: pos/test-shard-1
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'pos/test-shard-1') || contains(fromJSON(needs.plan.outputs.jobs), 'pos/test')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # src/renderer/__tests__/source-scope-guard.test.ts runs `git diff origin/main...HEAD`
      # and falls back to `git fetch origin main`. The product repo is public, so that fetch
      # works anonymously there; this repo is private and checkout does not persist
      # credentials, so fetch the main tip here, right after checkout and before any PR
      # code runs (npm ci included), with the read-only token passed to this one command
      # only (never written to .git/config). The refspec is forced (+) because on a push to
      # main, and on a re-run of an old run, checkout has already created origin/main at the
      # pushed SHA and a depth-1 fetch of a newer tip is otherwise rejected as non-fast-forward.
      - name: Fetch main tip for the source-scope guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --no-recurse-submodules --depth=1 origin +main:refs/remotes/origin/main

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      # tests/contract/backend-core already ran (blocking) in pos/static.
      - name: Test shard 1 (coverage collected, not gated)
        run: >-
          npm test -- --coverage
          --config vitest.shard.config.ts
          --exclude 'tests/contract/backend-core/**'
          --shard=1/${TEST_SHARD_COUNT}
          --reporter=default --reporter=blob

      - name: Upload vitest blob report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-blob-1
          path: apps/pos/.vitest-reports/
          # upload-artifact skips dot-directories unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pos-test-shard-2:
    name: pos/test-shard-2
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'pos/test-shard-2') || contains(fromJSON(needs.plan.outputs.jobs), 'pos/test')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch main tip for the source-scope guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --no-recurse-submodules --depth=1 origin +main:refs/remotes/origin/main

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Test shard 2 (coverage collected, not gated)
        run: >-
          npm test -- --coverage
          --config vitest.shard.config.ts
          --exclude 'tests/contract/backend-core/**'
          --shard=2/${TEST_SHARD_COUNT}
          --reporter=default --reporter=blob

      - name: Upload vitest blob report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-blob-2
          path: apps/pos/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pos-test-shard-3:
    name: pos/test-shard-3
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'pos/test-shard-3') || contains(fromJSON(needs.plan.outputs.jobs), 'pos/test')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch main tip for the source-scope guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --no-recurse-submodules --depth=1 origin +main:refs/remotes/origin/main

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Test shard 3 (coverage collected, not gated)
        run: >-
          npm test -- --coverage
          --config vitest.shard.config.ts
          --exclude 'tests/contract/backend-core/**'
          --shard=3/${TEST_SHARD_COUNT}
          --reporter=default --reporter=blob

      - name: Upload vitest blob report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-blob-3
          path: apps/pos/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Merge job. Skipped (so the gate fails) unless EVERY shard succeeded (default success()).
  pos-test:
    name: pos/test
    needs: [plan, pos-test-shard-1, pos-test-shard-2, pos-test-shard-3]
    if: contains(fromJSON(needs.plan.outputs.jobs), 'pos/test')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Download shard blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: apps/pos/.vitest-reports

      # A missing blob would silently drop a slice of the suite from the merged report.
      - name: Check every shard blob is present
        shell: bash
        run: |
          count="$(find .vitest-reports -maxdepth 1 -name 'blob-*.json' | wc -l)"
          echo "blob reports: $count (expected $TEST_SHARD_COUNT)"
          ls -la .vitest-reports
          if [ "$count" != "$TEST_SHARD_COUNT" ]; then
            echo "::error::expected $TEST_SHARD_COUNT shard blob reports, found $count"; exit 1
          fi

      # The ONLY place coverage thresholds are evaluated: the unmodified vitest.config.ts
      # applied to coverage merged across all shards. Prints the whole-suite test totals.
      - name: Merge shard reports + coverage thresholds
        run: npm test -- --merge-reports --coverage

  pos-package-windows:
    name: pos/package-windows
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'pos/package-windows')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      # Full install: postinstall runs electron-rebuild -f -w better-sqlite3.
      - name: Install dependencies
        run: npm ci

      # Electron-ABI argon2 for the packaged app.
      - name: Rebuild argon2 for Electron ABI (packaging)
        run: npx electron-rebuild -f -w argon2

      - name: Build (renderer + main + preload)
        run: npm run build

      - name: Package (Windows --dir, unsigned)
        run: npm run package:dir

      # RT-830: Electron 44 has no install-time download; node_modules/electron/dist is fetched
      # lazily on first use. verify-packaged.ts reads the stock electron.exe from there. The
      # source POS job gets it as a side effect of its Playwright smoke step (not carried here),
      # so fetch it explicitly (the same download electron-builder does for packaging).
      - name: Fetch stock Electron binary (for the packaged-build checks)
        run: node node_modules/electron/install.js

      # RT-830 (RT-748 I-7): the packaged exe's fuse wire must equal electronFuses in
      # electron-builder.yml (undeclared fuses keep the stock Electron value). Blocking.
      - name: Fuse readback (packaged exe vs electron-builder.yml)
        run: npx tsx scripts/verify-packaged.ts fuses

      # RT-830 decision NV-6a: the hardened exe has runAsNode off, so the stock Electron from
      # node_modules (verified identical to the packaged runtime) loads better-sqlite3 and argon2
      # out of the packaged app.asar in node mode. No smoke switch ships in the app. Blocking.
      - name: Native-load smoke (packaged better-sqlite3 + argon2)
        run: npx tsx scripts/verify-packaged.ts native

      # Manual-smoke convenience artifact, not a gate: best-effort, main pushes only.
      - name: Upload unpacked Windows build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pos-pulse-win-unpacked-${{ github.sha }}
          path: apps/pos/dist-electron/win-unpacked
          retention-days: 1

  pos-docs:
    name: pos/docs
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'pos/docs')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Depth 2 makes the first parent available: HEAD^1..HEAD is this change's file set
      # (the PR merge commit against its base, or a pushed commit against its parent).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (docs-only, skip postinstall)
        run: npm ci --ignore-scripts

      # Changed md/json files under apps/pos/, prefix stripped so Prettier resolves its
      # config from the product directory. Deleted files are excluded.
      - name: Prettier check (changed md/json)
        shell: bash
        run: |
          # The diff runs on its own line so a git failure (for example a missing HEAD^1)
          # fails the job instead of being swallowed by the filter pipeline below.
          diff_out="$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- .)"
          mapfile -t files < <(printf '%s\n' "$diff_out" | sed 's#^apps/pos/##' | grep -E '\.(md|json)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            echo "Prettier-checking:"
            printf '  %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          else
            echo "No .md/.json files to Prettier-check."
          fi
