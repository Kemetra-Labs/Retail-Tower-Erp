# RT-876: root gitleaks scan for the public monorepo. Scans the full git history with the
# repo's .gitleaks.toml on every PR, every push to main and weekly. A full-history scan takes
# seconds, so PRs scan the whole history too: no base..head range to get wrong.
#
# gitleaks runs from the official release binary, checked against its pinned SHA-256. Not
# gitleaks/gitleaks-action: it needs a license key and a token on an organization repo, and this
# workflow takes no credentials. Findings are redacted in the log. No SARIF upload: that needs
# `security-events: write`, which a PR-reachable workflow may not hold (pgraph privileges).
#
# Not a graph.yaml job, so not gate-required; making it required belongs with RT-866.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, off-peak.
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks/full-history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan full history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --verbose
