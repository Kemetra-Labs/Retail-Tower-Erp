# Root CI for the Port plugins (RT-1395, RT-1467 CI-10). Defines the graph job
# `port/rt-control-room`: the read-only Port widget in tools/port-plugins/rt-control-room/. It runs
# the plugin's vitest suite, rebuilds dist/index.html (the file uploaded to Port), runs the plugin's
# own dist/src checks and fails when the committed dist/index.html differs from that fresh build, so
# a stale upload file cannot merge. Before this job, tools/** selected every product job and none
# of them ran this suite.
#
# Owner decisions (RT-1395, 2026-11-14): its own root workflow, not a job in contracts.yml; a change
# only under the plugin selects this job (graph.yaml `port_plugin`), plus the always jobs. The
# workflow `name:` must stay `port-plugins` (listed in gate.yml `workflow_run`); the job `name:` is
# the graph key, a literal with no expression.
#
# The `plan` job is the same trusted evaluator as in every root workflow (copied from contracts.yml;
# RT-1467 Phase 4 folds the copies into one composite action). PR-reachable: read-only token, no
# credentials, no environment, no cache (nothing to poison), `npm ci --ignore-scripts`.
#
# Proof note: plan and `required` read graph.yaml from the trusted base, so the PR that adds this
# job cannot select it; its first run is the merge commit's push to main (FULL_RUN_EVENT).
name: port-plugins

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-workflow prefix so the product workflows never cancel each other on one ref; the
  # push-SHA suffix stops consecutive pushes to main from cancelling each other.
  group: port-plugins-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  # RT-867 (MR-4): the project graph decides which jobs of this workflow EXECUTE, with the same
  # selection the `required` gate enforces. The evaluator and graph.yaml come from the trusted
  # commit (the PR base; the pushed main commit on push), extracted with `git archive` and never
  # from the PR head, whose tree is read as git data only. On push to main the evaluator selects
  # everything (FULL_RUN_EVENT). `jobs` is the JSON list of selected graph job keys. If this job
  # fails, every guarded job is skipped and the gate fails (UNEXPECTED_SKIP / ABSENT_JOB).
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # Full history: the evaluator diffs the base and head commits with git plumbing. Only
      # tools/project-graph is materialised; nothing from the checked-out tree is executed.
      - name: Checkout (history only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: tools/project-graph

      - name: Resolve trusted, base and head commits
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) base="$SHA"; head="$SHA" ;;   # main itself is trusted; push selects all
            *) echo "::error::unsupported event '$EVENT'"; exit 1 ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base^{commit}"
          { echo "base=$base"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      - name: Extract the trusted evaluator (git archive of the base commit)
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgraph-base"
          git archive "$BASE_SHA" tools/project-graph | tar -x -C "$RUNNER_TEMP/pgraph-base"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned dependencies (from the base commit)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r "$RUNNER_TEMP/pgraph-base/tools/project-graph/requirements.txt"

      - name: Evaluate the project graph
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgraph-base/tools/project-graph"
          python -m pgraph evaluate --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event "$EVENT" --out "$RUNNER_TEMP/plan.json"
          plan="$RUNNER_TEMP/plan.json"
          # An invalid trusted graph selects nothing; fail loudly instead of running nothing quietly.
          if [ "$(jq '.products | length' "$plan")" = "0" ]; then
            echo "::error::trusted graph invalid: $(jq -c .graph_validation "$plan")"; exit 1
          fi
          jobs="$(jq -c '.needed_jobs | if all(test("^[a-z0-9/-]+$")) then . else error("bad job key") end' "$plan")"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          {
            echo "### project graph plan"
            echo "graph validation: \`$(jq -r .graph_validation.status "$plan")\` $(jq -c .graph_validation.reasons "$plan"), select_all: \`$(jq -r .select_all "$plan")\`"
            echo
            echo "selected: \`$jobs\`"
          } >> "$GITHUB_STEP_SUMMARY"

  port-rt-control-room:
    name: port/rt-control-room
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'port/rt-control-room')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/port-plugins/rt-control-room
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The plugin's engines field asks for Node >= 24; the root .nvmrc pins 24.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install (lockfile, no install scripts)
        run: npm ci --ignore-scripts

      - name: Unit tests (vitest)
        run: npm test

      - name: Build dist/index.html
        run: npm run build

      - name: Dist and src checks (size budget, self-contained, no forbidden HTML APIs)
        run: npm run check

      # The committed upload file must be the fresh build of this commit's sources.
      - name: Stale dist check
        run: |
          if ! git diff --exit-code --stat -- dist/index.html; then
            echo "::error file=tools/port-plugins/rt-control-room/dist/index.html::dist/index.html is stale: run npm run build in tools/port-plugins/rt-control-room and commit the result"
            exit 1
          fi
