# RT-1082 (slice S2, under RT-717): manual, approval-gated deploy of one lab-signed POS release
# into the lab update feed on lab-01, modelled on deploy-console-lab.yml.
#
# preflight (every run): GitHub only, no AWS. Verifies an already published, immutable pos/vX.Y.Z
# release (release-pos.yml): its commit is on main and it holds exactly its five lab assets, plus
# the unsigned pilot package POS-Pulse-X.Y.Z-win-x64.zip for a release made after RT-1261; the
# installer matches its .sha256 and carries a build-provenance attestation signed by
# release-pos.yml for that tag; release-manifest.json names the tag and commit and records the
# installer, blockmap and lab.yml (pos-installer, pos-blockmap, pos-channel) with the digests of
# the downloaded files, and the package (pos-package) by name when the release holds it; and
# lab.yml names the version and the installer with the installer's own sha512 and size. The
# package is never downloaded here and never reaches the feed. It reads back the aws-lab
# environment and uploads a planned ledger. It changes nothing.
#
# live (dry_run=false only): after the aws-lab reviewer approves, the job assumes the deploy role
# through GitHub OIDC (no stored keys) and runs exactly one owner-created SSM document,
# RT-PosLabFeedDeploy, on the single Online node tagged Environment=lab, Host=lab-01. The document
# is the security boundary (services/backend-core/deploy/lab/ssm/): it refuses a version that is
# not higher than the one the feed serves, re-checks the three digests and lab.yml on the host,
# writes the installer and blockmap first and lab.yml last, smokes the feed and puts the previous
# lab.yml back on a failed smoke. Only strict RT_* lines reach this public log and the ledger. It
# fails closed while AWS_ROLE_ARN / AWS_REGION are unset.
#
# The feed's current version is known only on the host: preflight cannot read it, and the
# document's version gate is the roll-forward check. Concurrency is shared with the other lab
# deploys: one lab deploy at a time.
name: Deploy POS lab

"on":
  workflow_dispatch:
    inputs:
      pos_release:
        description: Published POS release pos/vX.Y.Z of this repository (from release-pos.yml)
        required: true
        type: string
      jira_key:
        description: Jira issue authorizing this run (RT-<number>)
        required: true
        type: string
      dry_run:
        description: Preflight only (default). false runs the live deploy after preflight, with aws-lab approval
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: deploy-aws-lab
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight (verify release, lab.yml, planned ledger, no deploy)
    # No job-level `if`: a dispatch from any other ref must FAIL in the first step, not skip green.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # release metadata and assets, tag commits, compare
      attestations: read # gh attestation verify
      actions: read # read (never create) the aws-lab environment
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      installer_digest: ${{ steps.plan.outputs.installer_digest }}
      blockmap_digest: ${{ steps.plan.outputs.blockmap_digest }}
      channel_digest: ${{ steps.plan.outputs.channel_digest }}
      environment_gate: ${{ steps.plan.outputs.environment_gate }}
    steps:
      - name: Guard (main only, validated inputs)
        env:
          RUN_REF: ${{ github.ref }}
          POS_RELEASE: ${{ inputs.pos_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [ "$RUN_REF" = "refs/heads/main" ] || fail "must be dispatched from refs/heads/main"
          [[ "$POS_RELEASE" =~ ^pos/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "pos_release must be pos/vX.Y.Z"
          [[ "$JIRA_KEY" =~ ^RT-[1-9][0-9]{0,5}$ ]] || fail "jira_key must be RT-<number>"
          case "$DRY_RUN" in true | false) ;; *) fail "dry_run must be true or false" ;; esac

      # Release metadata, tag commits and assets through the read-only token; no checkout, no
      # repository code runs in this job.
      - name: Verify the POS release (immutable, on main, assets, checksum, attestation, manifest)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          POS_RELEASE: ${{ inputs.pos_release }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          VERSION="${POS_RELEASE#pos/v}"
          EXE="POS-Pulse-LAB-Setup-$VERSION.exe"
          ZIP="POS-Pulse-$VERSION-win-x64.zip"
          VIEW="$(gh release view "$POS_RELEASE" --repo "$REPO" --json isImmutable,isDraft,assets)" \
            || fail "$POS_RELEASE is not a published release"
          jq -e '.isImmutable == true and .isDraft == false' <<<"$VIEW" >/dev/null \
            || fail "$POS_RELEASE is not a published, immutable release"
          # Five lab assets (a release made before RT-1261), or the same five plus the pilot package zip.
          NAMES="$(jq -r '[.assets[].name] | sort | join(" ")' <<<"$VIEW")"
          FIVE="$(printf '%s\n' "$EXE" "$EXE.blockmap" "$EXE.sha256" lab.yml release-manifest.json | sort | paste -sd ' ' -)"
          SIX="$(printf '%s\n' "$EXE" "$EXE.blockmap" "$EXE.sha256" lab.yml release-manifest.json "$ZIP" | sort | paste -sd ' ' -)"
          if [ "$NAMES" = "$FIVE" ]; then PACKAGE=absent
          elif [ "$NAMES" = "$SIX" ]; then PACKAGE=present
          else fail "$POS_RELEASE must hold exactly $EXE, $EXE.blockmap, $EXE.sha256, lab.yml and release-manifest.json, and optionally $ZIP"
          fi
          SHA="$(gh api "repos/$REPO/commits/refs/tags/$POS_RELEASE" --jq .sha)" || fail "cannot resolve tag $POS_RELEASE"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "tag $POS_RELEASE does not name a commit"
          case "$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)" in
            ahead | identical) ;;
            *) fail "$POS_RELEASE ($SHA) is not on main" ;;
          esac
          DL="$RUNNER_TEMP/release"
          mkdir -p "$DL"
          gh release download "$POS_RELEASE" --repo "$REPO" --dir "$DL" \
            --pattern "$EXE" --pattern "$EXE.blockmap" --pattern "$EXE.sha256" --pattern lab.yml --pattern release-manifest.json \
            || fail "cannot download the release assets"
          [ "$(awk 'END { print NR }' "$DL/$EXE.sha256")" = 1 ] || fail "the .sha256 must list exactly one file"
          [ "$(awk '{ print $2 }' "$DL/$EXE.sha256")" = "$EXE" ] || fail "the .sha256 must list $EXE"
          (cd "$DL" && sha256sum --check --strict "$EXE.sha256") || fail "$EXE does not match its .sha256"
          gh attestation verify "$DL/$EXE" --repo "$REPO" \
            --signer-workflow Kemetra-Labs/Retail-Tower-Erp/.github/workflows/release-pos.yml \
            --source-ref "refs/tags/$POS_RELEASE" >/dev/null || fail "no valid release-pos.yml attestation for $EXE from refs/tags/$POS_RELEASE"
          digest() { echo "sha256:$(sha256sum "$DL/$1" | cut -d' ' -f1)"; }
          INSTALLER_DIGEST="$(digest "$EXE")"
          BLOCKMAP_DIGEST="$(digest "$EXE.blockmap")"
          CHANNEL_DIGEST="$(digest lab.yml)"
          # The manifest release-pos.yml wrote and checked before publishing, with the same predicate. The
          # package is not deployed, so it is bound by name only: release-pos.yml checked its digest.
          jq -e --arg tag "$POS_RELEASE" --arg sha "$SHA" \
              --arg exe "$EXE" --arg exe_digest "$INSTALLER_DIGEST" \
              --arg map "$EXE.blockmap" --arg map_digest "$BLOCKMAP_DIGEST" \
              --arg yml lab.yml --arg yml_digest "$CHANNEL_DIGEST" \
              --arg zip "$ZIP" --arg package "$PACKAGE" '
              .product == "pos" and .mode == "release" and .tag == $tag and .source.sha == $sha
              and ([.artifacts[] | select(.name == "pos-installer" and .file == $exe and .digest == $exe_digest)] | length == 1)
              and ([.artifacts[] | select(.name == "pos-blockmap" and .file == $map and .digest == $map_digest)] | length == 1)
              and ([.artifacts[] | select(.name == "pos-channel" and .file == $yml and .digest == $yml_digest)] | length == 1)
              and (if $package == "present"
                   then ([.artifacts[] | select(.name == "pos-package" and .file == $zip)] | length == 1)
                        and (.artifacts | length == 4)
                   else (.artifacts | length == 3) end)
            ' "$DL/release-manifest.json" >/dev/null \
            || fail "release-manifest.json does not name $POS_RELEASE, $SHA and the downloaded installer, blockmap and lab.yml (package: $PACKAGE)"
          {
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "installer_digest=$INSTALLER_DIGEST"
            echo "blockmap_digest=$BLOCKMAP_DIGEST"
            echo "channel_digest=$CHANNEL_DIGEST"
          } >> "$GITHUB_OUTPUT"

      # The updater trusts lab.yml for the version, the file and its sha512: it must describe exactly
      # the attested installer. Every occurrence of a key must match (electron-builder writes sha512
      # at the top level and in files[], and size only in files[]), read without a YAML parser, the
      # same way release-lab-installer.ps1 and RT-PosLabFeedDeploy read it.
      - name: Check lab.yml against the installer
        env:
          POS_RELEASE: ${{ inputs.pos_release }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          VERSION="${POS_RELEASE#pos/v}"
          EXE="POS-Pulse-LAB-Setup-$VERSION.exe"
          DL="$RUNNER_TEMP/release"
          YML="$DL/lab.yml"
          [ -f "$YML" ] && [ -f "$DL/$EXE" ] || fail "lab.yml or $EXE is missing"
          values() {
            sed -nE "s/^[[:space:]]*(-[[:space:]]+)?$1:[[:space:]]*['\"]?([^'\"]*[^'\"[:space:]])?['\"]?[[:space:]]*\$/\\2/p" "$YML"
          }
          top() {
            local v
            v="$(grep -E "^$1:" "$YML" | sed -nE "s/^$1:[[:space:]]*['\"]?([^'\"]*[^'\"[:space:]])?['\"]?[[:space:]]*\$/\\1/p")"
            # nothing when the key is missing or repeated, so the comparison below refuses it
            [ "$(grep -c . <<<"$v" || true)" = 1 ] && printf '%s\n' "$v"
          }
          all_equal() {
            local key="$1" want="$2" optional="${3:-}" v
            v="$(values "$key")"
            if [ -z "$v" ]; then [ "$optional" = optional ] || fail "lab.yml has no $key"; return 0; fi
            [ "$(grep -cvxF -- "$want" <<<"$v" || true)" = 0 ] || fail "lab.yml $key is not that of $EXE"
          }
          SHA512="$(openssl dgst -sha512 -binary "$DL/$EXE" | base64 -w0)"
          SIZE="$(stat -c '%s' "$DL/$EXE")"
          [ "$(top version)" = "$VERSION" ] || fail "lab.yml version is not $VERSION"
          [ "$(top path)" = "$EXE" ] || fail "lab.yml path is not $EXE"
          all_equal url "$EXE" optional
          all_equal sha512 "$SHA512"
          all_equal size "$SIZE"
          echo "lab.yml names $VERSION and $EXE with its sha512 and size ($SIZE bytes)"

      # Report the approval gate; never create it. A 404 is "not visible", not proof it is missing.
      - name: Read back the aws-lab environment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if OUT="$(gh api "repos/$REPO/environments/aws-lab" 2>&1)"; then
            jq '{status: "present", reviewers: ([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length)}' \
              <<<"$OUT" > "$RUNNER_TEMP/environment.json"
          elif grep -q "Not Found" <<<"$OUT"; then
            echo '{"status":"not-visible","reviewers":0}' > "$RUNNER_TEMP/environment.json"
          else
            echo '{"status":"unknown","reviewers":0}' > "$RUNNER_TEMP/environment.json"
          fi

      - name: Write the planned ledger
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          JIRA_KEY: ${{ inputs.jira_key }}
          POS_RELEASE: ${{ inputs.pos_release }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
          INSTALLER_DIGEST: ${{ steps.release.outputs.installer_digest }}
          BLOCKMAP_DIGEST: ${{ steps.release.outputs.blockmap_digest }}
          CHANNEL_DIGEST: ${{ steps.release.outputs.channel_digest }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          GATE="$(jq -r 'if .status == "present" and (.reviewers | type) == "number" and .reviewers >= 1 then "reviewed" else "unverified" end' \
            "$RUNNER_TEMP/environment.json" 2>/dev/null || echo unverified)"
          mkdir -p "$RUNNER_TEMP/plan"
          jq -n --arg jira "$JIRA_KEY" --arg actor "$ACTOR" --arg run "$RUN_URL" --arg tag "$POS_RELEASE" \
            --arg version "$VERSION" --arg sha "$SHA" --arg exe "$INSTALLER_DIGEST" --arg map "$BLOCKMAP_DIGEST" \
            --arg yml "$CHANNEL_DIGEST" --arg gate "$GATE" --arg dry "$DRY_RUN" '{
              schemaVersion: 1, kind: "rt1082-pos-lab-planned-ledger", mode: (if $dry == "true" then "dry-run" else "live" end),
              outcome: "planned", refusals: [],
              jiraKey: $jira, actor: $actor, runUrl: $run, generatedAt: (now | todate),
              target: {host: "lab-01", environment: "aws-lab", feed: "lab", release: $tag, version: $version, sha: $sha,
                installerDigest: $exe, blockmapDigest: $map, channelDigest: $yml},
              feedVersion: "read on lab-01 by RT-PosLabFeedDeploy, which refuses a version that is not higher",
              environmentGate: $gate
            }' > "$RUNNER_TEMP/plan/planned-ledger.json"
          {
            echo "## POS lab feed deploy plan ($([ "$DRY_RUN" = true ] && echo dry run || echo live))"
            echo
            echo "$POS_RELEASE ($SHA) into the lab feed on lab-01, $JIRA_KEY. Environment gate: $GATE."
            echo
            echo '```json'
            cat "$RUNNER_TEMP/plan/planned-ledger.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "version=$VERSION"
            echo "release_sha=$SHA"
            echo "installer_digest=$INSTALLER_DIGEST"
            echo "blockmap_digest=$BLOCKMAP_DIGEST"
            echo "channel_digest=$CHANNEL_DIGEST"
            echo "environment_gate=$GATE"
          } >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "false" ] && [ "$GATE" != "reviewed" ]; then
            echo "::error::live run refused: the aws-lab environment was not read back with a required reviewer"
            exit 1
          fi

      - name: Upload the planned ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pos-lab-planned-${{ github.run_id }}
          path: ${{ runner.temp }}/plan/
          if-no-files-found: warn
          retention-days: 90

  live:
    name: live deploy (aws-lab, OIDC, SSM RT-PosLabFeedDeploy on lab-01)
    needs: preflight
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: aws-lab
    permissions:
      contents: read # checkout of main for the claim printer
      id-token: write # the OIDC token for the deploy role; nothing else is granted
    steps:
      - name: Guard (main only, live run, verified plan)
        env:
          RUN_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          POS_RELEASE: ${{ inputs.pos_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          INSTALLER_DIGEST: ${{ needs.preflight.outputs.installer_digest }}
          BLOCKMAP_DIGEST: ${{ needs.preflight.outputs.blockmap_digest }}
          CHANNEL_DIGEST: ${{ needs.preflight.outputs.channel_digest }}
          ENVIRONMENT_GATE: ${{ needs.preflight.outputs.environment_gate }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [ "$RUN_REF" = "refs/heads/main" ] || fail "must be dispatched from refs/heads/main"
          [ "$DRY_RUN" = "false" ] || fail "the live job runs only when dry_run=false"
          [ "$ENVIRONMENT_GATE" = "reviewed" ] || fail "preflight did not read back aws-lab with a required reviewer"
          [[ "$POS_RELEASE" =~ ^pos/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "pos_release must be pos/vX.Y.Z"
          [[ "$JIRA_KEY" =~ ^RT-[1-9][0-9]{0,5}$ ]] || fail "jira_key must be RT-<number>"
          [ "$VERSION" = "${POS_RELEASE#pos/v}" ] || fail "preflight plan names another version"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "preflight plan lacks the release commit"
          [[ "$INSTALLER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "preflight plan lacks the installer digest"
          [[ "$BLOCKMAP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "preflight plan lacks the blockmap digest"
          [[ "$CHANNEL_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "preflight plan lacks the lab.yml digest"

      # Fails closed until the owner sets both non-secret variables on aws-lab. Runs before any token is requested.
      - name: Check the deploy variables (fail closed when unset)
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [ -n "${AWS_ROLE_ARN:-}" ] || fail "AWS_ROLE_ARN is not set on the aws-lab environment: the live deploy stays off"
          [ -n "${AWS_REGION:-}" ] || fail "AWS_REGION is not set on the aws-lab environment: the live deploy stays off"
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$ ]] \
            || fail "AWS_ROLE_ARN must be an IAM role ARN (never root, a user or an access key)"
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || fail "AWS_REGION must be a region name such as us-east-1"

      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Non-secret trust-policy claims before the first assume, so a deny is diagnosed, not guessed.
      - name: Print the OIDC claims (non-secret, informational)
        env:
          JIRA_KEY: ${{ inputs.jira_key }}
        run: |
          set -euo pipefail
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] \
            || { echo "::error::no OIDC request variables: the job needs id-token: write"; exit 1; }
          echo "::add-mask::$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          RESPONSE="$(curl --silent --show-error --fail --max-time 20 \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")" || { echo "::error::the OIDC token request failed"; exit 1; }
          TOKEN="$(jq -er .value <<<"$RESPONSE" 2>/dev/null)" || { echo "::error::the OIDC response held no token"; exit 1; }
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | node services/backend-core/deploy/lab/oidc-claims-check.cjs \
            --jira-key "$JIRA_KEY" --workflow-file deploy-pos-lab.yml --summary "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::a claim differs from the trust design; see the step summary (AWS STS still decides)"

      - name: Assume the deploy role (GitHub OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: rt-deploy-pos-lab-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Run RT-PosLabFeedDeploy on lab-01
        id: ssm
        env:
          POS_RELEASE: ${{ inputs.pos_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          VERSION: ${{ needs.preflight.outputs.version }}
          INSTALLER_DIGEST: ${{ needs.preflight.outputs.installer_digest }}
          BLOCKMAP_DIGEST: ${{ needs.preflight.outputs.blockmap_digest }}
          CHANNEL_DIGEST: ${{ needs.preflight.outputs.channel_digest }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          LIVE="$RUNNER_TEMP/live"
          mkdir -p "$LIVE"
          fail() { echo "::error::$*"; echo "$*" > "$LIVE/failure.txt"; exit 1; }
          RESULT_RE='^RT_(GATE|FAIL|PRIOR|TARGET|SWAP|REVERT|PRUNE|DONE)( [A-Za-z0-9=:._/-]+)*$'

          # One Online managed node, found by its owner-set tags (a tag filter cannot be mixed with PingStatus).
          NODE="$(aws ssm describe-instance-information \
            --filters "Key=tag:Environment,Values=lab" "Key=tag:Host,Values=lab-01" \
            --query "InstanceInformationList[?PingStatus=='Online'].InstanceId" --output text)" || fail "describe-instance-information failed"
          [[ "$NODE" =~ ^mi-[0-9a-f]{17}$ ]] || fail "no single Online SSM node tagged Environment=lab, Host=lab-01"

          jq -n --arg t "$POS_RELEASE" --arg v "$VERSION" --arg i "$INSTALLER_DIGEST" --arg b "$BLOCKMAP_DIGEST" \
            --arg c "$CHANNEL_DIGEST" \
            '{ReleaseTag: [$t], Version: [$v], InstallerDigest: [$i], BlockmapDigest: [$b], ChannelDigest: [$c]}' \
            > "$LIVE/params.json"

          CMD="$(aws ssm send-command --instance-ids "$NODE" --document-name RT-PosLabFeedDeploy --document-version '$DEFAULT' \
            --parameters "file://$LIVE/params.json" --timeout-seconds 600 --comment "deploy-pos-lab run $RUN_ID $JIRA_KEY" \
            --query Command.CommandId --output text)" || fail "send-command was refused"
          [[ "$CMD" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || fail "no command ID"
          echo "command $CMD on $NODE"
          # The document runs up to 1500 s (the installer download is the long step); polling stops a minute later.
          STATUS=Pending
          DEADLINE=$(( $(date +%s) + 1560 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 10
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$NODE" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Success | Failed | Cancelled | TimedOut | Undeliverable | Terminated) break ;; *) ;; esac
          done
          echo "$STATUS" > "$LIVE/status"
          # The raw output never reaches the log: only strict RT_* lines are kept.
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$NODE" \
            --query StandardOutputContent --output text 2>/dev/null \
            | grep -E "$RESULT_RE" > "$LIVE/deploy.lines" || true
          cat "$LIVE/deploy.lines"
          [ "$STATUS" = Success ] || fail "the document ended $STATUS"
          grep -qxF "RT_DONE release=$POS_RELEASE" "$LIVE/deploy.lines" || fail "the document did not report completion"

      # The live ledger: the feed's prior and new version, digests, gate results and the failure
      # boundary, built only from the strict RT_* lines. No secrets.
      - name: Write the live ledger
        if: always()
        env:
          POS_RELEASE: ${{ inputs.pos_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          INSTALLER_DIGEST: ${{ needs.preflight.outputs.installer_digest }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SSM_OUTCOME: ${{ steps.ssm.outcome }}
        run: |
          set -euo pipefail
          LIVE="$RUNNER_TEMP/live"
          OUT="$RUNNER_TEMP/live-ledger"
          mkdir -p "$LIVE" "$OUT"
          LINES="$(cat "$LIVE/deploy.lines" 2>/dev/null || true)"
          FAILURE="$(cat "$LIVE/failure.txt" 2>/dev/null || true)"
          if [ -z "$FAILURE" ] && [ "$SSM_OUTCOME" != success ]; then
            FAILURE="live job stopped before or during the SSM run (outcome: ${SSM_OUTCOME:-not-run})"
          fi
          jq -n --arg release "$POS_RELEASE" --arg version "$VERSION" --arg sha "$RELEASE_SHA" --arg digest "$INSTALLER_DIGEST" \
            --arg jira "$JIRA_KEY" --arg actor "$ACTOR" --arg run "$RUN_URL" --arg failure "$FAILURE" --arg lines "$LINES" '
            def kv: split(" ")[1:] | map(capture("^(?<key>[^=]+)=(?<value>.*)$")) | from_entries;
            ($lines | split("\n") | map(select(length > 0))) as $all
            | {
                schemaVersion: 1, kind: "rt1082-pos-lab-live-ledger", mode: "live",
                outcome: (if $failure == "" and ($all | any(. == "RT_DONE release=" + $release)) then "deployed" else "failed" end),
                jiraKey: $jira, actor: $actor, runUrl: $run, generatedAt: (now | todate),
                target: {host: "lab-01", environment: "aws-lab", feed: "lab", release: $release, version: $version, sha: $sha, installerDigest: $digest},
                prior: ([$all[] | select(startswith("RT_PRIOR ")) | kv] | first),
                swap: ([$all[] | select(startswith("RT_SWAP ")) | kv] | first),
                prune: ([$all[] | select(startswith("RT_PRUNE ")) | kv] | first),
                gates: [$all[] | select(startswith("RT_GATE ")) | split(" ") | {gate: .[1], result: .[2]}],
                revert: [$all[] | select(startswith("RT_REVERT "))],
                failureBoundary: ([$all[] | select(startswith("RT_FAIL ")) | kv] | first // (if $failure == "" then null else {reason: $failure} end))
              }' > "$OUT/ledger.json"
          {
            echo "## POS lab feed deploy live: $(jq -r '.outcome | ascii_upcase' "$OUT/ledger.json")"
            echo
            echo "$POS_RELEASE ($RELEASE_SHA, installer $INSTALLER_DIGEST) into the lab feed on lab-01, $JIRA_KEY."
            echo
            echo '```'
            printf '%s\n' "$LINES"
            echo '```'
            if [ -n "$FAILURE" ]; then echo; echo "Failure boundary: $FAILURE"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the live ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pos-lab-live-${{ github.run_id }}
          path: ${{ runner.temp }}/live-ledger/
          if-no-files-found: warn
          retention-days: 90
