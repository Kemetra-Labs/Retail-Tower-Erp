# Root CI for Admin-Console (RT-748 slice I-4, RT-794). Defines the graph.yaml job key
# admin/build-test and admin/e2e (RT-872) (static rule 5) by reproducing the `build-test` job of
# apps/admin-console/.github/workflows/ci.yml as imported at Admin-Console@a85e3e8,
# inside apps/admin-console/. The import is now at the Admin-Console SHA in
# tools/history/frozen.tsv; the one product ci.yml change since then (RT-831 parity manifest)
# is carried below. Each graph-key job `name:` is a literal with no expression and no matrix;
# the RT-1278 E2E shards are a matrix whose expression names are not graph keys. The
# workflow `name:` must stay `admin-console` (listed in gate.yml `workflow_run`).
# PR-reachable: read-only token, no credentials, no environment.
#
# RT-889: the pinned Backend-Core contracts are read from this repository's own history (the
# in-tree services/backend-core/packages/contracts/openapi at the commit in
# apps/admin-console/contracts/backend-core/PIN), so admin/build-test checks out with
# fetch-depth: 0 and makes no network git clone. Drift detection stays fail-closed: the client
# is regenerated at the pin and the job fails if src/generated/ differs from the committed output.
#
# Differences from the product workflow, all forced by the project graph:
#  - the graph is the only selector, so there is no `paths:` filter. RT-867: the `plan` job
#    runs the base-branch evaluator and the job runs only if the graph selects it. A selected
#    job that is skipped fails the gate.
#  - RT-872: the Playwright E2E steps run outside build-test (RT-1278: 4 shard jobs, merged and
#    checked by the fan-in admin/e2e), and every retry is counted in the fan-in's summary.
#  - RT-817: admin/e2e runs inside the official Playwright image (browsers and system deps
#    baked in), pinned by digest, so it has no apt step and no browser cache. The image tag
#    must equal the Playwright version in apps/admin-console/pnpm-lock.yaml; the job's first
#    step checks it, and Renovate bumps both in its `test` group (renovate.json5).
#  - the informational Codecov upload is not carried over (it needs a repository credential,
#    which PR-reachable workflows must not use). Coverage is still collected by `pnpm test`.
#    Dropping the upload here does not resolve RT-748 NV-9 (Codecov reporting), which stays
#    open.
#  - run directory: `defaults.run.working-directory` does not apply to `uses:` steps, so the
#    pnpm package.json and the pnpm cache path carry the apps/admin-console/ prefix
#    explicitly. `hashFiles` resolves from the workspace root.
#
# Hardening, not parity: actions are pinned to SHAs (the product used floating @v4 for
# checkout, setup-node and cache), checkout does not persist credentials, and pull_request
# is limited to branches: [main] (the gate evaluates PRs against main only).
#
# Known, not fixed here (product script, upstream first): report-flaky-e2e.mjs builds its
# `::warning file=` paths relative to apps/admin-console, so those annotations anchor to the
# wrong path in this repository. The step stays warn-only.
name: admin-console

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-workflow prefix so the product workflows never cancel each other on one ref; the
  # push-SHA suffix stops consecutive pushes to main from cancelling each other (RT-579).
  group: admin-console-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/admin-console

jobs:
  # RT-867 (MR-4): the project graph decides which jobs of this workflow EXECUTE, with the same
  # selection the `required` gate enforces. The evaluator and graph.yaml come from the trusted
  # commit (the PR base; the pushed main commit on push), extracted with `git archive` and never
  # from the PR head, whose tree is read as git data only. On push to main the evaluator selects
  # everything (FULL_RUN_EVENT). `jobs` is the JSON list of selected graph job keys. If this job
  # fails, every guarded job is skipped and the gate fails (UNEXPECTED_SKIP / ABSENT_JOB).
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # Full history: the evaluator diffs the base and head commits with git plumbing. Only
      # tools/project-graph is materialised; nothing from the checked-out tree is executed.
      - name: Checkout (history only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: tools/project-graph

      - name: Resolve trusted, base and head commits
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) base="$SHA"; head="$SHA" ;;   # main itself is trusted; push selects all
            *) echo "::error::unsupported event '$EVENT'"; exit 1 ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base^{commit}"
          { echo "base=$base"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      - name: Extract the trusted evaluator (git archive of the base commit)
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgraph-base"
          git archive "$BASE_SHA" tools/project-graph | tar -x -C "$RUNNER_TEMP/pgraph-base"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned dependencies (from the base commit)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r "$RUNNER_TEMP/pgraph-base/tools/project-graph/requirements.txt"

      - name: Evaluate the project graph
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgraph-base/tools/project-graph"
          python -m pgraph evaluate --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event "$EVENT" --out "$RUNNER_TEMP/plan.json"
          plan="$RUNNER_TEMP/plan.json"
          # An invalid trusted graph selects nothing; fail loudly instead of running nothing quietly.
          if [ "$(jq '.products | length' "$plan")" = "0" ]; then
            echo "::error::trusted graph invalid: $(jq -c .graph_validation "$plan")"; exit 1
          fi
          jobs="$(jq -c '.needed_jobs | if all(test("^[a-z0-9/-]+$")) then . else error("bad job key") end' "$plan")"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          {
            echo "### project graph plan"
            echo "graph validation: \`$(jq -r .graph_validation.status "$plan")\` $(jq -c .graph_validation.reasons "$plan"), select_all: \`$(jq -r .select_all "$plan")\`"
            echo
            echo "selected: \`$jobs\`"
          } >> "$GITHUB_STEP_SUMMARY"

  admin-build-test:
    name: admin/build-test
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'admin/build-test')
    runs-on: ubuntu-latest
    # RT-584: default is 360 min; the job's p90 is ~2 min, so a hang fails fast.
    # RT-1265: 40 = the verifier step's 22 minutes (20-minute wait for the CircleCI status plus
    # polling) + up to 18 minutes for the steps before it (p90 today about 1 minute), so a slow
    # install or build never cancels the job while a CircleCI success is still on its way.
    timeout-minutes: 40
    # RT-1265: statuses: read for the CircleCI commit status the verifier judges.
    permissions:
      contents: read
      statuses: read
    steps:
      # fetch-depth 0 (RT-889): `pnpm generate:client` reads the contract sources with
      # `git show <pin>:<path>` from this repository, and the pin is an older commit.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # RT-1265: where Vitest runs. On a pull request whose TRUSTED base (the PR base commit,
      # extracted with git archive, never the PR head) has pgraph/circleci_gate.py with
      # ADMIN_CUTOVER_ENABLED = True, this job verifies CircleCI's `admin-vitest-gate` result for the
      # exact head SHA (mode=circleci) and runs no Vitest. Otherwise it runs `pnpm test` here
      # (mode=github): push to main (also Sonar's lcov), a base before the cutover or with the flag
      # off, a fork PR (CircleCI never builds forks), or a PR whose .circleci/ differs from the base
      # (CircleCI would compile the PR's own config). Every other step of this job runs in both modes.
      - name: Vitest provider (RT-1265) - verify CircleCI or run here
        id: mode
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mode=github
          why="not a pull request"
          if [ "$EVENT" = pull_request ]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            dir="$RUNNER_TEMP/pgraph-base"
            mkdir -p "$dir"
            git archive "$BASE_SHA" tools/project-graph | tar -x -C "$dir"
            gate="$dir/tools/project-graph/pgraph/circleci_gate.py"
            rc=0
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- .circleci/ || rc=$?
            if ! { [ -f "$gate" ] && grep -qx 'ADMIN_CUTOVER_ENABLED = True' "$gate"; }; then
              why="the trusted base has no Admin Vitest cutover"
            elif [ "$HEAD_REPO" != "$REPO" ]; then
              why="fork PR"
            elif [ "$rc" -ne 0 ]; then
              why=".circleci/ differs from the base (git diff rc=$rc)"
            else
              mode=circleci
              why="verify CircleCI admin-vitest-gate"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "### Vitest provider (RT-1265): $mode ($why)" >> "$GITHUB_STEP_SUMMARY"

      # The action reads `packageManager` from a path relative to the workspace root, not
      # from the run directory, so it is named explicitly.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: apps/admin-console/package.json

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/admin-console/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # RT-584: the generated client is committed, so drift from the pinned
      # Backend-Core contract (hand edit, stale regen, generator bump) must fail
      # before merge. RT-889: the sources come from this repository's history at the
      # PIN commit (local git, no network). Runs before Build so drift fails fast.
      - name: Regenerate API client
        run: pnpm generate:client

      - name: Check API client is up to date
        run: |
          if ! git diff --exit-code --stat src/generated/; then
            echo "::error title=API client drift::src/generated/ differs from a regeneration at the pinned Backend-Core commit. Run 'pnpm generate:client' and commit the result."
            exit 1
          fi

      - name: Build
        run: pnpm build

      # RT-831: monorepo parity evidence (RT-711 item 3), the same two steps as the product
      # ci.yml since Admin-Console@2e3c7f6c. vite.config.ts bakes GITHUB_SHA into the bundle
      # (RT-633), so stamped builds differ between the product repo and this repository. Hash
      # an extra build with GITHUB_SHA unset; the shipped dist/ above is unchanged. Its digest
      # must equal the product run's digest at the same imported tree.
      # RT-1242: the hidden source maps are not hashed (the frozen product builds had none; the JS is unchanged).
      - name: Parity manifest (unstamped dist, RT-711)
        run: |
          out="$RUNNER_TEMP/dist-parity"
          env -u GITHUB_SHA pnpm exec vite build --outDir "$out" --emptyOutDir
          (cd "$out" && find . -type f ! -name '*.map' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/dist-parity.sha256"
          cat "$RUNNER_TEMP/dist-parity.sha256"
          digest=$(sha256sum "$RUNNER_TEMP/dist-parity.sha256" | cut -d' ' -f1)
          echo "dist-parity manifest digest: $digest"
          echo "dist-parity manifest digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      # `uses:` steps do not inherit defaults.run.working-directory; both paths are absolute.
      - name: Upload parity manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-dist-parity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dist-parity.sha256
            ${{ runner.temp }}/dist-parity
          retention-days: 1
          if-no-files-found: error

      - name: Lint
        run: pnpm lint

      # RT-1200: dead code (knip), duplication (jscpd) and Biome cognitive-complexity warnings may
      # not grow past scripts/code-health/baseline.json. A PR that lowers a count runs
      # `pnpm code-health:update` in the same PR; --update never raises a count.
      - name: Code-health ratchet (RT-1200)
        run: pnpm code-health

      - name: Unit tests
        if: steps.mode.outputs.mode == 'github'
        run: pnpm test

      - name: Set up Python (CircleCI verifier)
        if: steps.mode.outputs.mode == 'circleci'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # RT-1265: the verdict comes from the trusted base's pgraph (circleci_gate.judge, target admin).
      # Exit 0 passes, 1 fails, 3 waits and polls again; at the 20-minute deadline a wait becomes a
      # failure (ABSENT_STATUS / STATUS_INCOMPLETE). A failed statuses call is a wait, then a failure
      # at the deadline. It runs after build, lint and code-health, so those overlap the CircleCI run.
      - name: Verify the CircleCI Admin Vitest result for the exact head SHA (RT-1265)
        if: steps.mode.outputs.mode == 'circleci'
        working-directory: .
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          pg="$RUNNER_TEMP/pgraph-base/tools/project-graph"
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r "$pg/requirements.txt"
          out="$RUNNER_TEMP/admin-gate"
          mkdir -p "$out"
          flags=()
          [ "$HEAD_REPO" = "$REPO" ] || flags+=(--fork)
          git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- .circleci/ || flags+=(--circleci-changed)
          mb="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          # --no-renames: a rename lists its old and new path, as the graph classifies both.
          git diff --name-only --no-renames "$mb" "$HEAD_SHA" > "$out/paths.txt"
          deadline=$((SECONDS + 20 * 60))
          while :; do
            late=()
            [ "$SECONDS" -lt "$deadline" ] || late=(--deadline-passed)
            rc=0
            if gh api --paginate "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" > "$out/raw.json" 2> "$out/api.err" \
              && jq -s 'add // []' "$out/raw.json" > "$out/statuses.json"; then
              (cd "$pg" && python -m pgraph circleci-gate --target admin --event pull_request --head "$HEAD_SHA" \
                --statuses "$out/statuses.json" --paths "$out/paths.txt" "${flags[@]}" "${late[@]}") \
                > "$out/verdict.json" || rc=$?
              jq -c . "$out/verdict.json"
            else
              echo "statuses API call failed: $(head -c 300 "$out/api.err")"
              rc=3
              [ "${#late[@]}" -eq 0 ] || rc=1
            fi
            case "$rc" in
              0) echo "CircleCI admin-vitest-gate passed for $HEAD_SHA."; break ;;
              3) sleep 30 ;;
              *) echo "::error::CircleCI Admin Vitest result not accepted: $(jq -c .reasons "$out/verdict.json" 2>/dev/null || echo unknown)"; exit 1 ;;
            esac
          done
          jq -r '"CircleCI status: \(.status.state) at \(.status.created_at), \(.status.target_url)"' "$out/verdict.json" >> "$GITHUB_STEP_SUMMARY"

      # RT-901: hand the lcov to sonar.yml, which scans each push to main. A push-only,
      # credential-free upload that cannot change this job's result; PR runs upload nothing.
      - name: Upload lcov for the Sonar scan (main pushes only)
        if: github.event_name == 'push' && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-coverage-admin-console
          path: apps/admin-console/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 3

  # RT-872: the Admin-Console Playwright E2E, split out of admin/build-test so a flaky or failing
  # E2E run is its own check instead of hiding inside the build job. Same steps as the product
  # ci.yml from "Install" on, minus the contract-drift, parity, lint and unit steps that stay in
  # admin/build-test. `pnpm build` is still needed: the suite runs against `pnpm preview` of dist/.
  #
  # RT-817: the job runs in the official Playwright image instead of installing browsers and
  # their system deps with apt (`playwright install --with-deps` / `install-deps`), which stalled
  # for up to ~12 min or failed. The tag is the Playwright version the lockfile resolves (not the
  # package.json range) and the digest is that tag's multi-arch manifest list. The container runs
  # as root (Chromium only; Playwright's `--user 1001` advice is for Firefox), and --ipc=host keeps
  # Chromium off Docker's 64 MB /dev/shm. setup-node still puts the .nvmrc Node ahead of the
  # image's own Node.
  #
  # RT-1278: the suite (968 tests) is sharded 4 ways with Playwright's own --shard. Each shard
  # writes a blob report; the fan-in below, the only job named admin/e2e, merges them and fails
  # unless every shard succeeded and the merged report holds every test of `playwright test --list`
  # at this SHA exactly once, with none failed (.github/scripts/check-e2e-shards.mjs). The shard
  # name is an expression, so it is not a graph job key. To change the shard count, change the
  # matrix and E2E_SHARDS in both jobs together.
  admin-e2e-shard:
    name: ${{ format('admin/e2e shard {0}', matrix.shard) }}
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'admin/e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one failure does not hide the others' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_SHARDS: "4"
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    # In a container job a `run:` step without `shell:` uses `sh -e`, not bash as on the host
    # runner, so the job sets bash (and keeps the workflow's run directory) for every step.
    defaults:
      run:
        shell: bash
        working-directory: apps/admin-console
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # RT-817: the image carries the browsers for one Playwright version. If the lockfile moves
      # without the image (or the reverse), fail here with the fix instead of later with
      # "Executable doesn't exist". Only @playwright/test is read: it is the runner that launches
      # the browsers, and other packages may resolve their own playwright/playwright-core (axe).
      - name: Check the Playwright image matches the lockfile
        working-directory: .
        run: |
          set -euo pipefail
          wf=.github/workflows/admin-console.yml
          lock=apps/admin-console/pnpm-lock.yaml
          mapfile -t images < <(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+-noble@sha256:[0-9a-f]{64}' "$wf" | sort -u)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error title=Playwright image pin::expected one digest-pinned mcr.microsoft.com/playwright:vX.Y.Z-noble image in $wf, found ${#images[@]}"
            exit 1
          fi
          image_version=$(sed -E 's/^[^:]+:v([0-9.]+)-noble@.*$/\1/' <<< "${images[0]}")
          mapfile -t locked < <(grep -oE "^  '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+':" "$lock" | sed -E "s/^.*@([0-9.]+)':$/\1/" | sort -u)
          if [ "${#locked[@]}" -ne 1 ] || [ "${locked[0]}" != "$image_version" ]; then
            echo "::error title=Playwright version mismatch::$lock resolves @playwright/test to '${locked[*]:-none}' but $wf runs the image for $image_version. Pin the container image to mcr.microsoft.com/playwright:v<lockfile version>-noble@sha256:<digest> (or bump the lockfile) so both match."
            exit 1
          fi
          echo "Playwright $image_version: lockfile and container image agree (${images[0]})"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: apps/admin-console/package.json

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/admin-console/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      # The CLI reporters replace the config's: blob for the fan-in to merge, line so a failure is
      # readable in this shard's log. The fan-in merges into JSON (retry steps) and github
      # (annotations on the PR).
      - name: E2E tests (shard ${{ matrix.shard }} of 4)
        run: pnpm exec playwright test --shard="${{ matrix.shard }}/$E2E_SHARDS" --reporter=blob,line

      - name: Upload the shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-e2e-blob-${{ matrix.shard }}
          path: apps/admin-console/blob-report
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # RT-1278: fail-closed fan-in, the single job named admin/e2e. `!cancelled()` keeps it
  # reporting when a shard failed, so a red shard turns this check red instead of skipping it.
  admin-e2e:
    name: admin/e2e
    needs: [plan, admin-e2e-shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'admin/e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: apps/admin-console
    env:
      E2E_SHARDS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: apps/admin-console/package.json

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/admin-console/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Self-test the fan-in check
        run: node --test .github/scripts/check-e2e-shards.test.mjs

      # A failed or missing download is not a verdict: the check below fails on any absent report.
      - name: Download the shard blob reports
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: admin-e2e-blob-*
          path: ${{ runner.temp }}/e2e-blobs

      # Each artifact lands in its own folder; give every zip a unique name in one folder, since
      # Playwright may name each shard's file alike.
      - name: Gather the blob reports
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e2e-all"
          shopt -s nullglob
          for z in "$RUNNER_TEMP"/e2e-blobs/admin-e2e-blob-*/*.zip; do
            cp "$z" "$RUNNER_TEMP/e2e-all/$(basename "$(dirname "$z")")-$(basename "$z")"
          done
          ls -l "$RUNNER_TEMP/e2e-all"

      - name: Merge the shard reports
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/e2e-results.json
        run: |
          set -euo pipefail
          mkdir -p playwright-report
          if compgen -G "$RUNNER_TEMP/e2e-all/*.zip" > /dev/null; then
            pnpm exec playwright merge-reports --reporter=json,github "$RUNNER_TEMP/e2e-all"
          else
            echo "No shard blob report to merge."
          fi

      # Listing needs no browser and no web server.
      - name: Fan-in (every shard green, every listed test exactly once, none failed)
        if: ${{ !cancelled() }}
        env:
          SHARDS_RESULT: ${{ needs.admin-e2e-shard.result }}
        run: |
          set -euo pipefail
          pnpm exec playwright test --list --reporter=json > "$RUNNER_TEMP/e2e-listed.json"
          rc=0
          node .github/scripts/check-e2e-shards.mjs "$RUNNER_TEMP/e2e-all" "$E2E_SHARDS" \
            "$RUNNER_TEMP/e2e-listed.json" playwright-report/e2e-results.json || rc=1
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error title=admin/e2e fan-in::the shard jobs ended '$SHARDS_RESULT', not 'success'"
            rc=1
          fi
          exit $rc

      # RT-584: Playwright retries (2) hide flakes. Warn per test that passed
      # only on retry and list them in the step summary. Warn-only by policy.
      - name: Report E2E retries
        if: ${{ !cancelled() }}
        run: |
          node .github/scripts/report-flaky-e2e.mjs
          if [ -f playwright-report/e2e-retries.md ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < playwright-report/e2e-retries.md
          fi

      # RT-872: count every retry, not only the tests that passed on one. Retries stay at 2 (the
      # product config); the counts are always written to the summary, whatever the outcome.
      - name: Count E2E retries
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "playwright-report/e2e-results.json";
            let out = "### E2E retry count\n\n";
            if (!fs.existsSync(path)) {
              out += "No Playwright JSON report: the E2E tests did not run (see the earlier steps).\n";
            } else {
              const tests = [];
              const visit = (s) => {
                for (const spec of s.specs ?? []) for (const t of spec.tests ?? []) tests.push(t);
                for (const c of s.suites ?? []) visit(c);
              };
              for (const s of JSON.parse(fs.readFileSync(path, "utf8")).suites ?? []) visit(s);
              const by = {};
              for (const t of tests) by[t.status] = (by[t.status] ?? 0) + 1;
              const retries = tests.reduce((n, t) => n + Math.max(0, (t.results ?? []).length - 1), 0);
              const retried = tests.filter((t) => (t.results ?? []).length > 1).length;
              out += `| Tests | Expected | Flaky (passed on retry) | Unexpected (failed) | Skipped | Tests retried | Retry attempts |\n`;
              out += `| --- | --- | --- | --- | --- | --- | --- |\n`;
              out += `| ${tests.length} | ${by.expected ?? 0} | ${by.flaky ?? 0} | ${by.unexpected ?? 0} | ${by.skipped ?? 0} | ${retried} | ${retries} |\n`;
              console.log(`retry attempts: ${retries} across ${retried} test(s)`);
              if (retries > 0) console.log(`::warning title=E2E retries::${retries} retry attempt(s) across ${retried} test(s); see the job summary`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
          '
