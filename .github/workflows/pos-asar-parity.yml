# RT-711 scope item 2, `app.asar` file list and per-`.node` Electron ABI: manual, read-only parity
# check of the POS Windows package.
#
# Builds the POS Windows `--dir` package twice on windows-latest with the same steps as
# `pos/package-windows` (npm ci, electron-rebuild argon2, build, package:dir): once from this
# repo's apps/pos and once from the public source repo Kemetra/POS at the SHA that
# tools/history/frozen.tsv pins, then compares the two `resources/app.asar` file lists with
# .github/scripts/asar_parity.py. Then checks, on both packages, that every `.node` the archive ships
# is unpacked and exports either the N-API symbol or `node_register_module_v<N>` with N equal to the
# NODE_MODULE_VERSION of the shipped Electron (.github/scripts/native_abi.py). Verification only: nothing is published, signed, deployed or
# written back, and the source repo is not modified.
#
# Not a graph job and not a gate input: `workflow_dispatch` only, so it never runs on a pull
# request and `required` does not consume it. No secrets, no environment, read-only token. The
# source repo is public, so the checkout needs no credential.
#
# Fails closed: a source SHA that is not 40 hex or a repo other than Kemetra/POS, a source tree
# that differs from apps/pos (the two builds would not compare like with like), an unreadable or
# empty archive, any file-list difference, a `.node` built for another ABI or with no addon symbol
# (outside the one allowlisted SQLite extension) and differing ABI reports are all failures.
name: pos-asar-parity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-asar-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  asar-parity:
    name: asar-parity
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Shadow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # frozen.tsv: product, subdirectory, source repo, frozen main SHA (tab separated).
      - name: Resolve the pinned POS source commit
        id: src
        run: |
          row="$(awk -F'\t' '$1 == "pos" { gsub(/\r/, ""); print $3 " " $4 }' tools/history/frozen.tsv)"
          repo="${row%% *}"
          sha="${row##* }"
          if [ "$repo" != "POS" ]; then
            echo "frozen.tsv pos source repo is '$repo', expected POS (Kemetra/POS)" >&2
            exit 1
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "frozen.tsv pos SHA '$sha' is not 40 hex" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "POS source: $repo@$sha" >> "$GITHUB_STEP_SUMMARY"

      # Outside the Shadow workspace on purpose: a checkout under the workspace would inherit any
      # file the Shadow root adds later (.npmrc, tsconfig, package.json) and mask it in both builds.
      # Kemetra/POS is public, so an anonymous fetch of the one pinned commit needs no credential.
      - name: Fetch POS source at the pinned SHA
        run: |
          src="$RUNNER_TEMP/src-pos"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/Kemetra/POS.git "${{ steps.src.outputs.sha }}"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "${{ steps.src.outputs.sha }}"

      # Both sides must be the same code, or a file-list difference would not be a build difference.
      - name: Source tree equals apps/pos
        run: |
          shadow="$(git rev-parse HEAD:apps/pos)"
          source="$(git -C "$RUNNER_TEMP/src-pos" rev-parse 'HEAD^{tree}')"
          echo "apps/pos tree: $shadow"
          echo "source tree:   $source"
          if [ "$shadow" != "$source" ]; then
            echo "apps/pos differs from Kemetra/POS@${{ steps.src.outputs.sha }}; refusing to compare" >&2
            exit 1
          fi

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Unit tests for the asar comparison
        run: |
          python -m unittest discover -s .github/scripts -p 'test_asar_parity.py' -v
          python -m unittest discover -s .github/scripts -p 'test_native_abi.py' -v

      - name: Build and package (Shadow apps/pos)
        working-directory: apps/pos
        run: |
          npm ci
          npx electron-rebuild -f -w argon2
          npm run build
          npm run package:dir

      - name: Build and package (POS source)
        run: |
          cd "$RUNNER_TEMP/src-pos"
          npm ci
          npx electron-rebuild -f -w argon2
          npm run build
          npm run package:dir

      - name: Compare app.asar file lists
        run: |
          shadow_asar=apps/pos/dist-electron/win-unpacked/resources/app.asar
          source_asar="$RUNNER_TEMP/src-pos/dist-electron/win-unpacked/resources/app.asar"
          mkdir -p "$RUNNER_TEMP/asar-parity"
          python .github/scripts/asar_parity.py list "$source_asar" > "$RUNNER_TEMP/asar-parity/source.list"
          python .github/scripts/asar_parity.py list "$shadow_asar" > "$RUNNER_TEMP/asar-parity/shadow.list"
          set +e
          python .github/scripts/asar_parity.py compare --require package.json "$source_asar" "$shadow_asar" 2>&1 | tee "$RUNNER_TEMP/asar-parity/verdict.txt"
          rc="${PIPESTATUS[0]}"
          set -e
          {
            echo "### asar file list (A = POS source, B = Shadow apps/pos)"
            echo '```'
            cat "$RUNNER_TEMP/asar-parity/verdict.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Electron 44 fetches node_modules/electron/dist lazily (same step as pos/package-windows). The
      # stock binary is the packaged runtime: RT-830's drift check in pos/package-windows proves it on
      # this tree, and the source tree is identical (checked above), so one ABI read serves both sides.
      - name: Read the shipped Electron ABI
        id: electron
        working-directory: apps/pos
        run: |
          node node_modules/electron/install.js
          abi="$(ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron.exe -e 'process.stdout.write(String(process.versions.modules))')"
          version="$(ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron.exe -e 'process.stdout.write(process.versions.electron)')"
          if ! printf '%s' "$abi" | grep -Eq '^[1-9][0-9]*$'; then
            echo "Electron NODE_MODULE_VERSION '$abi' is not a positive integer" >&2
            exit 1
          fi
          echo "abi=$abi" >> "$GITHUB_OUTPUT"
          echo "Electron $version, NODE_MODULE_VERSION $abi" >> "$GITHUB_STEP_SUMMARY"

      # better-sqlite3 ships test_extension.node, a SQLite loadable extension (no Node addon symbol),
      # unpacked next to the addon. It is the only allowed non-addon; any other one fails.
      - name: Every .node targets the Electron ABI (both packages)
        run: |
          allow=node_modules/better-sqlite3/build/Release/test_extension.node
          out="$RUNNER_TEMP/asar-parity"
          set +e
          python .github/scripts/native_abi.py check --abi "${{ steps.electron.outputs.abi }}" --allow-non-addon "$allow"             "$RUNNER_TEMP/src-pos/dist-electron/win-unpacked/resources/app.asar" > "$out/native-abi.source.txt"
          src_rc=$?
          python .github/scripts/native_abi.py check --abi "${{ steps.electron.outputs.abi }}" --allow-non-addon "$allow"             apps/pos/dist-electron/win-unpacked/resources/app.asar > "$out/native-abi.shadow.txt"
          shadow_rc=$?
          diff -u "$out/native-abi.source.txt" "$out/native-abi.shadow.txt" > "$out/native-abi.diff"
          diff_rc=$?
          set -e
          {
            echo "### .node ABI (source rc=$src_rc, Shadow rc=$shadow_rc, report diff rc=$diff_rc)"
            echo '```'
            cat "$out/native-abi.shadow.txt"
            cat "$out/native-abi.diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$out/native-abi.source.txt" "$out/native-abi.diff"
          test "$src_rc" = 0 && test "$shadow_rc" = 0 && test "$diff_rc" = 0

      # Informational: embedded per-file SHA-256 and sizes. A difference here is evidence to explain
      # (RT-711: every diff is empty or explained); it does not fail the run.
      - name: Compare app.asar content hashes (informational)
        continue-on-error: true
        run: |
          set +e
          python .github/scripts/asar_parity.py compare --strict-content \
            "$RUNNER_TEMP/src-pos/dist-electron/win-unpacked/resources/app.asar" \
            apps/pos/dist-electron/win-unpacked/resources/app.asar 2>&1 | tee "$RUNNER_TEMP/asar-parity/content.txt"
          rc="${PIPESTATUS[0]}"
          set -e
          {
            echo "### asar content hashes (informational)"
            echo '```'
            cat "$RUNNER_TEMP/asar-parity/content.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload file lists
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pos-asar-parity-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asar-parity
          retention-days: 14
          if-no-files-found: ignore
