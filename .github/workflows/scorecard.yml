# RT-877: one OSSF Scorecard supply-chain analysis for the monorepo, replacing the four nested
# scorecard.yml files (POS, Admin-Console, Backend-Core, ERPNext-Connector), which GitHub never
# runs from a nested .github/ since the RT-715 cutover. Scorecard scores a repository, not a
# directory, so one run covers all four products.
#
# Results are published to the OpenSSF API (badge) and uploaded to the repo's code-scanning
# dashboard as SARIF. Actions are pinned by commit SHA. Scorecard's publishing restrictions apply
# to this file: no top-level env or defaults, read-only top-level permissions, no services or
# containers, and only its approved actions in the job.
#
# Differences from the product workflows:
#  - no `branch_protection_rule` trigger. It is a privileged, non-PR trigger, so
#    `pgraph privileges` would put this workflow in scope and reject the job's write grants. The
#    weekly schedule and push to main still pick up branch-protection changes.
#  - workflow_dispatch added for an on-demand run.
#  - top-level `permissions: read-all` (Scorecard's own recommendation); checkout is pinned to
#    the SHA the root workflows use.
name: Scorecard supply-chain security

on:
  # Weekly, off-peak.
  schedule:
    - cron: "27 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# Read-only default; the job below adds only what Scorecard needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload SARIF to the code-scanning dashboard.
      security-events: write
      # Publish results to the OpenSSF API and obtain the OIDC token.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repository: results can be published for the Scorecard badge.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
