# Root e2e smoke (RT-851, RT-748 slice I-9). Defines the graph.yaml job key e2e/smoke.
#
# What it is: a fast, PR-time, black-box wire smoke against a REAL Backend-Core API with Postgres
# and Redis. It brings the stack up with services/backend-core/tools/schemathesis/stack-up.sh
# (unchanged; ephemeral, throwaway generated credentials, a DB-seeded operator envelope), then
# tests/e2e/smoke.test.mjs captures a POS-shaped sale, replays it, checks the 409 on a diverging
# replay, reads the sale back and checks the auth boundary. Payloads are synthetic and test-only.
#
# What it is NOT (RT-714 / G5 stays independent verification): no POS Electron or packaged build,
# no old-POS or RT-713 compatibility snapshots, no Worker or outbox drain, no Connector, no
# ERPNext or ERP invoice leg, no real identity provider, no tenant-isolation matrix. A green
# e2e/smoke is never G5 evidence.
#
# The graph is the only selector: no `paths:` filter. RT-867: the `plan` job runs the base-branch
# evaluator and the job runs only if the graph selects it; a selected job that is skipped fails
# the gate. PR-reachable: read-only token, no credentials, no
# environment. The job `name:` is the graph key, a literal with no expression and no matrix.
# timeout-minutes is 10: owner-approved ceiling (RT-851); the job measures about 2m30s.
name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-workflow prefix so the workflows never cancel each other on one ref; the push-SHA suffix
  # stops consecutive pushes to main from cancelling each other.
  group: e2e-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  # RT-867 (MR-4): the project graph decides which jobs of this workflow EXECUTE, with the same
  # selection the `required` gate enforces. The evaluator and graph.yaml come from the trusted
  # commit (the PR base; the pushed main commit on push), extracted with `git archive` and never
  # from the PR head, whose tree is read as git data only. On push to main the evaluator selects
  # everything (FULL_RUN_EVENT). `jobs` is the JSON list of selected graph job keys. If this job
  # fails, every guarded job is skipped and the gate fails (UNEXPECTED_SKIP / ABSENT_JOB).
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # Full history: the evaluator diffs the base and head commits with git plumbing. Only
      # tools/project-graph is materialised; nothing from the checked-out tree is executed.
      - name: Checkout (history only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: tools/project-graph

      - name: Resolve trusted, base and head commits
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) base="$SHA"; head="$SHA" ;;   # main itself is trusted; push selects all
            *) echo "::error::unsupported event '$EVENT'"; exit 1 ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base^{commit}"
          { echo "base=$base"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      - name: Extract the trusted evaluator (git archive of the base commit)
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgraph-base"
          git archive "$BASE_SHA" tools/project-graph | tar -x -C "$RUNNER_TEMP/pgraph-base"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned dependencies (from the base commit)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r "$RUNNER_TEMP/pgraph-base/tools/project-graph/requirements.txt"

      - name: Evaluate the project graph
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgraph-base/tools/project-graph"
          python -m pgraph evaluate --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event "$EVENT" --out "$RUNNER_TEMP/plan.json"
          plan="$RUNNER_TEMP/plan.json"
          # An invalid trusted graph selects nothing; fail loudly instead of running nothing quietly.
          if [ "$(jq '.products | length' "$plan")" = "0" ]; then
            echo "::error::trusted graph invalid: $(jq -c .graph_validation "$plan")"; exit 1
          fi
          jobs="$(jq -c '.needed_jobs | if all(test("^[a-z0-9/-]+$")) then . else error("bad job key") end' "$plan")"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          {
            echo "### project graph plan"
            echo "graph validation: \`$(jq -r .graph_validation.status "$plan")\` $(jq -c .graph_validation.reasons "$plan"), select_all: \`$(jq -r .select_all "$plan")\`"
            echo
            echo "selected: \`$jobs\`"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-smoke:
    name: e2e/smoke
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'e2e/smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FUZZ_PROJECT: e2e-smoke
      API_PORT: "23100"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The stack-up script writes its throwaway credentials and the operator envelope under
      # $FUZZ_OUT (the runner context is not available in job-level env, so it is set here).
      - name: Start ephemeral Backend-Core stack
        timeout-minutes: 10
        run: |
          echo "FUZZ_OUT=$RUNNER_TEMP/e2e-smoke" >> "$GITHUB_ENV"
          FUZZ_OUT="$RUNNER_TEMP/e2e-smoke" bash services/backend-core/tools/schemathesis/stack-up.sh

      - name: Run smoke scenarios
        timeout-minutes: 5
        env:
          E2E_BASE_URL: http://127.0.0.1:23100
        run: |
          E2E_ENVELOPE_FILE="$FUZZ_OUT/envelope-operator" node --test tests/e2e/*.test.mjs

      - name: Stack logs on failure
        if: failure()
        run: |
          set -a; . "$FUZZ_OUT/stack.env" 2>/dev/null || true; set +a
          export API_IMAGE=api-fuzz-api:local
          docker compose -p "$FUZZ_PROJECT" -f services/backend-core/tools/schemathesis/compose.yml logs --no-color --tail 80 api || true

      - name: Tear down
        if: always()
        run: |
          if [ -f "$FUZZ_OUT/stack.env" ]; then
            set -a; . "$FUZZ_OUT/stack.env"; set +a
            export API_IMAGE=api-fuzz-api:local
            docker compose -p "$FUZZ_PROJECT" -f services/backend-core/tools/schemathesis/compose.yml down -v
          fi
          rm -rf "$FUZZ_OUT"
