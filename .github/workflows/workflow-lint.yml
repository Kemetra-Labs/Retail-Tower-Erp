# RT-1410: lint the workflow files themselves. Runs actionlint (syntax, expression types, shellcheck
# on `run:` blocks; ubuntu-24.04 ships shellcheck) and zizmor (security audits: template injection,
# cache poisoning, unpinned actions, excessive permissions, ...) over .github/workflows.
#
# RT-1459 (audit A-14): BASELINE MODE. Each tool's JSON findings are normalised to
# `tool|file|rule|message` (no line numbers, so an edit that only moves a finding never churns the
# list) and compared with .github/workflow-lint-baseline.txt by .github/scripts/workflow_lint_baseline.py.
# A finding that is not in the baseline fails the step, and so does a baseline line whose finding no
# longer occurs, so the baseline can only shrink (the rule of boundary-todo.yaml). New findings are
# printed first in the job summary. A tool that exits with anything other than a lint result, or
# prints unreadable JSON, also fails (fail closed). To pay a finding off, fix the workflow and delete
# its baseline line; regeneration commands are in the baseline's header. The script's own unit tests
# run first in this job.
#
# Not a graph.yaml job and not listed in gate.yml `workflow_run`, so `required` never reads it (same
# as gitleaks, secrets.yml): the job shows red on the PR, but wiring it into `required` is an owner
# decision (RT-1459 step 5, not done here). Selected by path instead: `.github/**` is the part of the
# `policy` class that holds workflows, this linter, its baseline and its config (.github/zizmor.yml).
#
# Both tools are official release binaries, fetched anonymously over HTTPS and checked against the
# pinned SHA-256 (the GitHub release-asset digests), the same way as osv-scanner and gitleaks. Bump a
# version and its digest together (and regenerate the baseline, since a new version can add findings).
# No SARIF upload: that needs `security-events: write`, which a PR-reachable workflow may not hold
# (pgraph privileges). zizmor runs `--offline`, so no token reaches it; the online-only audits
# (known-vulnerable-actions, impostor-commit, ref-confusion) do not run.
#
# `--strict-collection` makes zizmor exit 1 on a workflow it cannot parse (without it zizmor warns,
# skips the file and exits 0, so the file would go unaudited); 1 is outside the allowed codes, so the
# step fails closed. The job name `workflow-lint/report` is kept on purpose: renaming it would change
# the check context. actionlint's `run:` findings come from the runner image's shellcheck (0.9.0 on
# ubuntu-24.04 when the baseline was generated; the install step prints the version): if an image
# update changes it, regenerate the baseline.
#
# Known false positive handled here: actionlint (1.7.12 and its main branch, 2026-11) does not know
# the job-level `concurrency.queue` key that GitHub accepts (mirror-erpnext-connector.yml publish
# job, `queue: max`). The `-ignore` regex below drops exactly that message and nothing else.
# Second one (RT-1467): actionlint 1.7.12 does not know the self-repository syntax `uses: $/path`
# (rhysd/actionlint#711), which GitHub supports and zizmor's `self-repository` audit asks for. The
# regex drops only that message for the one action path `$/.github/actions/pgraph-plan`. Remove both
# alternatives when a pinned actionlint release knows the syntax / the key.
name: workflow-lint

on:
  pull_request:
    branches: [main]
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: workflow-lint/report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      ZIZMOR_VERSION: "1.32.0"
      ZIZMOR_SHA256: "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b"
      # actionlint does not know `concurrency.queue` or `uses: $/...` (see the header); this drops exactly
      # those two messages (the second only for the pgraph-plan action path).
      ACTIONLINT_IGNORE: 'unexpected key "queue" for "concurrency" section|specifying action "\$/\.github/actions/pgraph-plan" in invalid format because ref is missing'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor (pinned, hash-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          al="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/$al" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$al" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$al" -C "$bin" actionlint
          zz="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/$zz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${zz}"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/$zz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$zz" -C "$bin"
          chmod +x "$bin/actionlint" "$bin/zizmor"
          "$bin/actionlint" -version
          "$bin/zizmor" --version
          shellcheck --version | head -2 || echo "shellcheck not on PATH: actionlint skips run: scripts"

      - name: Unit tests of the baseline script
        run: python3 -m unittest discover -s .github/scripts -p 'test_workflow_lint_baseline.py' -v

      # Baseline mode. GitHub runs `run:` as `bash -e`, and `set -uo pipefail` does not turn -e off, so
      # each tool's status is captured with `|| rc=$?` (a command on the left of || never trips -e). The
      # tool runs twice, offline and in seconds: once for the human-readable log and summary, once as
      # JSON for the comparison. The step's own status is the status of the last command, the baseline
      # check, so a new finding, a stale baseline line or a tool failure turns the step red.
      - name: actionlint (baseline)
        run: |
          set -uo pipefail
          bin="$RUNNER_TEMP/bin"
          plain="$RUNNER_TEMP/actionlint.txt"
          json="$RUNNER_TEMP/actionlint.json"
          "$bin/actionlint" -no-color -ignore "$ACTIONLINT_IGNORE" > "$plain" 2>&1 || true
          rc=0
          "$bin/actionlint" -no-color -format '{{json .}}' -ignore "$ACTIONLINT_IGNORE" > "$json" || rc=$?
          cat "$plain"
          python3 .github/scripts/workflow_lint_baseline.py check --tool actionlint --rc "$rc" \
            --findings "$json" --baseline .github/workflow-lint-baseline.txt \
            --plain "$plain" --summary "$GITHUB_STEP_SUMMARY"

      - name: zizmor (baseline, offline)
        run: |
          set -uo pipefail
          bin="$RUNNER_TEMP/bin"
          plain="$RUNNER_TEMP/zizmor.txt"
          json="$RUNNER_TEMP/zizmor.json"
          "$bin/zizmor" --offline --no-progress --color never --quiet --strict-collection --format plain \
            .github/workflows > "$plain" 2>&1 || true
          rc=0
          "$bin/zizmor" --offline --no-progress --color never --quiet --strict-collection --format json \
            .github/workflows > "$json" || rc=$?
          cat "$plain"
          python3 .github/scripts/workflow_lint_baseline.py check --tool zizmor --rc "$rc" \
            --findings "$json" --baseline .github/workflow-lint-baseline.txt \
            --plain "$plain" --summary "$GITHUB_STEP_SUMMARY"
