# RT-1300: promotion of a POS PILOT release. It reads a published pos-pilot/vX.Y.Z release, proves it is the
# release the pilot lane may promote, and, only when `dry_run` is false, uploads those exact bytes to the private
# pilot bucket and registers them with Backend-Core. It never activates a release: a platform admin does that
# separately, in the Console. `dry_run` defaults to true, and a dry run holds no environment, no secret, no AWS
# credential and no id-token: the first two jobs (resolve, verify) never hold one in either mode, and the two
# live jobs (upload, register) are skipped unless a person turns `dry_run` off.
#
# Trigger: workflow_dispatch only, with the tag, the pinned pilot leaf thumbprint and `dry_run`. No push and no
# pull_request trigger: PR code can never start it.
#
#   resolve  the tag must be pos-pilot/vX.Y.Z (anchored at both ends: a lab tag or a look-alike is refused), the
#            tag must exist and its commit must be an ancestor of origin/main, and the leaf pin must be a 40-hex
#            SHA-1. The commit is the one the release was built from.
#   verify   reads the published release (not a draft; exactly the installer, its .sha256 and the manifest),
#            checks the manifest (product pos-pilot, signing pilot, mode release, this tag, this commit, this
#            repository, one artifact whose digest is the installer's), the .sha256 and the size (the registry
#            refuses over 2 GiB), checks the build provenance with `gh attestation verify` bound to the
#            repository, the release workflow, this commit and this tag, and checks the Authenticode signature:
#            the signer must be the pinned pilot leaf, subject CN=Kemetra POS PILOT, self-signed. Only then is
#            that public leaf trusted, on this hosted runner only, so Windows can answer Valid; the trust is
#            removed again whatever happens. Nothing is rebuilt, re-signed or changed.
#   upload   LIVE only (dry_run false), behind the protected release-pos-pilot-promote environment. The upload is
#            ONE-SHOT: the bucket policy refuses a second write of the same key and this role can neither read
#            nor delete, so everything that can be checked is checked BEFORE the role is assumed: the
#            environment's settings, the tools, the release bytes against what verify checked, the SLSA build
#            provenance attestation (its id comes from the release run the manifest names), and that Backend-Core
#            answers. Then one conditional PutObject (If-None-Match: *, SHA-256 checked by S3), and the
#            registration body is built once so that any re-run sends the identical body.
#   register LIVE only, behind the same environment. One POST to the register route with a GitHub OIDC token for
#            the Backend-Core audience. A failure here is retried with "Re-run failed jobs", which repeats only
#            this job with the upload's outputs; re-running the upload fails closed on the conditional write.
#
# It runs on main only: a copy of this file on another branch could print a verification it did not do, and the
# Backend-Core `ref` pin and the upload role's trust are each one exact value (refs/heads/main).
#
# RT-1363, WITHDRAW mode (`mode` = withdraw): Backend-Core takes a withdrawal (RT-1298) only from this workflow's own
# GitHub OIDC token, and its `job_workflow_ref` pin names this file, so the withdraw jobs live here and in no other
# file. In withdraw mode the four promote jobs above do not run; in promote mode the two below do not run. It takes
# the version (`tag`) and the registry id (`release_id`) of the release to withdraw.
#
#   withdraw-check  every withdraw run, dry or live, with no environment, no token and no credential: main only, a
#                   person started it, the tag and the id are well formed. It prints what a live run would withdraw
#                   and, in a live run, what the approver should confirm. A dry run (`dry_run` true, the default)
#                   stops here and withdraws nothing.
#   withdraw        LIVE only (dry_run false), behind the same protected environment as the promote jobs, so it asks
#                   for the same approval. One POST to the withdraw route with a GitHub OIDC token for the
#                   Backend-Core audience. It accepts exactly a 200 whose release is the one asked for and is now
#                   withdrawn, and refuses any other answer with its code. A withdrawal is for good, and repeating
#                   it is safe (an already-withdrawn release answers 200), so a failed run may simply be run again.
#
# Withdrawing only stops the resolver offering the release and frees the slot for the next one: it never activates
# a release (a platform admin does that in the Console), no object is deleted and nothing here touches the bucket.
name: promote-pos-pilot

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: promote (the default) verifies a pilot release and, with dry_run false, uploads and registers it. withdraw withdraws one registered release for good (RT-1363) and needs tag and release_id.
        type: choice
        options:
          - promote
          - withdraw
        default: promote
      tag:
        description: The pilot release tag, pos-pilot/vX.Y.Z. Promote verifies it and it must be on main. Withdraw takes the version of the release that release_id names.
        type: string
        required: true
      leaf_sha1:
        description: Promote only. SHA-1 thumbprint (40 hex) of the pilot signing leaf, from the protected environment's POS_PILOT_LEAF_SHA1. Withdraw does not use it.
        type: string
        required: false
        default: ''
      release_id:
        description: Withdraw only. The registry id (a UUID) of the release to withdraw, as the register job of its promotion run printed it or the Console release list shows it.
        type: string
        required: false
        default: ''
      dry_run:
        description: True (the default) changes nothing. Promote then only verifies; withdraw only checks the request and prints what it would withdraw. False promotes (uploads and registers, never activates) or withdraws, after the environment's approval.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: promote-pos-pilot-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: promote/resolve
    if: ${{ inputs.mode == 'promote' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      leaf: ${{ steps.resolve.outputs.leaf }}
    steps:
      - name: Checkout (history and tags only, for the main-ancestry check)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # Non-cone: the check reads git objects only, no working file.
          sparse-checkout: |
            /.github/release/
          sparse-checkout-cone-mode: false

      - name: Resolve the tag and the leaf pin
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
          LEAF_SHA1: ${{ inputs.leaf_sha1 }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [ "$REF" = refs/heads/main ] || fail "run this workflow from main, not '$REF': another branch's copy of it could report a verification it did not do"
          [[ "$TAG" =~ ^pos-pilot/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "tag '$TAG' is not pos-pilot/vX.Y.Z"
          [[ "$LEAF_SHA1" =~ ^[0-9A-Fa-f]{40}$ ]] || fail "leaf_sha1 is not a 40-hex SHA-1 thumbprint"
          SHA="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")" || fail "tag $TAG does not exist"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "unexpected commit '$SHA' for tag $TAG"
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main || fail "tag $TAG ($SHA) is not on main"
          LEAF="$(printf '%s' "$LEAF_SHA1" | tr 'a-f' 'A-F')"
          VERSION="${TAG#pos-pilot/v}"
          { echo "sha=$SHA"; echo "tag=$TAG"; echo "version=$VERSION"; echo "leaf=$LEAF"; } >> "$GITHUB_OUTPUT"
          echo "### promote-pos-pilot (verify only): $TAG at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: promote/verify (dry-run, nothing is uploaded or registered)
    needs: resolve
    if: ${{ inputs.mode == 'promote' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.assets.outputs.digest }}
      size: ${{ steps.assets.outputs.size }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      VERSION: ${{ needs.resolve.outputs.version }}
      LEAF_SHA1: ${{ needs.resolve.outputs.leaf }}
      REPO: ${{ github.repository }}
    # No checkout: this job runs no repository code. GH_TOKEN is set per step, only where gh needs it.
    steps:
      # Not a draft, this tag, exactly the three assets the pilot release publishes. Nothing is downloaded after
      # a refusal.
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          for tool in jq sha256sum gh; do command -v "$tool" >/dev/null || fail "$tool is not available on this runner"; done
          EXE="POS-Pulse-Setup-$VERSION.exe"
          PKG="$RUNNER_TEMP/pkg"
          # The tag may not have moved since resolve (release-pos-pilot checks the same before it creates a release).
          TAG_SHA="$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)" || fail "cannot resolve tag $TAG"
          [ "$TAG_SHA" = "$SHA" ] || fail "tag $TAG now points at $TAG_SHA, not $SHA"
          REL="$(gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets)" || fail "cannot read release $TAG"
          jq -e --arg tag "$TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false' <<<"$REL" >/dev/null \
            || fail "release $TAG is missing, a draft, a prerelease, or another tag"
          jq -e --arg exe "$EXE" '([.assets[].name] | sort) == ([$exe, ($exe + ".sha256"), "release-manifest.json"] | sort)' <<<"$REL" >/dev/null \
            || fail "the release assets are not exactly $EXE, $EXE.sha256 and release-manifest.json"
          mkdir -p "$PKG"
          gh release download "$TAG" --repo "$REPO" --dir "$PKG"
          # The listing was checked above: what arrived must be exactly those three files.
          [ "$(ls "$PKG" | LC_ALL=C sort | paste -sd ' ' -)" = "$(printf '%s\n' "$EXE" "$EXE.sha256" release-manifest.json | LC_ALL=C sort | paste -sd ' ' -)" ] \
            || fail "the download held other files than $EXE, $EXE.sha256 and release-manifest.json"

      # What was published must be what the build and signing jobs produced and the manifest job recorded.
      - name: Check the assets against the manifest
        id: assets
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          EXE="POS-Pulse-Setup-$VERSION.exe"
          PKG="$RUNNER_TEMP/pkg"
          MANIFEST="$PKG/release-manifest.json"
          [ "$(ls "$PKG" | LC_ALL=C sort | paste -sd ' ' -)" = "$(printf '%s\n' "$EXE" "$EXE.sha256" release-manifest.json | LC_ALL=C sort | paste -sd ' ' -)" ] \
            || fail "the package must hold exactly $EXE, $EXE.sha256 and release-manifest.json"
          # Hash from stdin: on a Windows runner $PKG holds backslashes, which sha256sum would print (escaped) with the name.
          DIGEST="sha256:$(sha256sum < "$PKG/$EXE" | cut -d' ' -f1)"
          jq -e --arg tag "$TAG" --arg sha "$SHA" --arg repo "$REPO" --arg exe "$EXE" --arg digest "$DIGEST" '
              .product == "pos-pilot" and .signing == "pilot" and .mode == "release" and .tag == $tag
              and .source.sha == $sha and .source.repository == $repo
              and ([.artifacts[] | select(.name == "pos-installer" and .file == $exe and .digest == $digest)] | length == 1)
              and (.artifacts | length == 1)
            ' "$MANIFEST" >/dev/null \
            || fail "the manifest does not match the package: expected product pos-pilot, signing pilot, mode release, tag $TAG, commit $SHA, repository $REPO and installer $EXE $DIGEST"
          # Exactly the one line the pilot release writes (`sha256sum "$EXE"`): the installer's digest and ITS name. A
          # valid checksum of another asset, an extra line or a different format does not pass.
          [ "$(cat "$PKG/$EXE.sha256")" = "${DIGEST#sha256:}  $EXE" ] || fail "$EXE.sha256 is not exactly '<digest>  $EXE' for the installer"
          SIZE="$(wc -c < "$PKG/$EXE" | tr -d ' ')"
          # The registry accepts 1 byte to 2 GiB.
          { [ "$SIZE" -ge 1 ] && [ "$SIZE" -le 2147483648 ]; } || fail "the installer size $SIZE is outside 1..2147483648 bytes"
          # What a live upload must find again: the same bytes, by digest and size.
          { echo "digest=${DIGEST#sha256:}"; echo "size=$SIZE"; } >> "$GITHUB_OUTPUT"

      # Bound to this repository, the pilot release workflow, this commit and this tag: an attestation made by any
      # other workflow, commit or ref does not pass.
      - name: Verify the build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXE="POS-Pulse-Setup-$VERSION.exe"
          PKG="$RUNNER_TEMP/pkg"
          gh attestation verify "$PKG/$EXE" \
            --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release-pos-pilot.yml" \
            --source-digest "$SHA" \
            --signer-digest "$SHA" \
            --source-ref "refs/tags/$TAG" \
            --deny-self-hosted-runners

      # The signer is pinned and checked BEFORE anything is trusted. A self-signed leaf is its own root, so Windows
      # answers Valid only where that leaf is trusted: this hosted runner is ephemeral, the public bytes of the pinned
      # leaf are added for the check, and the next step removes them whatever happens.
      - name: Verify the Authenticode signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP "pkg/POS-Pulse-Setup-$($env:VERSION).exe"
          $pin = $env:LEAF_SHA1
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          $leaf = $sig.SignerCertificate
          if ($null -eq $leaf) { throw 'the installer carries no signature' }
          if ($leaf.Thumbprint -ne $pin) { throw "the installer is signed by another certificate ($($leaf.Thumbprint)) than the pinned pilot leaf" }
          if ($leaf.Subject -cne 'CN=Kemetra POS PILOT') { throw "the signer is not the pilot certificate (subject: $($leaf.Subject))" }
          if ($leaf.Issuer -cne $leaf.Subject) { throw "the pilot certificate is not self-signed (issuer: $($leaf.Issuer))" }
          $public = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new([byte[]]$leaf.RawData)
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root', 'LocalMachine')
          try {
            $store.Open('ReadWrite')
            $store.Add($public)
          } finally {
            $store.Close()
          }
          $checked = Get-AuthenticodeSignature -LiteralPath $exe
          if ($checked.Status -ne 'Valid') { throw "the installer signature status is $($checked.Status), expected Valid" }
          if ($checked.SignerCertificate.Thumbprint -ne $pin) { throw 'the checked signer is not the pinned pilot leaf' }
          if (-not $checked.TimeStamperCertificate) { throw 'the installer carries no timestamp: a pilot signature is always timestamped' }
          Write-Host "[OK] $(Split-Path -Leaf $exe) signed by $($leaf.Subject) ($($leaf.Thumbprint)), timestamped, Valid"

      - name: Remove the pilot trust
        if: always()
        shell: pwsh
        run: |
          $path = "Cert:\LocalMachine\Root\$env:LEAF_SHA1"
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          if (Test-Path -LiteralPath $path) { throw "the pilot leaf is still in the trust store ($env:LEAF_SHA1)" }

      # What a live promotion would do with these bytes. Nothing here touches S3 or Backend-Core.
      - name: Dry-run result
        run: |
          set -euo pipefail
          EXE="POS-Pulse-Setup-$VERSION.exe"
          PKG="$RUNNER_TEMP/pkg"
          DIGEST="$(sha256sum < "$PKG/$EXE" | cut -d' ' -f1)"
          SIZE="$(wc -c < "$PKG/$EXE" | tr -d ' ')"
          {
            echo "### Verified $TAG (dry-run): nothing was uploaded, nothing was registered, nothing was activated"
            echo
            echo "A live promotion of these exact bytes would:"
            echo
            echo "- upload \`$EXE\` ($SIZE bytes) to \`pos/pilot/${VERSION}/${EXE}\` in the private bucket, with SHA-256 \`$DIGEST\`, never overwriting;"
            echo "- register it with Backend-Core as version \`$VERSION\`, signing class \`pilot\`, publisher \`CN=Kemetra POS PILOT\`, source commit \`$SHA\`, and promotion run $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID;"
            echo "- leave the release inactive: a platform admin activates it separately."
            echo
            echo "Checked: published release with exactly the three assets, manifest, .sha256, size, build provenance, and the signature of the pinned leaf \`$LEAF_SHA1\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # LIVE, only when dry_run is false and verify passed. The upload is one-shot (see the header), so every check that
  # can run before the role is assumed does. This job holds the AWS role and an id-token request ONLY for the
  # assume-role step; the registration token is requested in the next job.
  upload:
    name: promote/upload (live, the private bucket, behind the approval environment)
    needs: [resolve, verify]
    if: ${{ inputs.mode == 'promote' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-pos-pilot-promote
    permissions:
      contents: read
      attestations: read
      id-token: write
    outputs:
      body: ${{ steps.body.outputs.body }}
      version_id: ${{ steps.put.outputs.version_id }}
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      VERSION: ${{ needs.resolve.outputs.version }}
      REPO: ${{ github.repository }}
      VERIFIED_DIGEST: ${{ needs.verify.outputs.digest }}
      VERIFIED_SIZE: ${{ needs.verify.outputs.size }}
      ROLE_ARN: ${{ vars.POS_PILOT_PROMOTE_ROLE_ARN }}
      BUCKET: ${{ vars.POS_PILOT_RELEASE_BUCKET }}
      S3_REGION: ${{ vars.POS_PILOT_RELEASE_S3_REGION }}
      API_BASE: ${{ vars.POS_PILOT_API_BASE_URL }}
      AUDIENCE: ${{ vars.POS_PILOT_PROMOTION_OIDC_AUDIENCE }}
    # No checkout: this job runs no repository code. GH_TOKEN is set per step, only where gh needs it.
    steps:
      # Settings come from the protected environment's variables (none is a secret). A blank or malformed one stops
      # the run here, before anything is uploaded that register could not then record.
      - name: Check the environment's settings and the tools
        env:
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # What the registration body will carry, checked BEFORE the one-shot upload: a value the registry would
          # refuse after the upload would leave an object that can never be registered.
          [[ "$ACTOR" =~ ^[A-Za-z0-9](-?[A-Za-z0-9])*$ ]] && [ "${#ACTOR}" -le 39 ] || fail "the actor '$ACTOR' is not a GitHub login the registry accepts (start the run as a person, not an app)"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || fail "the run id is not a number"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] && [ "${#VERSION}" -le 32 ] || fail "version '$VERSION' is not one the registry accepts"
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/rt-gha-pos-pilot-promote$ ]] || fail "POS_PILOT_PROMOTE_ROLE_ARN must be the ARN of the role rt-gha-pos-pilot-promote"
          [[ "$BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || fail "POS_PILOT_RELEASE_BUCKET must be a lower-case bucket name of letters, digits and hyphens (no dots)"
          [[ "$S3_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || fail "POS_PILOT_RELEASE_S3_REGION is not an AWS region name"
          [[ "$API_BASE" =~ ^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?$ ]] || fail "POS_PILOT_API_BASE_URL must be an https origin with no path and no trailing slash"
          [[ "$AUDIENCE" =~ ^[A-Za-z0-9._:/@-]{3,200}$ ]] || fail "POS_PILOT_PROMOTION_OIDC_AUDIENCE is blank or malformed"
          [ "$AUDIENCE" != sts.amazonaws.com ] || fail "the Backend-Core audience must not be the AWS one (sts.amazonaws.com)"
          for tool in jq sha256sum openssl base64 gh aws curl; do command -v "$tool" >/dev/null || fail "$tool is not available on this runner"; done
          # The conditional write is what makes the upload one-shot: a CLI that cannot send it must not upload at all.
          AWS_PAGER="" aws s3api put-object --generate-cli-skeleton input | jq -e 'has("IfNoneMatch")' >/dev/null \
            || fail "this runner's aws CLI cannot send If-None-Match on a PutObject, so the one-shot upload would not be enforced"

      # The release is immutable, so these are the bytes verify checked: same digest, same size, same manifest.
      - name: Download the release again and compare it with what verify checked
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          EXE="POS-Pulse-Setup-$VERSION.exe"
          PKG="$RUNNER_TEMP/pkg"
          TAG_SHA="$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)" || fail "cannot resolve tag $TAG"
          [ "$TAG_SHA" = "$SHA" ] || fail "tag $TAG now points at $TAG_SHA, not $SHA"
          REL="$(gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets)" || fail "cannot read release $TAG"
          jq -e --arg tag "$TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false' <<<"$REL" >/dev/null \
            || fail "release $TAG is missing, a draft, a prerelease, or another tag"
          jq -e --arg exe "$EXE" '([.assets[].name] | sort) == ([$exe, ($exe + ".sha256"), "release-manifest.json"] | sort)' <<<"$REL" >/dev/null \
            || fail "the release assets are not exactly $EXE, $EXE.sha256 and release-manifest.json"
          mkdir -p "$PKG"
          gh release download "$TAG" --repo "$REPO" --dir "$PKG"
          [ "$(ls "$PKG" | LC_ALL=C sort | paste -sd ' ' -)" = "$(printf '%s\n' "$EXE" "$EXE.sha256" release-manifest.json | LC_ALL=C sort | paste -sd ' ' -)" ] \
            || fail "the download held other files than $EXE, $EXE.sha256 and release-manifest.json"
          DIGEST="$(sha256sum < "$PKG/$EXE" | cut -d' ' -f1)"
          [ "$DIGEST" = "$VERIFIED_DIGEST" ] || fail "the installer is not the one verify checked (sha256 $DIGEST, verify saw $VERIFIED_DIGEST)"
          SIZE="$(wc -c < "$PKG/$EXE" | tr -d ' ')"
          [ "$SIZE" = "$VERIFIED_SIZE" ] || fail "the installer size is $SIZE bytes, verify saw $VERIFIED_SIZE"
          jq -e --arg digest "sha256:$DIGEST" '(.artifacts | length == 1) and .artifacts[0].digest == $digest' "$PKG/release-manifest.json" >/dev/null \
            || fail "the manifest does not name this installer"
          [ "$(cat "$PKG/$EXE.sha256")" = "$DIGEST  $EXE" ] || fail "$EXE.sha256 is not exactly '<digest>  $EXE' for the installer"
          # The run that built the release: its url is in the manifest, and the attestation must come from that run.
          CI_URL="$(jq -r '.ci_url // empty' "$PKG/release-manifest.json")"
          PREFIX="https://github.com/$REPO/actions/runs/"
          [[ "$CI_URL" == "$PREFIX"* ]] || fail "the manifest's ci_url is not a run of $REPO"
          REST="${CI_URL#"$PREFIX"}"
          [[ "$REST" =~ ^([0-9]+)(/attempts/[0-9]+)?$ ]] || fail "the manifest's ci_url is not a workflow run url"
          { echo "digest=$DIGEST"; echo "size=$SIZE"; echo "ci_run=${BASH_REMATCH[1]}"; } >> "$GITHUB_OUTPUT"

      # The registry wants the build provenance attestation's page url (.../attestations/<id>). GitHub's list API does
      # not return the id; it is the number in each bundle's storage path. Two attestations exist for the installer (the
      # SLSA build provenance and GitHub's release attestation), so the one wanted is selected by predicate type,
      # by this digest, and by the release run the manifest names; anything but exactly one match stops the run.
      - name: Resolve the build provenance attestation
        id: attest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.download.outputs.digest }}
          CI_RUN: ${{ steps.download.outputs.ci_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          LIST="$(gh api "repos/$REPO/attestations/sha256:$DIGEST")" || fail "cannot list the attestations of sha256:$DIGEST"
          IDS="$(jq -c --arg d "$DIGEST" --arg prefix "https://github.com/$REPO/actions/runs/$CI_RUN" '
              [ .attestations[]
                | { id: (.bundle_url | capture("/(?<id>[0-9]+)[.]json").id),
                    statement: (.bundle.dsseEnvelope.payload | @base64d | fromjson) }
                | select(.statement.predicateType == "https://slsa.dev/provenance/v1")
                | select([.statement.subject[].digest.sha256] | index($d) != null)
                | select((.statement.predicate.runDetails.metadata.invocationId | type) == "string")
                | select(.statement.predicate.runDetails.metadata.invocationId | startswith($prefix))
                | select(.statement.predicate.runDetails.metadata.invocationId | ltrimstr($prefix) | test("^(/attempts/[0-9]+)?$"))
                | .id ]' <<<"$LIST")" || fail "the attestation list is not in the expected shape"
          COUNT="$(jq 'length' <<<"$IDS")"
          [ "$COUNT" = 1 ] || fail "expected exactly one SLSA build provenance attestation for sha256:$DIGEST from run $CI_RUN, found $COUNT"
          ID="$(jq -r '.[0]' <<<"$IDS")"
          [[ "$ID" =~ ^[0-9]+$ ]] || fail "the attestation id '$ID' is not a number"
          echo "ref=https://github.com/$REPO/attestations/$ID" >> "$GITHUB_OUTPUT"

      # Before a byte is uploaded: if Backend-Core cannot be reached, the registration could not follow it.
      - name: Check that Backend-Core answers
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          HTTP="$(curl --silent --show-error --max-time 20 --proto '=https' --tlsv1.2 -o /dev/null -w '%{http_code}' "$API_BASE/api/v1/health/ready")" \
            || fail "cannot reach $API_BASE"
          [ "$HTTP" = 200 ] || fail "$API_BASE/api/v1/health/ready answered $HTTP, not 200"

      - name: Assume the upload role (GitHub OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.POS_PILOT_PROMOTE_ROLE_ARN }}
          aws-region: ${{ vars.POS_PILOT_RELEASE_S3_REGION }}
          role-session-name: rt-promote-pos-pilot-${{ github.run_id }}
          role-duration-seconds: 900

      # One PutObject (a multipart upload would be refused: its parts carry no If-None-Match). S3 verifies the SHA-256 we
      # send and refuses an existing key (412), so this can neither corrupt nor replace an object.
      - name: Upload the installer once (conditional write)
        id: put
        env:
          DIGEST: ${{ steps.download.outputs.digest }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          EXE="POS-Pulse-Setup-$VERSION.exe"
          PKG="$RUNNER_TEMP/pkg"
          KEY="pos/pilot/$VERSION/$EXE"
          B64="$(openssl dgst -sha256 -binary "$PKG/$EXE" | base64 | tr -d '\n')"
          ERR="$RUNNER_TEMP/put.err"
          if ! OUT="$(AWS_PAGER="" aws s3api put-object --bucket "$BUCKET" --key "$KEY" --body "$PKG/$EXE" \
                --checksum-algorithm SHA256 --checksum-sha256 "$B64" --if-none-match '*' --content-type application/octet-stream \
                --output json 2>"$ERR")"; then
            head -c 600 "$ERR" >&2 || true
            if grep -q 'PreconditionFailed' "$ERR"; then
              fail "$KEY already exists, so the one-shot write was refused. Do not re-run this job. If an earlier run uploaded it and only register failed, re-run the failed jobs of THAT run."
            fi
            fail "the upload of $KEY failed; nothing was written"
          fi
          VID="$(jq -r '.VersionId // empty' <<<"$OUT")"
          [ -n "$VID" ] || fail "S3 returned no VersionId: is versioning enabled on the bucket?"
          # (POSIX ERE caps a {m,n} repeat at 255, so the 1024 limit is a separate length check.)
          [[ "$VID" =~ ^[A-Za-z0-9._-]+$ ]] && [ "${#VID}" -le 1024 ] || fail "S3 returned a VersionId of an unexpected shape"
          [ "$(jq -r '.ChecksumSHA256 // empty' <<<"$OUT")" = "$B64" ] || fail "S3 did not confirm the SHA-256 of the uploaded object"
          echo "version_id=$VID" >> "$GITHUB_OUTPUT"
          echo "uploaded $KEY as version $VID"

      # Built once, here: a replay is recognised by exact content, so a re-run of register must send this very body
      # (the approval time and the run url are fixed now, not recomputed later).
      - name: Build the registration body once
        id: body
        env:
          DIGEST: ${{ steps.download.outputs.digest }}
          SIZE: ${{ steps.download.outputs.size }}
          VERSION_ID: ${{ steps.put.outputs.version_id }}
          ATTEST_REF: ${{ steps.attest.outputs.ref }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$ACTOR" =~ ^[A-Za-z0-9](-?[A-Za-z0-9])*$ ]] && [ "${#ACTOR}" -le 39 ] || fail "the actor '$ACTOR' is not a GitHub login the registry accepts"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || fail "the run id is not a number"
          [ -n "$VERSION_ID" ] || fail "there is no S3 VersionId to register"
          APPROVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(jq -cn --arg version "$VERSION" --arg sha256 "$DIGEST" --argjson size "$SIZE" --arg attestation "$ATTEST_REF" \
              --arg sourceSha "$SHA" --arg by "$ACTOR" --arg at "$APPROVED_AT" --arg run "https://github.com/$REPO/actions/runs/$RUN_ID" \
              --arg versionId "$VERSION_ID" \
              '{version: $version, sha256: $sha256, sizeBytes: $size, publisher: "CN=Kemetra POS PILOT", signingClass: "pilot",
                attestationRef: $attestation, sourceSha: $sourceSha, approvedBy: $by, approvedAt: $at, promotionRunUrl: $run,
                artifactVersionId: $versionId}')"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          {
            echo "### Uploaded $TAG to the private pilot bucket (not yet registered)"
            echo
            echo "- object \`pos/pilot/$VERSION/POS-Pulse-Setup-$VERSION.exe\`, S3 version \`$VERSION_ID\`, SHA-256 \`$DIGEST\`, $SIZE bytes"
            echo "- build provenance $ATTEST_REF"
            echo "- the next job registers it. If that fails, use **Re-run failed jobs** (never re-run this job)."
          } >> "$GITHUB_STEP_SUMMARY"

  # LIVE. One POST to Backend-Core with a GitHub OIDC token for the Backend-Core audience, in the same protected
  # environment (the token's `environment` claim is one of the five pins). It never activates a release.
  register:
    name: promote/register (live, Backend-Core, behind the approval environment)
    needs: [resolve, upload]
    if: ${{ inputs.mode == 'promote' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-pos-pilot-promote
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      BODY: ${{ needs.upload.outputs.body }}
      API_BASE: ${{ vars.POS_PILOT_API_BASE_URL }}
      AUDIENCE: ${{ vars.POS_PILOT_PROMOTION_OIDC_AUDIENCE }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Register the release with Backend-Core (OIDC bearer; it is not activated)
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$API_BASE" =~ ^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?$ ]] || fail "POS_PILOT_API_BASE_URL must be an https origin with no path and no trailing slash"
          [[ "$AUDIENCE" =~ ^[A-Za-z0-9._:/@-]{3,200}$ ]] && [ "$AUDIENCE" != sts.amazonaws.com ] || fail "POS_PILOT_PROMOTION_OIDC_AUDIENCE is blank, malformed, or the AWS audience"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || fail "no OIDC token request is available: this job needs id-token: write"
          jq -e --arg v "$VERSION" '.version == $v and .signingClass == "pilot" and .publisher == "CN=Kemetra POS PILOT"' <<<"$BODY" >/dev/null \
            || fail "the registration body from the upload job is not a pilot registration of $VERSION"
          # The credentials go through curl's config on stdin, never through the argument list.
          TOKEN="$(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | curl -K - --silent --show-error --fail --max-time 20 --proto '=https' --tlsv1.2 --get --data-urlencode "audience=$AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | jq -r '.value // empty')" || fail "GitHub did not issue an OIDC token"
          [ -n "$TOKEN" ] || fail "GitHub issued an empty OIDC token"
          echo "::add-mask::$TOKEN"
          KEY="pos-pilot-promote-$VERSION-$RUN_ID"
          RESP="$RUNNER_TEMP/register.json"
          HTTP="$(printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" \
            | curl -K - --silent --show-error --max-time 30 --proto '=https' --tlsv1.2 -o "$RESP" -w '%{http_code}' -X POST \
                -H "Idempotency-Key: $KEY" -H 'Content-Type: application/json' --data "$BODY" "$API_BASE/api/v1/platform/pos-pilot-releases")" \
            || fail "cannot reach Backend-Core"
          case "$HTTP" in
            200|201) ;;
            *) fail "Backend-Core answered $HTTP ($(jq -r '.code // .error // "no code"' "$RESP" 2>/dev/null | tr -cd 'A-Za-z0-9_. -' | head -c 120)). A 401 or 403 means the five POS_PILOT_PROMOTION_OIDC_* pins on the host do not match this token: fix the host, then use Re-run failed jobs." ;;
          esac
          jq -e --arg v "$VERSION" --argjson body "$BODY" \
              '.version == $v and .sha256 == $body.sha256 and .sizeBytes == $body.sizeBytes and .signingClass == "pilot" and .artifactVersionId == $body.artifactVersionId and .approved == true' \
              "$RESP" >/dev/null \
            || fail "Backend-Core answered $HTTP but not with the release that was sent (a withdrawn release answers approved:false)"
          {
            echo "### Registered $TAG with Backend-Core (HTTP $HTTP): it is NOT active"
            echo
            echo "- release \`$(jq -r '.releaseId // "unknown"' "$RESP")\`, version \`$VERSION\`"
            echo "- a platform admin activates it separately in the Console; nothing here makes it downloadable"
          } >> "$GITHUB_STEP_SUMMARY"

  # RT-1363, withdraw mode, every run. No environment, no token, no credential and no checkout: it validates the
  # request and says what it would withdraw. The live job repeats the checks that matter, because it holds the token.
  withdraw-check:
    name: withdraw/check (no environment and no token, nothing is withdrawn here)
    if: ${{ inputs.mode == 'withdraw' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      REF: ${{ github.ref }}
      ACTOR: ${{ github.actor }}
      TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check the withdraw request
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # A value this run was given is never echoed as it came: only its plain characters, and only a few.
          show() { printf '%s' "$1" | tr -cd 'A-Za-z0-9._/@-' | head -c 60 || true; }
          [ "$REF" = refs/heads/main ] || fail "run this workflow from main, not '$(show "$REF")': another branch's copy of it could withdraw a release without the review of main's copy"
          [[ "$ACTOR" =~ ^[A-Za-z0-9](-?[A-Za-z0-9])*$ ]] && [ "${#ACTOR}" -le 39 ] || fail "the actor '$(show "$ACTOR")' is not a GitHub login the registry accepts (start the run as a person, not an app)"
          [[ "$TAG" =~ ^pos-pilot/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "tag '$(show "$TAG")' is not pos-pilot/vX.Y.Z: name the version of the release to withdraw"
          ID="$(printf '%s' "$RELEASE_ID" | tr 'A-F' 'a-f')"
          [[ "$ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || fail "release_id '$(show "$RELEASE_ID")' is not a release id (the UUID the registry gave the release)"
          VERSION="${TAG#pos-pilot/v}"
          if [ "$DRY_RUN" = true ]; then
            {
              echo "### withdraw (dry run): release \`$ID\` as $TAG"
              echo
              echo "- a live run would withdraw the registry row \`$ID\`, which must be version \`$VERSION\`, for good: the resolver stops offering it at once and it is never approved again"
              echo "- nothing was withdrawn: this run held no environment and no token"
              echo "- the installer is not touched by a withdrawal, and nothing is activated"
              echo "- run it again with dry_run false to withdraw: it first asks for your approval on the protected environment"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### withdraw requested: release \`$ID\` as $TAG"
              echo
              echo "- the next job withdraws it for good, after your approval on the protected environment"
              echo "- approve only if the Console release list shows this id as version \`$VERSION\`: the check after the withdrawal can report a mix-up but cannot undo it"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # RT-1363, withdraw mode, LIVE only (dry_run false). One POST with a GitHub OIDC token for the Backend-Core audience,
  # in the same protected environment as the promote jobs (the token's `environment` claim is one of the five pins).
  # It never activates a release and never touches the installer.
  withdraw:
    name: withdraw/live (Backend-Core, behind the approval environment)
    needs: withdraw-check
    if: ${{ inputs.mode == 'withdraw' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-pos-pilot-promote
    permissions:
      id-token: write
    env:
      REF: ${{ github.ref }}
      ACTOR: ${{ github.actor }}
      TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      API_BASE: ${{ vars.POS_PILOT_API_BASE_URL }}
      AUDIENCE: ${{ vars.POS_PILOT_PROMOTION_OIDC_AUDIENCE }}
    steps:
      - name: Withdraw the release through Backend-Core (OIDC bearer; it is not re-activated or deleted)
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          show() { printf '%s' "$1" | tr -cd 'A-Za-z0-9._/@-' | head -c 60 || true; }
          # Everything below is checked again here, before any token is requested: this job holds the credential.
          [ "$REF" = refs/heads/main ] || fail "run this workflow from main, not '$(show "$REF")'"
          [[ "$ACTOR" =~ ^[A-Za-z0-9](-?[A-Za-z0-9])*$ ]] && [ "${#ACTOR}" -le 39 ] || fail "the actor '$(show "$ACTOR")' is not a GitHub login the registry accepts (start the run as a person, not an app)"
          [[ "$TAG" =~ ^pos-pilot/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "tag '$(show "$TAG")' is not pos-pilot/vX.Y.Z"
          ID="$(printf '%s' "$RELEASE_ID" | tr 'A-F' 'a-f')"
          [[ "$ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || fail "release_id '$(show "$RELEASE_ID")' is not a release id"
          VERSION="${TAG#pos-pilot/v}"
          [[ "$API_BASE" =~ ^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?$ ]] || fail "POS_PILOT_API_BASE_URL must be an https origin with no path and no trailing slash"
          [[ "$AUDIENCE" =~ ^[A-Za-z0-9._:/@-]{3,200}$ ]] && [ "$AUDIENCE" != sts.amazonaws.com ] || fail "POS_PILOT_PROMOTION_OIDC_AUDIENCE is blank, malformed, or the audience of another service"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || fail "no OIDC token request is available: this job needs id-token: write"
          # The credentials go through curl's config on stdin, never through the argument list.
          TOKEN="$(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | curl -K - --silent --show-error --fail --max-time 20 --proto '=https' --tlsv1.2 --get --data-urlencode "audience=$AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | jq -r '.value // empty')" || fail "GitHub did not issue an OIDC token"
          [ -n "$TOKEN" ] || fail "GitHub issued an empty OIDC token"
          echo "::add-mask::$TOKEN"
          RESP="$RUNNER_TEMP/answer.json"
          HTTP="$(printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" \
            | curl -K - --silent --show-error --max-time 30 --proto '=https' --tlsv1.2 -o "$RESP" -w '%{http_code}' -X POST --data '' \
                "$API_BASE/api/v1/platform/pos-pilot-releases/$ID/withdraw")" \
            || fail "cannot reach Backend-Core, so it is not known whether release $ID was withdrawn: a withdrawal is safe to repeat, run this job again"
          # The envelope is { error: { code } }; read only a short plain code out of whatever came back.
          CODE="$(jq -r '((.error | objects | .code) // .code // "no code") | tostring' "$RESP" 2>/dev/null | tr -cd 'A-Za-z0-9_. -' | head -c 80 || true)"
          [ -n "$CODE" ] || CODE="no code"
          [ "$HTTP" = 200 ] || fail "Backend-Core answered $HTTP ($CODE) for release $ID: nothing is reported as withdrawn. 401 or 403 means the five POS_PILOT_PROMOTION_OIDC_* pins on the host do not match this token (fix the host, then run this job again). 404 means no release has this id."
          jq -e --arg id "$ID" '.releaseId == $id and .approved == false and (.withdrawnAt | type) == "string"' "$RESP" >/dev/null 2>&1 \
            || fail "Backend-Core answered 200 but not with release $ID now withdrawn: do not trust this run, read the release in the Console"
          ANSWERED="$(jq -r '.version | if type == "string" then . else "none" end' "$RESP" | tr -cd '0-9A-Za-z.+-' | head -c 40 || true)"
          [ "$ANSWERED" = "$VERSION" ] || fail "WITHDREW release $ID, which is version ${ANSWERED:-none}, not $VERSION as this run named it. A withdrawal is for good: tell the owner now, the release cannot be un-withdrawn and a fix ships as a higher version."
          WITHDRAWN_BY="$(jq -r '.withdrawnBy // "unknown"' "$RESP" | tr -cd 'A-Za-z0-9-' | head -c 39 || true)"
          WITHDRAWN_AT="$(jq -r '.withdrawnAt' "$RESP" | tr -cd '0-9TZ:.+-' | head -c 40 || true)"
          {
            echo "### Withdrew $TAG (release \`$ID\`): HTTP 200"
            echo
            echo "- withdrawn by \`$WITHDRAWN_BY\` at \`$WITHDRAWN_AT\` (a release that was already withdrawn answers 200 too: the login and time are then those of the first withdrawal)"
            echo "- the resolver stops offering it at once and it is never approved again: a fix ships as a higher version"
            echo "- the installer is untouched and the release is not re-activated or deleted; a platform admin can now activate the next release in the Console"
          } >> "$GITHUB_STEP_SUMMARY"
