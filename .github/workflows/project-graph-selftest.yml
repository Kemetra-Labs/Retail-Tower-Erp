# Read-only selftest of tools/project-graph (RT-721 Substep A).
# Runs PR code with a read-only token and no secrets. It is NOT the trust gate:
# the gate is .github/workflows/gate.yml, which runs only base-branch code.
#
# RT-1467 (CI-06): it runs only when a path it tests changes (its own tool, the workflows, and the
# .circleci/ and .depot/ files test_circleci_gate and test_depot_preflight read), and it repeats nothing
# a gated job runs.
# The layer-1 boundary check is `boundary-check` (project-graph.yml, always selected) and the release
# tooling's offline specs are in `contracts/check` (contracts.yml, selected by .github/release/**).
# A changed path no class owns is rejected by `evaluate` itself (UNKNOWN_PATH), so skipping the
# tree-wide classify-tree on unrelated PRs leaves that guard in the gate.
name: project-graph-selftest

on:
  pull_request:
    paths: ["tools/project-graph/**", ".github/**", ".circleci/**", ".depot/**"]
  push:
    branches: [main]
    paths: ["tools/project-graph/**", ".github/**", ".circleci/**", ".depot/**"]

permissions:
  contents: read

concurrency:
  group: project-graph-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: project-graph/selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tools/project-graph/requirements.txt
      - name: Unit tests and fixtures P01-P19, X01-X07
        working-directory: tools/project-graph
        run: python -m unittest discover -s tests -v
      - name: Classify every tracked path
        working-directory: tools/project-graph
        run: python -m pgraph classify-tree --repo "$GITHUB_WORKSPACE" --rev HEAD
      - name: Workflow privilege invariants (R5, T-A)
        working-directory: tools/project-graph
        run: python -m pgraph privileges --repo "$GITHUB_WORKSPACE"
