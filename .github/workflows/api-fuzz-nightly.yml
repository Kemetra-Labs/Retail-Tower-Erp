# RT-877: nightly full Schemathesis run on main, ported from
# services/backend-core/.github/workflows/api-fuzz.yml (RT-59, RT-582), which GitHub never runs
# from a nested .github/ since the RT-715 cutover. Same scripts, baselines and steps, run inside
# services/backend-core/:
#
#   - gate:   not_a_server_error. Fails on any 5xx that is not in
#             tools/schemathesis/5xx-baseline.json.
#   - report: positive_data_acceptance. Findings never fail the job; they are
#             listed in the job summary. Since RT-1467 (CI-03) this is the only place it runs;
#             the PR shards run the gate only.
#   - operator: the RT-612 operator-envelope run, a second non-gating job (moved here from
#             backend-core.yml by RT-1467, D5).
#
# The PR-time check is the sharded bc/schemathesis in backend-core.yml, selected by the project
# graph. This run covers main whatever changed, unsharded, as the product's nightly did. It is not
# a graph job: the job name is not a graph.yaml key and the workflow is not in gate.yml
# `workflow_run`, so it never feeds `required`. Everything it creates is local to the runner; see
# services/backend-core/tools/schemathesis/README.md.
#
# Differences from the product workflow:
#  - job timeout 60 minutes (product: 30). shard-timings.json puts the full surface at about
#    24 minutes before the stack starts, on a runner not yet measured here; the first
#    workflow_dispatch run is the measurement.
#  - hardening, not parity: actions pinned to the SHAs the root workflows use, checkout does not
#    persist credentials, top-level `permissions: read-all` with a read-only job grant.
#
# RT-917 Depot Runners pilot (RT-917 comment 14423): a manual dispatch from main with
# runner=depot runs this job on depot-ubuntu-24.04-4 (4 CPU / 16 GB, the size of a public-repo
# ubuntu-24.04). Every other run, the schedule and a default dispatch included, stays on
# ubuntu-24.04. Depot runners are reachable only when the org runner group allows this file at
# refs/heads/main; nothing here grants a permission or a secret. The "Runner size" step prints the
# CPU and memory of both arms for the A/B comparison.

name: API fuzz nightly (Schemathesis)

"on":
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily, on the default branch
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for this run: github (ubuntu-24.04) or depot (depot-ubuntu-24.04-4, main only; RT-917 pilot)"
        type: choice
        options:
          - github
          - depot
        default: github

permissions: read-all

concurrency:
  group: api-fuzz-nightly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/backend-core

jobs:
  schemathesis-nightly:
    name: schemathesis-nightly (cookieAuth surface, full)
    # Depot only for an explicit runner=depot dispatch on refs/heads/main; anything else (the
    # schedule, a default dispatch, a dispatch from another ref) runs on ubuntu-24.04.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'depot' && github.ref == 'refs/heads/main') && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The scripts write to $RUNNER_TEMP/api-fuzz (the runner context is not
      # available in job-level env, so the path is not set here).
      FUZZ_PROJECT: api-fuzz
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Runner size
        run: |
          {
            echo "### Runner size"
            echo "- runner: \`$RUNNER_NAME\` ($RUNNER_OS/$RUNNER_ARCH)"
            echo "- CPUs: $(nproc)"
            echo "- model: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
            echo "- memory: $(free -m | awk '/^Mem:/ {printf "%.1f", $2/1024}') GiB"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start ephemeral stack
        run: bash tools/schemathesis/stack-up.sh

      - name: "Gate: no 5xx (not_a_server_error)"
        run: bash tools/schemathesis/run.sh gate

      # Findings never fail this step; it fails only if Schemathesis could not run.
      - name: "Report (non-gating findings): positive_data_acceptance"
        if: always()
        run: bash tools/schemathesis/run.sh report

      - name: Tear down
        if: always()
        run: |
          out="$RUNNER_TEMP/api-fuzz"
          if [ -f "$out/stack.env" ]; then
            set -a; . "$out/stack.env"; set +a
            export API_IMAGE=api-fuzz-api:local
            docker compose -p "$FUZZ_PROJECT" -f tools/schemathesis/compose.yml down -v
          fi
          rm -rf "$out"

  # RT-612 phase 1 (owner decision 2026-11-05, confirmed 2026-11-06): the operator-envelope
  # surface. `run.sh operator` fuzzes the operatorAuthorization (POS envelope) operations with
  # not_a_server_error and the envelope that stack-up.sh mints. It is NON-GATING three ways:
  #  - run.sh operator exits 0 on findings (they go to the job summary); it fails only when
  #    Schemathesis could not run;
  #  - `continue-on-error: true` on the job, so even that failure never fails the workflow;
  #  - this workflow is not a graph workflow and is not in gate.yml `workflow_run`, so it never
  #    feeds `required`.
  # RT-1467 (D5): moved here from backend-core.yml, where it ran on every PR that selected
  # bc/schemathesis and spent 3-6 runner-minutes for findings nobody gated on. Behaviour is
  # unchanged: its own runner and stack, images built with the shards' GitHub Actions layer
  # cache read only (main's entries; this job never writes the cache). Promoting it to a gate is
  # a separate owner decision.
  schemathesis-operator-nightly:
    name: schemathesis operator (non-gating)
    # Same runner choice as schemathesis-nightly above.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'depot' && github.ref == 'refs/heads/main') && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    env:
      FUZZ_PROJECT: api-fuzz
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build api image (layer cache, read only)
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/backend-core
          target: api
          tags: api-fuzz-api:local
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=bc-st-api

      - name: Build migrate image (layer cache, read only)
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/backend-core
          target: migrate
          tags: api-fuzz-migrate:local
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=bc-st-migrate

      - name: Start ephemeral stack
        timeout-minutes: 10
        env:
          SKIP_BUILD: "1"
        run: bash tools/schemathesis/stack-up.sh

      # Findings never fail this step (see the job comment above); it fails only if Schemathesis
      # could not run. The step summary carries the findings, never the envelope.
      - name: "Operator envelope (non-gating): not_a_server_error"
        timeout-minutes: 15
        run: bash tools/schemathesis/run.sh operator

      - name: Tear down
        if: always()
        run: |
          out="$RUNNER_TEMP/api-fuzz"
          if [ -f "$out/stack.env" ]; then
            set -a; . "$out/stack.env"; set +a
            export API_IMAGE=api-fuzz-api:local
            docker compose -p "$FUZZ_PROJECT" -f tools/schemathesis/compose.yml down -v
          fi
          rm -rf "$out"
