# RT-871 (MR-1, MR-3, MR-9): Backend-Core release, independent of the other products.
# Dry-run by default; a backend-core/vX.Y.Z tag publishes (RT-717 B1).
#
# Triggers: a `backend-core/vX.Y.Z` tag push, or a manual dispatch whose default is a dry-run.
# No pull_request trigger: PR code can never start this workflow with the release environment.
#
#   resolve   the release SHA (always github.sha) must be on main; a release needs a
#             backend-core/vX.Y.Z tag ref, a dry-run needs nothing else.
#   guard     MR-3 compat guard, ported from Kemetra/Backend-Core deploy/release-compat-gate.cjs
#             (RT-863) as .github/release/compat-gate.cjs: the latest github-actions run of
#             bc/fast, bc/db-integration, bc/db-package and bc/contracts-compat on the SHA must be
#             `success`, the release commit's contracts-compat fleet baseline must be fresh, and
#             replay NOT_PROVEN is recorded, not blocking, until every supported snapshot has a
#             recorded fixture. Red or missing refuses. It runs in dry-runs too, so a dry-run
#             shows whether the SHA is releasable. bc/contracts-compat is the root job in
#             backend-core.yml (RT-863); it runs on every push to main, like the other three.
#   build     api, worker and migrate images (services/backend-core/Dockerfile targets), built
#             without cache into OCI layouts. Nothing is pushed: the digests are OCI manifest
#             digests, the ones a later push of the same layout would carry.
#   manifest  release-manifest.json + unsigned in-toto provenance for the three images
#             (.github/release/manifest.py): source SHA, services/backend-core tree hash, image
#             digests, Backend-Core contract tree, guard verdict, CI URL. Every run. In release
#             mode it refuses unless the guard passed.
#   publish   RT-717 B1. Release mode only (a backend-core/vX.Y.Z tag) with a PASS guard verdict,
#             behind the `release-backend-core` environment (owner reviewer, tag-only deployment
#             policy; publish refuses unless the environment is protected that way). Re-runs
#             the compat guard, then pushes the three OCI layouts the build job produced,
#             unchanged (skopeo --preserve-digests, no rebuild), to
#             ghcr.io/kemetra-labs/backend-core-* as :sha-<SHA> (a re-run of failed jobs skips a
#             tag already holding this run's digest); verifies registry digests and labels;
#             attests build provenance; assembles the deploy bundle
#             (services/backend-core/deploy/release-bundle.sh); creates the GitHub release
#             backend-core/vX.Y.Z with exactly the three assets deploy-lab.yml consumes. Never
#             overwrites an image tag or a release, and never deploys.
#   env-probe manual negative probe (input probe_environment): asks for the environment from the
#             dispatched ref; from anything but a backend-core/v* tag it must never start.
#
# Every job is environment-free and secret-free except publish and env-probe. The token is
# read-only (workflow `permissions: {}`; contents: read per job, plus checks: read for guard).
# Only publish, admitted by the environment, gets contents/packages/attestations write and
# id-token: these scopes are repo-wide (a monorepo token is never confined to
# services/backend-core); the boundary is the tag-only environment and this job's steps.
name: release-backend-core

"on":
  push:
    tags: ["backend-core/v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry-run (guard + build + manifest, publish nothing). false needs a backend-core/vX.Y.Z tag ref.
        type: boolean
        default: true
      probe_environment:
        description: Negative probe of the release-backend-core environment from the dispatched ref
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-backend-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: release/resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout (history only, for the main-ancestry check)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: .github/release

      - name: Resolve SHA, mode and tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          TAG_RE='^refs/tags/backend-core/v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "unexpected SHA '$SHA'"
          case "$EVENT" in
            push) [[ "$REF" =~ $TAG_RE ]] || fail "tag $REF is not backend-core/vX.Y.Z"; mode=release ;;
            workflow_dispatch)
              if [ "$DRY_RUN" = "true" ]; then mode=dry-run
              else [[ "$REF" =~ $TAG_RE ]] || fail "a non-dry-run dispatch must run on a backend-core/vX.Y.Z tag ref, not $REF"; mode=release
              fi ;;
            *) fail "unsupported event $EVENT" ;;
          esac
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main || fail "$SHA is not on main"
          tag=""
          if [ "$mode" = release ]; then tag="${REF#refs/tags/}"; fi
          { echo "sha=$SHA"; echo "mode=$mode"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          echo "### release-backend-core: $mode ${tag:-(no tag)} at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  guard:
    name: release/compat-guard (MR-3)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      evidence: ${{ steps.gate.outputs.evidence }}
    steps:
      # The gate reads the release commit's files and runs contracts-compat's parser from the
      # same commit (the SHA resolve proved is on main); it executes nothing else from it.
      - name: Checkout the release SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/release
            services/backend-core/contracts-compat

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Read the check runs of the release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, conclusion, slug: .app.slug, started_at}' | jq -s . > "$RUNNER_TEMP/check-runs.json"
          jq -r '.[] | "\(.name): \(.conclusion) (\(.slug))"' "$RUNNER_TEMP/check-runs.json"

      - name: Compat guard
        id: gate
        env:
          # Root graph jobs that run on every push to main (backend-core.yml), plus the compat
          # job (MR-3). bc/oasdiff and bc/schemathesis are PR-only and enforced at merge time.
          REQUIRED_CHECKS: '["bc/fast","bc/db-integration","bc/db-package","bc/contracts-compat"]'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/compat-gate.txt"
          status=0
          node .github/release/compat-gate.cjs --checks "$RUNNER_TEMP/check-runs.json" --required "$REQUIRED_CHECKS" \
            --source services/backend-core --lib services/backend-core/contracts-compat/lib > "$out" || status=$?
          cat "$out"
          {
            echo "### POS compatibility guard (MR-3)"
            echo
            sed 's/^::error:://; s/^/- /' "$out"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 0 ]; then verdict=PASS; else verdict=REFUSED; fi
          {
            echo "verdict=$verdict"
            echo "evidence=$(sed 's/^::error:://' "$out" | tr -d '\r' | paste -sd ';' -)"
          } >> "$GITHUB_OUTPUT"
          [ "$status" -eq 0 ] || { echo "::error::compat guard refused ${GITHUB_SHA} (bc/contracts-compat, MR-3)"; exit 1; }

  build:
    name: release/build (api, worker, migrate images; not pushed)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      api: ${{ steps.api.outputs.digest }}
      worker: ${{ steps.worker.outputs.digest }}
      migrate: ${{ steps.migrate.outputs.digest }}
    steps:
      - name: Checkout the release SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Prepare the output directory
        run: mkdir -p "$RUNNER_TEMP/images"

      - name: Build api (OCI layout, no push)
        id: api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/backend-core
          target: api
          push: false
          no-cache: true
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/images/backend-core-api.oci.tar
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build worker (OCI layout, no push)
        id: worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/backend-core
          target: worker
          push: false
          no-cache: true
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/images/backend-core-worker.oci.tar
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build migrate (OCI layout, no push)
        id: migrate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/backend-core
          target: migrate
          push: false
          no-cache: true
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/images/backend-core-migrate.oci.tar
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Check the image digests
        env:
          API: ${{ steps.api.outputs.digest }}
          WORKER: ${{ steps.worker.outputs.digest }}
          MIGRATE: ${{ steps.migrate.outputs.digest }}
        run: |
          set -euo pipefail
          for d in "$API" "$WORKER" "$MIGRATE"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad image digest '$d'"; exit 1; }
          done
          printf 'api %s\nworker %s\nmigrate %s\n' "$API" "$WORKER" "$MIGRATE"
          sha256sum "$RUNNER_TEMP"/images/*.oci.tar

      - name: Upload the images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-core-images-${{ needs.resolve.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/images/
          if-no-files-found: error
          # a release run may wait for approval or need a re-run of failed jobs
          retention-days: ${{ needs.resolve.outputs.mode == 'release' && 14 || 3 }}

  # Runs whatever the guard decided, so a refused dry-run still records its verdict.
  manifest:
    name: release/manifest
    needs: [resolve, guard, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the release SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-core-images-${{ needs.resolve.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/images

      - name: Write the release manifest
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          MODE: ${{ needs.resolve.outputs.mode }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          API: ${{ needs.build.outputs.api }}
          WORKER: ${{ needs.build.outputs.worker }}
          MIGRATE: ${{ needs.build.outputs.migrate }}
          VERDICT: ${{ needs.guard.outputs.verdict || 'MISSING' }}
          EVIDENCE: ${{ needs.guard.outputs.evidence }}
        run: |
          set -euo pipefail
          img="$RUNNER_TEMP/images"
          args=(--product backend-core --sha "$SHA" --mode "$MODE" --repository "$REPOSITORY" --ci-url "$CI_URL"
                --artifact "backend-core-api=$img/backend-core-api.oci.tar" --artifact-digest "backend-core-api=$API"
                --artifact "backend-core-worker=$img/backend-core-worker.oci.tar" --artifact-digest "backend-core-worker=$WORKER"
                --artifact "backend-core-migrate=$img/backend-core-migrate.oci.tar" --artifact-digest "backend-core-migrate=$MIGRATE"
                --compat-verdict "$VERDICT" --compat-evidence "$EVIDENCE"
                --note "images=OCI layouts built without cache, not pushed; image_digest is the OCI manifest digest"
                --out "$RUNNER_TEMP/manifest")
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          python3 .github/release/manifest.py "${args[@]}"
          { echo '```json'; cat "$RUNNER_TEMP/manifest/release-manifest.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-core-release-manifest-${{ needs.resolve.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/manifest/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: release/publish (GHCR + attestation + GitHub release)
    needs: [resolve, guard, build, manifest]
    if: needs.resolve.outputs.mode == 'release' && needs.guard.outputs.verdict == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-backend-core
    # One publish at a time for the product: two tags on one commit share the sha-<SHA> image tags.
    concurrency:
      group: release-backend-core-publish
      cancel-in-progress: false
    permissions:
      contents: write # the GitHub release
      packages: write # GHCR push and attestation push
      id-token: write # attestation signing (Sigstore)
      attestations: write
      checks: read # compat guard re-check
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      TAG: ${{ needs.resolve.outputs.tag }}
      REGISTRY: ghcr.io/kemetra-labs
      REPO: ${{ github.repository }}
    # GH_TOKEN is set per step, only where gh needs it: release-bundle.sh and the compat gate
    # run without it.
    steps:
      # No `ref:`: checkout uses github.sha, the tagged commit resolve proved is on main.
      # release-bundle.sh re-checks HEAD against the SHA.
      - name: Checkout the release SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # A job that names a missing environment creates it unprotected. Refuse unless the
      # environment has a required reviewer and admits only backend-core/v* tags.
      - name: Refuse unless the release environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          ENV_JSON="$(gh api "repos/$REPO/environments/release-backend-core")" || fail "cannot read the release-backend-core environment"
          jq -e '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length > 0' <<<"$ENV_JSON" >/dev/null \
            || fail "release-backend-core has no required reviewer"
          jq -e '.deployment_branch_policy.custom_branch_policies == true' <<<"$ENV_JSON" >/dev/null \
            || fail "release-backend-core has no custom deployment policy"
          POLICIES="$(gh api "repos/$REPO/environments/release-backend-core/deployment-branch-policies" \
            --jq '[.branch_policies[] | {name, type}]')" || fail "cannot read the deployment policies"
          [ "$(jq -c . <<<"$POLICIES")" = '[{"name":"backend-core/v*","type":"tag"}]' ] \
            || fail "release-backend-core must admit exactly the tag pattern backend-core/v* (got $POLICIES)"

      - name: Check the release inputs
        env:
          API: ${{ needs.build.outputs.api }}
          WORKER: ${{ needs.build.outputs.worker }}
          MIGRATE: ${{ needs.build.outputs.migrate }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$TAG" =~ ^backend-core/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "release tag '$TAG' is not backend-core/vX.Y.Z"
          [ "$SHA" = "$GITHUB_SHA" ] || fail "resolved SHA $SHA != checked-out $GITHUB_SHA"
          for d in "$API" "$WORKER" "$MIGRATE"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "bad build digest '$d'"
          done
          grep -q -- '--release-tag)' services/backend-core/deploy/release-bundle.sh \
            || fail "release-bundle.sh in $SHA has no --release-tag (RT-908 B2 must be on main first)"

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # Environment approval can wait: the fleet freshness the guard judged is judged again
      # before anything irreversible.
      - name: Re-check the compat guard before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: '["bc/fast","bc/db-integration","bc/db-package","bc/contracts-compat"]'
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, conclusion, slug: .app.slug, started_at}' | jq -s . > "$RUNNER_TEMP/check-runs.json"
          env -u GH_TOKEN node .github/release/compat-gate.cjs --checks "$RUNNER_TEMP/check-runs.json" --required "$REQUIRED_CHECKS" \
            --source services/backend-core --lib services/backend-core/contracts-compat/lib

      - name: Download the images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-core-images-${{ needs.resolve.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/images

      # skopeo reads the same ~/.docker/config.json credentials.
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A re-run of failed jobs keeps this run's build digests: an image tag that already holds
      # exactly that digest is this run's own earlier push and is skipped, any other digest is
      # refused. An existing release (published or draft) is always refused.
      - name: Refuse to overwrite an image tag or a release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ needs.build.outputs.api }}
          WORKER: ${{ needs.build.outputs.worker }}
          MIGRATE: ${{ needs.build.outputs.migrate }}
        run: |
          set -euo pipefail
          declare -A DIGESTS=([api]="$API" [worker]="$WORKER" [migrate]="$MIGRATE")
          push=()
          for TARGET in api worker migrate; do
            IMAGE="$REGISTRY/backend-core-$TARGET:sha-$SHA"
            if OUT="$(docker buildx imagetools inspect "$IMAGE" 2>&1)"; then
              HAVE="sha256:$(skopeo inspect --raw "docker://$IMAGE" | sha256sum | cut -d' ' -f1)"
              [ "$HAVE" = "${DIGESTS[$TARGET]}" ] \
                || { echo "::error::image $IMAGE already exists with $HAVE, not this build's ${DIGESTS[$TARGET]}; refusing to overwrite"; exit 1; }
              echo "$TARGET already pushed by this run's build ($HAVE); skipping the push"
              continue
            fi
            grep -Eqi "not found|manifest unknown|name unknown" <<<"$OUT" \
              || { echo "::error::could not determine whether $IMAGE exists: $OUT"; exit 1; }
            push+=("$TARGET")
          done
          if OUT="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>&1)"; then
            echo "::error::release $TAG already exists (draft: $OUT); refusing to overwrite. A draft left by a failed run must be deleted by the owner first."
            exit 1
          fi
          grep -qi "release not found" <<<"$OUT" \
            || { echo "::error::could not determine whether release $TAG exists: $OUT"; exit 1; }
          echo "push=${push[*]}" >> "$GITHUB_OUTPUT"

      # The exact layouts the build job produced and the manifest job recorded are what is
      # published: no rebuild. --preserve-digests makes skopeo fail rather than re-encode.
      - name: Push the images by digest (no rebuild)
        env:
          PUSH: ${{ steps.existing.outputs.push }}
        run: |
          set -euo pipefail
          for TARGET in $PUSH; do
            case "$TARGET" in api|worker|migrate) ;; *) echo "::error::unexpected target '$TARGET'"; exit 1 ;; esac
            skopeo copy --preserve-digests --retry-times 3 \
              "oci-archive:$RUNNER_TEMP/images/backend-core-$TARGET.oci.tar" \
              "docker://$REGISTRY/backend-core-$TARGET:sha-$SHA"
          done

      - name: Verify the registry digests and labels
        env:
          API: ${{ needs.build.outputs.api }}
          WORKER: ${{ needs.build.outputs.worker }}
          MIGRATE: ${{ needs.build.outputs.migrate }}
        run: |
          set -euo pipefail
          declare -A DIGESTS=([api]="$API" [worker]="$WORKER" [migrate]="$MIGRATE")
          for TARGET in api worker migrate; do
            IMG="$REGISTRY/backend-core-$TARGET"
            DIGEST="${DIGESTS[$TARGET]}"
            TAG_DIGEST="sha256:$(skopeo inspect --raw "docker://$IMG:sha-$SHA" | sha256sum | cut -d' ' -f1)"
            [ "$TAG_DIGEST" = "$DIGEST" ] || { echo "::error::$TARGET tag digest $TAG_DIGEST != build digest $DIGEST"; exit 1; }
            LABELS="$(skopeo inspect --config "docker://$IMG@$DIGEST" | jq -c '.config.Labels // {}')"
            REVISION="$(jq -r '."org.opencontainers.image.revision" // ""' <<<"$LABELS")"
            SOURCE="$(jq -r '."org.opencontainers.image.source" // ""' <<<"$LABELS")"
            [ "$REVISION" = "$SHA" ] || { echo "::error::$TARGET revision label '$REVISION' != $SHA"; exit 1; }
            [ "$SOURCE" = "$GITHUB_SERVER_URL/$REPO" ] || { echo "::error::$TARGET source label '$SOURCE' != $GITHUB_SERVER_URL/$REPO"; exit 1; }
            echo "$TARGET OK $IMG@$DIGEST"
          done

      - name: Attest build provenance (api)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/kemetra-labs/backend-core-api
          subject-digest: ${{ needs.build.outputs.api }}
          push-to-registry: true

      - name: Attest build provenance (worker)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/kemetra-labs/backend-core-worker
          subject-digest: ${{ needs.build.outputs.worker }}
          push-to-registry: true

      - name: Attest build provenance (migrate)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/kemetra-labs/backend-core-migrate
          subject-digest: ${{ needs.build.outputs.migrate }}
          push-to-registry: true

      - name: Assemble the deploy bundle (registry digests)
        env:
          API: ${{ needs.build.outputs.api }}
          WORKER: ${{ needs.build.outputs.worker }}
          MIGRATE: ${{ needs.build.outputs.migrate }}
        run: |
          set -euo pipefail
          bash services/backend-core/deploy/release-bundle.sh \
            --sha "$SHA" --release-tag "$TAG" --published true --digest-kind registry-manifest-digest \
            --api-digest "$API" --worker-digest "$WORKER" --migrate-digest "$MIGRATE" \
            --out "$RUNNER_TEMP/release-out"

      - name: Create the GitHub release (never overwrites)
        env:
          GH_TOKEN: ${{ github.token }}
          COMPAT_EVIDENCE: ${{ needs.guard.outputs.evidence }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          OUT_DIR="$RUNNER_TEMP/release-out"
          BUNDLE="backend-core-release-${SHA:0:12}.tar.gz"
          [ "$(ls "$OUT_DIR" | sort | paste -sd ' ' -)" = "$(printf '%s\n' "$BUNDLE" SHA256SUMS release-manifest.json | sort | paste -sd ' ' -)" ] \
            || fail "release-bundle.sh output is not exactly $BUNDLE, release-manifest.json and SHA256SUMS"
          [ "$(jq -r .releaseTag "$OUT_DIR/release-manifest.json")" = "$TAG" ] || fail "manifest releaseTag is not $TAG"
          # --verify-tag only proves the tag exists: it must still point at the SHA this run built.
          TAG_SHA="$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)" || fail "cannot resolve tag $TAG"
          [ "$TAG_SHA" = "$SHA" ] || fail "tag $TAG now points at $TAG_SHA, not $SHA"
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --title "Backend-Core $TAG" \
            --notes "Digest-pinned api, worker and migrate images ($REGISTRY/backend-core-*) built from $SHA by $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID. Verify with SHA256SUMS and gh attestation verify before use; see services/backend-core/deploy/README.md. Compat guard: $COMPAT_EVIDENCE" \
            "$OUT_DIR/$BUNDLE" "$OUT_DIR/release-manifest.json" "$OUT_DIR/SHA256SUMS"
          {
            echo "### Published $TAG"
            echo
            echo "- release: $GITHUB_SERVER_URL/$REPO/releases/tag/$TAG"
            jq -r '.images | to_entries[] | "- \(.key): `\(.value.ref)`"' "$OUT_DIR/release-manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"

  env-probe:
    name: release/env-probe (must not start outside a backend-core/v* tag)
    if: github.event_name == 'workflow_dispatch' && inputs.probe_environment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-backend-core
    permissions: {}
    steps:
      - name: Report what the environment admitted
        env:
          REF: ${{ github.ref }}
          PROBE: ${{ secrets.RELEASE_ENV_PROBE }}
        run: |
          visible=no
          if [ -n "$PROBE" ]; then visible=yes; fi
          if [[ "$REF" =~ ^refs/tags/backend-core/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release-backend-core admitted the release tag $REF, as intended (probe secret visible: $visible)"
            exit 0
          fi
          echo "::error::release-backend-core admitted $REF (probe secret visible: $visible). Only backend-core/v* tags may use this environment: set its deployment policy."
          exit 1
