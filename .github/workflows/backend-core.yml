# Root CI for Backend-Core (RT-748 slices I-5, I-6 and I-11). Defines the graph.yaml job keys
# bc/fast, bc/db-integration, bc/db-package, bc/oasdiff, bc/contracts-compat and bc/schemathesis
# (static rule 5) by reproducing the `fast`, `db-integration`, `db-package`, `oasdiff`,
# `contracts-compat` (RT-863) and `schemathesis` jobs of the product's former
# services/backend-core/.github/workflows/ci.yml inside services/backend-core/. RT-845 (I-11)
# mirrors the product's RT-816 split: db + worker suites run in bc/db-package, in parallel with
# the api suite in bc/db-integration. Job `name:` values are the graph keys, so each is a literal
# with no expression and there is no matrix on a graph job. The workflow `name:` must stay
# `backend-core` (listed in gate.yml `workflow_run`). PR-reachable: read-only token, no credentials, no
# environment.
#
# bc/oasdiff and bc/schemathesis (RT-849, I-6). Their scripts (tools/oasdiff/check.sh,
# tools/schemathesis/*.sh) locate the Backend-Core root from their own path since RT-801, so they
# work from this repository's monorepo root. bc/schemathesis is the fan-in job of a 4-way shard
# matrix (`schemathesis shard N`, an expression name, so it is not a graph key); the fan-in is the
# only job named bc/schemathesis and it fails unless every shard succeeded and proved its files.
#
# Differences from the product workflow, all forced by the project graph:
#  - the graph is the only selector, so the `changes` job (risk-tier classifier), the `ci`
#    aggregate and the `needs.changes.outputs.* != 'false'` gates are gone; no `paths:`
#    filter. RT-867: the `plan` job runs the base-branch evaluator and every job runs only if
#    the graph selects it (the Schemathesis shards run for bc/schemathesis); a selected job that
#    is skipped fails the gate. Push to main selects everything. The product's
#    event-based conditions are not carried over. That includes
#    the product's `github.event_name == 'pull_request'` condition on oasdiff and Schemathesis:
#    it is dropped here, so both also run on push to main (see the next two points).
#  - oasdiff base: pull_request compares with `git merge-base origin/<base_ref> HEAD`, as the
#    product does; push (where github.base_ref is empty) compares with github.event.before, the
#    previous tip of main. Any other event, an empty or all-zero `before`, a base that is not a
#    commit, or a base tree without packages/contracts/openapi fails the job. The last one
#    closes the one path in check.sh that would otherwise print "nothing to compare" and exit 0.
#  - Schemathesis: the shard and fan-in wiring is the product's (RT-809) with the `changes`
#    dependency removed; the fan-in needs only the shard job and uses `!cancelled()`.
#  - timeouts of bc/oasdiff and bc/schemathesis are the product's values (5, shard 30 with step
#    limits 10/20/15, fan-in 10) and are NOT yet measured on this repo's 2-core runner; the first
#    PR run is the measurement (RT-849).
#  - the informational Codecov upload and its lcov check are not carried over (the upload
#    needs a repo credential, which PR-reachable workflows must not use). Coverage is still
#    collected and the Jest thresholds in apps/api/jest.config.cjs still gate the job.
#  - run directory: `defaults.run.working-directory` does not apply to `uses:` steps, so the
#    pnpm cache path carries the services/backend-core/ prefix explicitly.
#  - environment, not parity: the api test step sets NODE_OPTIONS=--max-old-space-size=4096 and
#    a read-only step before it reports the runner's size (see the comments on those steps).
#  - hardening, not parity: actions are pinned to SHAs (the product used floating @v4),
#    checkout does not persist credentials, and pull_request is limited to branches: [main]
#    (the gate evaluates PRs against main only).
#
# Known, not fixed here (product test, upstream first): the api spec
# apps/api/test/auth-contract-cleanup/auth-contract-cleanup.contract.spec.ts runs
# `git status --porcelain`, whose paths are repo-root-relative here (services/backend-core/...).
# Its apps/api/src, openapi and connector fences can therefore never match, and on a clean CI
# checkout it sees nothing at all, so those fences are vacuous in this repository.
name: backend-core

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-workflow prefix so the product workflows never cancel each other on one ref; the
  # push-SHA suffix stops consecutive pushes to main from cancelling each other.
  group: backend-core-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/backend-core

jobs:
  # RT-867 (MR-4): the project graph decides which jobs of this workflow EXECUTE, with the same
  # selection the `required` gate enforces. The evaluator and graph.yaml come from the trusted
  # commit (the PR base; the pushed main commit on push), extracted with `git archive` and never
  # from the PR head, whose tree is read as git data only. On push to main the evaluator selects
  # everything (FULL_RUN_EVENT). `jobs` is the JSON list of selected graph job keys. If this job
  # fails, every guarded job is skipped and the gate fails (UNEXPECTED_SKIP / ABSENT_JOB).
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # Full history: the evaluator diffs the base and head commits with git plumbing. Only
      # tools/project-graph is materialised; nothing from the checked-out tree is executed.
      - name: Checkout (history only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: tools/project-graph

      - name: Resolve trusted, base and head commits
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) base="$SHA"; head="$SHA" ;;   # main itself is trusted; push selects all
            *) echo "::error::unsupported event '$EVENT'"; exit 1 ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base^{commit}"
          { echo "base=$base"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      - name: Extract the trusted evaluator (git archive of the base commit)
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgraph-base"
          git archive "$BASE_SHA" tools/project-graph | tar -x -C "$RUNNER_TEMP/pgraph-base"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned dependencies (from the base commit)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r "$RUNNER_TEMP/pgraph-base/tools/project-graph/requirements.txt"

      - name: Evaluate the project graph
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgraph-base/tools/project-graph"
          python -m pgraph evaluate --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event "$EVENT" --out "$RUNNER_TEMP/plan.json"
          plan="$RUNNER_TEMP/plan.json"
          # An invalid trusted graph selects nothing; fail loudly instead of running nothing quietly.
          if [ "$(jq '.products | length' "$plan")" = "0" ]; then
            echo "::error::trusted graph invalid: $(jq -c .graph_validation "$plan")"; exit 1
          fi
          jobs="$(jq -c '.needed_jobs | if all(test("^[a-z0-9/-]+$")) then . else error("bad job key") end' "$plan")"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          {
            echo "### project graph plan"
            echo "graph validation: \`$(jq -r .graph_validation.status "$plan")\` $(jq -c .graph_validation.reasons "$plan"), select_all: \`$(jq -r .select_all "$plan")\`"
            echo
            echo "selected: \`$jobs\`"
          } >> "$GITHUB_STEP_SUMMARY"

  bc-fast:
    name: bc/fast
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'bc/fast')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: services/backend-core/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all workspaces
        run: pnpm -r run build

      # MUST run after the build: `lint` is a --noEmit typecheck, and each workspace resolves
      # its siblings through their published `types` entrypoints under dist/.
      - name: Static checks
        run: pnpm lint

      - name: ESLint
        run: pnpm lint:eslint

      - name: Typecheck tests (api + worker)
        run: pnpm typecheck

      - name: ESLint rule smoke test
        run: node --test tools/eslint-rules/__tests__/no-unscoped-tenant-query.spec.js

      - name: oasdiff consumer-impact spec
        run: node --test tools/oasdiff/__tests__/consumer-impact.spec.mjs

      # The Testcontainers-backed outbox suites are excluded by default in
      # apps/worker/jest.config.cjs; they run in bc/db-package with
      # WORKER_INCLUDE_DB_TESTS=1.
      - name: Test @data-pulse-2/worker (Docker-free suites)
        run: pnpm --filter @data-pulse-2/worker test

      - name: Test @data-pulse-2/shared
        run: pnpm --filter @data-pulse-2/shared test

      - name: Test @data-pulse-2/auth
        run: pnpm --filter @data-pulse-2/auth test

  bc-db-integration:
    name: bc/db-integration
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'bc/db-integration')
    runs-on: ubuntu-latest
    # 25 minutes (RT-845): api-only since the db + worker suites moved to bc/db-package. Measured
    # on this repo's 2-core runner on PR #14 (RT-841): setup about 1 minute + api 15.0 minutes.
    # The product keeps 40 until it has more measurements; this repo uses its own measurement.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: services/backend-core/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspaces required by db/api/worker tests
        run: >-
          pnpm
          --filter @data-pulse-2/shared
          --filter @data-pulse-2/auth
          --filter @data-pulse-2/db
          --filter @data-pulse-2/worker
          run build

      - name: Pre-pull postgres:16-alpine
        run: docker pull postgres:16-alpine

      # Read-only: prints the runner's size and Node's effective heap limit, so the heap setting
      # on the api step below is backed by a measurement from this runner.
      - name: Report runner size and Node heap limit
        run: |
          echo "nproc: $(nproc)"
          free -m
          node -p "'node ' + process.version + ', heap_size_limit MB: ' + Math.round(require('v8').getHeapStatistics().heap_size_limit / 1048576)"

      # Coverage is collected and the Jest thresholds in apps/api/jest.config.cjs gate this job.
      # --forceExit: the api suite has a pre-existing open-handle leak (the product workflow
      # documents it); without it Jest hangs after a green run until the job times out.
      # NODE_OPTIONS (this step only): the first run on this private repo's standard runner died
      # with "JavaScript heap out of memory" at a ~2 GB heap after 412 of 569 suites (run
      # 39408180851). The product's public repo runs the same step on a larger hosted runner and
      # passed 14 of 14 recent runs. Raising V8's heap limit is an environmental deviation, not a
      # test change; that it matches the headroom of the public runner is reasoned, not proven.
      - name: Test @data-pulse-2/api (RLS + audit + auth suites)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @data-pulse-2/api test -- --coverage --forceExit

      # RT-901: hand the api lcov (Jest's default reporters include lcov) to sonar.yml, which scans
      # each push to main. A push-only, credential-free upload that cannot change this job's
      # result; PR runs upload nothing. The paths in it are relative to apps/api.
      - name: Upload lcov for the Sonar scan (main pushes only)
        if: github.event_name == 'push' && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-coverage-backend-core
          path: services/backend-core/apps/api/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 3

  bc-db-package:
    name: bc/db-package
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'bc/db-package')
    runs-on: ubuntu-latest
    # 20 minutes, as in the product's db-package job (RT-816). Measured on this repo's 2-core
    # runner on PR #14 (RT-841): setup about 1 minute + db 10.8 + worker 2.5 minutes.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: services/backend-core/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspaces required by db/worker tests
        run: >-
          pnpm
          --filter @data-pulse-2/shared
          --filter @data-pulse-2/auth
          --filter @data-pulse-2/db
          --filter @data-pulse-2/worker
          run build

      - name: Pre-pull postgres:16-alpine
        run: docker pull postgres:16-alpine

      - name: Test @data-pulse-2/db (migrations + Testcontainers)
        run: pnpm --filter @data-pulse-2/db test

      # WORKER_INCLUDE_DB_TESTS=1 lifts the default exclusion of the three Testcontainers-backed
      # outbox specs that bc/fast skips for lack of Docker. This re-runs the full worker suite;
      # the unit-tier overlap with bc/fast is intentional, as in the product workflow.
      - name: Test @data-pulse-2/worker (Testcontainers outbox suites)
        env:
          WORKER_INCLUDE_DB_TESTS: "1"
        run: pnpm --filter @data-pulse-2/worker test

  # Compares packages/contracts/openapi/** at the comparison base with the checked-out head, in
  # oasdiff composed mode, and fails on WARN or higher (config and acknowledgement workflow:
  # tools/oasdiff/README.md). Needs no install, DB or Docker. Timeout: the product's 5 minutes,
  # not yet measured here.
  bc-oasdiff:
    name: bc/oasdiff
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'bc/oasdiff')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OASDIFF_VERSION: "1.32.1"
      # sha256 of oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz from the release checksums.txt
      OASDIFF_SHA256: "7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f"
    steps:
      # fetch-depth 0: the merge-base and the push base need history.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install oasdiff (pinned, checksum-verified)
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"

      # Event data reaches the script through env only. Every path that cannot name a real base
      # with the contracts in its tree fails, so the check can never pass by comparing nothing.
      - name: Resolve the comparison base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          case "$EVENT" in
            pull_request)
              [[ -n "$BASE_REF" ]] || fail "empty github.base_ref on a pull_request event"
              base="$(git merge-base "origin/$BASE_REF" HEAD)"
              ;;
            push)
              [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] || fail "push event without a usable 'before' SHA ('$BEFORE')"
              base="$BEFORE"
              ;;
            *) fail "unsupported event '$EVENT'" ;;
          esac
          git cat-file -e "$base^{commit}" || fail "base '$base' is not a commit in this checkout"
          prefix="$(git rev-parse --show-prefix)"
          # check.sh exits 0 with "nothing to compare" when the base tree has no contracts.
          git cat-file -e "$base:${prefix}packages/contracts/openapi" \
            || fail "base $base has no ${prefix}packages/contracts/openapi; refusing to compare nothing"
          echo "Comparing against $EVENT base $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Check for breaking changes
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
        run: |
          oasdiff --version
          bash tools/oasdiff/check.sh "$BASE_SHA"

  # RT-863 (MR-3): the POS compatibility matrix (RT-713), the product's `contracts-compat (POS
  # supported snapshots)` job. It re-reads each supported POS build's contract snapshot from git
  # history (commit + blob, verified) and runs oasdiff, the envelope/idempotency rules and the
  # offline replay from it to the current packages/contracts/openapi (contracts-compat/README.md).
  # PR mode: replay NOT_PROVEN and a stale fleet baseline are reported, not failed; the release
  # guard (.github/release/compat-gate.cjs) applies the release rules to this run's result. In
  # @bc-full, so it runs for every Backend-Core change and on every push to main, which is the
  # run release-backend-core.yml requires on the release SHA. No install, DB or Docker.
  # fetch-depth 0: the snapshot commits are in history. Node is pinned (the product used the
  # runner's default).
  bc-contracts-compat:
    name: bc/contracts-compat
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'bc/contracts-compat')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OASDIFF_VERSION: "1.32.1"
      # sha256 of oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz from the release checksums.txt
      OASDIFF_SHA256: "7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install oasdiff (pinned, checksum-verified)
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"

      - name: contracts-compat spec
        env:
          CONTRACTS_COMPAT_REQUIRE_OASDIFF: "1"
        run: node --test contracts-compat/__tests__/compat.spec.mjs

      - name: Check POS supported snapshots
        run: |
          oasdiff --version
          node contracts-compat/check.mjs --mode pr

  # Sharded 4 ways by the product (RT-809). Every shard boots its own ephemeral Backend-Core
  # stack on its own runner (fresh Postgres + Redis, throwaway owner and platform sessions, no
  # worker), then runs Schemathesis over its share of the cookieAuth contract files: the gate
  # (not_a_server_error, fails on any 5xx not in tools/schemathesis/5xx-baseline.json) and the
  # report (positive_data_acceptance, never fails the job). Either step fails if Schemathesis
  # could not run. The plan is computed from ops.py at this SHA, and the fan-in below proves the
  # shards ran every file exactly once.
  #
  # To change the shard count, change the matrix and SHARD_TOTAL in BOTH jobs together.
  # The name is an expression, so it is not a graph job key and never equals bc/schemathesis.
  # Timeouts are the product's, not yet measured on this repo's 2-core runner (job 30 minutes;
  # steps 10, 20 and 15).
  #
  # Image layer cache (RT-578, RT-917 comment 14404): the api and migrate images are built here
  # with Buildx and the GitHub Actions cache, then stack-up.sh runs with SKIP_BUILD=1. Only
  # shard 0 of a push to main writes the cache (cache-to); every other run only reads it, and
  # GitHub scopes the cache by ref, so a PR can read main's entries but never write them. No
  # token permission is added (pgraph privileges). A cache miss is a normal cold build, and a
  # failed build fails the shard.
  bc-schemathesis-shard:
    name: schemathesis shard ${{ matrix.shard }}
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'bc/schemathesis')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports, so a failed one does not hide the others' evidence.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # The scripts write to $RUNNER_TEMP/api-fuzz (the runner context is not available in
      # job-level env, so the path is not set here).
      FUZZ_PROJECT: api-fuzz
      SHARD_TOTAL: "4"
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Plan this shard's contract files
        run: bash tools/schemathesis/shard.sh plan

      # `uses:` steps ignore defaults.run.working-directory, hence the services/backend-core
      # context. Same pins as release-backend-core.yml.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build api image (layer cache)
        timeout-minutes: 10
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/backend-core
          target: api
          tags: api-fuzz-api:local
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=bc-st-api
          cache-to: ${{ github.event_name == 'push' && matrix.shard == 0 && 'type=gha,mode=max,scope=bc-st-api' || '' }}

      - name: Build migrate image (layer cache)
        timeout-minutes: 10
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/backend-core
          target: migrate
          tags: api-fuzz-migrate:local
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=bc-st-migrate
          cache-to: ${{ github.event_name == 'push' && matrix.shard == 0 && 'type=gha,mode=max,scope=bc-st-migrate' || '' }}

      - name: Start ephemeral stack
        timeout-minutes: 10
        env:
          SKIP_BUILD: "1"
        run: bash tools/schemathesis/stack-up.sh

      - name: "Gate: no 5xx (not_a_server_error)"
        timeout-minutes: 20
        run: bash tools/schemathesis/shard.sh run gate

      # Findings never fail this step; it fails only if Schemathesis could not run.
      - name: "Report (non-gating findings): positive_data_acceptance"
        if: always()
        timeout-minutes: 15
        run: bash tools/schemathesis/shard.sh run report

      # Plan, manifests, exit codes, SHA and findings only: no raw logs (their curl
      # reproductions carry the session cookie) and nothing if a credential shows up in them.
      # Runs before the teardown removes $RUNNER_TEMP/api-fuzz.
      - name: Collect shard evidence
        if: always()
        run: bash tools/schemathesis/shard.sh collect

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schemathesis-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/st-shard/artifact
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Tear down
        if: always()
        run: |
          out="$RUNNER_TEMP/api-fuzz"
          if [ -f "$out/stack.env" ]; then
            set -a; . "$out/stack.env"; set +a
            export API_IMAGE=api-fuzz-api:local
            docker compose -p "$FUZZ_PROJECT" -f tools/schemathesis/compose.yml down -v
          fi
          rm -rf "$out"

  # Fail-closed fan-in: the single job named bc/schemathesis. It fails unless all shard jobs
  # succeeded and the shards' artifacts prove that every (group, contract file, operationIds)
  # of the inventory regenerated here ran exactly once in gate and in report, at this SHA, with
  # no unbaselined 5xx. `!cancelled()` keeps it reporting when a shard failed.
  bc-schemathesis:
    name: bc/schemathesis
    needs: [plan, bc-schemathesis-shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'bc/schemathesis') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHARD_TOTAL: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Self-test the shard planner and fan-in
        run: python3 tools/schemathesis/__tests__/shards.test.py

      # A failed or missing download is not a verdict: the fan-in below fails on any shard
      # artifact that is absent, so this step may not decide anything.
      - name: Download shard evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: schemathesis-shard-*
          path: ${{ runner.temp }}/st-shard/downloaded

      - name: Fan-in (coverage + gate)
        env:
          SHARDS_RESULT: ${{ needs.bc-schemathesis-shard.result }}
        run: bash tools/schemathesis/shard.sh fanin

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schemathesis-merged
          path: ${{ runner.temp }}/st-shard/merged/schemathesis-merged.md
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
