# RT-749 (planned in RT-748): root CI job for the ERPNext Connector.
# Reproduces ERPNext-Connector@274589a ci.yml job `test` ("Unit tests and lint") inside
# integrations/erpnext-connector/. That ci.yml is unchanged up to the Connector SHA in
# tools/history/frozen.tsv, where the import now is. RT-872 adds connector/bench, the real-bench
# run of the DB tests (from the product's bench-nightly.yml) on Frappe v16, the only supported line. Each graph
# job's `name:` is the graph.yaml job key (static rule 5), so it is a literal with no expression.
# The workflow `name:` must stay `erpnext-connector` (listed in gate.yml `workflow_run`).
# PR-reachable: read-only token, no credentials, no environment. Deliberately no `paths:` filter: the project graph is the
# only selector. RT-867: the `plan` job runs the base-branch evaluator and the job runs only
# if the graph selects it; a selected job that is skipped fails the gate.
# The product's informational coverage upload is not carried over (it needs a repo
# credential, which PR-reachable workflows must not use). coverage.xml is still produced.
name: erpnext-connector

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-workflow prefix so the product workflows never cancel each other on one ref; the
  # push-SHA suffix stops consecutive pushes to main from cancelling each other.
  group: erpnext-connector-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  # RT-867 (MR-4): the project graph decides which jobs of this workflow EXECUTE, with the same
  # selection the `required` gate enforces. The evaluator and graph.yaml come from the trusted
  # commit (the PR base; the pushed main commit on push), extracted with `git archive` and never
  # from the PR head, whose tree is read as git data only. On push to main the evaluator selects
  # everything (FULL_RUN_EVENT). `jobs` is the JSON list of selected graph job keys. If this job
  # fails, every guarded job is skipped and the gate fails (UNEXPECTED_SKIP / ABSENT_JOB).
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # Full history: the evaluator diffs the base and head commits with git plumbing. Only
      # tools/project-graph is materialised; nothing from the checked-out tree is executed.
      - name: Checkout (history only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: tools/project-graph

      - name: Resolve trusted, base and head commits
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) base="$SHA"; head="$SHA" ;;   # main itself is trusted; push selects all
            *) echo "::error::unsupported event '$EVENT'"; exit 1 ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base^{commit}"
          { echo "base=$base"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      - name: Extract the trusted evaluator (git archive of the base commit)
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgraph-base"
          git archive "$BASE_SHA" tools/project-graph | tar -x -C "$RUNNER_TEMP/pgraph-base"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies (from the base commit)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r "$RUNNER_TEMP/pgraph-base/tools/project-graph/requirements.txt"

      - name: Evaluate the project graph
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgraph-base/tools/project-graph"
          python -m pgraph evaluate --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event "$EVENT" --out "$RUNNER_TEMP/plan.json"
          plan="$RUNNER_TEMP/plan.json"
          # An invalid trusted graph selects nothing; fail loudly instead of running nothing quietly.
          if [ "$(jq '.products | length' "$plan")" = "0" ]; then
            echo "::error::trusted graph invalid: $(jq -c .graph_validation "$plan")"; exit 1
          fi
          jobs="$(jq -c '.needed_jobs | if all(test("^[a-z0-9/-]+$")) then . else error("bad job key") end' "$plan")"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          {
            echo "### project graph plan"
            echo "graph validation: \`$(jq -r .graph_validation.status "$plan")\` $(jq -c .graph_validation.reasons "$plan"), select_all: \`$(jq -r .select_all "$plan")\`"
            echo
            echo "selected: \`$jobs\`"
          } >> "$GITHUB_STEP_SUMMARY"

  connector-unit-tests-and-lint:
    name: connector/unit-tests-and-lint
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'connector/unit-tests-and-lint')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/erpnext-connector
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # 3.11 matches the ERPNext/Frappe v15 bench runtime (rt9 image: Python 3.11.6).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
          # A fresh .venv on PATH for the later steps, so lint and tests see only the locked set.
          python-version: "3.11"
          activate-environment: true

      # The CI tool set is locked, with sha256 hashes and wheels only, in pylock.toml.
      # --require-hashes refuses any wheel without a matching hash; --no-build refuses sdists.
      - name: Install test tools (hash-locked)
        run: uv pip install --require-hashes --no-build -r pylock.toml

      - name: Lint
        run: python -m ruff check retail_tower_erpnext_connector

      - name: Unit tests (frappe-free)
        run: >-
          python -m pytest -q retail_tower_erpnext_connector/tests
          --ignore=retail_tower_erpnext_connector/tests/test_foundation.py
          --cov=retail_tower_erpnext_connector --cov-report=xml:coverage.xml

  # RT-872: connector/bench runs the DB-dependent Connector tests (test_foundation.py and the
  # Gate G5 real-DB index test, test_g5_unique_index_db.py) on a throwaway Frappe v16 bench, the only
  # supported line (owner decision 2026-10-25: v15 dropped; ERPNext-Connector #96,
  # docs/decisions/version-pin-upgrade-policy.md). The lane reproduces
  # integrations/erpnext-connector/.github/workflows/bench-nightly.yml. Its name is not a graph key,
  # and it is guarded on connector/bench (rule 5b). The graph job is the `connector-bench`
  # aggregate below: it fails unless the lane is green and every DB test ran unskipped, and it
  # names the lane's first failing boundary (recorded, never masked). Service containers are job-local; the MariaDB root password is a
  # throwaway value, not a secret. bench clones an app with `git clone`, so the lane stages the
  # Connector subtree (git archive of the checked-out commit) as a standalone repository first.
  # The RT-494 validated pair, the same pins and MariaDB 11.8 as bench-nightly.yml.
  connector-bench-v16:
    name: connector/bench lane v16
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'connector/bench')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FRAPPE_REF: v16.52.0
      ERPNEXT_REF: v16.51.0
      BENCH_VERSION: "5.31.0"
      PYTEST_VERSION: "9.1.1"
      APP: retail_tower_erpnext_connector
      SITE: test_site
    outputs:
      boundary: ${{ steps.boundary.outputs.boundary }}
      junit: ${{ steps.boundary.outputs.junit }}
    services:
      redis-cache:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=2s --health-retries=20
    steps:
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Frappe v16 requires Python 3.14 and Node 24 (RT-494).
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install MariaDB client
        id: client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client

      - name: Initialise bench (Frappe ${{ env.FRAPPE_REF }})
        id: init
        run: |
          pip install --only-binary :all: "frappe-bench==${BENCH_VERSION}"
          bench init --frappe-branch "${FRAPPE_REF}" --skip-redis-config-generation --skip-assets \
            --python "$(which python)" ~/frappe-bench

      - name: Stage the Connector as a standalone repository
        id: stage
        run: |
          src="$RUNNER_TEMP/app-src/$APP"
          mkdir -p "$src"
          git archive HEAD:integrations/erpnext-connector | tar -x -C "$src"
          git -C "$src" init -q -b main
          git -C "$src" add -A
          git -C "$src" -c user.name=ci -c user.email=ci@invalid commit -q -m "connector at $GITHUB_SHA"

      - name: Get ERPNext and the Connector, create the throwaway site
        id: site
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app --branch "${ERPNEXT_REF}" --skip-assets https://github.com/frappe/erpnext
          bench get-app --skip-assets "$RUNNER_TEMP/app-src/$APP"
          bench setup requirements --dev
          # The frappe-free unit-test modules import pytest; bench discovery imports every test_*.py.
          bench pip install --only-binary :all: "pytest==${PYTEST_VERSION}"
          bench new-site --db-host 127.0.0.1 --db-root-password root --admin-password admin "${SITE}"
          bench --site "${SITE}" install-app erpnext
          bench --site "${SITE}" install-app "${APP}"

      - name: Run the app tests on the bench
        id: tests
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench --site "${SITE}" set-config allow_tests true
          bench --site "${SITE}" run-tests --app "${APP}" --junit-xml-output "${RUNNER_TEMP}/bench-junit.xml"

      # The first step that did not succeed, in order, for the aggregate's summary.
      - name: Record the first failing boundary
        id: boundary
        if: always()
        env:
          OUTCOMES: >-
            checkout=${{ steps.checkout.outcome }} setup-python=${{ steps.python.outcome }}
            setup-node=${{ steps.node.outcome }} mariadb-client=${{ steps.client.outcome }}
            bench-init=${{ steps.init.outcome }}
            stage-app=${{ steps.stage.outcome }} site-setup=${{ steps.site.outcome }}
            run-tests=${{ steps.tests.outcome }}
        run: |
          boundary=none
          for pair in $OUTCOMES; do
            if [ "${pair#*=}" != success ]; then boundary="$pair"; break; fi
          done
          junit=false
          [ -f "$RUNNER_TEMP/bench-junit.xml" ] && junit=true
          echo "first failing boundary: $boundary (junit: $junit)"
          { echo "boundary=$boundary"; echo "junit=$junit"; } >> "$GITHUB_OUTPUT"

      - name: Upload JUnit report
        if: always() && steps.boundary.outputs.junit == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-bench-junit-v16
          path: ${{ runner.temp }}/bench-junit.xml
          if-no-files-found: error
          retention-days: 14

  # The graph job. `!cancelled() && needs.plan.result == 'success'` lets it run after a red lane,
  # so the failure is reported here with its boundary instead of becoming a bare skip.
  connector-bench:
    name: connector/bench
    needs: [plan, connector-bench-v16]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'connector/bench') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download v16 JUnit report
        if: needs.connector-bench-v16.outputs.junit == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: connector-bench-junit-v16
          path: ${{ runner.temp }}/junit/v16

      # Fails unless the v16 lane succeeded and every Gate G5 method and every test_foundation
      # class ran and none was skipped. A silent skip cannot pass for green.
      - name: Check the lane and summarise
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
          V16_RESULT: ${{ needs.connector-bench-v16.result }}
          V16_BOUNDARY: ${{ needs.connector-bench-v16.outputs.boundary }}
        shell: python
        run: |
          import os
          import sys
          import xml.etree.ElementTree as ET

          # Keep in step with test_g5_unique_index_db.py and test_foundation.py.
          G5 = {
              "test_index_is_installed",
              "test_duplicate_provenance_is_rejected_by_the_unique_index",
              "test_distinct_provenance_is_accepted",
              "test_null_provenance_is_not_deduplicated",
          }
          FOUNDATION = {"TestFoundationInstall", "TestFoundationNoMutationNoFork", "TestConnectorSettingsSingleton"}

          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          out.write("## connector/bench\n\n| Lane | Result | First failing boundary | Tests | DB tests |\n| --- | --- | --- | --- | --- |\n")
          failed = []
          details = []
          for lane in ("v16",):
              result = os.environ[f"{lane.upper()}_RESULT"]
              boundary = os.environ[f"{lane.upper()}_BOUNDARY"] or "lane did not run"
              path = os.path.join(os.environ["JUNIT_DIR"], lane, "bench-junit.xml")
              results = {}
              if os.path.exists(path):
                  for case in ET.parse(path).iter("testcase"):
                      status = "passed"
                      for tag in ("failure", "error", "skipped"):
                          if case.find(tag) is not None:
                              status = tag
                      results[(case.get("classname") or "", case.get("name") or "")] = status
              counts = {}
              for status in results.values():
                  counts[status] = counts.get(status, 0) + 1
              tests = f"{len(results)} ({', '.join(f'{k}: {v}' for k, v in sorted(counts.items()))})" if results else "no JUnit report"
              g5 = {n: s for (c, n), s in results.items() if c.endswith("TestSalesInvoiceProvenanceUniqueIndex")}
              fnd = {}
              for (c, n), s in results.items():
                  cls = c.rsplit(".", 1)[-1]
                  if cls in FOUNDATION:
                      fnd.setdefault(cls, []).append(s)
              problems = []
              if missing := sorted(G5 - set(g5)):
                  problems.append(f"G5 missing {missing}")
              if skipped := sorted(n for n, s in g5.items() if s == "skipped"):
                  problems.append(f"G5 skipped {skipped}")
              if missing := sorted(FOUNDATION - set(fnd)):
                  problems.append(f"test_foundation missing {missing}")
              if skipped := sorted(c for c, ss in fnd.items() if "skipped" in ss):
                  problems.append(f"test_foundation skipped in {skipped}")
              db = "; ".join(problems) if problems else "all ran"
              out.write(f"| {lane} | {result} | `{boundary}` | {tests} | {db} |\n")
              bad = sorted(f"{c}.{n} ({s})" for (c, n), s in results.items() if s in ("failure", "error"))
              if bad:
                  details.append(f"\n**{lane} failing tests:**\n\n" + "".join(f"- `{t}`\n" for t in bad))
              if result != "success" or problems:
                  failed.append(lane)
                  print(f"::error title=connector/bench {lane}::result={result}; first failing boundary: {boundary}; DB tests: {db}")
          out.write("".join(details))
          if failed:
              out.write(f"\n**Red lanes: {', '.join(failed)}.** Nothing is masked; the first failing boundary is listed above.\n")
              sys.exit(1)
