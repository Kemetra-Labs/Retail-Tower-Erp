# Root CI for consumer contracts (RT-868, decision MR-2). Defines the job `contracts/check`:
# every consumer is checked against the in-tree Backend-Core contract
# (services/backend-core/packages/contracts/openapi) at the same commit, so a change that breaks
# POS, Admin-Console or the Connector fails in the PR that makes it. tools/contracts-check:
#  - POS and Admin-Console PINs: each pinned file (read by blob SHA from this repository's object
#    store) against the in-tree file with `oasdiff breaking` (WARN or higher fails, Backend-Core
#    severity levels); every other change is listed as drift in the job summary.
#  - Connector posting/bin_view contracts.py, parsed with `ast`: enums, patterns and field names
#    against posting-feed.yaml / stock-view.yaml. Version-string drift is reported only.
#  - The OBS-1 golden-vector copies must be byte-identical.
# The job `name:` is a literal with no expression. The workflow `name:` must stay `contracts`.
# PR-reachable: read-only token, no credentials, no environment.
#
# Deliberately no `paths:` filter: the project graph is the only selector. RT-867: the `plan` job
# runs the base-branch evaluator and contracts/check runs only if the graph selects it (the
# Backend-Core and every consumer `contracts` tier, or any policy/tooling change); a selected job
# that is skipped fails the gate.
name: contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-workflow prefix so the product workflows never cancel each other on one ref; the
  # push-SHA suffix stops consecutive pushes to main from cancelling each other.
  group: contracts-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  # RT-867 (MR-4): the project graph decides which jobs of this workflow EXECUTE, with the same
  # selection the `required` gate enforces. The evaluator and graph.yaml come from the trusted
  # commit (the PR base; the pushed main commit on push), extracted with `git archive` and never
  # from the PR head, whose tree is read as git data only. On push to main the evaluator selects
  # everything (FULL_RUN_EVENT). `jobs` is the JSON list of selected graph job keys. If this job
  # fails, every guarded job is skipped and the gate fails (UNEXPECTED_SKIP / ABSENT_JOB).
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # Full history: the evaluator diffs the base and head commits with git plumbing. Only
      # tools/project-graph is materialised; nothing from the checked-out tree is executed.
      - name: Checkout (history only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: tools/project-graph

      - name: Resolve trusted, base and head commits
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) base="$SHA"; head="$SHA" ;;   # main itself is trusted; push selects all
            *) echo "::error::unsupported event '$EVENT'"; exit 1 ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base^{commit}"
          { echo "base=$base"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      - name: Extract the trusted evaluator (git archive of the base commit)
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgraph-base"
          git archive "$BASE_SHA" tools/project-graph | tar -x -C "$RUNNER_TEMP/pgraph-base"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned dependencies (from the base commit)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r "$RUNNER_TEMP/pgraph-base/tools/project-graph/requirements.txt"

      - name: Evaluate the project graph
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgraph-base/tools/project-graph"
          python -m pgraph evaluate --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event "$EVENT" --out "$RUNNER_TEMP/plan.json"
          plan="$RUNNER_TEMP/plan.json"
          # An invalid trusted graph selects nothing; fail loudly instead of running nothing quietly.
          if [ "$(jq '.products | length' "$plan")" = "0" ]; then
            echo "::error::trusted graph invalid: $(jq -c .graph_validation "$plan")"; exit 1
          fi
          jobs="$(jq -c '.needed_jobs | if all(test("^[a-z0-9/-]+$")) then . else error("bad job key") end' "$plan")"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          {
            echo "### project graph plan"
            echo "graph validation: \`$(jq -r .graph_validation.status "$plan")\` $(jq -c .graph_validation.reasons "$plan"), select_all: \`$(jq -r .select_all "$plan")\`"
            echo
            echo "selected: \`$jobs\`"
          } >> "$GITHUB_STEP_SUMMARY"

  contracts-check:
    name: contracts/check
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'contracts/check')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Same pin and digest as bc/oasdiff (.github/workflows/backend-core.yml). Bump both together.
      OASDIFF_VERSION: "1.32.1"
      # sha256 of oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz from the release checksums.txt
      OASDIFF_SHA256: "7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f"
    steps:
      # fetch-depth 0: the pinned blobs come from older commits; a shallow clone lacks them and
      # the check would fail closed on every pin.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # Hash-locked, wheels only, no transitive resolution (same file as project-graph).
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tools/project-graph/requirements.txt

      - name: Install oasdiff (pinned, checksum-verified)
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
          "$RUNNER_TEMP/oasdiff/oasdiff" --version

      # Includes the RT-868 acceptance probes against the real pinned blobs and real oasdiff:
      # removing a POS-used field from pos-sales/sales.yaml fails, an additive field is drift.
      - name: Unit tests
        working-directory: tools/contracts-check
        env:
          CONTRACTS_CHECK_OASDIFF: ${{ runner.temp }}/oasdiff/oasdiff
        run: python -m unittest discover -s tests -v

      - name: Check consumers against the in-tree contract
        working-directory: tools/contracts-check
        run: |
          python -m contracts_check --repo "$GITHUB_WORKSPACE" \
            --oasdiff "$RUNNER_TEMP/oasdiff/oasdiff" --summary "$GITHUB_STEP_SUMMARY"

      # RT-1030 (plan RT-1029): every system release manifest passes the offline gate (G1-G3, G5:
      # .github/release/system_gate.py), and each consumer PIN at its release is compatible with
      # the Backend-Core contract at the Backend-Core release (G4). Releases and commits are read
      # from the full history checked out above; an incompatible system version fails here.
      - name: System release gate
        run: |
          set -euo pipefail
          shopt -s nullglob
          for manifest in system/releases/*.json; do
            echo "::group::$manifest"
            python .github/release/system_gate.py --manifest "$manifest" --main origin/main
            mapfile -t revs < <(python .github/release/system_gate.py --manifest "$manifest" --contracts-args)
            (cd tools/contracts-check && python -m contracts_check --repo "$GITHUB_WORKSPACE" \
              --oasdiff "$RUNNER_TEMP/oasdiff/oasdiff" --only pins "${revs[@]}" --summary "$GITHUB_STEP_SUMMARY")
            echo "::endgroup::"
          done
