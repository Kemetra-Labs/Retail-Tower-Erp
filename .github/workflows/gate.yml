# =============================================================================
# Trusted gate, RT-709 A.3 (owner decision O-5 = T-A). Posts the `required` check-run.
#
# Status on main (RT-721 S3 moved it here from tools/ci-gate/, observe-only):
#   - it runs on pull_request_target and on `workflow_run` of the product workflows, and
#     `post` posts `required` with the workflow's own GITHUB_TOKEN, scoped to checks:write,
#     in the `ci-gate` environment. Owner decision 2026-10-25 (after the RT-715 cutover):
#     no kemetra-ci-gate App, so the gate needs no App installation, variable or secret.
#     Trade-off: `required` is now authored by github-actions, the same producer as every
#     other check, so a ruleset source pin cannot tell the gate's `required` from one posted
#     by another workflow holding checks:write. `.github/**` being policy class is the control;
#   - graph.yaml `policy_approvers` is [Kemetra] (RT-721 S1), so a policy change can pass
#     with an APPROVED review by that login carrying the attestation line below;
#   - root workflows define every graph.yaml job and every non-always job is plan-guarded
#     (static rules 5 and 5b; tests/test_real_tree.py).
# Not done yet:
#   - a main ruleset that requires `required`, plus "require branches to be up to date"
#     (the S6 no-bypass ruleset, RT-866, open).
#     The gate evaluates against the PR's base SHA, so without "up to date" a green result
#     could merge onto a newer main;
#   - RT-711 independent verification (P17/P19, latest-wins of multiple `required`
#     check-runs per SHA). The App source pin and its anti-spoof canary no longer apply;
#   - the delegated reviewer identity as approver, by numeric ID (MR-5, RT-870).
#
# Invariants this file must keep (review any change against them):
#   - Runs only base-branch code: checkout of the BASE sha only. Head objects
#     are fetched and read with git plumbing (names, modes, blobs) - never
#     checked out, installed or executed. No artifact is downloaded.
#   - Two jobs: `evaluate` touches all untrusted data and has NO environment,
#     no secrets and a read-only token; `post` holds `ci-gate`, reads only
#     validated job outputs (conclusion enum, 40-hex SHA, base64 summary) and
#     runs no repo code.
#   - Every value from the event or API reaches shell via env vars, never
#     inline ${{ }} in a run script (script injection).
#   - The only write scope in this file is checks:write, on `post` alone.
#   - Approval = APPROVED review with the SHA-bound line, verified by pgraph
#     (A.8 R1). Labels only re-trigger the gate; they never carry authority.
#     Dismissing a review does NOT re-trigger (pull_request_review would run
#     untrusted workflow code); the next push or label re-evaluates.
#   - Merge Queue stays OFF: merge_group is an UNKNOWN_EVENT (P15 deferred).
#   - `python -m pgraph privileges` must report no problems for this file.
#   - A late workflow_run (RT-888) whose PR is already closed, or whose open PR has moved
#     to a newer head, is "not applicable": `evaluate` ends green after the `pr` step and
#     `post` is skipped, so no `required` of any conclusion is published for it. Every
#     other unresolved shape still fails closed (tests/test_gate_resolve.py).
#   - Gate runs for one head SHA queue, they never cancel each other (RT-903,
#     `cancel-in-progress: false`): no gate job is killed mid-run and shown red on a PR.
# =============================================================================
name: gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [pos, admin-console, backend-core, erpnext-connector, contracts, e2e, project-graph]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  # One key per head SHA for both triggers, so two gate runs cannot race.
  # RT-903: queue, don't cancel. A newer run waits while one is running; GitHub keeps at
  # most one pending run per group and replaces it before its jobs start, so a superseded
  # run creates no gate/evaluate or gate/post check-run. The running one finishes, and the
  # newest pending run evaluates after it, so the last `required` reflects the latest state.
  group: gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: gate/evaluate
    # workflow_run for a push has no PR to evaluate; only PR-originated runs gate.
    if: ${{ github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      resolution: ${{ steps.pr.outputs.resolution }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      conclusion: ${{ steps.agg.outputs.conclusion }}
      summary_b64: ${{ steps.agg.outputs.summary_b64 }}
    steps:
      - name: Resolve pull request (metadata only)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        # Outputs: resolution=pr (a live PR: number, head_sha, base_sha follow) or
        # resolution=not_applicable (late workflow_run, see below: no head_sha, so nothing
        # is evaluated and `post` publishes no `required`). Any other outcome exits non-zero
        # with no outputs. tests/test_gate_resolve.py runs this script against stubbed `gh`.
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request_target) sha="$PR_HEAD_SHA" ;;
            workflow_run) sha="$RUN_HEAD_SHA" ;;
            *) echo "::error::gate: unexpected event"; exit 5 ;;
          esac
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          pulls="$(gh api "repos/$REPO/commits/$sha/pulls")"
          jq -e 'type == "array"' <<<"$pulls" > /dev/null
          if [ "$EVENT" = "workflow_run" ]; then
            # RT-888: a product workflow can complete after $sha stopped being the live head
            # of a PR. Two unambiguous shapes are "not applicable"; every other shape falls
            # through to the live check below and fails closed.
            #   closed:     no open PR, and a closed (merged or not) PR on main has head $sha;
            #   superseded: exactly one open PR, on main, and its head is no longer $sha
            #               (the gate run for its current head is the authority).
            late="$(jq -r --arg sha "$sha" '
              [.[] | select(.state == "open")] as $open
              | if ($open | length) == 0 then
                  ([.[] | select(.state == "closed" and .head.sha == $sha and .base.ref == "main")] | first
                   | if . == null then "" else
                       "closed \(.number) \(if .merged_at then "merged" else "closed-unmerged" end) \(.head.sha)" end)
                elif ($open | length) == 1 and $open[0].head.sha != $sha and $open[0].base.ref == "main" then
                  "superseded \($open[0].number) open \($open[0].head.sha)"
                else "" end' <<<"$pulls")"
            if [ -n "$late" ]; then
              read -r kind number state current <<<"$late"
              [[ "$kind" =~ ^(closed|superseded)$ && "$number" =~ ^[0-9]+$ ]]
              [[ "$state" =~ ^(merged|closed-unmerged|open)$ && "$current" =~ ^[0-9a-f]{40}$ ]]
              if [ "$kind" = "closed" ]; then
                msg="PR #$number is already $state; this late workflow_run for its head $sha has nothing to gate."
              else
                msg="PR #$number is open at head $current; this workflow_run is for the superseded head $sha. The gate run for $current is the authority."
              fi
              msg="$msg Not applicable: nothing evaluated, no required check posted."
              echo "::notice title=gate not applicable::$msg"
              printf '### gate: not applicable (%s)\n\n%s\n' "$kind" "$msg" >> "$GITHUB_STEP_SUMMARY"
              { echo "resolution=not_applicable"; echo "not_applicable_reason=$kind"; echo "number=$number"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Fail closed unless exactly one open PR has this head SHA, so a decoy
          # PR with the same head (e.g. against another base) cannot lend its runs.
          pr_json="$(jq --arg sha "$sha" \
                '[.[] | select(.state == "open" and .head.sha == $sha)] | if length == 1 then .[0] else error("head SHA is not unique to one open PR") end' <<<"$pulls")"
          number="$(jq -r .number <<<"$pr_json")"
          base_sha="$(jq -r .base.sha <<<"$pr_json")"
          base_ref="$(jq -r .base.ref <<<"$pr_json")"
          [[ "$number" =~ ^[0-9]+$ && "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [ "$base_ref" = "main" ]
          if [ "$EVENT" = "pull_request_target" ]; then [ "$number" = "$PR_NUMBER" ]; fi
          { echo "resolution=pr"; echo "number=$number"; echo "head_sha=$sha"; echo "base_sha=$base_sha"; } >> "$GITHUB_OUTPUT"

      # Every later step runs only for a resolved live PR (resolution=pr).
      - name: Check out the trusted BASE only
        if: ${{ steps.pr.outputs.resolution == 'pr' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch head objects (no checkout)
        if: ${{ steps.pr.outputs.resolution == 'pr' }}
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --no-recurse-submodules \
            "$SERVER/$REPO" "+refs/pull/$NUMBER/head:refs/gate/head"
          [ "$(git rev-parse refs/gate/head)" = "$HEAD_SHA" ]

      - name: Set up Python
        if: ${{ steps.pr.outputs.resolution == 'pr' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned dependencies (from BASE)
        if: ${{ steps.pr.outputs.resolution == 'pr' }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tools/project-graph/requirements.txt

      - name: Evaluate (trusted evaluator, head as data)
        if: ${{ steps.pr.outputs.resolution == 'pr' }}
        working-directory: tools/project-graph
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          python -m pgraph evaluate --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event pull_request_target --out "$RUNNER_TEMP/plan.json"

      - name: Collect job results and reviews (read-only token)
        if: ${{ steps.pr.outputs.resolution == 'pr' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP"
          # The gate's own runs are excluded, or "all runs completed" could never be true.
          gh api --paginate "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" --jq '.workflow_runs' \
            | jq -s '{workflow_runs: (add | map(select(.path != ".github/workflows/gate.yml")))}' > "$t/runs.json"
          echo '{}' > "$t/jobs.json"
          for id in $(jq -r '.workflow_runs[].id' "$t/runs.json"); do
            [[ "$id" =~ ^[0-9]+$ ]]
            gh api --paginate "repos/$REPO/actions/runs/$id/jobs?filter=all&per_page=100" --jq '.jobs' \
              | jq -s --arg id "$id" --slurpfile acc "$t/jobs.json" '$acc[0] + {($id): add}' > "$t/jobs.next"
            mv "$t/jobs.next" "$t/jobs.json"
          done
          gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs' \
            | jq -s '{check_runs: add}' > "$t/checks.json"
          gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews?per_page=100" | jq -s 'add' > "$t/reviews.json"

      - name: Normalize and aggregate
        if: ${{ steps.pr.outputs.resolution == 'pr' }}
        id: agg
        working-directory: tools/project-graph
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -uo pipefail
          t="$RUNNER_TEMP"
          python -m pgraph normalize --repo-name "$REPO" --workflow-runs "$t/runs.json" --jobs "$t/jobs.json" \
            --check-runs "$t/checks.json" --reviews "$t/reviews.json" \
            --out-checks "$t/records.json" --out-approvals "$t/approvals.json" > "$t/norm.json"
          deadline=""
          [ "$(jq -r .all_runs_completed "$t/norm.json")" = "true" ] && deadline="--deadline-passed"
          python -m pgraph aggregate --plan "$t/plan.json" --checks "$t/records.json" \
            --approvals "$t/approvals.json" --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" $deadline \
            > "$t/result.json" || true
          conclusion="$(jq -r '.conclusion // "failure"' "$t/result.json" 2>/dev/null || echo failure)"
          summary="$(jq -r '"reasons: " + ((.reasons // ["NO_RESULT"]) | join(", "))' "$t/result.json" 2>/dev/null || echo "reasons: NO_RESULT")"
          # Publish the exact attestation line a listed human must put in an
          # APPROVED review on this head commit. Harmless: only a trusted login counts.
          if [ "$(jq -r '.approval_required // false' "$t/plan.json" 2>/dev/null)" = "true" ]; then
            line="$(jq -r '"policy-change-approved: base=" + .base_sha + " fingerprint=" + .policy_fingerprint' "$t/plan.json")"
            # The mode comes from the TRUSTED graph via the aggregator; a missing or unreadable result is `required`.
            mode="$(jq -r '.approval.mode // "required"' "$t/result.json" 2>/dev/null || echo required)"
            if [ "$mode" = "observe" ]; then
              # Print what the aggregator evaluated, so a valid, a missing and an invalid approval are distinguishable.
              astatus="$(jq -r '.approval | "approval status: valid=\(.valid), problems=" + ((.problems // []) | join(","))' "$t/result.json" 2>/dev/null || echo "approval status: unknown")"
              summary="$summary"$'\n\n'"Policy change: approval is OBSERVE-ONLY (policy_approval: observe in the trusted graph.yaml): its absence does not fail this check."$'\n'"$astatus"$'\n'"To attest anyway, an APPROVED review on this head commit containing exactly:"$'\n'"$line"
            else
              summary="$summary"$'\n\n'"Policy change: approval must be an APPROVED review on this head commit containing exactly:"$'\n'"$line"
            fi
          fi
          { echo "conclusion=$conclusion"; echo "summary_b64=$(printf '%s' "$summary" | base64 -w0)"; } >> "$GITHUB_OUTPUT"

  post:
    name: gate/post
    needs: evaluate
    # Runs even if evaluate failed after resolving the PR, so such a crash posts a failing
    # `required`. NOT always(): that also runs post in a cancelled run and publishes an
    # empty or partial verdict. Concurrency no longer cancels a started run (RT-903: it
    # queues), so a cancelled run is a manual cancel; it posts nothing and the next gate
    # run posts instead (until then `required` keeps its last posted value, or stays missing).
    # Never for resolution=not_applicable (RT-888: a late workflow_run for a closed PR or a
    # superseded head): that run has no verdict, so it must publish no `required` at all.
    if: ${{ !cancelled() && needs.evaluate.outputs.resolution == 'pr' && needs.evaluate.outputs.head_sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ci-gate
    permissions:
      checks: write
    steps:
      - name: Validate job outputs
        id: v
        env:
          HEAD_SHA: ${{ needs.evaluate.outputs.head_sha }}
          CONCLUSION: ${{ needs.evaluate.outputs.conclusion }}
          SUMMARY_B64: ${{ needs.evaluate.outputs.summary_b64 }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$CONCLUSION" in success|failure|pending) c="$CONCLUSION" ;; *) c=failure ;; esac
          [[ "$SUMMARY_B64" =~ ^[A-Za-z0-9+/=]*$ ]] || SUMMARY_B64="$(printf 'reasons: NO_RESULT' | base64 -w0)"
          { echo "conclusion=$c"; echo "summary_b64=$SUMMARY_B64"; } >> "$GITHUB_OUTPUT"

      - name: Post the `required` check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.evaluate.outputs.head_sha }}
          CONCLUSION: ${{ steps.v.outputs.conclusion }}
          SUMMARY_B64: ${{ steps.v.outputs.summary_b64 }}
        run: |
          set -euo pipefail
          summary="$(printf '%s' "$SUMMARY_B64" | base64 -d)"
          if [ "$CONCLUSION" = "pending" ]; then
            gh api "repos/$REPO/check-runs" -f name=required -f head_sha="$HEAD_SHA" -f status=in_progress \
              -f "output[title]=required: waiting" -f "output[summary]=$summary"
          else
            gh api "repos/$REPO/check-runs" -f name=required -f head_sha="$HEAD_SHA" -f status=completed \
              -f conclusion="$CONCLUSION" -f "output[title]=required: $CONCLUSION" -f "output[summary]=$summary"
          fi
