# R3 canary (RT-721 Substep B, step B4). Manual only; posts NO real gate result.
# Proves, on an isolated `canary/**` ruleset (never `main`):
#   - a `required` check-run from kemetra-ci-gate (App 5373080, checks:write)
#     satisfies a required check whose source is pinned to that App;
#   - the same context posted by GITHUB_TOKEN (github-actions) does NOT;
#   - the `ci-gate` environment (main-only) refuses a run dispatched on any
#     other branch, so the App key never reaches it.
# Runbook: tools/ci-gate/R3-CANARY.md. Independent witnessing: RT-711.
name: r3-canary

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: 40-hex commit that receives the `required` check-run
        required: true
        type: string
      source:
        description: app = kemetra-ci-gate via ci-gate env; token = GITHUB_TOKEN (spoof attempt)
        required: true
        type: choice
        options: [app, token]

permissions: {}

concurrency:
  group: r3-canary
  cancel-in-progress: false

jobs:
  app:
    name: r3-canary/app
    if: ${{ inputs.source == 'app' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ci-gate
    permissions: {}
    steps:
      - name: Validate input
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Mint kemetra-ci-gate token (checks:write only)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_GATE_APP_ID }}
          private-key: ${{ secrets.CI_GATE_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Post `required` from the App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          gh api "repos/$REPO/check-runs" -f name=required -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion=success \
            -f "output[title]=R3 canary: kemetra-ci-gate" \
            -f "output[summary]=RT-721 B4 canary. Not a real gate result."

  token:
    name: r3-canary/token
    if: ${{ inputs.source == 'token' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Validate input
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Post `required` with GITHUB_TOKEN (spoof attempt)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          gh api "repos/$REPO/check-runs" -f name=required -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion=success \
            -f "output[title]=R3 canary: GITHUB_TOKEN spoof" \
            -f "output[summary]=RT-721 B4 canary. Must NOT satisfy the pinned check."
