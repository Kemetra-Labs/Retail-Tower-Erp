# RT-876: gitleaks config for the root secret scan (.github/workflows/secrets.yml).
#
# Runs the gitleaks default rules. The allowlists below cover only the findings triaged at
# b2b42a72 (full history, gitleaks 8.30.1): 94 hits, 0 live secrets. They are idempotency keys,
# redaction-test sentinels, fake JWTs and doc placeholders. Each allowlist needs all three to
# match (condition AND): the rule that fired, one of the exact files it fired in, and one of the
# exact triaged values. A new value in a listed file still fails the scan, as does any other
# credential shape (AWS, GitHub, private key, ...) and any hit anywhere else.
#
# This file and .gitleaksignore are policy class (graph.yaml): widening the allowlist needs
# owner approval, like any workflow change.

title = "Retail Tower gitleaks config"

[extend]
useDefault = true

