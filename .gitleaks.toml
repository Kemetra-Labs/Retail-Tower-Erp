# RT-876: gitleaks config for the root secret scan (.github/workflows/secrets.yml).
#
# Runs the gitleaks default rules. The allowlists below cover only the findings triaged at
# b2b42a72 (full history, gitleaks 8.30.1): 94 hits, 0 live secrets. They are idempotency keys,
# redaction-test sentinels, fake JWTs and doc placeholders. Each allowlist is scoped to the rule
# that fired and to the exact files it fired in, so a real credential shape (AWS, GitHub, private
# key, ...) is still reported in those files, and a new generic hit anywhere else fails the scan.
#
# This file and .gitleaksignore are policy class (graph.yaml): widening the allowlist needs
# owner approval, like any workflow change.

title = "Retail Tower gitleaks config"

[extend]
useDefault = true

# Test fixtures and doc examples that look like generic keys: idempotency keys, `*_SECRET`
# sentinels in redaction tests, fake JWTs ({"kid":"secret-jwt-..."}, {"sub":"u"}), placeholder
# passwords in test env files and curl examples, and a Datadog monitor `key` name.
[[allowlists]]
