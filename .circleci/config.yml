# RT-920 (CI Modernization Execution Plan v2, Phase 3): advisory CircleCI lane.
# RT-1059: the automatic advisory workflow is TEMPORARILY PAUSED (advisory_enabled=false below).
#
# NOT a gate. GitHub Actions and gate.yml stay the only CI of record: the gate trusts only
# the GitHub Actions app (graph.yaml trusted_check_producer), so nothing here can make
# `required` green or red. This lane runs the Backend-Core API Jest suite through CircleCI
# Smarter Testing (`circleci testsuite`, suite in .circleci/test-suites.yml) to collect test
# timings and Test Insights.
#
# Test impact analysis runs in SHADOW mode (PR-4b, RT-920 comment 14285): the test job always
# runs the full suite and only records which specs impact analysis would have selected, then
# reports the selection ratio and any failing spec it would have skipped (a miss). Impact data
# is built by the separate analysis job on main. Nothing is ever skipped. A manual pipeline on
# main with full_tia_analysis=true runs only the tia-full-analysis workflow, which finishes
# that analysis in one go (RT-920 comment 14318 option 1).
#
# No secrets, no contexts, no orbs. Machine executor: the api suite starts one
# postgres:16-alpine through Testcontainers, which needs a local Docker daemon
# (setup_remote_docker breaks getMappedPort(); RT-594).
#
# RT-981: on-demand remote runs (remote-dev-api, remote-dev-db-package) for a pushed branch
# with no PR, where neither GitHub Actions (push triggers are main-only) nor the advisory lane
# (trigger only-build-prs) runs anything. Advisory, never a gate. Only a manual pipeline that
# sets remote_suite starts them, and the owner holds that trigger; webhooks set no parameters.
# Each job runs the remote-guard command before any install: the expected SHA, a non-main
# branch, and a .circleci/ identical to origin/main. Trigger with ONE branch for config and
# checkout (`circleci pipeline run -b <branch>`), never a split config/checkout API call: then
# the compiled config is that commit's, so an equal .circleci/ makes it main's. The guard pins
# only .circleci/; the branch's own code (.nvmrc, packageManager, lockfile, build scripts,
# tests) still runs, which is the point, and the protection is that the jobs read no secrets.
# This repo and its CircleCI builds are public: the jobs store test results only, no artifacts.
# RT-1036 adds remote-dev-backend-fast, remote-dev-admin, remote-dev-admin-e2e and remote-dev-pos
# with the same guard.
# Not covered remotely: POS Windows packaging and Electron e2e, and the ERPNext Connector.

version: 2.1

parameters:
  # RT-1059: TEMPORARY PAUSE of the automatic advisory workflow (backend-api-jest and
  # backend-api-jest-analysis) while CircleCI support case #151821496 investigates a
  # false-negative in Smarter Testing TIA full-test-run-paths seen across PR #221 (RT-1047).
  # Default false: ordinary push and PR pipelines schedule no advisory job. GitHub Actions stays
  # the only gate, and the manual remote_suite, tia_probe and full_tia_analysis workflows are
  # unchanged. To run advisory deliberately, set this true on a manual pipeline (on main this
  # also schedules backend-api-jest-analysis, which spends credits).
  # Re-enable (rollback): set the default to true, or revert the RT-1059 commit. A vendor reply
  # is a review trigger only: resume after the owner approves, once the root cause and the
  # selection safety are independently verified.
  advisory_enabled:
    type: boolean
    default: false
  # RT-920 comment 14318 option 1: set true only on a manual pipeline on main (web app,
  # Trigger Pipeline, Add parameter) to finish the first impact analysis in one go. It runs
  # the tia-full-analysis workflow INSTEAD of advisory. false (every push and PR) leaves the
  # advisory workflow to its own advisory_enabled gate (RT-1059: paused by default).
  full_tia_analysis:
    type: boolean
    default: false
  # RT-920: set true only on a manual pipeline on main to run the tia-probe workflow INSTEAD of
  # advisory. It analyzes nothing: it prints which impact data the CLI finds and how many test
  # atoms are still new, so the data saved by an earlier analysis can be checked before any
  # more credits go into analysis. false (every push and PR) leaves advisory to its own
  # advisory_enabled gate (RT-1059: paused by default).
  tia_probe:
    type: boolean
    default: false
  # RT-981: set only on a manual pipeline for a pushed feature branch, together with
  # remote_expected_sha. api runs the api Jest suite (as bc/db-integration, without coverage);
  # db-package runs the db and worker suites (as bc/db-package). RT-1036: backend-fast runs the
  # Backend-Core build, static checks and Docker-free tests (as bc/fast), admin the Admin Console
  # checks and unit tests (as admin/build-test), admin-e2e its Playwright suite (as admin/e2e),
  # pos the POS static checks and vitest suite (as pos/static and pos/test). none (every push and
  # PR) leaves advisory to its own advisory_enabled gate (RT-1059: paused by default).
  remote_suite:
    type: enum
    enum: [none, api, db-package, backend-fast, admin, admin-e2e, pos]
    default: none
  # RT-981: the full 40-character commit SHA the owner expects the branch to be at. The remote
  # job refuses to run on any other commit.
  remote_expected_sha:
    type: string
    default: ""

commands:
  backend-setup:
    description: Node, pnpm, dependencies, the workspaces the api tests import, and Postgres.
    steps:
      # Same toolchain source as the repo: Node from the root .nvmrc (RT-923: one .nvmrc for
      # every product), pnpm from Backend-Core's packageManager.
      - run:
          name: Node from the root .nvmrc, pnpm from packageManager
          working_directory: ~/project/services/backend-core
          command: |
            node_version="$(tr -d '[:space:]' < ~/project/.nvmrc)"
            [ -n "$node_version" ] || { echo "The root .nvmrc is empty."; exit 1; }
            nvm install "$node_version"
            # Every `run` step is a fresh shell: put Node's bin dir (with the corepack shims) on PATH.
            node_bin="$(dirname "$(nvm which "$node_version")")"
            [ -x "$node_bin/node" ] || { echo "nvm gave no node binary for $node_version ($node_bin)."; exit 1; }
            echo "export PATH=\"$node_bin:\$PATH\"" >> "$BASH_ENV"
            export PATH="$node_bin:$PATH"
            corepack enable
            corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
            echo "nproc=$(nproc)"
            node --version
            pnpm --version
      - run:
          name: Install dependencies
          working_directory: ~/project/services/backend-core
          command: pnpm install --frozen-lockfile --ignore-scripts
      - run:
          name: Build the workspaces the api tests import (as bc/db-integration)
          working_directory: ~/project/services/backend-core
          command: >-
            pnpm --filter @data-pulse-2/shared --filter @data-pulse-2/auth
            --filter @data-pulse-2/db --filter @data-pulse-2/worker run build
      - run:
          name: Pre-pull postgres:16-alpine
          command: docker pull postgres:16-alpine

  # RT-981: runs before anything is installed, so a failed check costs about a minute.
  remote-guard:
    description: Stop unless HEAD is the expected commit on a feature branch with main's .circleci/.
    steps:
      - run:
          name: "Remote run guard: expected SHA, not main, .circleci/ equal to origin/main"
          environment:
            EXPECTED_SHA: "<< pipeline.parameters.remote_expected_sha >>"
            PIPELINE_REVISION: "<< pipeline.git.revision >>"
          command: |
            # Bash =~ anchors the whole string, so a value with a newline or shell text fails too.
            if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "remote_expected_sha must be the full 40-character lowercase commit SHA; refusing to run."
              exit 1
            fi
            head="$(git rev-parse HEAD)"
            if [ "$head" != "$EXPECTED_SHA" ] || [ "$PIPELINE_REVISION" != "$EXPECTED_SHA" ] \
              || [ "${CIRCLE_SHA1:-}" != "$EXPECTED_SHA" ]; then
              echo "Checked out $head (pipeline revision '$PIPELINE_REVISION', CIRCLE_SHA1 '${CIRCLE_SHA1:-}'), expected $EXPECTED_SHA; refusing to run."
              exit 1
            fi
            if [ -z "${CIRCLE_BRANCH:-}" ] || [ "$CIRCLE_BRANCH" = "main" ]; then
              echo "Remote runs are for pushed feature branches only (branch '${CIRCLE_BRANCH:-}'); refusing to run."
              exit 1
            fi
            git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main \
              || { echo "Could not fetch origin/main; refusing to run."; exit 1; }
            # With config and checkout from the same branch (see the header), an equal .circleci/
            # means the compiled config is main's. --quiet exits 1 on a difference; anything
            # non-zero refuses.
            rc=0
            git diff --quiet refs/remotes/origin/main HEAD -- .circleci/ || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo ".circleci/ differs from origin/main (git diff rc=$rc). Remote runs use main's CI config only: merge origin/main without changing .circleci/, push, and trigger again."
              exit 1
            fi
            echo "Guard passed: $head on $CIRCLE_BRANCH; .circleci/ equals origin/main $(git rev-parse --short refs/remotes/origin/main)."

  # RT-1036: Node from the root .nvmrc for a product directory, as backend-setup does for
  # Backend-Core; pnpm through corepack when the product's package.json names a packageManager
  # (Admin Console), npm from Node otherwise (POS).
  node-toolchain:
    description: Node from the root .nvmrc, and the product's package manager, on PATH.
    parameters:
      app_dir:
        type: string
    steps:
      - run:
          name: Node from the root .nvmrc, package manager from << parameters.app_dir >>
          working_directory: ~/project/<< parameters.app_dir >>
          command: |
            node_version="$(tr -d '[:space:]' < ~/project/.nvmrc)"
            [ -n "$node_version" ] || { echo "The root .nvmrc is empty."; exit 1; }
            nvm install "$node_version"
            node_bin="$(dirname "$(nvm which "$node_version")")"
            [ -x "$node_bin/node" ] || { echo "nvm gave no node binary for $node_version ($node_bin)."; exit 1; }
            echo "export PATH=\"$node_bin:\$PATH\"" >> "$BASH_ENV"
            export PATH="$node_bin:$PATH"
            pm="$(node -p "require('./package.json').packageManager || ''")"
            if [ -n "$pm" ]; then
              corepack enable
              corepack prepare "$pm" --activate
              echo "package manager: $pm"
            else
              echo "package manager: npm $(npm --version)"
            fi
            echo "nproc=$(nproc)"
            node --version

jobs:
  backend-api-jest:
    machine:
      image: ubuntu-2404:2026.05.1
    # large = 4 vCPU, the size of GitHub's public-repo runner, so timings compare like for like.
    resource_class: large
    steps:
      - checkout
      # Credit guard: most PRs do not touch Backend-Core. Fails open (runs the suite) when the
      # base cannot be resolved, so a git problem never hides the lane.
      - run:
          name: Stop unless Backend-Core, .circleci or the root .nvmrc changed
          command: |
            if ! git fetch --quiet origin main; then
              echo "Could not fetch origin/main; running the suite."
              exit 0
            fi
            # Pushes to main always run: a GitHub App project has no pipeline.git.base_revision,
            # and the tip commit alone would miss earlier commits of a multi-commit push.
            if [ "${CIRCLE_BRANCH:-}" = "main" ]; then
              echo "Push to main; running the suite."
              exit 0
            fi
            base="$(git merge-base origin/main HEAD)" || { echo "No merge-base; running the suite."; exit 0; }
            # No pipe into grep: under pipefail a SIGPIPE on a large diff would read as "no change".
            # --quiet exits 1 when the paths changed, 0 when not; anything else runs the suite.
            rc=0
            git diff --quiet "$base" HEAD -- services/backend-core/ .circleci/ .nvmrc || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "No Backend-Core, .circleci or .nvmrc change since $base; nothing to run."
              circleci-agent step halt
            else
              echo "Backend-Core, .circleci or .nvmrc changed since $base (git diff rc=$rc); running the suite."
            fi
      - backend-setup
      # Shadow mode, step 1: record the checks and the selection without letting either fail
      # the job. With no impact data yet, list-tests may fail, select nothing or fall back to
      # every spec; the report labels a failure, an empty selection and an all-spec selection
      # separately, and list-tests.log says which case it was. `timeout` keeps a hung call
      # (all output goes to files) from hitting no_output_timeout and failing the job.
      - run:
          name: "Impact analysis (shadow): doctor and the specs it would select"
          working_directory: ~/project/services/backend-core/apps/api
          command: |
            mkdir -p /tmp/tia
            rc=0
            timeout 300 circleci testsuite doctor "backend api jest" > /tmp/tia/doctor.log 2>&1 || rc=$?
            cat /tmp/tia/doctor.log
            echo "doctor exit code: $rc"
            # doctor runs a sample of specs through the suite's `run` command, which writes the
            # same Jest JSON and JUnit paths as the full run; drop them so a full run that dies
            # early can never be reported with the sample's results.
            rm -rf /tmp/api-jest.json /tmp/test-reports
            rc=0
            timeout 300 circleci testsuite list-tests "backend api jest" > /tmp/tia/selected.txt 2> /tmp/tia/list-tests.log || rc=$?
            echo "$rc" > /tmp/tia/list-tests.rc
            cat /tmp/tia/list-tests.log
            echo "list-tests exit code: $rc; $(wc -l < /tmp/tia/selected.txt) lines in selected.txt"
            # doctor writes .circleci/impact-doctor-<suite>.json into the checkout; specs that fence
            # `git status --porcelain` (030 T11) would fail on it. Keep it as evidence, outside git.
            find ~/project/.circleci -maxdepth 1 -name 'impact-doctor-*.json' -exec mv -t /tmp/tia {} + \
              || echo "could not move the doctor's impact file out of the checkout"
            echo "changes left in the checkout (git status --porcelain, as the 030 T11 fence):"
            git -C ~/project status --porcelain
            # The suite size, so the report can tell a full run from a failed-only rerun
            # ("Rerun workflow from failed" reruns only the failed specs).
            node_modules/.bin/jest --listTests | wc -l > /tmp/tia/discovered.count \
              || echo "could not count the suite's specs"
      # Shadow mode, step 2: the FULL suite, every branch. --analyze-tests=none because the
      # default branch would otherwise also run LCOV analysis here; that is the analysis job's.
      - run:
          name: API Jest through circleci testsuite (full suite)
          working_directory: ~/project/services/backend-core/apps/api
          no_output_timeout: 40m
          environment:
            # As bc/db-integration: the full api suite needs more than V8's default heap.
            NODE_OPTIONS: --max-old-space-size=4096
          command: circleci testsuite run "backend api jest" --run-tests=all --analyze-tests=none
      # Always, so a red run (where a miss can happen) is still measured. Never fails the job.
      # Reads every report in /tmp/test-reports: the CLI numbers outputs.junit per run
      # (backend-api-jest-1.xml), and the doctor step clears doctor's reports from there.
      - run:
          name: "Impact analysis (shadow): selection ratio and misses"
          when: always
          command: >-
            node .circleci/scripts/tia-shadow-report.cjs /tmp/tia/selected.txt
            /tmp/test-reports /tmp/tia
            ~/project/services/backend-core/apps/api
      - store_test_results:
          path: /tmp/test-reports
      - store_artifacts:
          path: /tmp/tia
          destination: tia

  # Builds impact data on main only: LCOV analysis of the specs whose data is stale, capped by
  # test-analysis-duration (30 min) per run, so the first full analysis spreads over merges.
  # Runs no tests for the record (--run-tests=none) and nothing waits on it.
  backend-api-jest-analysis:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - backend-setup
      - run:
          name: Impact analysis of the API Jest suite (LCOV, one spec at a time)
          working_directory: ~/project/services/backend-core/apps/api
          no_output_timeout: 60m
          environment:
            NODE_OPTIONS: --max-old-space-size=4096
          command: circleci testsuite run "backend api jest" --run-tests=none

  # One link of the manual full-analysis chain: the analysis job above with a hard stop.
  # Analysis saves impact data at the end of each run and the next run continues from it
  # (run 3f86178c: "589 new test atoms"), so 30-minute links add up. test-analysis-duration
  # stays 30 (test-suites.yml is shared with the job above) and the links run one after
  # another: two analysis runs that overlap pick the same atoms (runs e1ad1bed and 9aa8bf5a
  # both analyzed the first ~88), and the docs do not say analysis splits across parallel
  # nodes. `timeout` only ends a hung link (SIGKILL 2 min after SIGTERM, in case Jest children
  # hold the step open); the CLI itself stops after the current spec once 30 minutes have
  # passed. A killed link saves nothing; the next link repeats its specs.
  # Observed in pipeline 43 (RT-920 comment 14329 and the follow-up): links of ONE pipeline do
  # not add up. All 10 found the impact data of pipeline 42, patched version 43 and analyzed the
  # same first ~88 specs. Run the tia-probe workflow before using this chain again.
  backend-api-jest-full-analysis:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - backend-setup
      - run:
          name: Impact analysis of the API Jest suite, one 30-minute link (hard stop 50 min)
          working_directory: ~/project/services/backend-core/apps/api
          no_output_timeout: 20m
          environment:
            NODE_OPTIONS: --max-old-space-size=4096
          command: timeout -k 2m 50m circleci testsuite run "backend api jest" --run-tests=none

  # Read-only look at the saved impact data. `--run-tests=none --analyze-tests=none` runs the
  # selection step only: discover, find the latest impact data, count new, impacted and stale
  # atoms. Nothing is analyzed and no test runs, so it costs about a minute of a large machine
  # (about 20 credits; every discovered atom still counts toward the plan allowance). The
  # guard fails the job if the CLI starts an analysis anyway, so this job can never spend
  # analysis credits.
  backend-api-jest-tia-probe:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - backend-setup
      - run:
          name: Impact data probe (selection only, no analysis, no tests)
          working_directory: ~/project/services/backend-core/apps/api
          no_output_timeout: 10m
          command: |
            circleci testsuite run "backend api jest" --run-tests=none --analyze-tests=none 2>&1 | tee /tmp/tia-probe.log
            echo "--- probe summary ---"
            grep -E 'Discovered|Found test impact|impact-key|new test atoms|impacted by|failed previously|no source file|Selected|Patching' /tmp/tia-probe.log || true
            # No result is a failure, never a green probe: both lines below are what it is for.
            # (--run-tests=none still runs selection: pipeline 43 logged both with it.)
            for line in '^Found test impact generated by: ' '^- [0-9]+ new test atoms$'; do
              grep -qE "$line" /tmp/tia-probe.log || { echo "Probe result missing: no line matching $line"; exit 1; }
            done
            if grep -qE '^(Analyzing [0-9]+ test atoms|Running impact analysis for)' /tmp/tia-probe.log; then
              echo "The probe started an analysis; failing so no analysis credits are spent unnoticed."
              exit 1
            fi

  # RT-981: the api suite for a pushed feature branch, as bc/db-integration but without
  # --coverage (GitHub enforces the coverage floors). Plain Jest, not `circleci testsuite`: no
  # test atoms, no impact data, no shadow report, so RT-920's measurements are untouched.
  remote-api-jest:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - remote-guard
      - backend-setup
      - run:
          name: API Jest, full suite (remote, advisory)
          working_directory: ~/project/services/backend-core/apps/api
          no_output_timeout: 10m
          environment:
            NODE_OPTIONS: --max-old-space-size=4096
          command: |
            mkdir -p /tmp/remote /tmp/test-reports
            rc=0
            timeout -k 2m 20m node_modules/.bin/jest --forceExit --json --outputFile=/tmp/remote/api-jest.json || rc=$?
            node ~/project/.circleci/scripts/jest-json-to-junit.cjs /tmp/remote/api-jest.json /tmp/test-reports/remote-api-jest.xml "$PWD" || rc=1
            exit $rc
      - store_test_results:
          path: /tmp/test-reports

  # RT-981: the db and worker suites for a pushed feature branch, as bc/db-package
  # (WORKER_INCLUDE_DB_TESTS=1 adds the Testcontainers outbox suites). One step, so both suites
  # run and the job fails if either does.
  remote-db-package:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - remote-guard
      - backend-setup
      - run:
          name: db and worker Jest with Testcontainers (remote, advisory)
          working_directory: ~/project/services/backend-core
          no_output_timeout: 10m
          command: |
            mkdir -p /tmp/remote /tmp/test-reports
            rc=0
            for pkg in packages/db apps/worker; do
              name="$(basename "$pkg")"
              # Only apps/worker/jest.config.cjs reads WORKER_INCLUDE_DB_TESTS.
              ( cd "$pkg" && WORKER_INCLUDE_DB_TESTS=1 timeout -k 2m 20m node_modules/.bin/jest --json --outputFile="/tmp/remote/$name-jest.json" ) || rc=1
              node ~/project/.circleci/scripts/jest-json-to-junit.cjs "/tmp/remote/$name-jest.json" "/tmp/test-reports/remote-$name-jest.xml" "$PWD/$pkg" || rc=1
            done
            exit $rc
      - store_test_results:
          path: /tmp/test-reports

  # RT-1036: the Backend-Core build, static checks and Docker-free tests for a pushed feature
  # branch, as bc/fast. lint is a --noEmit typecheck that resolves sibling workspaces through
  # their built dist/, so the build runs first. As in remote-admin, the test step runs after
  # failed checks only if the install finished.
  remote-backend-fast:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - remote-guard
      - node-toolchain:
          app_dir: services/backend-core
      - run:
          name: Install (Backend-Core)
          working_directory: ~/project/services/backend-core
          command: |
            timeout -k 1m 10m pnpm install --frozen-lockfile --ignore-scripts
            mkdir -p /tmp/remote && touch /tmp/remote/installed
      - run:
          name: Build, static checks and rule specs (remote, advisory; 15 min budget)
          working_directory: ~/project/services/backend-core
          no_output_timeout: 10m
          command: |
            # One wall-clock budget for the whole step: each command gets only what is left.
            deadline=$((SECONDS + 15 * 60))
            bounded() { left=$((deadline - SECONDS)); [ "$left" -gt 0 ] || { echo "Step budget used up before: $*"; return 124; }; timeout -k 1m "$left" "$@"; }
            rc=0
            bounded pnpm -r run build || rc=1
            bounded pnpm lint || rc=1
            bounded pnpm lint:eslint || rc=1
            bounded pnpm typecheck || rc=1
            bounded node --test tools/eslint-rules/__tests__/no-unscoped-tenant-query.spec.js || rc=1
            bounded node --test tools/oasdiff/__tests__/consumer-impact.spec.mjs || rc=1
            exit $rc
      - run:
          name: worker (Docker-free), shared and auth tests (remote, advisory; 10 min budget)
          when: always
          working_directory: ~/project/services/backend-core
          no_output_timeout: 10m
          command: |
            [ -f /tmp/remote/installed ] || { echo "Install did not complete; no tests run."; exit 1; }
            deadline=$((SECONDS + 10 * 60))
            bounded() { left=$((deadline - SECONDS)); [ "$left" -gt 0 ] || { echo "Step budget used up before: $*"; return 124; }; timeout -k 1m "$left" "$@"; }
            rc=0
            for pkg in worker shared auth; do
              bounded pnpm --filter "@data-pulse-2/$pkg" test || rc=1
            done
            exit $rc

  # RT-1036: the Admin Console checks and unit tests for a pushed feature branch, as
  # admin/build-test without its parity manifest and Sonar upload. The checks step records every
  # failure and the test step still runs after it, so one run reports both; the test step runs
  # only if the install finished, which happens only after the guard passed.
  remote-admin:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - remote-guard
      - node-toolchain:
          app_dir: apps/admin-console
      - run:
          name: Install (Admin Console)
          working_directory: ~/project/apps/admin-console
          command: |
            timeout -k 1m 10m pnpm install --frozen-lockfile --ignore-scripts
            mkdir -p /tmp/remote && touch /tmp/remote/installed
      - run:
          name: API client drift, build and lint (remote, advisory; 15 min budget)
          working_directory: ~/project/apps/admin-console
          no_output_timeout: 10m
          command: |
            deadline=$((SECONDS + 15 * 60))
            bounded() { left=$((deadline - SECONDS)); [ "$left" -gt 0 ] || { echo "Step budget used up before: $*"; return 124; }; timeout -k 1m "$left" "$@"; }
            rc=0
            # generate:client reads the pinned contract sources with `git show <pin>:<path>`;
            # CircleCI's checkout is a full clone, so the pin commit is present.
            bounded pnpm generate:client || rc=1
            git diff --exit-code --stat src/generated/ \
              || { echo "API client drift: src/generated/ differs from a regeneration at the pinned Backend-Core commit."; rc=1; }
            bounded pnpm build || rc=1
            bounded pnpm lint || rc=1
            exit $rc
      - run:
          name: Admin Console vitest with coverage (remote, advisory)
          when: always
          working_directory: ~/project/apps/admin-console
          no_output_timeout: 10m
          command: |
            [ -f /tmp/remote/installed ] || { echo "Install did not complete; no tests run."; exit 1; }
            mkdir -p /tmp/test-reports
            timeout -k 1m 15m pnpm exec vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=/tmp/test-reports/remote-admin-vitest.xml
      - store_test_results:
          path: /tmp/test-reports

  # RT-1036: the Admin Console Playwright suite for a pushed feature branch, as admin/e2e.
  # CircleCI sets CI=true, so retries (2), forbidOnly and the JSON report behave as on GitHub;
  # the last step lists retried tests, as admin/e2e's two retry-report steps do, so a pass on
  # retry is never a silent green.
  # The suite runs inside the same digest-pinned Playwright image as admin/e2e, read from
  # admin-console.yml at run time, so there is no second pin to drift. The console ships no web
  # font, so its text renders in fontconfig's system-ui / sans-serif pick. The full machine
  # image has more fonts than the Playwright image, and its wider fallback face failed three
  # layout specs that pass on GitHub (canary #417, RT-1036 comment 14899). Install and build
  # still run on the VM. The container gets the VM's .nvmrc Node and pnpm (as setup-node does on
  # GitHub) and runs as the VM user, so the report step can still write next to its output.
  remote-admin-e2e:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - remote-guard
      - node-toolchain:
          app_dir: apps/admin-console
      - run:
          name: Install (Admin Console)
          working_directory: ~/project/apps/admin-console
          command: timeout -k 1m 10m pnpm install --frozen-lockfile --ignore-scripts
      - run:
          name: Build
          working_directory: ~/project/apps/admin-console
          command: timeout -k 1m 10m pnpm build
      - run:
          name: Pull admin/e2e's Playwright image (checked against the lockfile)
          working_directory: ~/project
          no_output_timeout: 10m
          command: |
            # The same pin check as admin/e2e's first step: one digest-pinned image, at the
            # Playwright version the lockfile resolves.
            wf=.github/workflows/admin-console.yml
            lock=apps/admin-console/pnpm-lock.yaml
            mapfile -t images < <(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+-noble@sha256:[0-9a-f]{64}' "$wf" | sort -u)
            if [ "${#images[@]}" -ne 1 ]; then
              echo "Expected one digest-pinned mcr.microsoft.com/playwright:vX.Y.Z-noble image in $wf, found ${#images[@]}."
              exit 1
            fi
            image_version=$(sed -E 's/^[^:]+:v([0-9.]+)-noble@.*$/\1/' <<< "${images[0]}")
            mapfile -t locked < <(grep -oE "^  '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+':" "$lock" | sed -E "s/^.*@([0-9.]+)':$/\1/" | sort -u)
            if [ "${#locked[@]}" -ne 1 ] || [ "${locked[0]}" != "$image_version" ]; then
              echo "$lock resolves @playwright/test to '${locked[*]:-none}' but $wf pins the image for $image_version."
              exit 1
            fi
            timeout -k 1m 10m docker pull --quiet "${images[0]}"
            printf '%s\n' "${images[0]}" > /tmp/playwright-image
            # Font evidence: what the console's system-ui / sans-serif fallback resolves to.
            fonts='echo "system-ui: $(fc-match system-ui)"; echo "sans-serif: $(fc-match sans-serif)"; echo "sans-serif:lang=ar: $(fc-match sans-serif:lang=ar)"; echo "font files: $(fc-list | wc -l)"'
            echo "VM:"; bash -c "$fonts" || true
            echo "Image ${images[0]}:"; docker run --rm "${images[0]}" bash -c "$fonts" || true
      - run:
          name: Admin Console Playwright E2E (remote, advisory)
          working_directory: ~/project/apps/admin-console
          no_output_timeout: 10m
          command: |
            # The marker exists only on this VM and only once the guard, install and build have
            # passed, so the report step below never runs branch code after a failed guard.
            touch /tmp/e2e-started
            node_dir="$(dirname "$(dirname "$(command -v node)")")"
            corepack_home="${COREPACK_HOME:-${XDG_CACHE_HOME:-$HOME/.cache}/node/corepack}"
            # The inner timeout stops the suite; the outer one is a backstop for the container.
            timeout -k 1m 22m docker run --rm --init --ipc=host \
              --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI \
              -e COREPACK_HOME="$corepack_home" -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
              -v "$node_dir:$node_dir:ro" -v "$corepack_home:$corepack_home" \
              -v "$HOME/project:$HOME/project" -w "$PWD" \
              "$(cat /tmp/playwright-image)" \
              bash -c "export PATH=\"$node_dir/bin:\$PATH\"; node --version; timeout -k 1m 20m pnpm test:e2e"
      - run:
          name: Report E2E retries
          when: always
          working_directory: ~/project/apps/admin-console
          command: |
            if [ ! -f /tmp/e2e-started ] || [ ! -f playwright-report/e2e-results.json ]; then
              echo "The E2E tests did not run or wrote no JSON report (see the earlier steps)."
              exit 0
            fi
            node .github/scripts/report-flaky-e2e.mjs || echo "report-flaky-e2e.mjs failed; the counts below still apply."
            [ -f playwright-report/e2e-retries.md ] && cat playwright-report/e2e-retries.md
            node -e '
              const r = JSON.parse(require("node:fs").readFileSync("playwright-report/e2e-results.json", "utf8"));
              const tests = [];
              const visit = (s) => { for (const sp of s.specs ?? []) for (const t of sp.tests ?? []) tests.push(t); for (const c of s.suites ?? []) visit(c); };
              for (const s of r.suites ?? []) visit(s);
              const by = {};
              for (const t of tests) by[t.status] = (by[t.status] ?? 0) + 1;
              const retries = tests.reduce((n, t) => n + Math.max(0, (t.results ?? []).length - 1), 0);
              console.log(`tests ${tests.length}: expected ${by.expected ?? 0}, flaky ${by.flaky ?? 0}, unexpected ${by.unexpected ?? 0}, skipped ${by.skipped ?? 0}; retry attempts ${retries}`);
            '

  # RT-1036: the POS static checks and vitest suite for a pushed feature branch, as pos/static and
  # pos/test. One unsharded run with the unmodified vitest.config.ts, so the coverage thresholds
  # are evaluated once, on the whole suite, as the merge job does. The guard already fetched
  # origin/main, which the source-scope guard test diffs against (GitHub fetches it at depth 1;
  # the triple-dot diff works here because CircleCI's checkout is a full clone). As in remote-admin, the test
  # step runs after failed static checks only if the install finished.
  remote-pos:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - remote-guard
      - node-toolchain:
          app_dir: apps/pos
      - run:
          name: Install (POS, no lifecycle scripts)
          working_directory: ~/project/apps/pos
          command: |
            timeout -k 1m 10m npm ci --ignore-scripts
            mkdir -p /tmp/remote && touch /tmp/remote/installed
      - run:
          name: POS static checks (remote, advisory; 15 min budget)
          working_directory: ~/project/apps/pos
          no_output_timeout: 10m
          command: |
            deadline=$((SECONDS + 15 * 60))
            bounded() { left=$((deadline - SECONDS)); [ "$left" -gt 0 ] || { echo "Step budget used up before: $*"; return 124; }; timeout -k 1m "$left" "$@"; }
            rc=0
            bounded npm test -- tests/contract/backend-core || rc=1
            bounded npm run codegen:verify || rc=1
            bounded npm run build:renderer || rc=1
            bounded npm run typecheck || rc=1
            bounded npm run lint || rc=1
            bounded node scripts/check-index-size.mjs || rc=1
            exit $rc
      - run:
          name: POS vitest with coverage, whole suite (remote, advisory)
          when: always
          working_directory: ~/project/apps/pos
          no_output_timeout: 10m
          command: |
            [ -f /tmp/remote/installed ] || { echo "Install did not complete; no tests run."; exit 1; }
            mkdir -p /tmp/test-reports
            timeout -k 1m 30m npm test -- --coverage --exclude 'tests/contract/backend-core/**' --reporter=default --reporter=junit --outputFile.junit=/tmp/test-reports/remote-pos-vitest.xml
      - store_test_results:
          path: /tmp/test-reports

workflows:
  # RT-1059: paused by default, see the advisory_enabled parameter above.
  advisory:
    when:
      and:
        - << pipeline.parameters.advisory_enabled >>
        - not:
            or:
              - << pipeline.parameters.full_tia_analysis >>
              - << pipeline.parameters.tia_probe >>
              - not:
                  equal: [none, << pipeline.parameters.remote_suite >>]
    jobs:
      - backend-api-jest
      - backend-api-jest-analysis:
          filters:
            branches:
              only: main

  # Manual, main only: up to 10 links x 30 min = about 880 specs, enough for the 589 not yet
  # analyzed (677 in all, about 88 per link) with room for a lost link or two. A link that finds
  # nothing left to analyze ends in about a minute. A failed link (a hung or failing spec) does not stop the chain; cancelling the
  # workflow stops it. Do not run two at once: overlapping analysis repeats the same specs.
  tia-full-analysis:
    when:
      and:
        - << pipeline.parameters.full_tia_analysis >>
        - equal: [main, << pipeline.git.branch >>]
        - equal: [none, << pipeline.parameters.remote_suite >>]
    jobs:
      - backend-api-jest-full-analysis:
          name: full-analysis-1
      - backend-api-jest-full-analysis:
          name: full-analysis-2
          requires:
            - full-analysis-1: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-3
          requires:
            - full-analysis-2: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-4
          requires:
            - full-analysis-3: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-5
          requires:
            - full-analysis-4: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-6
          requires:
            - full-analysis-5: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-7
          requires:
            - full-analysis-6: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-8
          requires:
            - full-analysis-7: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-9
          requires:
            - full-analysis-8: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-10
          requires:
            - full-analysis-9: [success, failed]

  # Manual, main only: one probe job. Run it after an analysis pipeline has finished, read the
  # "new test atoms" line, and only then decide on more analysis (RT-920). It ignores
  # tia_probe when full_tia_analysis is also true, so the two never run together.
  tia-probe:
    when:
      and:
        - << pipeline.parameters.tia_probe >>
        - not: << pipeline.parameters.full_tia_analysis >>
        - equal: [main, << pipeline.git.branch >>]
        - equal: [none, << pipeline.parameters.remote_suite >>]
    jobs:
      - backend-api-jest-tia-probe

  # RT-981: manual, owner-triggered, feature branches only, never together with the TIA
  # parameters. serial-group keeps remote runs of this project one at a time.
  remote-dev-api:
    when:
      and:
        - equal: [api, << pipeline.parameters.remote_suite >>]
        - not:
            equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.parameters.full_tia_analysis >>
        - not: << pipeline.parameters.tia_probe >>
    jobs:
      - remote-api-jest:
          serial-group: << pipeline.project.slug >>/remote-dev

  remote-dev-db-package:
    when:
      and:
        - equal: [db-package, << pipeline.parameters.remote_suite >>]
        - not:
            equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.parameters.full_tia_analysis >>
        - not: << pipeline.parameters.tia_probe >>
    jobs:
      - remote-db-package:
          serial-group: << pipeline.project.slug >>/remote-dev

  # RT-1036: as the two RT-981 workflows above.
  remote-dev-backend-fast:
    when:
      and:
        - equal: [backend-fast, << pipeline.parameters.remote_suite >>]
        - not:
            equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.parameters.full_tia_analysis >>
        - not: << pipeline.parameters.tia_probe >>
    jobs:
      - remote-backend-fast:
          serial-group: << pipeline.project.slug >>/remote-dev

  remote-dev-admin:
    when:
      and:
        - equal: [admin, << pipeline.parameters.remote_suite >>]
        - not:
            equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.parameters.full_tia_analysis >>
        - not: << pipeline.parameters.tia_probe >>
    jobs:
      - remote-admin:
          serial-group: << pipeline.project.slug >>/remote-dev

  remote-dev-admin-e2e:
    when:
      and:
        - equal: [admin-e2e, << pipeline.parameters.remote_suite >>]
        - not:
            equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.parameters.full_tia_analysis >>
        - not: << pipeline.parameters.tia_probe >>
    jobs:
      - remote-admin-e2e:
          serial-group: << pipeline.project.slug >>/remote-dev

  remote-dev-pos:
    when:
      and:
        - equal: [pos, << pipeline.parameters.remote_suite >>]
        - not:
            equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.parameters.full_tia_analysis >>
        - not: << pipeline.parameters.tia_probe >>
    jobs:
      - remote-pos:
          serial-group: << pipeline.project.slug >>/remote-dev
