# RT-920 (CI Modernization Execution Plan v2, Phase 3): advisory CircleCI lane.
#
# NOT a gate. GitHub Actions and gate.yml stay the only CI of record: the gate trusts only
# the GitHub Actions app (graph.yaml trusted_check_producer), so nothing here can make
# `required` green or red. This lane runs the Backend-Core API Jest suite through CircleCI
# Smarter Testing (`circleci testsuite`, suite in .circleci/test-suites.yml) to collect test
# timings and Test Insights.
#
# Test impact analysis runs in SHADOW mode (PR-4b, RT-920 comment 14285): the test job always
# runs the full suite and only records which specs impact analysis would have selected, then
# reports the selection ratio and any failing spec it would have skipped (a miss). Impact data
# is built by the separate analysis job on main. Nothing is ever skipped. A manual pipeline on
# main with full_tia_analysis=true runs only the tia-full-analysis workflow, which finishes
# that analysis in one go (RT-920 comment 14318 option 1).
#
# No secrets, no contexts, no orbs. Machine executor: the api suite starts one
# postgres:16-alpine through Testcontainers, which needs a local Docker daemon
# (setup_remote_docker breaks getMappedPort(); RT-594).

version: 2.1

parameters:
  # RT-920 comment 14318 option 1: set true only on a manual pipeline on main (web app,
  # Trigger Pipeline, Add parameter) to finish the first impact analysis in one go. It runs
  # the tia-full-analysis workflow INSTEAD of advisory. false (every push and PR) leaves the
  # lane exactly as it was.
  full_tia_analysis:
    type: boolean
    default: false
  # RT-920: set true only on a manual pipeline on main to run the tia-probe workflow INSTEAD of
  # advisory. It analyzes nothing: it prints which impact data the CLI finds and how many test
  # atoms are still new, so the data saved by an earlier analysis can be checked before any
  # more credits go into analysis. false (every push and PR) leaves the lane as it was.
  tia_probe:
    type: boolean
    default: false

commands:
  backend-setup:
    description: Node, pnpm, dependencies, the workspaces the api tests import, and Postgres.
    steps:
      # Same toolchain source as the repo: Node from the root .nvmrc (RT-923: one .nvmrc for
      # every product), pnpm from Backend-Core's packageManager.
      - run:
          name: Node from the root .nvmrc, pnpm from packageManager
          working_directory: ~/project/services/backend-core
          command: |
            node_version="$(tr -d '[:space:]' < ~/project/.nvmrc)"
            [ -n "$node_version" ] || { echo "The root .nvmrc is empty."; exit 1; }
            nvm install "$node_version"
            # Every `run` step is a fresh shell: put Node's bin dir (with the corepack shims) on PATH.
            node_bin="$(dirname "$(nvm which "$node_version")")"
            [ -x "$node_bin/node" ] || { echo "nvm gave no node binary for $node_version ($node_bin)."; exit 1; }
            echo "export PATH=\"$node_bin:\$PATH\"" >> "$BASH_ENV"
            export PATH="$node_bin:$PATH"
            corepack enable
            corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
            echo "nproc=$(nproc)"
            node --version
            pnpm --version
      - run:
          name: Install dependencies
          working_directory: ~/project/services/backend-core
          command: pnpm install --frozen-lockfile --ignore-scripts
      - run:
          name: Build the workspaces the api tests import (as bc/db-integration)
          working_directory: ~/project/services/backend-core
          command: >-
            pnpm --filter @data-pulse-2/shared --filter @data-pulse-2/auth
            --filter @data-pulse-2/db --filter @data-pulse-2/worker run build
      - run:
          name: Pre-pull postgres:16-alpine
          command: docker pull postgres:16-alpine

jobs:
  backend-api-jest:
    machine:
      image: ubuntu-2404:2026.05.1
    # large = 4 vCPU, the size of GitHub's public-repo runner, so timings compare like for like.
    resource_class: large
    steps:
      - checkout
      # Credit guard: most PRs do not touch Backend-Core. Fails open (runs the suite) when the
      # base cannot be resolved, so a git problem never hides the lane.
      - run:
          name: Stop unless Backend-Core, .circleci or the root .nvmrc changed
          command: |
            if ! git fetch --quiet origin main; then
              echo "Could not fetch origin/main; running the suite."
              exit 0
            fi
            # Pushes to main always run: a GitHub App project has no pipeline.git.base_revision,
            # and the tip commit alone would miss earlier commits of a multi-commit push.
            if [ "${CIRCLE_BRANCH:-}" = "main" ]; then
              echo "Push to main; running the suite."
              exit 0
            fi
            base="$(git merge-base origin/main HEAD)" || { echo "No merge-base; running the suite."; exit 0; }
            # No pipe into grep: under pipefail a SIGPIPE on a large diff would read as "no change".
            # --quiet exits 1 when the paths changed, 0 when not; anything else runs the suite.
            rc=0
            git diff --quiet "$base" HEAD -- services/backend-core/ .circleci/ .nvmrc || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "No Backend-Core, .circleci or .nvmrc change since $base; nothing to run."
              circleci-agent step halt
            else
              echo "Backend-Core, .circleci or .nvmrc changed since $base (git diff rc=$rc); running the suite."
            fi
      - backend-setup
      # Shadow mode, step 1: record the checks and the selection without letting either fail
      # the job. With no impact data yet, list-tests may fail, select nothing or fall back to
      # every spec; the report labels a failure, an empty selection and an all-spec selection
      # separately, and list-tests.log says which case it was. `timeout` keeps a hung call
      # (all output goes to files) from hitting no_output_timeout and failing the job.
      - run:
          name: "Impact analysis (shadow): doctor and the specs it would select"
          working_directory: ~/project/services/backend-core/apps/api
          command: |
            mkdir -p /tmp/tia
            rc=0
            timeout 300 circleci testsuite doctor "backend api jest" > /tmp/tia/doctor.log 2>&1 || rc=$?
            cat /tmp/tia/doctor.log
            echo "doctor exit code: $rc"
            # doctor runs a sample of specs through the suite's `run` command, which writes the
            # same Jest JSON and JUnit paths as the full run; drop them so a full run that dies
            # early can never be reported with the sample's results.
            rm -rf /tmp/api-jest.json /tmp/test-reports
            rc=0
            timeout 300 circleci testsuite list-tests "backend api jest" > /tmp/tia/selected.txt 2> /tmp/tia/list-tests.log || rc=$?
            echo "$rc" > /tmp/tia/list-tests.rc
            cat /tmp/tia/list-tests.log
            echo "list-tests exit code: $rc; $(wc -l < /tmp/tia/selected.txt) lines in selected.txt"
            # doctor writes .circleci/impact-doctor-<suite>.json into the checkout; specs that fence
            # `git status --porcelain` (030 T11) would fail on it. Keep it as evidence, outside git.
            find ~/project/.circleci -maxdepth 1 -name 'impact-doctor-*.json' -exec mv -t /tmp/tia {} + \
              || echo "could not move the doctor's impact file out of the checkout"
            echo "changes left in the checkout (git status --porcelain, as the 030 T11 fence):"
            git -C ~/project status --porcelain
            # The suite size, so the report can tell a full run from a failed-only rerun
            # ("Rerun workflow from failed" reruns only the failed specs).
            node_modules/.bin/jest --listTests | wc -l > /tmp/tia/discovered.count \
              || echo "could not count the suite's specs"
      # Shadow mode, step 2: the FULL suite, every branch. --analyze-tests=none because the
      # default branch would otherwise also run LCOV analysis here; that is the analysis job's.
      - run:
          name: API Jest through circleci testsuite (full suite)
          working_directory: ~/project/services/backend-core/apps/api
          no_output_timeout: 40m
          environment:
            # As bc/db-integration: the full api suite needs more than V8's default heap.
            NODE_OPTIONS: --max-old-space-size=4096
          command: circleci testsuite run "backend api jest" --run-tests=all --analyze-tests=none
      # Always, so a red run (where a miss can happen) is still measured. Never fails the job.
      # Reads every report in /tmp/test-reports: the CLI numbers outputs.junit per run
      # (backend-api-jest-1.xml), and the doctor step clears doctor's reports from there.
      - run:
          name: "Impact analysis (shadow): selection ratio and misses"
          when: always
          command: >-
            node .circleci/scripts/tia-shadow-report.cjs /tmp/tia/selected.txt
            /tmp/test-reports /tmp/tia
            ~/project/services/backend-core/apps/api
      - store_test_results:
          path: /tmp/test-reports
      - store_artifacts:
          path: /tmp/tia
          destination: tia

  # Builds impact data on main only: LCOV analysis of the specs whose data is stale, capped by
  # test-analysis-duration (30 min) per run, so the first full analysis spreads over merges.
  # Runs no tests for the record (--run-tests=none) and nothing waits on it.
  backend-api-jest-analysis:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - backend-setup
      - run:
          name: Impact analysis of the API Jest suite (LCOV, one spec at a time)
          working_directory: ~/project/services/backend-core/apps/api
          no_output_timeout: 60m
          environment:
            NODE_OPTIONS: --max-old-space-size=4096
          command: circleci testsuite run "backend api jest" --run-tests=none

  # One link of the manual full-analysis chain: the analysis job above with a hard stop.
  # Analysis saves impact data at the end of each run and the next run continues from it
  # (run 3f86178c: "589 new test atoms"), so 30-minute links add up. test-analysis-duration
  # stays 30 (test-suites.yml is shared with the job above) and the links run one after
  # another: two analysis runs that overlap pick the same atoms (runs e1ad1bed and 9aa8bf5a
  # both analyzed the first ~88), and the docs do not say analysis splits across parallel
  # nodes. `timeout` only ends a hung link (SIGKILL 2 min after SIGTERM, in case Jest children
  # hold the step open); the CLI itself stops after the current spec once 30 minutes have
  # passed. A killed link saves nothing; the next link repeats its specs.
  # Observed in pipeline 43 (RT-920 comment 14329 and the follow-up): links of ONE pipeline do
  # not add up. All 10 found the impact data of pipeline 42, patched version 43 and analyzed the
  # same first ~88 specs. Run the tia-probe workflow before using this chain again.
  backend-api-jest-full-analysis:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - backend-setup
      - run:
          name: Impact analysis of the API Jest suite, one 30-minute link (hard stop 50 min)
          working_directory: ~/project/services/backend-core/apps/api
          no_output_timeout: 20m
          environment:
            NODE_OPTIONS: --max-old-space-size=4096
          command: timeout -k 2m 50m circleci testsuite run "backend api jest" --run-tests=none

  # Read-only look at the saved impact data. `--run-tests=none --analyze-tests=none` runs the
  # selection step only: discover, find the latest impact data, count new, impacted and stale
  # atoms. Nothing is analyzed and no test runs, so it costs about a minute of a large machine
  # (about 20 credits; every discovered atom still counts toward the plan allowance). The
  # guard fails the job if the CLI starts an analysis anyway, so this job can never spend
  # analysis credits.
  backend-api-jest-tia-probe:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - backend-setup
      - run:
          name: Impact data probe (selection only, no analysis, no tests)
          working_directory: ~/project/services/backend-core/apps/api
          no_output_timeout: 10m
          command: |
            circleci testsuite run "backend api jest" --run-tests=none --analyze-tests=none 2>&1 | tee /tmp/tia-probe.log
            echo "--- probe summary ---"
            grep -E 'Discovered|Found test impact|impact-key|new test atoms|impacted by|failed previously|no source file|Selected|Patching' /tmp/tia-probe.log || true
            # No result is a failure, never a green probe: both lines below are what it is for.
            # (--run-tests=none still runs selection: pipeline 43 logged both with it.)
            for line in '^Found test impact generated by: ' '^- [0-9]+ new test atoms$'; do
              grep -qE "$line" /tmp/tia-probe.log || { echo "Probe result missing: no line matching $line"; exit 1; }
            done
            if grep -qE '^(Analyzing [0-9]+ test atoms|Running impact analysis for)' /tmp/tia-probe.log; then
              echo "The probe started an analysis; failing so no analysis credits are spent unnoticed."
              exit 1
            fi

workflows:
  advisory:
    when:
      not:
        or:
          - << pipeline.parameters.full_tia_analysis >>
          - << pipeline.parameters.tia_probe >>
    jobs:
      - backend-api-jest
      - backend-api-jest-analysis:
          filters:
            branches:
              only: main

  # Manual, main only: up to 10 links x 30 min = about 880 specs, enough for the 589 not yet
  # analyzed (677 in all, about 88 per link) with room for a lost link or two. A link that finds
  # nothing left to analyze ends in about a minute. A failed link (a hung or failing spec) does not stop the chain; cancelling the
  # workflow stops it. Do not run two at once: overlapping analysis repeats the same specs.
  tia-full-analysis:
    when:
      and:
        - << pipeline.parameters.full_tia_analysis >>
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - backend-api-jest-full-analysis:
          name: full-analysis-1
      - backend-api-jest-full-analysis:
          name: full-analysis-2
          requires:
            - full-analysis-1: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-3
          requires:
            - full-analysis-2: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-4
          requires:
            - full-analysis-3: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-5
          requires:
            - full-analysis-4: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-6
          requires:
            - full-analysis-5: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-7
          requires:
            - full-analysis-6: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-8
          requires:
            - full-analysis-7: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-9
          requires:
            - full-analysis-8: [success, failed]
      - backend-api-jest-full-analysis:
          name: full-analysis-10
          requires:
            - full-analysis-9: [success, failed]

  # Manual, main only: one probe job. Run it after an analysis pipeline has finished, read the
  # "new test atoms" line, and only then decide on more analysis (RT-920). It ignores
  # tia_probe when full_tia_analysis is also true, so the two never run together.
  tia-probe:
    when:
      and:
        - << pipeline.parameters.tia_probe >>
        - not: << pipeline.parameters.full_tia_analysis >>
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - backend-api-jest-tia-probe
