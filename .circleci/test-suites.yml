# RT-920: CircleCI Smarter Testing suite for the Backend-Core API Jest tests (advisory lane;
# see config.yml). `circleci testsuite run "backend api jest"` runs from
# services/backend-core/apps/api, so every command below runs there and each test atom is a
# spec path relative to apps/api.
---
name: backend api jest
# Paths only: jest --listTests prints absolute paths, so drop the cwd prefix and sort.
discover: node_modules/.bin/jest --listTests | sed "s#^$PWD/##" | sort
# bc/db-integration's flags minus --coverage (GitHub enforces the coverage floors).
# --runTestsByPath takes exact paths, never a regex. The converter writes JUnit with a `file`
# attribute per spec for timing-based splitting. Jest's own exit code is kept, and a failed
# conversion also fails the run, so a broken suite can never report green. Both statuses are
# captured with `|| rc=`, so the JUnit report is still written when the shell runs with -e.
run: >-
  rc=0;
  node_modules/.bin/jest --runTestsByPath << test.atoms >> --forceExit --json --outputFile=/tmp/api-jest.json || rc=$?;
  node "$(git rev-parse --show-toplevel)/.circleci/scripts/jest-json-to-junit.cjs" /tmp/api-jest.json "<< outputs.junit >>" "$PWD" || rc=1;
  exit $rc
outputs:
  junit: /tmp/test-reports/backend-api-jest.xml
# RT-920 PR-4b: test impact analysis in SHADOW mode. The job always runs the full suite
# (--run-tests=all) and only records what impact analysis would have selected (list-tests);
# nothing is skipped. Impact data is built by the separate main-only analysis job in config.yml.
# One spec at a time with LCOV: Jest's lcovonly reporter writes lcov.info into the fresh
# directory the CLI makes for each atom. --coverageThreshold='{}' drops the global floors in
# jest.config.cjs, which a single spec file could never meet.
analysis: >-
  node_modules/.bin/jest --runTestsByPath << test.atoms >> --coverage --coverageReporters=lcovonly
  --coverageDirectory="<< outputs.lcov-directory >>" --coverageThreshold='{}' --forceExit
options:
  test-impact-analysis: true
  # Target minutes per analysis run on main; a full first analysis is spread across merges.
  test-analysis-duration: 30
  # Changes here select every spec. Coverage only sees apps/api/src/**: the shared, auth, db
  # and worker packages are imported as built dist/, and many specs read deploy/*.sh,
  # docs/operations/sql and the OpenAPI YAML directly. Known gap, left for the measurement to
  # show: specs also read other files (Caddyfile, docker-compose*.yml, CHANGELOG.md,
  # changelog.d/, tools/, contracts-compat/, two root workflows) and scan src/ as text; a change
  # there that breaks such a spec shows up as a miss in the shadow report.
  # RT-1047: the CLI expands each pattern from its working directory, apps/api, so ../../ is
  # services/backend-core and ../../../../ is the repo root; a pattern that matches no file is
  # dropped (RT-1045). `testsuite run` prints the expanded file list. The CLI does not recurse:
  # `**` matches only the files directly in its folder (CI job 4fe8a3d8), so each tree with
  # subfolders is one `*` per level, one level deeper than its tracked files go today (flat
  # folders and a package's own top-level files get one level); a file deeper than that, or
  # in a new top-level folder of a package, is not covered until a level is added here.
  # packages/ lists its tracked subtrees, never `packages/*/*/*`, which would also match the
  # gitignored dist/ and node_modules/ the build leaves there. .circleci/ is *.yml plus
  # scripts/: the PR job's doctor leaves an untracked impact-doctor-*.json there while
  # list-tests runs, and main's analysis never records it. Selection compares file hashes with
  # the impact data, and a full-run file with no stored hash counts as new and selects every
  # spec, so PRs select everything until a main analysis records these files' hashes.
  full-test-run-paths:
    - ../../../../.nvmrc
    - ../../../../.circleci/*.yml
    - ../../../../.circleci/scripts/*
    - ../../package.json
    - ../../pnpm-lock.yaml
    - ../../pnpm-workspace.yaml
    - ../../tsconfig*.json
    - jest.config.cjs
    - tsconfig*.json
    - test/_helpers/*
    - test/_helpers/*/*
    - ../../packages/*/*
    - ../../packages/*/src/*
    - ../../packages/*/src/*/*
    - ../../packages/*/src/*/*/*
    - ../../packages/*/src/*/*/*/*
    - ../../packages/*/__tests__/*
    - ../../packages/*/__tests__/*/*
    - ../../packages/*/__tests__/*/*/*
    - ../../packages/*/__tests__/*/*/*/*
    - ../../packages/contracts/openapi/*
    - ../../packages/contracts/openapi/*/*
    - ../../packages/contracts/openapi/*/*/*
    - ../../packages/db/drizzle/*
    - ../../packages/db/drizzle/*/*
    - ../../deploy/*
    - ../../deploy/*/*
    - ../../deploy/*/*/*
    - ../../deploy/*/*/*/*
    - ../../docs/*
    - ../../docs/*/*
    - ../../docs/*/*/*
    - ../../docs/*/*/*/*
    - ../../docs/*/*/*/*/*
