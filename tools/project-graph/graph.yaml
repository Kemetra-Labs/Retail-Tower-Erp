# Retail Tower project graph, schema v1 (RT-709 §A.1, §B.3, §B.5). RT-721 Substep A.
#
# Single source for CI job selection, the boundary check and the risk tiers.
# Globs are gitignore-style, anchored: shared-class globs at the repo root, tier
# globs at the product root. `*` does not cross `/`, `**` spans segments,
# `{a,b}` expands. Case-sensitive; paths are NFC-normalised.
#
# This file is in the `policy` class: any change to it is a policy change that
# needs SHA-bound human approval (A.4 / A.8 R1). YAML anchors, aliases and
# duplicate keys are rejected by the loader.

schema: retail-tower/project-graph@1

# Producer of every product check-run the gate may consume (A.8 R2).
# 15368 is the GitHub Actions app.
trusted_check_producer: { app_id: 15368, app_slug: github-actions }

# Every job the gate can require, and the root workflow that must define it
# (static rule 5). RT-867 (MR-4): the same selection also decides execution. Each
# root workflow starts with a `plan` job (base-branch evaluator) and every job here
# except `always_jobs` needs it and runs only if its key is selected; the jobs it
# needs are guarded on its key too. The plan-guard rule enforces this.
jobs:
  pos/static: .github/workflows/pos.yml
  pos/test-shard-1: .github/workflows/pos.yml
  pos/test-shard-2: .github/workflows/pos.yml
  pos/test-shard-3: .github/workflows/pos.yml
  pos/test: .github/workflows/pos.yml
  pos/package-windows: .github/workflows/pos.yml
  pos/docs: .github/workflows/pos.yml
  pos/e2e-electron: .github/workflows/pos.yml
  admin/build-test: .github/workflows/admin-console.yml
  admin/e2e: .github/workflows/admin-console.yml
  bc/fast: .github/workflows/backend-core.yml
  bc/db-integration: .github/workflows/backend-core.yml
  bc/db-package: .github/workflows/backend-core.yml
  bc/oasdiff: .github/workflows/backend-core.yml
  bc/contracts-compat: .github/workflows/backend-core.yml
  bc/schemathesis: .github/workflows/backend-core.yml
  connector/unit-tests-and-lint: .github/workflows/erpnext-connector.yml
  connector/bench: .github/workflows/erpnext-connector.yml
  e2e/smoke: .github/workflows/e2e.yml
  boundary-check: .github/workflows/project-graph.yml
  dependency-review: .github/workflows/project-graph.yml
  contracts/check: .github/workflows/contracts.yml

job_groups:
  pos-full: [pos/static, pos/test-shard-1, pos/test-shard-2, pos/test-shard-3, pos/test]
  # bc/contracts-compat (RT-863, MR-3): the POS compatibility matrix; release-backend-core.yml
  # requires its run on the release SHA.
  bc-full: [bc/fast, bc/db-integration, bc/db-package, bc/oasdiff, bc/contracts-compat, bc/schemathesis]

always_jobs: [boundary-check, dependency-review]
e2e_job: e2e/smoke
e2e_runs_when: any_product_selected

products:
  pos:
    root: apps/pos/
    toolchain: { manager: npm, lockfiles: [apps/pos/package-lock.json] }
    ci_jobs: [pos/static, pos/test-shard-1, pos/test-shard-2, pos/test-shard-3, pos/test, pos/package-windows, pos/docs, pos/e2e-electron]
    high_jobs: ["@pos-full", pos/package-windows]
    tiers:
      contracts:
        globs: [contracts/backend-core/**, "scripts/{codegen-api,verify-codegen,contracts-pin,contracts-repin}.ts", src/shared/api-types.ts, tests/contract/**, src/main/observability/__tests__/obs1-golden-vectors.json, src/main/observability/__tests__/rt879-redaction-vectors.json]
        jobs: [pos/static, "@pos-full", bc/oasdiff, contracts/check]
      money:
        globs: ["src/main/{payments,shift-cashup,drawer}/**", "src/shared/{payments,money,shift-cashup}/**", src/shared/money.ts, src/preload/shift-cashup.ts, "migrations/*payment*", "migrations/*cash*"]
        jobs: ["@pos-full", pos/package-windows, e2e/smoke]
      sales:
        globs: ["src/main/{sales,sales-sync,sale-history,sale-void,returns,receipts,cart,sync-outbox}/**", "src/shared/{sales,sales-sync,sale-history,sale-void,returns,receipts,cart}/**", "src/preload/{sales,sales-sync,sale-void}.ts", "src/renderer/{sale,returns,routes}/**"]
        jobs: ["@pos-full", pos/package-windows, e2e/smoke]
      stock:
        globs: [src/main/catalogue/**, src/shared/catalogue/**, src/renderer/scan/**]
        jobs: ["@pos-full", pos/package-windows]
      auth:
        globs: ["src/main/{operator,pairing,recovery}/**", "src/main/ipc/{manager-approval,recovery,recovery-mode-guard,session-lock,session-lock-guard,cashier-pin-status}.ts", "src/preload/{manager-approval,recovery,session-state}.ts", src/shared/operator/**, src/renderer/session/**]
        jobs: ["@pos-full", pos/package-windows]
      persistence:
        globs: [migrations/**, "src/main/{db,migrations,audit,logging}/**", src/main/app/startup-migrations.ts]
        jobs: ["@pos-full", pos/package-windows]
      electron-security:
        globs: [src/main/index.ts, src/main/app/**, src/main/secrets/**, src/main/ipc/**, src/preload/**, "src/shared/{bridge-api,secret-store}.ts", src/renderer/index.html, electron-builder.yml, src/tests/**]
        jobs: ["@pos-full", pos/package-windows, pos/e2e-electron]
      windows-packaging:
        globs: [electron-builder.yml, "vite.config*.ts", "tsconfig*.json", scripts/dev-electron.cjs, LICENSE, NOTICE]
        jobs: [pos/package-windows, pos/e2e-electron]
      dependency:
        globs: [package.json, package-lock.json]
        jobs: ["@pos-full", pos/package-windows, dependency-review]
      tooling:
        globs: [scripts/**, eslint.config.js, ".prettier*", "vitest*.ts", codecov.yml, .sonarcloud.properties, .coderabbit.yaml, .editorconfig, .gitattributes, .gitignore, postcss.config.cjs, tailwind.config.ts, .env.example]
        jobs: [pos/static, "@pos-full"]
      low:
        globs: [docs/**, specs/**, .specify/**, .claude/**, .impeccable/**, "*.md"]
        jobs: [pos/docs]

  admin-console:
    root: apps/admin-console/
    toolchain: { manager: pnpm, lockfiles: [apps/admin-console/pnpm-lock.yaml] }
    ci_jobs: [admin/build-test, admin/e2e]
    high_jobs: [admin/build-test, admin/e2e]
    tiers:
      contracts:
        globs: [contracts/backend-core/PIN, src/generated/**, openapi-ts.config.ts, "src/lib/{contracts-pin,client,auth-interceptor,request-id}.ts", "tests/unit/{contracts-pin,boundary}.test.ts", "tests/unit/*-boundary.test.ts", tests/unit/obs1-golden-vectors.json, tests/unit/rt879-redaction-vectors.json]
        jobs: [admin/build-test, admin/e2e, bc/oasdiff, contracts/check]
      money:
        globs: ["src/{cash-policy,payers,shift-closes}/**", "src/lib/{cash-variance-policy,shift-close}-queries.ts"]
        jobs: [admin/build-test, admin/e2e]
      sales:
        globs: [src/sales/**, src/lib/sale-queries.ts]
        jobs: [admin/build-test, admin/e2e]
      stock:
        globs: ["src/{stock-discrepancies,unknown-items}/**", "src/lib/{stock-discrepancy,unknown-items}-queries.ts"]
        jobs: [admin/build-test, admin/e2e]
      auth:
        globs: ["src/{auth,context,operators,devices,tenants,stores}/**", "src/shell/{useSignOut,sign-out,SignInRoute,ScopeGate,scope-gate,scope-mismatch,ScopeMismatchBanner}*", src/lib/auth-interceptor.ts]
        jobs: [admin/build-test, admin/e2e]
      security:
        globs: [src/observability/**, index.html, release-artifact.ts]
        jobs: [admin/build-test, admin/e2e]
      release:
        globs: [release-artifact.ts, vite.config.ts]
        jobs: [admin/build-test, admin/e2e]
      dependency:
        globs: [package.json, pnpm-lock.yaml]
        jobs: [admin/build-test, admin/e2e, dependency-review]
      tooling:
        globs: [scripts/**, biome.json, vitest.config.ts, playwright.config.ts, e2e.config.ts, tsconfig.json, codecov.yml, .sonarcloud.properties, .coderabbit.yaml, .gitignore]
        jobs: [admin/build-test, admin/e2e]
      low:
        globs: [docs/**, specs/**, design/**, design_handoff_retail_tower_console/**, .design-sync/**, .claude/**, .specify/**, .impeccable/**, "*.md"]
        jobs: []

  backend-core:
    root: services/backend-core/
    toolchain: { manager: pnpm, lockfiles: [services/backend-core/pnpm-lock.yaml] }
    ci_jobs: [bc/fast, bc/db-integration, bc/db-package, bc/oasdiff, bc/contracts-compat, bc/schemathesis]
    high_jobs: ["@bc-full"]
    tiers:
      contracts:
        globs: [packages/contracts/**, apps/api/src/openapi/**, apps/api/test/contract-conformance.spec.ts, apps/api/test/openapi/**, tools/oasdiff/**, tools/schemathesis/**, packages/shared/__tests__/observability/obs1-golden-vectors.json, packages/shared/__tests__/observability/rt879-redaction-vectors.json]
        jobs: ["@bc-full", pos/static, pos/test, admin/build-test, admin/e2e, connector/unit-tests-and-lint, contracts/check]
      money:
        globs: [apps/api/src/settlement/**, packages/db/src/schema/settlement/**, packages/db/src/schema/sales/sale-tenders.ts, packages/db/src/schema/catalog/price-history.ts]
        # pos/static + pos/test: semantic edge (MR-4), wire behaviour POS depends on.
        jobs: ["@bc-full", e2e/smoke, pos/static, pos/test]
      sales:
        globs: [apps/api/src/catalog/sales/**, "apps/api/src/{pos-shifts,shift-closes}/**", apps/worker/src/sales/**, packages/db/src/schema/sales/**, "packages/db/src/schema/shift*.ts"]
        jobs: ["@bc-full", e2e/smoke, pos/static, pos/test]
      stock:
        globs: [apps/api/src/inventory/**, apps/worker/src/inventory/**, packages/db/src/schema/inventory/**, "apps/api/src/catalog/erpnext-{warehouse-map,bin-view}/**", packages/db/src/helpers/stock-reconciliation-run.ts]
        jobs: ["@bc-full", e2e/smoke]
      tenant-auth:
        globs: [packages/auth/**, apps/api/src/auth/**, "apps/api/test/{auth,authz}/**", "apps/api/src/{tenants,memberships,stores,context,devices,pos-operators,pos-cashier-admissions,pos-terminal-pairing}/**", packages/db/src/middleware/tenant-context.ts, packages/db/src/helpers/with-tenant.ts, "packages/db/src/schema/{tenants,stores,memberships,roles,permissions,store_access,sessions,auth_tokens,users,devices}.ts", packages/db/__tests__/rls.bypass.spec.ts, docs/operations/sql/**, tools/eslint-rules/**]
        jobs: ["@bc-full"]
      migrations:
        globs: [packages/db/drizzle/**, packages/db/__tests__/migration/**, packages/db/src/cli/migrate.ts]
        jobs: ["@bc-full"]
      posting-sync:
        globs: [packages/shared/src/outbox/**, packages/db/src/outbox/**, "packages/db/src/schema/{outbox_events,connector*}.ts", "packages/db/src/schema/catalog/erpnext-*.ts", packages/db/src/helpers/posting-feed-lock.ts, "apps/api/src/{outbox,connector,connector-health}/**", "apps/api/src/catalog/{erpnext-*,read-down,sale-sync-ops}/**", "apps/worker/src/{outbox,erpnext-posting,erpnext-reconciliation,erpnext-product-reconciliation}/**"]
        jobs: ["@bc-full", connector/unit-tests-and-lint, e2e/smoke, pos/static, pos/test]
      deploy-security:
        globs: ["Dockerfile*", .dockerignore, Caddyfile, "docker-compose.*.yml", deploy/**]
        jobs: ["@bc-full"]
      dependency:
        globs: [pnpm-lock.yaml, pnpm-workspace.yaml, package.json, "*/*/package.json", "tsconfig*.json"]
        jobs: ["@bc-full", dependency-review]
      tooling:
        globs: [scripts/**, loadtests/**, .eslintrc.cjs, .prettierrc, codecov.yml, .sonarcloud.properties, .coderabbit.yaml]
        jobs: [bc/fast]
      # No `low` tier for BC yet. §B.3.3 makes docs/**, specs/**, .specify/**,
      # *.md and images low ONLY if no code under apps/ packages/ tools/ quotes
      # the path (RT-582 rule, e.g. deploy/README.md read by release-images.spec.ts).
      # That content check is not implemented, so these paths fall to `high`
      # (full BC suite). Fail closed: over-selects, never under-selects.

  erpnext-connector:
    root: integrations/erpnext-connector/
    toolchain: { manager: uv, lockfiles: [integrations/erpnext-connector/pylock.toml] }
    ci_jobs: [connector/unit-tests-and-lint, connector/bench]
    high_jobs: [connector/unit-tests-and-lint]
    # §B.3.4 globs are relative to retail_tower_erpnext_connector/ unless they
    # start with `/` (product root); translated here to product-root-relative.
    tiers:
      contracts:
        # RT-704: the Connector PIN of the in-tree Backend-Core contract, so a repin runs contracts/check.
        globs: [contracts/backend-core/**, retail_tower_erpnext_connector/connector/posting/contracts.py, retail_tower_erpnext_connector/connector/bin_view/contracts.py, retail_tower_erpnext_connector/connector/schema.py, retail_tower_erpnext_connector/tests/**/test_contracts.py, retail_tower_erpnext_connector/tests/**/test_resolution_contracts.py, retail_tower_erpnext_connector/tests/obs1-golden-vectors.json, retail_tower_erpnext_connector/tests/rt879-redaction-vectors.json]
        jobs: [connector/unit-tests-and-lint, bc/fast, contracts/check]
      money:
        globs: ["retail_tower_erpnext_connector/connector/posting/{tender,uom,builder,return_builder,reversal_builder,reversal_policy,stock_policy,representation_check}.py", "retail_tower_erpnext_connector/connector/doctype/{rt_tender_mode_map_row,rt_uom_map_row}/**"]
        jobs: [connector/unit-tests-and-lint]
      posting-sync:
        globs: [retail_tower_erpnext_connector/connector/posting/**, retail_tower_erpnext_connector/connector/bin_view/**, retail_tower_erpnext_connector/connector/doctype/posting_log/**, retail_tower_erpnext_connector/hooks.py, retail_tower_erpnext_connector/tests/posting/**, retail_tower_erpnext_connector/tests/test_scheduler_cadence.py]
        # bc/fast: semantic edge (MR-4), Backend-Core posting/outbox tests. connector/bench: the
        # real-bench v16 DB tests (RT-872).
        jobs: [connector/unit-tests-and-lint, connector/bench, e2e/smoke, bc/fast]
      auth:
        globs: ["retail_tower_erpnext_connector/connector/posting/{credential_lifecycle,config}.py", "retail_tower_erpnext_connector/connector/doctype/{connector_settings,rt_store_customer_map_row}/**"]
        jobs: [connector/unit-tests-and-lint]
      migrations:
        globs: [retail_tower_erpnext_connector/patches.txt, retail_tower_erpnext_connector/patches/**, "retail_tower_erpnext_connector/connector/doctype/**/*.json", retail_tower_erpnext_connector/fixtures/**, retail_tower_erpnext_connector/connector/posting/index_guard.py, retail_tower_erpnext_connector/tests/test_g5_unique_index_db.py, retail_tower_erpnext_connector/tests/test_foundation.py, retail_tower_erpnext_connector/modules.txt]
        jobs: [connector/unit-tests-and-lint, connector/bench]
      observability:
        globs: [retail_tower_erpnext_connector/connector/observability/**, retail_tower_erpnext_connector/connector/request_id.py]
        jobs: [connector/unit-tests-and-lint]
      # RT-923: .python-version picks the Python of the lint/unit job AND the bench lane, and bench
      # installs the app through pip, which enforces pyproject's requires-python, so both run bench.
      runtime:
        globs: [.python-version, pyproject.toml]
        jobs: [connector/unit-tests-and-lint, connector/bench, dependency-review]
      dependency:
        globs: [pylock.toml]
        jobs: [connector/unit-tests-and-lint, dependency-review]
      tooling:
        globs: [codecov.yml, .sonarcloud.properties, .coderabbit.yaml]
        jobs: [connector/unit-tests-and-lint]
      low:
        globs: [docs/**, specs/**, .specify/**, .claude/**, "*.md"]
        jobs: []

shared_classes:   # precedence: lower wins; two matches at the SAME precedence = AMBIGUOUS_PATH
  # tools/agent-broker/** runs on the owner's machine with 1Password access, so any change to it is a policy change.
  # A policy class outranks product ownership (RT-867): each product's own .github/** holds scripts
  # that root CI jobs execute (e.g. admin-console report-flaky-e2e.mjs), so they need approval.
  # .gitleaks.toml and .gitleaksignore (RT-876) decide what the root secret scan ignores, so widening them is a policy change too.
  # The root .python-version (RT-923) picks the interpreter the gate and every plan job run the trusted evaluator on.
  policy:  { precedence: 1, globs: [.github/**, tools/project-graph/**, tools/ci-gate/**, tools/agent-broker/**, CODEOWNERS, .gitleaks.toml, .gitleaksignore, .python-version, "apps/*/.github/**", "services/*/.github/**", "integrations/*/.github/**"], selects: all, policy_change: true }
  tooling: { precedence: 2, globs: [tools/**], selects: all }
  e2e:     { precedence: 3, globs: [tests/e2e/**], selects: [e2e] }
  docs:    { precedence: 3, globs: [docs/**], selects: [] }
  root:    { precedence: 4, globs: ["*"], selects: all }

edges:   # allowed cross-product references; anything else is a boundary violation
  - { from: pos, to: backend-core, via: [services/backend-core/packages/contracts/openapi/**] }
  - { from: admin-console, to: backend-core, via: [services/backend-core/packages/contracts/openapi/**] }
  - { from: erpnext-connector, to: backend-core, kind: semantic, via: [services/backend-core/packages/contracts/openapi/erpnext-connector/**, services/backend-core/packages/contracts/openapi/connector/**] }

generated:   # an output may change only together with at least one declared source (§B.2)
  - { outputs: [apps/pos/src/shared/api-types.ts], sources: [apps/pos/contracts/backend-core/PIN, apps/pos/contracts/backend-core/openapi/**, apps/pos/scripts/codegen-api.ts, apps/pos/package-lock.json] }
  - { outputs: [apps/admin-console/src/generated/schema.d.ts], sources: [apps/admin-console/contracts/backend-core/PIN, apps/admin-console/openapi-ts.config.ts, apps/admin-console/pnpm-lock.yaml, services/backend-core/packages/contracts/openapi/**] }

allowed_symlinks: []

# Accounts whose SHA-bound attestation can approve a policy change. Matched by the review
# author's immutable numeric account id AND actor type, never by login (`login` is only a
# label; a renamed or recycled login cannot match). Adding or changing an entry is itself a
# policy change.
#   - Kemetra, id 206601658, User: the owner. RT-721 S1 (owner decisions c13766/c13770).
#     Accepted residual: agent sessions on this machine still act under the Kemetra token, so
#     an approval by this account cannot be proven human, and it can approve a policy PR that
#     another actor (for example kemetra-agent[bot]) authored. Full A.8 R1 separation (agents
#     off the Kemetra credentials) is still open.
#   - kemetra-reviewer[bot], id 348508063, Bot: the independent reviewer App (RT-870, owner
#     decision 2026-10-26). Its token has only pull_requests:write + metadata:read, so it
#     can review but cannot push, merge or edit files. It runs in a separate session from the
#     one that authors the PR; GitHub does not let an author approve their own PR.
policy_approvers:
  - { id: 206601658, type: User, login: Kemetra }
  - { id: 348508063, type: Bot, login: "kemetra-reviewer[bot]" }

# Whether a missing policy approval fails `required` (RT-721 S3, RT-866).
#   required  (the default when this key is absent, and the meaning of anything but exactly
#             `observe`): a policy change keeps `required` red until a listed approver attests.
#   observe   the approval is still evaluated and printed in the gate summary, but its absence does
#             not fail `required`. Every selected job must still pass; a policy change still selects
#             all jobs, and `policy_approvers` and the fingerprint are unchanged.
# The aggregator reads this from the TRUSTED (base) graph, so a PR cannot relax its own approval, and
# changing it is itself a policy change.
# Owner decision 2026-10-27: `observe` while the owner is the only maintainer (same reasoning as
# advisory CODEOWNERS). Revert by changing this value back to `required` (or deleting the key) when a
# second maintainer joins, or BEFORE RT-866 makes `required` an enforced check on `main`.
# Residual while observing: nothing requires a human attestation on .github/** or tools/project-graph/**,
# nor for a path the trusted graph does not know but the proposed one classifies (UNKNOWN_IN_TRUSTED_ONLY).
policy_approval: observe
